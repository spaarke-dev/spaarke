name: SDAP CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'projects/_backlog/**'
      - 'projects/x-*/**'   # research/notes-only project folders
      - '**.md'
      - '.claude/**'
      - 'memory/**'
      - 'knowledge/**'
      - 'CHANGELOG*'
      - 'CODEOWNERS'
      - 'LICENSE*'
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - 'projects/_backlog/**'
      - 'projects/x-*/**'
      - '**.md'
      - '.claude/**'
      - 'memory/**'
      - 'knowledge/**'
      - 'CHANGELOG*'
      - 'CODEOWNERS'
      - 'LICENSE*'

permissions:
  contents: read
  security-events: write  # For security scanning
  actions: read

concurrency:
  group: sdap-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true  # 2026-06-24: CI informational-only until test-architecture-reset-r1 lands. See projects/test-architecture-reset-r1/design.md.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # Skip the knowledge/ repo (reference docs + MCP sample apps — not product code).
          # The Azurite default key in trey-research/db.ts is a publicly documented
          # Microsoft test credential; see .trivyignore for full rationale.
          skip-dirs: 'knowledge'
          trivyignores: '.trivyignore'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build-test:
    name: Build & Test
    runs-on: windows-latest
    # 2026-07-10 (redesign-r2 audit F-5 completion): job-level continue-on-error
    # REMOVED. The 2026-06-24 "informational-only" posture predated the two-pass
    # classifier + reliability registry and silently swallowed the classifier's
    # verdict (a failed job still produced a green run — observed live on master
    # run 29126132011). The full solution is 0-failures as of ef5d098b4; genuine
    # timing flakes belong in tests/.reliability-registry.json, not in a
    # job-level swallow.
    strategy:
      # When one matrix configuration fails (e.g., a flaky timing test in
      # Release), the default fail-fast=true cancels the sibling Debug job
      # mid-flight. The cancelled Debug then shows COMPLETED/CANCELLED — and
      # because Debug is the only REQUIRED status check, the PR becomes
      # un-mergeable even though Debug would have passed on its own. We want
      # each matrix configuration to run to its own conclusion.
      fail-fast: false
      matrix:
        # 2026-06-24 — Release matrix entry temporarily removed due to high
        # CI-flake rate on shared runners (timing/scheduling tests). Debug-only
        # build still validates compilation + unit tests. Tracked under
        # projects/test-architecture-reset-r1/ for permanent resolution.
        # Restore Release here AFTER that audit lands a stable test suite.
        configuration: [Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for GitVersion and better diff analysis
          lfs: true  # smudge tests/fixtures/compose-corpus/*.docx — real bytes, not LFS pointers (else ~200 Compose corpus seam tests fail on pointer files; mirrors compose-fidelity-gate job)

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Setup .NET Framework targeting pack
        shell: pwsh
        run: |
          # Ensure .NET Framework 4.8 targeting pack is available for plugin projects
          if (!(Test-Path "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8")) {
            Write-Warning ".NET Framework 4.8 targeting pack not found. Plugin build may fail."
          }

      - name: Cache NuGet packages
        uses: actions/cache@v5
        continue-on-error: true  # Prevents Debug/Release matrix race on shared cache key from failing the job (PR #337 hit this 2026-06-03 — Release lost the cache-save race to concurrent Debug at 00:18:47)
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore --verbosity minimal

      - name: Build
        # WarningsAsErrors policy is centralized in Directory.Build.props
        # (TreatWarningsAsErrors=true + WarningsNotAsErrors=CS0109;CS0618;CS1998;CS8601;CS8604).
        # The previous CLI -warnaserror overrode WarningsNotAsErrors. See
        # docs/assessments/bff-warning-suppression-analysis-2026-06-01.md.
        run: dotnet build -c ${{ matrix.configuration }} --no-restore

      # ------------------------------------------------------------------
      # Two-pass test runner — see scripts/ci/classify-and-retry.ps1 + docs/
      # procedures/testing-and-code-quality.md.
      #
      # Pass 1 runs the full suite. The classifier reads the TRX and consults
      # tests/.reliability-registry.json. If any pass-1 failure is NOT in the
      # registry, that's a real bug → classify exits 1 → this job fails (no
      # retry). If failures are ALL registry-tagged (timing/concurrency-
      # sensitive), pass 2 reruns just those on a fresh execution. Pass 2
      # failures fail the build (treated as a real regression — two
      # consecutive failures on different runs is no longer noise).
      # ------------------------------------------------------------------
      - name: Test with coverage (pass 1)
        id: test-pass-1
        continue-on-error: true   # let classifier decide; don't abort here on test failures
        shell: pwsh
        run: |
          # LogFilePrefix (NOT LogFileName): each test project writes its own
          # uniquely-named TRX. A fixed LogFileName made every project in the
          # solution OVERWRITE the same file, so the classifier only ever saw
          # the last project's results — failures in the other test projects
          # were invisible to CI (redesign-r2 e2e audit finding F-5, 2026-07-10).
          dotnet test -c ${{ matrix.configuration }} --no-build `
            --logger "trx;LogFilePrefix=pass1" `
            --results-directory ./TestResults/pass1 `
            --collect:"XPlat Code Coverage" --settings config/coverlet.runsettings

      - name: Classify pass-1 failures (decide on retry)
        id: classify
        shell: pwsh
        run: ./scripts/ci/classify-and-retry.ps1 -TrxDirectory ./TestResults/pass1

      - name: Retry timing/concurrency-sensitive tests (pass 2)
        id: test-pass-2
        if: steps.classify.outputs.retry_needed == 'true'
        continue-on-error: true   # final verdict step decides; capture TRX either way
        shell: pwsh
        run: |
          # LogFilePrefix for the same reason as pass 1 (audit finding F-5).
          dotnet test -c ${{ matrix.configuration }} --no-build `
            --filter "${{ steps.classify.outputs.retry_filter }}" `
            --logger "trx;LogFilePrefix=pass2" `
            --results-directory ./TestResults/pass2

      - name: Final test verdict
        shell: pwsh
        run: |
          $retryRan = "${{ steps.classify.outputs.retry_needed }}" -eq "true"
          if (-not $retryRan) {
            # Classify already exited 1 if there were deterministic failures.
            # Reaching here with retry_needed=false means pass 1 was fully clean.
            Write-Host "Pass 1 clean — no retry was needed"
            exit 0
          }
          # Aggregate ALL pass-2 TRX files (one per test project under
          # LogFilePrefix naming — audit finding F-5).
          $trxFiles = @(Get-ChildItem -Path ./TestResults/pass2 -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue)
          if ($trxFiles.Count -eq 0) {
            Write-Host "::error::Retry pass 2 ran but no TRX files were produced — dotnet test likely crashed"
            exit 1
          }
          $nsUri = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"
          $stillFailing = @()
          $passed = 0
          foreach ($trx in $trxFiles) {
            $xml = [xml](Get-Content $trx.FullName -Raw)
            $nsm = New-Object System.Xml.XmlNamespaceManager $xml.NameTable
            $nsm.AddNamespace("x", $nsUri)
            $stillFailing += @($xml.SelectNodes("//x:UnitTestResult[@outcome='Failed']", $nsm))
            $passed += $xml.SelectNodes("//x:UnitTestResult[@outcome='Passed']", $nsm).Count
          }
          if ($stillFailing.Count -gt 0) {
            Write-Host "::error::Retry pass failed: $($stillFailing.Count) test(s) still failing after a second attempt — treating as real regression"
            $stillFailing | ForEach-Object {
              Write-Host "  - $($_.GetAttribute('testName'))"
            }
            exit 1
          }
          Write-Host "Retry pass clean: $passed test(s) retried, all passed on second attempt"

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.configuration }}
          path: ./TestResults/

      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-${{ matrix.configuration }}
          path: ./TestResults/**/coverage.cobertura.xml

  # ──────────────────────────────────────────────────────────────────────────
  # Golden-utterance eval gate (NFR-02, spaarke-ai-architecture-redesign-r1
  # task 026 / FR-P1-07) — MERGE-BLOCKING from P1 onward.
  #
  # Deliberately a SEPARATE job with NO continue-on-error: build-test carries
  # job-level `continue-on-error: true` (2026-06-24 informational posture),
  # which would swallow a failing eval step placed inside it — with branch
  # protection currently disabled on this repo, the workflow-run conclusion is
  # the only mechanical merge signal, and this job is what turns it red when
  # any Category=GoldenUtteranceEval test fails. When branch protection /
  # rulesets are re-enabled, mark "Eval Gate (Golden Utterances)" as a
  # REQUIRED status check. Activation plan + rationale:
  # tests/integration/contract/Eval/README.md.
  #
  # Families joined to this gate via the Category=GoldenUtteranceEval trait (no
  # YAML change needed to register a family — the trait IS the registration):
  #   • Golden-utterance suite + P2 loop/injection (r1 tasks 011/026/037)
  #   • D-F0(e) Resourcefulness family (r2 task 031 / FR-A1-02) —
  #     ResourcefulnessEvalSuiteTests: no_fabrication is asserted MECHANICALLY
  #     against the ADR-040 ledger ToolChain (ResourcefulnessFabricationOracle);
  #     the four family dimensions are LLM-judge-scored on the live eval-gate run.
  #   • Origin-classification family (r2 task 033 / FR-A1-04, Policy v2 E-1..E-6)
  #     — OriginClassificationEvalSuiteTests: hard-equality assertions against the
  #     real RequestOriginClassifier + ConfirmationPolicyEngine (deterministic
  #     production code, never an LLM judge).
  #   • ContextEnvelope budget-breach-fails-eval (r2 task 054 / FR-B-05) —
  #     ContextBudgetBreachEvalTests: a per-slice or envelope-ceiling breach is
  #     mechanically DETECTED (never silently truncated) against the real
  #     EnvelopeBudget checker.
  #   • Memory-write capture→recall family (r2 task 057 / FR-B-08 / FR-30) —
  #     MemoryWriteCaptureRecallEvalTests.
  #
  # spec FR-D-02 / NFR-02 (r2 spaarke-ai-architecture-redesign-r2 task 071):
  # ALL of the above families gate the merge — any single family red fails this
  # job. Memory-poisoning eval families are explicitly OUT OF SCOPE here —
  # DEFERRED to the separate memory-governance project per spec FR-B-10
  # (spaarke-ai-architecture-redesign-r2/spec.md item 38). Do NOT add a
  # memory-poisoning family to this trait/gate until that governance project
  # ships it.
  # ──────────────────────────────────────────────────────────────────────────
  eval-gate:
    name: Eval Gate (Golden Utterances)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        continue-on-error: true  # cache is an optimization, never a gate
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Golden-utterance eval gate (NFR-02 — merge-blocking)
        shell: pwsh
        run: dotnet test tests/unit/Sprk.Bff.Api.Tests/Sprk.Bff.Api.Tests.csproj -c Debug --filter "Category=GoldenUtteranceEval"

  client-quality:
    name: Client Quality (Prettier + ESLint)
    runs-on: ubuntu-latest
    continue-on-error: true  # 2026-06-24: CI informational-only until test-architecture-reset-r1 lands. See projects/test-architecture-reset-r1/design.md.
    permissions:
      contents: write   # Auto-format push-back on PRs
    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache root npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-root-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-root-

      - name: Cache PCF npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-pcf-${{ hashFiles('src/client/pcf/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-pcf-

      - name: Install root dependencies (Prettier)
        # `npm install` instead of `npm ci` per root CLAUDE.md §11 Node Installs:
        # this repo's lockfiles drift frequently; strict `npm ci` blocks CI on
        # transitive churn that's harmless at install time. `npm install` reads
        # the lockfile as hints but does not enforce strict sync.
        # Established pattern across ~14 Vite solutions + Build-AllClientComponents.ps1.
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Prettier auto-fix
        run: npx prettier --write "src/client/**/*.{ts,tsx}" --no-error-on-unmatched-pattern

      - name: Push Prettier fixes
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: auto-format Prettier (CI)"
            git push
            echo "::notice::Prettier fixes auto-committed and pushed to PR branch."
          fi

      - name: Prettier format check
        run: npx prettier --check "src/client/**/*.{ts,tsx}" --no-error-on-unmatched-pattern

      - name: Install PCF dependencies (ESLint)
        working-directory: src/client/pcf
        # Same `npm install` pattern as the root step above — see comment there.
        # PCF lockfile drifts on dev-dep bumps (e.g. eslint 9.39.4 was a
        # transitive of @microsoft/eslint-plugin-power-apps that broke `npm ci`
        # on 2026-06-18 / PR #391).
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: ESLint check
        # --max-warnings 0 dropped: pre-existing baseline has 186 warnings
        # (window.top usage in Power Apps integration code, unused-vars in catch blocks).
        # Mirrors the WarningsNotAsErrors policy applied to C# (visible but non-blocking).
        # Follow-on cleanup tracked per docs/assessments/bff-warning-suppression-analysis-2026-06-01.md.
        #
        # `node_modules/.bin/eslint` instead of `npx eslint` per PR #393 root-cause
        # fix (2026-06-18): `npx eslint` silently auto-fetches `eslint` from the
        # registry when the local copy is missing, masking install bugs. Using the
        # local path forces resolution from the just-installed node_modules — if
        # eslint is ever missing again, this step fails loudly with "ENOENT" rather
        # than confusing `Cannot find module 'eslint/package.json'` errors deep in
        # an ESLint plugin's require chain. See d-widget-parity-audit-2026-06-18.md
        # follow-up + PR #393 commit message for the full root-cause analysis.
        working-directory: src/client/pcf
        run: node_modules/.bin/eslint .

      # Spaarke.AI.Widgets tsc gate (R4 task 061 / B-2 / NFR-05)
      # AI.Widgets tsconfig path-maps four @spaarke/* sibling packages to their
      # respective ../<Package>/dist/index.d.ts. CI must build each dist before
      # the typecheck so path resolution succeeds.
      # See projects/spaarke-ai-platform-unification-r4/notes/b2-tsc-rootdir-decision.md
      - name: Install Spaarke.Auth deps
        working-directory: src/client/shared/Spaarke.Auth
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Spaarke.Auth (declarations required by UI.Components + Widgets typecheck)
        working-directory: src/client/shared/Spaarke.Auth
        run: npx tsc

      - name: Install Spaarke.AI.Context deps
        working-directory: src/client/shared/Spaarke.AI.Context
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Spaarke.AI.Context (declarations required by Widgets typecheck)
        working-directory: src/client/shared/Spaarke.AI.Context
        run: npx tsc

      - name: Install Spaarke.SdapClient deps
        working-directory: src/client/shared/Spaarke.SdapClient
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Spaarke.SdapClient (declarations required by UI.Components typecheck)
        working-directory: src/client/shared/Spaarke.SdapClient
        run: npx tsc

      - name: Install Spaarke.UI.Components deps
        working-directory: src/client/shared/Spaarke.UI.Components
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Spaarke.UI.Components (declarations required by Widgets typecheck)
        working-directory: src/client/shared/Spaarke.UI.Components
        run: npx tsc

      - name: Install Spaarke.AI.Outputs deps
        working-directory: src/client/shared/Spaarke.AI.Outputs
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Spaarke.AI.Outputs (declarations required by Widgets typecheck)
        working-directory: src/client/shared/Spaarke.AI.Outputs
        run: npx tsc

      # Spaarke.Communication.Components was the ONE path-mapped sibling never built
      # here. AI.Widgets' tsconfig maps @spaarke/communication-components to
      # ../Spaarke.Communication.Components/dist/index.d.ts; with no dist, TypeScript
      # fell back to that package's raw SOURCE, which cannot resolve its own react /
      # @fluentui deps in this context — producing ~20 TS2307/TS2875/TS7026 errors and
      # a permanently red Client Quality gate. MUST come after Spaarke.UI.Components
      # (above): this package type-checks against @spaarke/ui-components' dist.
      - name: Install Spaarke.Communication.Components deps
        working-directory: src/client/shared/Spaarke.Communication.Components
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Spaarke.Communication.Components (declarations required by Widgets typecheck)
        working-directory: src/client/shared/Spaarke.Communication.Components
        run: npx tsc

      - name: Install Spaarke.AI.Widgets deps
        working-directory: src/client/shared/Spaarke.AI.Widgets
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Spaarke.AI.Widgets — tsc --noEmit
        working-directory: src/client/shared/Spaarke.AI.Widgets
        run: npx tsc --noEmit

  code-quality:
    name: Code Quality
    runs-on: windows-latest
    needs: build-test
    continue-on-error: true  # 2026-06-24: CI informational-only until test-architecture-reset-r1 lands. See projects/test-architecture-reset-r1/design.md.
    permissions:
      contents: write   # Auto-format push-back on PRs

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore --verbosity minimal

      - name: Auto-fix whitespace formatting
        run: dotnet format whitespace --verbosity minimal

      - name: Push dotnet format fixes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git pull --rebase || true
          if [ -n "$(git diff --name-only)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: auto-format dotnet whitespace (CI)"
            git push
            echo "::notice::dotnet format fixes auto-committed and pushed to PR branch."
          fi

      - name: Format verification
        # `dotnet format whitespace` restricts to whitespace-only checks; excludes
        # IDE1006 naming-rule analyzer warnings which fire on intentionally-lowercase
        # Dataverse field names (e.g., sprk_projectid, accountid) in anonymous payloads
        # passed to the Dataverse Web API. Style/analyzer warnings are tracked but
        # not blocking — see docs/assessments/bff-warning-suppression-analysis-2026-06-01.md.
        run: dotnet format whitespace --verify-no-changes --verbosity diagnostic

      - name: ADR policy check (Legacy PowerShell)
        shell: pwsh
        run: ./scripts/adr_policy_check.ps1 -RepoRoot .
        continue-on-error: true  # Legacy script - NetArchTest is primary validation

      - name: ADR architecture tests (NetArchTest)
        id: adr-tests
        run: dotnet test tests/Spaarke.ArchTests/Spaarke.ArchTests.csproj --logger "trx;LogFileName=adr-results.trx" --results-directory ./TestResults
        continue-on-error: true  # Don't block PR - violations reported via comment

      - name: Upload ADR test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: adr-test-results
          path: ./TestResults/adr-results.trx
          if-no-files-found: warn

      - name: Plugin size validation
        shell: pwsh
        run: |
          # Validate plugin assemblies are under size limits per ADR-002
          $pluginPath = "power-platform/plugins/Spaarke.Plugins/bin/Release/net48/Spaarke.Plugins.dll"
          if (Test-Path $pluginPath) {
            $size = (Get-Item $pluginPath).Length
            Write-Host "Plugin assembly size: $size bytes"
            if ($size -gt 1MB) {
              Write-Error "Plugin assembly exceeds 1MB size limit (ADR-002)"
              exit 1
            }
          }

      - name: Dependencies audit
        shell: pwsh
        run: |
          # Check for vulnerable packages. Accepted-risk allow-list EMPTIED 2026-08-13
          # (dotnet-10-upgrade-r1 task 032; see projects/dotnet-10-upgrade-r1/notes/cve-audit.md).
          # The net10 package graph has ZERO vulnerable packages — all 3 former entries are stale:
          # - Microsoft.Kiota.* : HIGH GHSA-7j59-v9qr-6fq9 FIXED — Graph 6.5 (task 033) pulls transitive Kiota 2.0.0 (> 1.22.0 floor); direct pins removed. Not accepted-risk.
          # - OpenMcdf          : Moderate GHSA-jxpf-xq2m-q525 CLEARED — bumped 3.1.4 -> 3.2.0 (task 004).
          # - OpenTelemetry.Api : Moderate GHSA-g94r-2vxg-569j CLEARED — bumped 1.15.3 -> 1.17.0 (task 004).
          # Empty list = the gate now fails on ANY future transitive advisory (stricter posture, matches NoWarn=NU1903 removal in task 004).
          $acceptedRiskPackages = @()
          $output = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $output
          if ($output -match "has the following vulnerable packages") {
            # Build a regex that filters out accepted-risk packages, then check what remains
            $lines = $output -split "`n"
            $unaccepted = $lines | Where-Object {
              $line = $_
              # Match the package-name column shape ">" or " > " then a package name
              if ($line -notmatch '^\s*>\s*([\w\.]+)') { return $false }
              $pkg = $matches[1]
              # If this matches any accepted-risk prefix, skip
              foreach ($prefix in $acceptedRiskPackages) {
                if ($pkg.StartsWith($prefix)) { return $false }
              }
              # It's a real (unaccepted) vulnerable package
              return $true
            }
            if ($unaccepted.Count -gt 0) {
              Write-Error "Vulnerable packages detected (outside accepted-risk list):`n$($unaccepted -join "`n")"
              exit 1
            } else {
              Write-Output "Vulnerable packages detected, but all match accepted-risk list (ADR-029)."
            }
          }

  integration-readiness:
    name: Integration Readiness
    runs-on: windows-latest
    needs: [security-scan, build-test, code-quality, client-quality]
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    continue-on-error: true  # 2026-06-24: CI informational-only until test-architecture-reset-r1 lands. See projects/test-architecture-reset-r1/design.md.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore --verbosity minimal

      - name: Build for deployment
        run: |
          dotnet publish src/server/api/Sprk.Bff.Api/Sprk.Bff.Api.csproj -c Release -o ./publish/api --no-restore

      - name: Package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: deployment-packages
          path: ./publish/**
          retention-days: 30

      - name: Environment readiness check
        shell: pwsh
        run: |
          # Validate configuration templates and deployment readiness
          Write-Host "=== Deployment Readiness Check ==="
          Write-Host "✓ API package built successfully"
          Write-Host "✓ CI/CD pipeline validated"

          # Check for deployment configuration
          $hasDeployConfig = Test-Path ".github/workflows/deploy-*.yml"
          if (-not $hasDeployConfig) {
            Write-Warning "⚠ Deployment workflow not found. Add deployment pipelines for complete CI/CD."
          }

  adr-pr-comment:
    name: ADR Violations Report
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Download test results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: adr-test-results
          path: ./test-results

      - name: Parse and comment on PR
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read TRX file
            const trxPath = './test-results/adr-results.trx';
            if (!fs.existsSync(trxPath)) {
              console.log('No test results found');
              return;
            }

            const trxContent = fs.readFileSync(trxPath, 'utf8');

            // Parse failures from TRX (simple regex parsing)
            const failureMatches = [...trxContent.matchAll(/<UnitTestResult.*?outcome="Failed".*?testName="(.*?)".*?<Message>(.*?)<\/Message>/gs)];
            const totalTests = (trxContent.match(/<UnitTestResult/g) || []).length;
            const passedTests = (trxContent.match(/outcome="Passed"/g) || []).length;
            const failedTests = failureMatches.length;

            // Build comment
            let comment = '## 🏛️ ADR Architecture Validation Report\n\n';
            comment += `**Summary:** ${passedTests}/${totalTests} tests passed`;

            if (failedTests === 0) {
              comment += ' ✅\n\n';
              comment += '**Status:** All ADR validations passed! No architectural violations detected.\n\n';
              comment += '---\n';
              comment += '*This is a non-blocking validation. See [ADR Validation Process](../blob/master/docs/adr/ADR-VALIDATION-PROCESS.md) for details.*';
            } else {
              comment += ` ⚠️ (${failedTests} violations)\n\n`;
              comment += '**Status:** ADR violations detected. These are **non-blocking warnings** but should be reviewed.\n\n';
              comment += '### ⚠️ Violations Found\n\n';

              failureMatches.forEach((match, index) => {
                const testName = match[1];
                const message = match[2]
                  .replace(/&lt;/g, '<')
                  .replace(/&gt;/g, '>')
                  .replace(/&quot;/g, '"')
                  .replace(/&amp;/g, '&')
                  .trim();

                // Extract ADR number from test name
                const adrMatch = testName.match(/ADR-(\d+)/);
                const adrNum = adrMatch ? adrMatch[1] : '???';

                comment += `#### ${index + 1}. ${testName}\n\n`;
                comment += '```\n';
                comment += message.substring(0, 500); // Limit message length
                if (message.length > 500) comment += '...\n(truncated)';
                comment += '\n```\n\n';
                comment += `📖 See [ADR-${adrNum}](../blob/master/docs/adr/ADR-${adrNum.padStart(3, '0')}-*.md) for guidance\n\n`;
              });

              comment += '---\n\n';
              comment += '### 🔧 How to Fix\n\n';
              comment += '1. Run locally: `dotnet test tests/Spaarke.ArchTests/`\n';
              comment += '2. Get guidance: `/adr-check` (Claude Code skill)\n';
              comment += '3. Review [ADR Validation Process](../blob/master/docs/adr/ADR-VALIDATION-PROCESS.md)\n\n';
              comment += '**Note:** These violations are **warnings only** and will not block this PR.\n';
            }

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('ADR Architecture Validation Report')
            );

            // Create or update comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [security-scan, build-test, code-quality, client-quality, integration-readiness]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## SDAP CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Client Quality | ${{ needs.client-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Readiness | ${{ needs.integration-readiness.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Configure deployment environments" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Set up monitoring and alerting" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Complete service registrations for test coverage" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # Compose fidelity gate (FR-08, spaarkeai-compose-r6 tasks 060/061 +
  # ADR-049 R6 amendment point 3) — RELEASE-GATING.
  #
  # Runs the corpus round-trip fidelity harness
  # (tests/integration/seam/Compose/ComposeFidelityGateHarnessTests.cs):
  # every `.docx` under tests/fixtures/compose-corpus/ is driven through one
  # full render-on-save wire round trip (load → edit → save → reopen) and
  # classified pass/warn/fail. FAIL-class results fail their xUnit Theory —
  # that non-zero `dotnet test` exit IS the gate; no continue-on-error here
  # by design (an advisory gate would defeat spec FR-08).
  #
  # Deliberately a SEPARATE self-contained job (same rationale as eval-gate):
  # existing jobs are owned by ci-cd-unit-test-remediation-r1 and are not
  # modified. `lfs: true` on checkout pulls the Git-LFS `.docx` corpus bytes
  # (same mechanism as PR #690's build-test fix); a missing-LFS checkout
  # fails LOUDLY via ComposeCorpusFixtureLocator's PK-signature guard — it
  # can never silently skip the gate. The per-document breakdown
  # (fidelity-gate-result.json, written next to the test assembly by the
  # harness's result sink) is uploaded as an artifact even on red.
  # ──────────────────────────────────────────────────────────────────────────
  compose-fidelity-gate:
    name: Compose Fidelity Gate (Corpus Round-Trip)
    runs-on: windows-latest
    steps:
      - name: Checkout (with Git-LFS corpus fixtures)
        uses: actions/checkout@v6
        with:
          lfs: true  # smudge tests/fixtures/compose-corpus/*.docx — real bytes, not LFS pointers

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        continue-on-error: true  # cache is an optimization, never a gate
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Fidelity gate (corpus round-trip — merge-blocking)
        shell: pwsh
        run: dotnet test tests/unit/Sprk.Bff.Api.Tests/Sprk.Bff.Api.Tests.csproj -c Debug --filter "FullyQualifiedName~FidelityGate"

      - name: Upload fidelity-gate-result.json (per-document breakdown)
        uses: actions/upload-artifact@v6
        if: always()   # the breakdown matters MOST when the gate is red
        with:
          name: fidelity-gate-result
          path: tests/unit/Sprk.Bff.Api.Tests/bin/**/fidelity-gate-result.json
          if-no-files-found: warn  # absent only if the run crashed pre-sink; the test step is already red then

  # ──────────────────────────────────────────────────────────────────────────
  # Compose CLIENT gate (spaarkeai-compose-r8 task 018, spec Track S) — the
  # Half-B counterpart to compose-fidelity-gate above.
  #
  # WHAT IT GATES: the `@spaarke/compose-components` jest suite
  # (src/client/shared/Spaarke.Compose.Components — 90 suites / ~1,100 tests):
  # the CLIENT half of the save contract. Did the save request get built and
  # issued correctly, and does the UI then tell the user the truth about what
  # happened. compose-fidelity-gate drives `.docx` BYTES through load → edit →
  # save → reopen — that is Half A. Half B had no gate at all: no workflow
  # installed this package, built it, or ran a single one of its tests. R8 task
  # 010 found a save-error branch that had passed its tests for three releases
  # while validating a response shape the real transport cannot emit; it passed
  # because nothing ran it. This job is what stops that from repeating.
  #
  # WHY A SEPARATE JOB — the same rationale eval-gate and compose-fidelity-gate
  # state: build-test, code-quality, client-quality and integration-readiness
  # all carry job-level `continue-on-error: true` (the 2026-06-24 informational
  # posture), so a step added to any of them would have its failure swallowed
  # by the job it lives in. Those jobs are also owned by
  # ci-cd-unit-test-remediation-r1 and are not modified here. A self-contained
  # job is the only construction whose result can reach the workflow-run
  # conclusion.
  #
  # ADVISORY ON LANDING (`continue-on-error: true`), WITH THE REASON:
  # the gate earns the right to block only once the suite is proven
  # deterministic on THIS runner. Task 018 fixed the two defects that made it
  # non-deterministic — 39 of 90 suites could not resolve `@spaarke/ui-components`
  # and never ran at all, and 7 suites carried `jest.mock(..., { virtual: true })`
  # on `@spaarke/*` specifiers, which registers them in jest's shared resolver
  # and changed how LATER suites in the same worker resolved the same module
  # (order-dependent, and invisible to a single-suite run) — and demonstrated six
  # consecutive byte-identical green runs (90/90 suites, 1103/1103 tests) across
  # six DIFFERENT suite execution orders at this job's concurrency. But all six
  # were on a developer Windows box, and this job has never executed once on
  # ubuntu-latest: no run on the actual runner exists yet. A blocking gate
  # whose first red is an environment artifact gets ignored, then disabled, and
  # the surface silently reverts to having no gate — strictly worse than today.
  #
  # FLIP CONDITION (do this; do not let it drift): after three consecutive green
  # `compose-client-gate` runs on unchanged code ON THIS RUNNER, DELETE the
  # `continue-on-error: true` line below and record the run ids in the PR.
  # Nothing else about the job changes. Evidence + measurements:
  # projects/spaarkeai-compose-r8/notes/compose-client-ci-gate.md.
  #
  # SHARED-LIB BUILD: the package consumes its `@spaarke/*` siblings as built
  # `dist/` (see the resolution contract at the top of that package's
  # jest.config.js). The install → `npx tsc` recipe and its dependency ORDER are
  # copied from client-quality above; building out of order produces the
  # TS2307/TS2875 cascade documented there. `npm install`, never `npm ci`, per
  # root CLAUDE.md §12.
  # ──────────────────────────────────────────────────────────────────────────
  compose-client-gate:
    name: Compose Client Gate (Save-Contract Suite)
    runs-on: ubuntu-latest
    continue-on-error: true  # ADVISORY until three green runs on THIS runner — see FLIP CONDITION above
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---- SharedLibs dist, in dependency order (client-quality recipe) ----
      # Spaarke.Auth first: both Spaarke.UI.Components and Spaarke.DocumentOperations
      # type-check against its emitted declarations.
      - name: Install Spaarke.Auth deps
        working-directory: src/client/shared/Spaarke.Auth
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Spaarke.Auth
        working-directory: src/client/shared/Spaarke.Auth
        run: npx tsc

      # Spaarke.UI.Components' tsconfig path-maps @spaarke/sdap-client to
      # ../Spaarke.SdapClient/dist/index.d.ts — with no dist, tsc falls back to that
      # package's raw source and the build fails.
      - name: Install Spaarke.SdapClient deps
        working-directory: src/client/shared/Spaarke.SdapClient
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Spaarke.SdapClient
        working-directory: src/client/shared/Spaarke.SdapClient
        run: npx tsc

      # The one that matters: 39 of the 90 suites cannot even LOAD without this
      # dist — every ComposeWorkspace/ComposeEditor suite reaches it transitively.
      - name: Install Spaarke.UI.Components deps
        working-directory: src/client/shared/Spaarke.UI.Components
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Spaarke.UI.Components
        working-directory: src/client/shared/Spaarke.UI.Components
        run: npx tsc

      # ComposeWorkspace + ComposeToolbar import useDocumentActions from here.
      - name: Install Spaarke.DocumentOperations deps
        working-directory: src/client/shared/Spaarke.DocumentOperations
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Spaarke.DocumentOperations
        working-directory: src/client/shared/Spaarke.DocumentOperations
        run: npx tsc

      # Spaarke.AI.Widgets needs NO dist: jest.config maps @spaarke/ai-widgets
      # straight to its `src` (that mapping's own comment says so).
      - name: Install Spaarke.Compose.Components deps
        working-directory: src/client/shared/Spaarke.Compose.Components
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # The package's own declared CI entry point (`jest --ci --coverage --maxWorkers=2`).
      # The extra flags only add the machine-readable result the artifact step uploads.
      # Coverage is collected but NOT gated (ADR-038: coverage is observation, never a gate).
      - name: Compose client suite (save contract)
        id: jest
        working-directory: src/client/shared/Spaarke.Compose.Components
        run: npm run test:ci -- --json --outputFile=compose-client-jest-results.json

      # A job-level `continue-on-error: true` renders a failure as a green check with a
      # warning annotation, which is easy to miss. While the gate is advisory this step is
      # what makes a red suite legible: a job-summary table plus an ::error:: annotation
      # naming every failed suite. Keep it after the flip to blocking — it is just as useful.
      - name: Report result (job summary + annotation)
        if: always()
        working-directory: src/client/shared/Spaarke.Compose.Components
        run: |
          if [ ! -f compose-client-jest-results.json ]; then
            echo "::error::compose-client-gate produced no jest results - the run crashed before jest reported"
            echo "### Compose Client Gate - no results (jest crashed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node "$GITHUB_WORKSPACE/scripts/ci/summarize-jest-results.js" compose-client-jest-results.json "Compose Client Gate (Save-Contract Suite)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jest results (per-suite breakdown)
        uses: actions/upload-artifact@v6
        if: failure()   # the breakdown matters MOST when the gate is red
        with:
          name: compose-client-jest-results
          path: src/client/shared/Spaarke.Compose.Components/compose-client-jest-results.json
          if-no-files-found: warn  # absent only if the run crashed before jest reported
