# ============================================================================
# Client Tests — Phase 1: BASELINE ONLY
# ============================================================================
# ci-cd-unit-test-remediation-r1 · task CICD-095 · issue #851
#
# WHY THIS EXISTS
# ---------------
# 730 tracked client test files across ~40 packages (the count is discovered at
# runtime, never hard-coded; 43 on 2026-10-12), and BEFORE this workflow
# not one of them ran in CI — while 923 server .cs files did. One package has
# been red since 2026-06-11 under a board that showed all green. A test nobody
# runs is not a test; it is a file.
#
# SCOPE — PHASE 1 IS DELIBERATELY PLUMBING ONLY
# ---------------------------------------------
# This workflow makes the client test surface VISIBLE and nothing more. It does
# not fix a single test, and no jest test file was modified by the task that
# added it. The project spec puts "React/PCF Jest test architecture" explicitly
# OUT of scope and it stays out — how those tests are designed is not this
# project's business. But "no workflow runs jest at all" is a CI gap, and CI is
# precisely what this project owns. That is the split.
#
# The per-package pass/fail table this produces IS the deliverable. Remediation
# is handed on with numbers attached.
#
# WHY IT DOES NOT RUN ON pull_request (deliberate, revisit at promotion)
# ----------------------------------------------------------------------
# ~40 packages with no npm workspace root means ~40 independent `npm install`s.
# Hanging that off every PR would contend for runners with the very PRs the
# CI shadow window is trying to accumulate (20 agreeing PRs), which works
# directly against the owner north star "CI must not hold up high-frequency
# master builds and pushes". Phase 1 needs to SEE the surface, not gate it, and
# a nightly baseline sees it just as well at a fraction of the contention.
#
# Adding `pull_request` is part of the Phase 2 promotion described below — not
# an oversight.
#
# PROMOTION PATH (NOT part of this task)
# ---------------------------------------
# Promotion into Tier 2 as a real gate happens only AFTER the shadow window
# closes AND the baseline is green. Until then this workflow is advisory by
# construction: every step is continue-on-error and it appears in no blocking
# filter. Do not add it to ci-tier1-blocking.yml or ci-tier2-advisory.yml.
# ============================================================================

name: Client Tests

on:
  # Nightly baseline. 07:00 UTC — deliberately one hour after nightly-health.yml
  # (06:00 UTC) so the two do not contend for runners.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      package_filter:
        description: 'Optional substring filter — run only packages whose path contains this'
        required: false
        type: string
      dry_run_alerts:
        description: 'Quality alert: print what would be posted instead of opening/updating/closing the issue'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keyed per ref. Never cancel a nightly baseline mid-flight on account of a
  # manual dispatch: a partial baseline is worse than a late one.
  group: client-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # Job 1 — discover
  # Build the matrix by SCANNING for packages that declare a real jest test
  # script. A hardcoded list would silently drift the first time someone adds a
  # package, and a baseline that quietly stops covering things is exactly the
  # false-green this project exists to remove.
  # --------------------------------------------------------------------------
  discover:
    name: Discover client packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find packages with a jest test script
        id: find
        shell: bash
        env:
          PACKAGE_FILTER: ${{ inputs.package_filter }}
        run: |
          set -euo pipefail
          filter="$PACKAGE_FILTER"
          pkgs=()

          while IFS= read -r pkgjson; do
            dir="$(dirname "$pkgjson")"
            script="$(node -e "
              try {
                const j = require('./$pkgjson');
                const t = (j.scripts && j.scripts.test) || '';
                process.stdout.write(t);
              } catch (e) { }
            " 2>/dev/null || true)"

            # A package counts only if it has a test script that actually runs
            # something. The npm-init default ('Error: no test specified' + exit 1)
            # must NOT be treated as coverage.
            if [ -z "$script" ]; then continue; fi
            case "$script" in
              *"no test specified"*) continue ;;
            esac

            if [ -n "$filter" ] && [[ "$dir" != *"$filter"* ]]; then continue; fi
            pkgs+=("$dir")
          done < <(git ls-files '*/package.json' | grep -v node_modules)

          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "::error::No client packages with a jest test script were found. That is almost certainly a discovery bug, not an empty repo — failing loudly rather than reporting a vacuous green."
            exit 1
          fi

          matrix=$(printf '%s\n' "${pkgs[@]}" | jq -R . | jq -cs '{package: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=${#pkgs[@]}" >> "$GITHUB_OUTPUT"

          echo "Discovered ${#pkgs[@]} package(s):"
          printf '  %s\n' "${pkgs[@]}"

  # --------------------------------------------------------------------------
  # Job 2 — test
  # One package per matrix leg. continue-on-error so a red package never fails
  # the run; the result is RECORDED, not enforced.
  # --------------------------------------------------------------------------
  test:
    name: ${{ matrix.package }}
    needs: discover
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      # Bound runner usage. 40 simultaneous legs would starve everything else in
      # the org queue for the duration.
      max-parallel: 8
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `*.docx filter=lfs` (.gitattributes): without LFS the checkout yields a
          # pointer file where tests read real fixtures, e.g. Spaarke.Compose.Components'
          # ComposeWorkspace.redline-from-ledger.test.tsx reads
          # tests/integration/Spe.Integration.Tests/fixtures/sample.docx; with the
          # pointer 25 of its 30 tests fail with `Unable to find role="textbox"`.
          # Same fix as ci-standalone-checks.yml compose-client-gate.
          lfs: true

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        id: install
        continue-on-error: true
        working-directory: ${{ matrix.package }}
        # NOT `npm ci`. Per root CLAUDE.md §12, roughly 14 of 16 Vite solutions
        # carry stale package-lock.json files and `npm ci` fails outright on them.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # Shared-library dependencies.
      #
      # A package that imports `@spaarke/ui-components`, `@spaarke/auth`, ... via
      # `file:` dependencies gets a SYMLINK to the library source and nothing
      # else: the library has no `dist/` (main points at dist/index.js) and no
      # node_modules of its own. Suites then die at import time ("Cannot find
      # module '@spaarke/auth'", "Cannot find module '@fluentui/react-icons'
      # from ../Spaarke.UI.Components/src/...") before a single assertion runs.
      # That is not a test failure and must not be reported as one.
      #
      # So, before jest: install + (where the library ships dist/) build every
      # library the package depends on, TRANSITIVELY. The set is derived, never
      # hard-coded:
      #   1. `file:`/`link:` entries in dependencies/devDependencies/
      #      optionalDependencies (recursively; built when main/types point at
      #      dist/), and
      #   2. sibling packages a tsconfig `paths` entry points INTO the dist/ of
      #      (build-time dependency of that package's own `tsc`), and
      #   3. sibling packages whose source the package under test imports by
      #      relative path WITHOUT declaring them (install only, no build).
      # Deliberately NOT derived from jest `moduleNameMapper`: those are written
      # for a world where the mapped-to library has no node_modules of its own;
      # installing one there gives it a second copy of react (office-addins:
      # "Cannot read properties of null (reading 'useContext')"). A package whose
      # generated PCF types are missing gets `npm run refreshTypes`
      # (pcf-scripts) first.
      # Libraries are processed dependencies-first. A failure here is recorded as
      # `deps-build-failed`, NOT `fail` — the tests never got a chance to run.
      - name: Install and build shared-library dependencies
        id: deps
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -uo pipefail
          # Explicit failure handler instead of `-e`: the rest of this step
          # accumulates failures in $failed and must keep going. A Node crash
          # here would otherwise leave an empty TSV and the leg would run with
          # no libs built, silently.
          if ! node - "$PKG" > "$RUNNER_TEMP/deps-order.tsv" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const self = path.resolve(root, process.argv[2]);

          const readPkg = (d) => {
            try { return JSON.parse(fs.readFileSync(path.join(d, 'package.json'), 'utf8')); }
            catch { return null; }
          };
          // Nearest ancestor directory (inside the repo, never the repo root)
          // that owns a package.json.
          const owner = (p) => {
            let d = p;
            while (d.startsWith(root + path.sep)) {
              if (fs.existsSync(path.join(d, 'package.json'))) return d;
              d = path.dirname(d);
            }
            return null;
          };
          // Does the package publish a built dist/ that consumers resolve?
          const emitsDist = (pj) =>
            !!(pj && pj.scripts && pj.scripts.build) &&
            /(^|[^\w])dist\//.test(JSON.stringify([pj.main, pj.types, pj.module, pj.exports]));

          // Source files of the package under test that import (relative path)
          // a SIBLING package's source without declaring it as a dependency,
          // e.g. `from '../../../solutions/LegalWorkspace/src/...'`. Jest then
          // loads that source from where it lives, and its own imports resolve
          // from ITS node_modules — so that package has to be installed too.
          // CAVEAT: installing node_modules into a sibling of a different React
          // major (e.g. pcf/VisualHost on React 16/17) is safe only while the
          // imported files are plain utilities. A test importing a hook-using
          // component across such a path fails with "useContext of null" (two
          // React copies). That symptom means a duplicate-React problem, not a
          // test bug.
          const SKIP_DIRS = new Set(['node_modules', 'dist', 'build', 'out', 'coverage', 'generated', '.git', '__snapshots__']);
          const SPEC = /(?:\bfrom\s*|\bimport\s*\(\s*|\brequire\s*\(\s*|\bjest\.(?:mock|doMock|requireActual)\s*\(\s*)['"]((?:\.\.\/)+[^'"]*)['"]/g;
          const sourceNeighbours = (dir) => {
            const found = new Set();
            const walk = (d) => {
              for (const ent of fs.readdirSync(d, { withFileTypes: true })) {
                if (ent.isDirectory()) { if (!SKIP_DIRS.has(ent.name)) walk(path.join(d, ent.name)); continue; }
                if (!/\.(?:[cm]?[jt]sx?)$/.test(ent.name) || ent.name.endsWith('.d.ts')) continue;
                const text = fs.readFileSync(path.join(d, ent.name), 'utf8');
                for (const m of text.matchAll(SPEC)) {
                  const target = path.resolve(d, m[1]);
                  if (target === dir || target.startsWith(dir + path.sep)) continue;
                  const o = owner(target);
                  if (o && o !== dir && !dir.startsWith(o + path.sep) && readPkg(o)) found.add(o);
                }
              }
            };
            walk(dir);
            return found;
          };

          // Direct dependency edges of one package: Map<absDir, {build:boolean}>.
          const edges = (dir, withSources) => {
            const out = new Map();
            const add = (d, build) => {
              if (!d || d === dir || d === root || dir.startsWith(d + path.sep)) return;
              if (d.split(path.sep).includes('node_modules')) return;
              const prev = out.get(d);
              out.set(d, { build: (prev && prev.build) || build });
            };
            const pj = readPkg(dir) || {};
            for (const k of ['dependencies', 'devDependencies', 'optionalDependencies']) {
              for (const v of Object.values(pj[k] || {})) {
                const m = /^(?:file|link):(.+)$/.exec(v);
                if (!m) continue;
                const d = path.resolve(dir, m[1]);
                const dp = readPkg(d);
                if (dp) add(d, emitsDist(dp));
              }
            }
            // tsconfig `paths` that point INTO a sibling's dist/ are build-time
            // dependencies (e.g. AI.Widgets -> ../Spaarke.AI.Context/dist/index.d.ts):
            // that sibling must be built before this package's own `tsc` runs.
            for (const f of fs.readdirSync(dir).filter((n) => /^tsconfig[\w.-]*\.json$/.test(n))) {
              const text = fs.readFileSync(path.join(dir, f), 'utf8');
              for (const m of text.matchAll(/["']((?:\.\.\/)+[^"']*?\/dist(?:\/[^"']*)?)["']/g)) {
                const o = owner(path.resolve(dir, m[1]));
                const op = o && readPkg(o);
                if (op) add(o, !!(op.scripts && op.scripts.build));
              }
            }
            if (withSources) for (const d of sourceNeighbours(dir)) add(d, false);
            return out;
          };

          // Post-order DFS: dependencies before dependents.
          const build = new Map();
          const post = [];
          const seen = new Set([self]);
          const visit = (dir) => {
            for (const [d, e] of edges(dir, dir === self)) {
              build.set(d, !!build.get(d) || e.build);
              if (seen.has(d)) continue;
              seen.add(d);
              visit(d);
              post.push(d);
            }
          };
          visit(self);
          for (const d of post) {
            const rel = path.relative(root, d).split(path.sep).join('/');
            process.stdout.write(rel + '\t' + (build.get(d) ? 1 : 0) + '\n');
          }
          NODE
          then
            echo "::error::deriving shared-library dependencies of $PKG failed (node crashed)"
            exit 1
          fi
          echo "Shared-library dependencies of $PKG (dependencies first):"
          sed 's/^/  /' "$RUNNER_TEMP/deps-order.tsv"

          failed=0
          # PCF controls: generated/ManifestTypes.d.ts is gitignored and written
          # by pcf-scripts. Tests import it (`./generated/ManifestTypes`), so
          # without it ts-jest dies on TS2307 before any assertion runs.
          if (cd "$PKG" && node -e "process.exit(require('./package.json').scripts?.refreshTypes ? 0 : 1)"); then
            echo "::group::refreshTypes: $PKG"
            (cd "$PKG" && npm run refreshTypes) || { echo "::error::npm run refreshTypes failed in $PKG"; failed=1; }
            echo "::endgroup::"
          fi
          while IFS=$'\t' read -r dep build; do
            [ -n "$dep" ] || continue
            echo "::group::deps: $dep (build=$build)"
            if ! (cd "$dep" && npm install --legacy-peer-deps --no-audit --no-fund); then
              echo "::error::npm install failed in shared dependency $dep"; failed=1
            elif [ "$build" = "1" ] && ! (cd "$dep" && npm run build); then
              echo "::error::npm run build failed in shared dependency $dep"; failed=1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/deps-order.tsv"
          exit $failed

      - name: Run tests
        id: jest
        if: steps.install.outcome == 'success' && steps.deps.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ matrix.package }}
        shell: bash
        run: |
          # Packages are not all jest: vitest rejects jest's --ci/--reporters
          # flags outright ("Unknown option `--ci`"), which would fail the leg
          # before a single test ran. vitest already detects CI from $CI.
          if node -e "process.exit(/vitest/.test(require('./package.json').scripts.test) ? 0 : 1)"; then
            npm test -- --passWithNoTests=false
          else
            npm test -- --ci --reporters=default --passWithNoTests=false
          fi

      - name: Record result
        if: always()
        shell: bash
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          # Distinguish install failure from test failure. Collapsing them would
          # report a broken lockfile as "tests failing", sending the next person
          # to debug the wrong thing. Same for a shared library that would not
          # install/build: the package's tests never ran.
          if [ "${{ steps.install.outcome }}" != "success" ]; then
            status="install-failed"
          elif [ "${{ steps.deps.outcome }}" != "success" ]; then
            status="deps-build-failed"
          elif [ "${{ steps.jest.outcome }}" = "success" ]; then
            status="pass"
          else
            status="fail"
          fi
          slug="$(printf '%s' "$PKG" | tr '/' '_')"
          printf '%s\t%s\n' "$PKG" "$status" > "$RUNNER_TEMP/results/$slug.tsv"
          echo "$status  $PKG"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-result-${{ strategy.job-index }}
          path: ${{ runner.temp }}/results/
          retention-days: 30

  # --------------------------------------------------------------------------
  # Job 3 — summarize
  # The per-package table is the artifact of this task. It must be readable
  # without downloading anything, so it goes in the job summary.
  # --------------------------------------------------------------------------
  summarize:
    name: Baseline summary
    needs: [discover, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: client-test-result-*
          merge-multiple: true
          path: results

      - name: Build baseline table
        shell: bash
        run: |
          set -euo pipefail
          discovered='${{ needs.discover.outputs.count }}'
          cat results/*.tsv 2>/dev/null | sort -u > all.tsv || true
          reported=$(wc -l < all.tsv | tr -d ' ')

          pass=$(awk -F'\t' '$2=="pass"'          all.tsv | wc -l | tr -d ' ')
          fail=$(awk -F'\t' '$2=="fail"'          all.tsv | wc -l | tr -d ' ')
          inst=$(awk -F'\t' '$2=="install-failed"' all.tsv | wc -l | tr -d ' ')
          deps=$(awk -F'\t' '$2=="deps-build-failed"' all.tsv | wc -l | tr -d ' ')

          {
            echo "# Client Test Baseline (Phase 1)"
            echo
            echo "Advisory only — this workflow gates nothing. See the header of"
            echo '`.github/workflows/client-tests.yml` for the scope split.'
            echo
            echo "| Result | Packages |"
            echo "|---|---:|"
            echo "| ✅ pass | $pass |"
            echo "| ❌ fail | $fail |"
            echo "| ⚠️ install-failed | $inst |"
            echo "| 🔧 deps-build-failed | $deps |"
            echo "| **discovered** | **$discovered** |"
            echo

            # Never let a partial baseline read as a complete one.
            if [ "$reported" != "$discovered" ]; then
              echo "> ⚠️ **Incomplete baseline** — $discovered package(s) discovered but only"
              echo "> $reported reported a result. The difference is legs that did not finish"
              echo "> (cancelled or infrastructure failure). Treat the table below as partial."
              echo
            fi

            echo "## Per package"
            echo
            echo "| Package | Result |"
            echo "|---|---|"
            awk -F'\t' '{
              icon = ($2=="pass") ? "✅" : ($2=="fail") ? "❌" : ($2=="deps-build-failed") ? "🔧" : "⚠️";
              printf "| `%s` | %s %s |\n", $1, icon, $2
            }' all.tsv
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Baseline: $pass pass / $fail fail / $inst install-failed / $deps deps-build-failed of $discovered discovered"

      - name: Upload combined baseline
        uses: actions/upload-artifact@v4
        with:
          name: client-test-baseline
          path: all.tsv
          retention-days: 90

  # --------------------------------------------------------------------------
  # Job 4 — alert
  # The baseline above is advisory by design (nothing here gates a PR), but an
  # advisory result that nobody sees is the false-green this project exists to
  # remove. So the nightly outcome is surfaced as ONE quality alert, assigned to
  # the owner: open while any package is red, closed by the first all-green run.
  # See .github/actions/quality-alert and docs/procedures/ci-cd-workflow.md
  # "Quality alerts". This job is not a gate either: the action never fails it.
  # --------------------------------------------------------------------------
  alert:
    name: Quality alert (client-tests)
    needs: [discover, test, summarize]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (local action only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Download combined baseline
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: client-test-baseline
          path: baseline

      - name: Decide status
        id: decide
        shell: bash
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          SUMMARIZE_RESULT: ${{ needs.summarize.result }}
          DISCOVERED: ${{ needs.discover.outputs.count }}
        run: |
          set -euo pipefail
          status=ok
          summary=""

          if [ "$DISCOVER_RESULT" != "success" ]; then
            status=failing
            summary+="- The package discovery job finished **${DISCOVER_RESULT}**: no client package was tested."$'\n'
          elif [ "$SUMMARIZE_RESULT" != "success" ] || [ ! -s baseline/all.tsv ]; then
            status=failing
            summary+="- The baseline was not produced (summary job: **${SUMMARIZE_RESULT}**). Treat every client package as unverified tonight."$'\n'
          else
            reported="$(wc -l < baseline/all.tsv | tr -d ' ')"
            bad="$(awk -F'\t' '$2 != "pass"' baseline/all.tsv | sort)"
            if [ -n "$bad" ]; then
              status=failing
              count="$(printf '%s\n' "$bad" | wc -l | tr -d ' ')"
              summary+="${count} of ${DISCOVERED} client package(s) are not passing (\`fail\`, \`install-failed\` or \`deps-build-failed\`):"$'\n\n'
              summary+="$(printf '%s\n' "$bad" | awk -F'\t' '{ printf "- `%s`: %s\n", $1, $2 }')"$'\n'
            fi
            if [ "$reported" != "$DISCOVERED" ]; then
              status=failing
              summary+=$'\n'"- Incomplete baseline: ${DISCOVERED} package(s) discovered but only ${reported} reported (legs cancelled or lost to an infrastructure failure)."$'\n'
            fi
          fi

          if [ "$status" = "failing" ]; then
            summary+=$'\n'"Known: #1788–#1793 track the six known real failures; a package listed above that is not covered by those issues is new."$'\n'
          else
            summary="All ${DISCOVERED} client packages passed."
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          delimiter="ALERT_SUMMARY_EOF_$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "summary<<${delimiter}"
            printf '%s\n' "$summary"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Raise or clear the alert
        uses: ./.github/actions/quality-alert
        with:
          check: client-tests
          status: ${{ steps.decide.outputs.status }}
          summary: ${{ steps.decide.outputs.summary }}
          dry-run: ${{ inputs.dry_run_alerts == true || github.ref_name != github.event.repository.default_branch }}
