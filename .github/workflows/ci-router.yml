# ============================================================================
# ci-router.yml — Tiered CI Router (single required status check)
# ============================================================================
#
# PURPOSE
#   This workflow is the single gate for branch protection on master.
#   Per spec FR-A01: emits exactly ONE required status check named
#   `CI / Router` that is NEVER stuck pending. Dispatches Tier 1 (blocking)
#   and Tier 2 (advisory) via reusable workflow calls, conditioned on
#   path-aware diff classification.
#
# SIGNAL MODEL — Model A (single composite check)
#   Per task 012's decision (notes/router-signal-model-decision.md):
#   - Workflow has NO `paths:` filter (would re-introduce the stuck-pending
#     trap; see GitHub Docs "Troubleshooting required status checks").
#   - `classify` job uses dorny/paths-filter to emit boolean outputs.
#   - `tier1` / `tier2` are reusable-workflow calls gated by `if:` on
#     classify outputs (skipped jobs report success per GitHub semantics).
#   - `router-result` is the final job: `if: always()` + re-actors/alls-green.
#     This job's success/failure IS the `CI / Router` required check.
#
# BAN — NO COMMIT-MARKER SKIP MECHANISM (spec FR-A05)
#   The router MUST NOT inspect commit messages for [skip ci]-style markers.
#   Path-based dispatch via `classify` is the ONLY relief mechanism.
#
# SHADOW MODE (Phase 2)
#   This workflow runs in PARALLEL with the existing `sdap-ci.yml` for ≥14
#   days. Branch protection is NOT flipped to require `CI / Router` until
#   task 071 (cutover). Until then, this workflow's result is observational.
#
# MERGE QUEUE COMPATIBILITY (spec FR-C01)
#   The `merge_group` trigger is included from day 1. When merge queue is
#   enabled in task 071, this workflow re-runs on each queued PR with the
#   integrated base. classify still works because dorny/paths-filter handles
#   merge_group payloads (uses github.event.merge_group.base_sha when present).
#
# REFERENCES
#   - projects/ci-cd-unit-test-remediation-r1/spec.md FR-A01, FR-A05, FR-C01
#   - projects/ci-cd-unit-test-remediation-r1/notes/router-signal-model-decision.md
#   - GitHub Docs: "Troubleshooting required status checks" — paths-ignore
#     causes stuck-pending; skipped JOBS report success.
#   - re-actors/alls-green — pinned to a tagged release for supply-chain safety.
# ============================================================================

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:
    # NOTE: `merge_group` does NOT support a `branches:` filter per GitHub Actions
    # schema (only `types:` is allowed). Adding `branches:` here causes workflow
    # startup_failure on every push to master. Merge queue events only fire for
    # the queue's target branch anyway, so no filter is needed.

permissions:
  contents: read
  # pull-requests: write — bumped from `read` to `write` per CICD-086 bisect (2026-06-26).
  # Root cause: ci-tier2-advisory.yml declares `permissions: pull-requests: write` (for
  # the tier2-pr-comment job that posts ONE deduplicated comment). GitHub rejects reusable
  # workflow calls when the callee requests MORE permissions than the caller granted,
  # pre-job-creation, with no logs (conclusion=startup_failure). `read` was sufficient
  # for dorny/paths-filter but insufficient for tier2's PR-comment. `write` covers both.
  # Bisect proof: step 5 (router + tier2 + read) → startup_failure; step 6 (+ write) → parses.
  pull-requests: write

concurrency:
  # NOTE: `cancel-in-progress` MUST be a literal boolean — GitHub Actions
  # schema rejects expressions here at workflow startup (was the cause of
  # startup_failure 2026-06-26). Using literal `true` is safe because the
  # `group` key already segregates events:
  #   - PRs: group `ci-router-{pr_number}` — new push cancels previous PR run (desired)
  #   - master push: group `ci-router-{sha}` — see below
  #   - merge_group: `github.sha` is the ephemeral queue commit, so each queued
  #     PR gets its own group — no cross-cancellation
  #
  # CHANGED 2026-08-27: the fallback was `github.ref`, whose comment read
  # "back-to-back master pushes (rare) may cancel each other; acceptable since
  # the newer push supersedes the older one anyway". Both halves were wrong.
  #
  #   * NOT RARE. On 2026-08-27 four PRs merged inside 35 minutes during a
  #     routine integration sweep and produced TWO cancellations. Back-to-back
  #     master merges are the normal mode here, not an edge case.
  #   * NOT ACCEPTABLE. A cancelled run does not quietly yield to its successor:
  #     `router-result` aggregates via alls-green, which treats a *cancelled*
  #     dependency as a hard failure (`allowed-failures` covers failure, not
  #     cancellation). Run 33096671842 on 7acfec600 is the worked example —
  #     every Tier 1 gate PASSED (compile, arch, tenant-isolation, compose
  #     fidelity, eval) and `CI / Router` still reported RED, solely because
  #     `Classify Tier 1 Surfaces` was cancelled mid-checkout.
  #
  # A red that means nothing is the failure mode this project exists to remove,
  # and once `CI / Router` becomes the required check it stops being cosmetic:
  # a spurious red BLOCKS the merge.
  #
  # Keying master on `github.sha` means runs on DIFFERENT commits never cancel
  # each other, so every master commit gets its own honest verdict. This is the
  # same fix ci-tier2-advisory.yml already carries (see its concurrency block,
  # which documents this identical failure mode) — the router never received it.
  #
  # Cost, accepted deliberately: during a sweep, N merges now run N full CI runs
  # instead of cancelling down to one. That is more runner minutes in exchange
  # for a correct per-commit verdict. PR behaviour is UNCHANGED — still keyed on
  # PR number, so a new push still cancels the previous run, which is where the
  # savings actually matter.
  group: ci-router-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # JOB 1 — classify: Diff classification (path-aware dispatch)
  # ==========================================================================
  # Runs unconditionally on every event. Emits boolean outputs consumed by
  # downstream tier jobs' `if:` conditions. Designed to complete in <10s.
  # ==========================================================================
  classify:
    name: Classify Diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bff: ${{ steps.filter.outputs.bff }}
      spaarke_ai: ${{ steps.filter.outputs.spaarke_ai }}
      docs: ${{ steps.filter.outputs.docs }}
      ci_workflows: ${{ steps.filter.outputs.ci_workflows }}
      docs_only: ${{ steps.docs-only-flag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history for accurate diff on push / merge_group events.
          # PRs use the GitHub-provided merge ref and don't need depth.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # On merge_group / push events, paths-filter compares against the
          # merge_group.base_sha / previous commit automatically. On PRs it
          # uses the PR base.
          filters: |
            bff:
              - 'src/server/api/Sprk.Bff.Api/**'
              - 'src/server/shared/**'
              - 'tests/integration/auth/**'
              - 'tests/integration/regression/**'
              - 'tests/unit/Sprk.Bff.Api.Tests/**'
              - 'Directory.Packages.props'
              - 'Directory.Build.props'
            spaarke_ai:
              - 'src/solutions/SpaarkeAi/**'
              - 'src/client/shared/Spaarke.AI.**/**'
            docs:
              - 'docs/**'
              - 'projects/**'
              - '**.md'
              - '.claude/**'
              - 'knowledge/**'
              - 'memory/**'
              - 'CHANGELOG*'
              - 'CODEOWNERS'
              - 'LICENSE*'
            ci_workflows:
              - '.github/workflows/**'

      - name: Derive docs_only flag
        id: docs-only-flag
        # docs_only = true iff docs changed AND no production-code surface
        # changed (no BFF, no SpaarkeAi, no CI workflows). This is the only
        # classification that allows the entire Tier 1/2 stack to be skipped.
        shell: bash
        run: |
          docs='${{ steps.filter.outputs.docs }}'
          bff='${{ steps.filter.outputs.bff }}'
          spaarke_ai='${{ steps.filter.outputs.spaarke_ai }}'
          ci_workflows='${{ steps.filter.outputs.ci_workflows }}'
          if [[ "$docs" == "true" && "$bff" != "true" && "$spaarke_ai" != "true" && "$ci_workflows" != "true" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs-only change detected — Tier 1 and Tier 2 will be skipped; router-result will still pass."
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Classification summary
        shell: bash
        run: |
          {
            echo "### CI Router — Diff Classification"
            echo ""
            echo "| Surface | Changed |"
            echo "|---|---|"
            echo "| BFF (Sprk.Bff.Api + shared server) | ${{ steps.filter.outputs.bff }} |"
            echo "| SpaarkeAi (solutions/SpaarkeAi + AI client libs) | ${{ steps.filter.outputs.spaarke_ai }} |"
            echo "| Docs (docs/, .claude/, *.md, etc.) | ${{ steps.filter.outputs.docs }} |"
            echo "| CI workflows (.github/workflows/) | ${{ steps.filter.outputs.ci_workflows }} |"
            echo ""
            echo "**docs_only**: ${{ steps.docs-only-flag.outputs.value }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # JOB 2 — tier1: Blocking checks (compile, arch, smoke, auth)
  # ==========================================================================
  # Reusable workflow call. Skipped only on docs_only diffs. Tier 1 IS the
  # blocking surface. Per spec NFR-01: p95 ≤ 3 min.
  # ==========================================================================
  tier1:
    name: Tier 1 (Blocking)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    uses: ./.github/workflows/ci-tier1-blocking.yml
    secrets: inherit
    with:
      bff_changed: ${{ needs.classify.outputs.bff }}
      spaarke_ai_changed: ${{ needs.classify.outputs.spaarke_ai }}

  # ==========================================================================
  # JOB 3 — tier2: Advisory checks (format, lint, full tests, ADR, etc.)
  # ==========================================================================
  # Reusable workflow call. Skipped on docs_only diffs. Tier 2 is ADVISORY
  # (non-blocking) per spec FR-A03 — handled by `allowed-skips: tier2` in
  # the router-result gate below, so Tier 2 failures or skips DO NOT block.
  # Per spec NFR-02: p95 ≤ 8 min.
  # ==========================================================================
  tier2:
    name: Tier 2 (Advisory)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    uses: ./.github/workflows/ci-tier2-advisory.yml
    secrets: inherit
    with:
      # Map router classification → tier2's `run-*` toggles per its workflow_call contract.
      # docs_only diffs never reach here (see `if:` above). For everything else, default-on.
      # Skip client-side lint when no client files changed (no spaarke_ai/bff client paths).
      #
      # All run-* are tier2's string-typed inputs (CICD-086 rationale: avoids
      # cross-workflow_call coercion surprises that produced startup_failure).
      # Values MUST be explicit string-returning expressions to satisfy actionlint's
      # static type check (which treats unwrapped `'true'` literals AND `${{ ==
      # 'true' }}` boolean comparisons as bool — neither pattern previously worked
      # despite the now-removed comment claiming otherwise).
      # Pattern: conditional → `${{ (cond) && 'true' || 'false' }}` (ternary
      # returns string literal). Always-on → `${{ 'true' }}` (explicit string
      # expression).
      run-lint: ${{ (needs.classify.outputs.spaarke_ai == 'true' || needs.classify.outputs.bff == 'true') && 'true' || 'false' }}
      run-format: ${{ 'true' }}
      run-unit-tests: ${{ needs.classify.outputs.bff == 'true' && 'true' || 'false' }}
      run-adr-compliance: ${{ 'true' }}
      run-markdown: ${{ 'true' }}
      run-last-reviewed: ${{ 'true' }}
      run-plugin-size: ${{ needs.classify.outputs.bff == 'true' && 'true' || 'false' }}

  # ==========================================================================
  # JOB 4 — Router: THE single required status check (`CI / Router`)
  # ==========================================================================
  # `if: always()` ensures this job can never be skipped. The job name `Router`
  # combined with the workflow name `CI` produces the branch-protection
  # required-check string `CI / Router` per spec FR-A01.
  #
  # alls-green semantics (default):
  #   - success     -> pass
  #   - skipped     -> pass (used for tier1 on docs_only; used for tier2 always
  #                          via allowed-skips)
  #   - failure     -> FAIL (this fails the required check)
  #   - cancelled   -> FAIL
  #
  # `allowed-skips: tier2` means tier2's status (success OR failure OR skipped)
  # does not affect the router result. tier1 failures DO fail the router.
  # classify failure DOES fail the router (since classify is unconditional).
  # ==========================================================================
  router-result:
    name: Router
    if: always()
    needs: [classify, tier1, tier2]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ----------------------------------------------------------------------
      # tier2 is ADVISORY per FR-A03 — it must never be able to fail this gate.
      # It is therefore excluded from adjudication BY CONSTRUCTION rather than
      # by allow-list, because the allow-list did not hold:
      #
      #   `allowed-failures: tier2` covers conclusion=FAILURE only. A tier2 job
      #   killed by `timeout-minutes` reports conclusion=CANCELLED, which
      #   neither allowed-failures nor allowed-skips covers. alls-green then
      #   counted it against the gate:
      #       tier2 → ⬜ cancelled [allowed to fail]
      #       ❌ Some of the required to succeed jobs failed
      #       Process completed with exit code 1
      #   → `CI / Router` = failure while tier1 = success.
      #
      # Observed 2026-08-24: 17/17 runs red on work/unified-access-control-r2
      # (never once green), and work/spaarkeai-compose-r8 failing identically —
      # i.e. repo-wide. Root cause was tier2's 6-minute unit-test budget (raised
      # to 30 in ci-tier2-advisory.yml in the same change), but the gate must
      # survive ANY future tier2 cancellation source, not just that one.
      #
      # tier2 stays in `needs:` so the Router still sequences after it and the
      # decision summary below still reports its real result.
      # ----------------------------------------------------------------------
      - name: Build adjudication set (tier2 excluded — advisory per FR-A03)
        id: adjudicate
        shell: bash
        run: |
          # Shape mirrors `toJSON(needs)` exactly — including the empty `outputs`
          # object — so alls-green sees the structure it would normally receive.
          # Only `result` participates in adjudication.
          printf 'json={"classify":{"result":"%s","outputs":{}},"tier1":{"result":"%s","outputs":{}}}\n' \
            '${{ needs.classify.result }}' '${{ needs.tier1.result }}' >> "$GITHUB_OUTPUT"
          echo "classify=${{ needs.classify.result }} tier1=${{ needs.tier1.result }} tier2=${{ needs.tier2.result }} (tier2 not adjudicated)"

      - name: Aggregate tier results
        # Pinned to a tagged release (v1.2.2) per supply-chain hygiene.
        # If this action is ever deprecated, fallback is inline bash gate
        # documented in notes/router-signal-model-decision.md §5.
        uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ steps.adjudicate.outputs.json }}
          # tier1 may legitimately be skipped when classify finds no Tier-1
          # surface in the diff; a skipped job counts as success.
          allowed-skips: tier1

      - name: Router decision summary
        if: always()
        shell: bash
        run: |
          {
            echo "### CI Router — Final Decision"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| classify | ${{ needs.classify.result }} |"
            echo "| tier1 (blocking) | ${{ needs.tier1.result }} |"
            echo "| tier2 (advisory) | ${{ needs.tier2.result }} |"
            echo ""
            echo "Tier 2 is **advisory** — its result does NOT block merge (per spec FR-A03)."
            echo "Tier 1 failure OR classify failure DOES fail the required check \`CI / Router\`."
          } >> "$GITHUB_STEP_SUMMARY"
