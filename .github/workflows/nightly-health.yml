name: nightly-health

# Nightly health checks for the Spaarke repo. Runs on master, reports to a
# tracking issue. Catches problems that the per-PR SDAP CI doesn't surface:
#   - flake-hunt:    runs unit tests 3x (3 parallel runs, each split in 4 shards);
#                    flags tests that didn't pass all 3 runs (intermittent failures
#                    = flakes)
#   - bundle-size:   builds key client artifacts; flags >10% size regressions
#                    vs the recorded baseline in .github/baseline-bundle-sizes.json
#   - vuln-scan:     dotnet list package --vulnerable + npm audit per client pkg
#
# The legacy per-night comment on the rolling issue "Nightly Health — YYYY-MM-DD" is
# OFF by default (dispatch input post_tracking_comment); the quality alerts below and
# the Issues & Quality dashboard replace it. No Slack/Teams bridge by design.
#
# Raises one quality alert per check (the `alerts` job at the bottom, see
# .github/actions/quality-alert and docs/procedures/ci-cd-workflow.md "Quality
# alerts"). A cancelled or timed-out job is a failure to observe, never a pass: that
# is how this workflow was cancelled in 13 of its last 30 runs without anyone being
# told. The rolling issue above is a log; the alert issues are the dashboard.
#
# Operator notes:
#   - To temporarily silence a specific flake: add a [Trait("Category","Flaky")]
#     on the test and rerun nightly. The flake-hunt step will skip Flaky-tagged
#     tests in its triple-run analysis.
#   - To update the bundle-size baseline after an intentional bundle change:
#     workflow_dispatch this with update_baseline=true.

on:
  schedule:
    - cron: '0 6 * * *'  # daily 06:00 UTC (~02:00 ET, ~23:00 PT prev day)
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Update .github/baseline-bundle-sizes.json with current sizes (commit to master)'
        required: false
        type: boolean
        default: false
      dry_run_alerts:
        description: 'Quality alerts: print what would be posted instead of opening/updating/closing issues'
        required: false
        type: boolean
        default: false
      post_tracking_comment:
        description: 'Also append the legacy per-night comment to the rolling "Nightly Health" issue (off by default; alerts + dashboard replace it)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # for optional baseline update commit
  issues: write     # for tracking issue
  pull-requests: read

concurrency:
  group: nightly-health
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # -------------------------------------------------------------------------
  # flake-hunt: run the unit tests 3x; surface any test that didn't pass all 3.
  #
  # PARALLEL, not sequential (2026-10-13). The three runs used to execute one after
  # another on a single runner under a 60-minute cap, and ONE run of
  # Sprk.Bff.Api.Tests took ~42 minutes there (19.5k tests, 1,084 of them failing on
  # LFS pointer fixtures; see below). So the job was cancelled at its cap every night (13 of the last
  # 30 nightly runs) and the analysis step never ran: a flake hunt that never
  # reports. Now each of the 3 runs is its own matrix leg, and each leg is further
  # split into the same 4 namespace shards `ci-tier2-advisory.yml` uses for the PR
  # run, so every leg has its own cap and a leg takes a few minutes less than a
  # quarter of the suite. `flake-hunt` (below) downloads every TRX and runs the
  # unchanged analysis.
  #
  # KEEP THE SHARD FILTERS IN SYNC with `full-unit-tests-shard` in
  # ci-tier2-advisory.yml and with `coverage-shard` below: `rest` is the complement
  # of the other three, so a test in a new namespace always runs somewhere.
  #
  # `lfs: true`: tests/fixtures/compose-corpus/*.docx are Git-LFS pointers
  # (.gitattributes). Without the smudge ~1,084 Compose seam tests failed on every
  # nightly run for the wrong reason (129-byte "docx" fixtures) and buried real
  # failures. The PR run has had `lfs: true` since 2026-08-13.
  # -------------------------------------------------------------------------
  flake-hunt-run:
    name: Flake hunt run ${{ matrix.run }} / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Measured 2026-10-13 (run 38432551839): 6.7-12.9 min per leg including a ~3 min
    # build. Cap = ~2x the slowest leg.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
        shard: [api-office, api-insights-integration, api-seam, rest]
        include:
          - shard: api-office
            filter: 'FullyQualifiedName~Sprk.Bff.Api.Tests.Api.Office.'
          - shard: api-insights-integration
            filter: 'FullyQualifiedName~Sprk.Bff.Api.Tests.Api.Insights.|FullyQualifiedName~Sprk.Bff.Api.Tests.Integration.'
          - shard: api-seam
            filter: '(FullyQualifiedName~Sprk.Bff.Api.Tests.Api.|FullyQualifiedName~Sprk.Bff.Api.Tests.Seam.)&FullyQualifiedName!~Sprk.Bff.Api.Tests.Api.Office.&FullyQualifiedName!~Sprk.Bff.Api.Tests.Api.Insights.&FullyQualifiedName!~Sprk.Bff.Api.Tests.Integration.'
          - shard: rest
            filter: 'FullyQualifiedName!~Sprk.Bff.Api.Tests.Api.&FullyQualifiedName!~Sprk.Bff.Api.Tests.Seam.&FullyQualifiedName!~Sprk.Bff.Api.Tests.Integration.'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true  # smudge tests/fixtures/compose-corpus/*.docx — real bytes, not LFS pointers

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore + build
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Run unit tests (run ${{ matrix.run }}, shard ${{ matrix.shard }})
        shell: bash
        env:
          RUN_NO: ${{ matrix.run }}
          SHARD: ${{ matrix.shard }}
          SHARD_FILTER: ${{ matrix.filter }}
        run: |
          set -uo pipefail
          mkdir -p flake-runs
          # Test failures are the data the analysis needs, so they do not fail the leg...
          dotnet test tests/unit/Sprk.Bff.Api.Tests/ \
            -c Release --no-build \
            --filter "(${SHARD_FILTER})&Category!=Flaky" \
            --logger "trx;LogFileName=flake-run-${RUN_NO}--${SHARD}.trx" \
            --results-directory flake-runs/ \
            || echo "Run ${RUN_NO} / ${SHARD} had test failures (expected for flake hunt)"
          # ...but a leg that produced no TRX at all (host crash, filter typo) is a
          # broken measurement, and must not read as a clean one.
          if [ ! -s "flake-runs/flake-run-${RUN_NO}--${SHARD}.trx" ]; then
            echo "::error::No TRX produced for run ${RUN_NO} / ${SHARD}: dotnet test crashed or the shard filter matched nothing"
            exit 1
          fi

      - name: Upload TRX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-trx-run${{ matrix.run }}-${{ matrix.shard }}
          path: flake-runs/
          retention-days: 14

  flake-hunt:
    name: Flake hunt (3x unit tests)
    needs: flake-hunt-run
    # Analyse whatever TRX exist even when a leg timed out: a partial answer plus a
    # loud "incomplete" beats the silence the old single job produced.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      flakes_found: ${{ steps.analyze.outputs.flakes_found }}
      flake_summary: ${{ steps.analyze.outputs.flake_summary }}
      incomplete: ${{ steps.analyze.outputs.incomplete }}
    steps:
      - name: Download TRX artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-trx-run*
          merge-multiple: true
          path: flake-runs

      - name: Analyze for flakes
        id: analyze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flake-runs

          # Parse the TRX files (3 runs x 4 shards); identify tests that PASSED in some
          # runs and FAILED in others. The shards of one run are merged into that run.
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import json
          import os
          import re
          from collections import defaultdict
          from pathlib import Path

          EXPECTED_RUNS = 3
          EXPECTED_SHARDS = 4

          runs = {}
          shards_seen = defaultdict(set)
          for trx in sorted(Path("flake-runs").glob("flake-run-*.trx")):
              tree = ET.parse(trx)
              ns = {"x": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
              m = re.match(r"flake-run-(\d+)--(.+)$", trx.stem)
              run_id = f"flake-run-{m.group(1)}" if m else trx.stem
              shards_seen[run_id].add(m.group(2) if m else trx.stem)
              outcomes = runs.setdefault(run_id, {})
              for r in tree.findall(".//x:UnitTestResult", ns):
                  name = r.get("testName") or ""
                  outcome = r.get("outcome") or "Unknown"
                  outcomes[name] = outcome

          if not runs:
              print("::warning::No TRX files found; skipping flake analysis")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("flakes_found=0\nincomplete=1\nflake_summary=No TRX files found: every flake-hunt leg failed or was cancelled\n")
              raise SystemExit(0)

          legs = sum(len(s) for s in shards_seen.values())
          incomplete = len(runs) < EXPECTED_RUNS or legs < EXPECTED_RUNS * EXPECTED_SHARDS

          all_tests = set()
          for outcomes in runs.values():
              all_tests.update(outcomes.keys())

          flakes = []
          for test in sorted(all_tests):
              results = [runs[r].get(test, "NotRun") for r in runs]
              passed = sum(1 for r in results if r == "Passed")
              failed = sum(1 for r in results if r == "Failed")
              if passed > 0 and failed > 0:
                  flakes.append({"name": test, "runs": results})

          summary_lines = []
          if incomplete:
              summary_lines.append(
                  f"⚠️ Incomplete: {legs} of {EXPECTED_RUNS * EXPECTED_SHARDS} run/shard results were produced "
                  f"({len(runs)} of {EXPECTED_RUNS} runs). The legs that are missing failed, timed out or were cancelled.")
          if flakes:
              summary_lines.append(f"Found {len(flakes)} flaky test(s):")
              for f in flakes[:30]:  # cap at 30 to avoid issue body length issues
                  summary_lines.append(f"- `{f['name']}` runs={'/'.join(f['runs'])}")
              if len(flakes) > 30:
                  summary_lines.append(f"...and {len(flakes) - 30} more")
          elif not incomplete:
              summary_lines.append("No flakes detected ✅")
          else:
              summary_lines.append("No flakes detected in the results that exist.")

          summary = "\n".join(summary_lines)
          # Escape for GITHUB_OUTPUT (multi-line)
          delimiter = f"NIGHTLY_FLAKE_EOF_{os.urandom(4).hex()}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"flakes_found={len(flakes)}\n")
              f.write(f"incomplete={1 if incomplete else 0}\n")
              f.write(f"flake_summary<<{delimiter}\n{summary}\n{delimiter}\n")
          PY

  # -------------------------------------------------------------------------
  # bundle-size: build key client artifacts, check vs baseline
  # -------------------------------------------------------------------------
  bundle-size:
    name: Bundle size drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      drift_summary: ${{ steps.measure.outputs.drift_summary }}
      regressions_found: ${{ steps.measure.outputs.regressions_found }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # SemanticSearch's webpack aliases @spaarke/auth and @spaarke/ui-components
      # to the shared libs' src/ folders. Node module resolution walks UP from
      # those source files looking for peer deps (@azure/msal-browser,
      # @fluentui/react-components, etc.), so we must `npm install` in the
      # shared libs first — otherwise webpack fails with "module not found".
      - name: Install shared-lib deps (peer-dep resolution)
        run: |
          for pkg in src/client/shared/Spaarke.Auth src/client/shared/Spaarke.UI.Components; do
            echo "::group::npm install $pkg"
            (cd "$pkg" && npm install --legacy-peer-deps --no-audit --no-fund)
            echo "::endgroup::"
          done

      - name: Build SemanticSearch Code Page
        run: |
          cd src/client/code-pages/SemanticSearch
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          pwsh -File build-webresource.ps1 || powershell -File build-webresource.ps1 || true
          ls -la out/ || true

      - name: Build CreateMatterWizard solution
        run: |
          cd src/solutions/CreateMatterWizard
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          ls -la dist/ || true

      # unified-access-control-r2 (2026-09-04): LegalWorkspace's standalone Vite
      # build was RED from 2026-07-02 to 2026-09-04 — two months — and NOTHING
      # reported it. `tsc --noEmit` passed the whole time, because TypeScript
      # resolves through tsconfig paths while Rollup resolves through Vite
      # aliases, and the two lists had drifted. A green typecheck is not
      # evidence that a Vite solution builds; only the build is.
      #
      # LW transpiles Spaarke.Compose.Components, so it silently inherits every
      # dependency Compose acquires. That is the recurrence risk this step
      # exists to catch: the next such dependency fails HERE, within a day,
      # instead of hiding until someone happens to build the solution by hand.
      #
      # Verified from a clean checkout on 2026-09-04: rm -rf node_modules,
      # npm install (335 packages), npm run build → exit 0.
      - name: Build LegalWorkspace solution
        run: |
          cd src/solutions/LegalWorkspace
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          ls -la dist/ || true

      - name: Measure + compare to baseline
        id: measure
        shell: bash
        run: |
          set -euo pipefail
          BASELINE=".github/baseline-bundle-sizes.json"
          THRESHOLD_PCT=10

          declare -A current
          current["SemanticSearch_code_page"]=$(stat -c%s src/client/code-pages/SemanticSearch/out/sprk_semanticsearch.html 2>/dev/null || echo 0)
          current["CreateMatterWizard_solution"]=$(stat -c%s src/solutions/CreateMatterWizard/dist/index.html 2>/dev/null || echo 0)
          # LegalWorkspace's build script renames index.html → corporateworkspace.html.
          current["LegalWorkspace_solution"]=$(stat -c%s src/solutions/LegalWorkspace/dist/corporateworkspace.html 2>/dev/null || echo 0)

          summary=""
          regressions=0

          if [ ! -f "$BASELINE" ]; then
            echo "::warning::Baseline file $BASELINE missing; nothing to compare against"
            summary="No baseline file ($BASELINE) — to seed, workflow_dispatch with update_baseline=true."
          else
            for key in "${!current[@]}"; do
              cur=${current[$key]}
              base=$(jq -r --arg k "$key" '.[$k] // empty' "$BASELINE")
              if [ -z "$base" ] || [ "$base" = "null" ]; then
                summary+=$'\n'"⚠️ \`$key\`: $cur bytes (no baseline)"
                continue
              fi
              if [ "$cur" -eq 0 ]; then
                summary+=$'\n'"❌ \`$key\`: build produced no artifact"
                regressions=$((regressions+1))
                continue
              fi
              # Compute pct change
              pct=$(( (cur - base) * 100 / base ))
              abs_pct=${pct#-}
              if [ "$abs_pct" -ge "$THRESHOLD_PCT" ]; then
                arrow="🔺"; [ "$pct" -lt 0 ] && arrow="🔻"
                summary+=$'\n'"$arrow \`$key\`: $cur bytes vs baseline $base (${pct}%)"
                regressions=$((regressions+1))
              else
                summary+=$'\n'"✅ \`$key\`: $cur bytes (within ±${THRESHOLD_PCT}% of baseline)"
              fi
            done
          fi

          # Optional baseline update on workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.update_baseline }}" = "true" ]; then
            echo "Updating baseline..."
            python3 -c "
          import json, os
          data = {}
          for k, v in [('SemanticSearch_code_page', $(echo ${current[SemanticSearch_code_page]})), ('CreateMatterWizard_solution', $(echo ${current[CreateMatterWizard_solution]}))]:
              data[k] = v
          with open('$BASELINE', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "
            git config user.name "nightly-health-bot"
            git config user.email "noreply@spaarke.com"
            git add "$BASELINE"
            git commit -m "chore(ci): update bundle-size baseline (nightly-health)" || true
            git push || true
            summary+=$'\n'$'\n'"📌 Baseline updated and committed."
          fi

          # Emit multi-line output
          delimiter="DRIFT_EOF_$RANDOM"
          {
            echo "regressions_found=$regressions"
            echo "drift_summary<<$delimiter"
            echo "$summary"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # vuln-scan: dotnet + npm audit
  # -------------------------------------------------------------------------
  vuln-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      vuln_summary: ${{ steps.scan.outputs.vuln_summary }}
      high_or_critical: ${{ steps.scan.outputs.high_or_critical }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: dotnet vulnerable scan
        id: dotnet_vuln
        shell: bash
        run: |
          set +e
          dotnet restore > /dev/null
          out=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$out" > dotnet-vuln.txt
          high=$(echo "$out" | grep -c "High" || true)
          crit=$(echo "$out" | grep -c "Critical" || true)
          echo "dotnet_high=$high" >> "$GITHUB_OUTPUT"
          echo "dotnet_crit=$crit" >> "$GITHUB_OUTPUT"

      - name: npm audit (key client packages)
        id: npm_vuln
        shell: bash
        run: |
          set +e
          total_high=0; total_crit=0
          for pkg in src/client/code-pages/SemanticSearch src/solutions/CreateMatterWizard src/client/shared/Spaarke.UI.Components; do
            if [ -f "$pkg/package.json" ]; then
              cd "$pkg"
              if [ -f package-lock.json ]; then
                json=$(npm audit --omit=dev --json 2>/dev/null || true)
                h=$(echo "$json" | jq -r '.metadata.vulnerabilities.high // 0' 2>/dev/null || echo 0)
                c=$(echo "$json" | jq -r '.metadata.vulnerabilities.critical // 0' 2>/dev/null || echo 0)
                total_high=$((total_high + h))
                total_crit=$((total_crit + c))
              fi
              cd - > /dev/null
            fi
          done
          echo "npm_high=$total_high" >> "$GITHUB_OUTPUT"
          echo "npm_crit=$total_crit" >> "$GITHUB_OUTPUT"

      - name: Compose summary
        id: scan
        shell: bash
        run: |
          dh=${{ steps.dotnet_vuln.outputs.dotnet_high }}
          dc=${{ steps.dotnet_vuln.outputs.dotnet_crit }}
          nh=${{ steps.npm_vuln.outputs.npm_high }}
          nc=${{ steps.npm_vuln.outputs.npm_crit }}
          total=$((dh + dc + nh + nc))

          summary="dotnet: High=$dh Critical=$dc / npm: High=$nh Critical=$nc"
          if [ "$total" -gt 0 ]; then
            summary+=$'\n'"See workflow logs for package details."
          else
            summary+=$'\n'"No HIGH or CRITICAL vulnerabilities ✅"
          fi

          delimiter="VULN_EOF_$RANDOM"
          {
            echo "high_or_critical=$total"
            echo "vuln_summary<<$delimiter"
            echo "$summary"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # full-integration: Tier 3 — full integration test suite (no filters)
  # Per spec FR-A04. Runtime ~10-15 min. Failures surface in report but do NOT
  # block any PR (this is nightly, not on the PR critical path).
  # -------------------------------------------------------------------------
  full-integration:
    name: Full integration tests (Tier 3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      passed_count: ${{ steps.run.outputs.passed_count }}
      failed_count: ${{ steps.run.outputs.failed_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore + build
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Run integration tests
        id: run
        shell: bash
        run: |
          set +e  # don't abort on test failure — we want the report to render
          mkdir -p integration-results
          # Discover all Spe.Integration.Tests csproj files (current: 1 project).
          # Pattern matches spec FR-A04 wording (tests/integration/**/Spe.Integration.Tests/).
          mapfile -t projs < <(find tests/integration -type d -name 'Spe.Integration.Tests' | sort)
          if [ ${#projs[@]} -eq 0 ]; then
            echo "::warning::No Spe.Integration.Tests projects found"
            echo "passed_count=0" >> "$GITHUB_OUTPUT"
            echo "failed_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for d in "${projs[@]}"; do
            echo "::group::dotnet test $d"
            dotnet test "$d" \
              -c Release --no-build \
              --logger "trx;LogFileName=$(basename "$d").trx" \
              --results-directory integration-results/ \
              || echo "Test failures in $d (continuing for full report)"
            echo "::endgroup::"
          done

          # Aggregate pass/fail across all TRX files
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import os
          from pathlib import Path

          passed = failed = 0
          ns = {"x": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for trx in Path("integration-results").glob("*.trx"):
              try:
                  tree = ET.parse(trx)
              except ET.ParseError:
                  continue
              for r in tree.findall(".//x:UnitTestResult", ns):
                  outcome = r.get("outcome") or "Unknown"
                  if outcome == "Passed":
                      passed += 1
                  elif outcome == "Failed":
                      failed += 1

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"passed_count={passed}\n")
              f.write(f"failed_count={failed}\n")
          PY

      - name: Upload TRX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-integration-trx
          path: integration-results/
          retention-days: 14

  # -------------------------------------------------------------------------
  # coverage-observation: Tier 3 — measure coverage across unit + integration.
  # OBSERVATION ONLY. NEVER a gate, NEVER fails the build on a coverage threshold.
  # Per ADR-038 + spec FR-A04 MUST NOT (binding for ≥6 months).
  #
  # SHARDED (2026-10-13). One `dotnet test --collect` over the whole solution ran
  # past its 30-minute cap every night (cancelled at 27+ min in the test step), so
  # the coverage number was never produced. The Sprk.Bff.Api.Tests suite is now split
  # into the same 4 namespace shards as flake-hunt-run / ci-tier2-advisory.yml, and the
  # other test projects of Spaarke.sln run in a fifth shard. `coverage-observation`
  # merges every shard's Cobertura files (per source line, a line is covered when ANY
  # shard hit it) and reports the single number it always reported.
  # -------------------------------------------------------------------------
  coverage-shard:
    name: Coverage shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Measured 2026-10-13 (run 38432551839): 4.5-20.4 min per shard (api-seam is the
    # slowest). Cap = ~2x the slowest shard.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [api-office, api-insights-integration, api-seam, rest, other-projects]
        include:
          - shard: api-office
            filter: 'FullyQualifiedName~Sprk.Bff.Api.Tests.Api.Office.'
          - shard: api-insights-integration
            filter: 'FullyQualifiedName~Sprk.Bff.Api.Tests.Api.Insights.|FullyQualifiedName~Sprk.Bff.Api.Tests.Integration.'
          - shard: api-seam
            filter: '(FullyQualifiedName~Sprk.Bff.Api.Tests.Api.|FullyQualifiedName~Sprk.Bff.Api.Tests.Seam.)&FullyQualifiedName!~Sprk.Bff.Api.Tests.Api.Office.&FullyQualifiedName!~Sprk.Bff.Api.Tests.Api.Insights.&FullyQualifiedName!~Sprk.Bff.Api.Tests.Integration.'
          - shard: rest
            filter: 'FullyQualifiedName!~Sprk.Bff.Api.Tests.Api.&FullyQualifiedName!~Sprk.Bff.Api.Tests.Seam.&FullyQualifiedName!~Sprk.Bff.Api.Tests.Integration.'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true  # smudge tests/fixtures/compose-corpus/*.docx — real bytes, not LFS pointers

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore + build
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Run tests with coverage
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_FILTER: ${{ matrix.filter }}
        run: |
          set -uo pipefail
          # coverage observation NEVER blocks even on test failures
          mkdir -p coverage-results
          if [ "$SHARD" = "other-projects" ]; then
            # Every test project of Spaarke.sln that lives under tests\ except the big
            # one (which the four shards above cover), so a new project added there is
            # picked up without editing this workflow. NOT covered: a test project outside
            # tests\ (today src/server/services/Sprk.Provisioning.ControlPlane.Tests);
            # widen the grep below if its coverage should be counted.
            grep -oE 'tests\\[^"]+\.csproj' Spaarke.sln | tr '\\' '/' | grep -v '/Sprk\.Bff\.Api\.Tests/' > test-projects.txt
            cat test-projects.txt
            while IFS= read -r proj; do
              dotnet test "$proj" \
                -c Release --no-build \
                --collect:"XPlat Code Coverage" \
                --settings config/coverlet.runsettings \
                --results-directory coverage-results/ \
                || echo "Tests had failures in $proj (coverage observation continues)"
            done < test-projects.txt
          else
            dotnet test tests/unit/Sprk.Bff.Api.Tests/ \
              -c Release --no-build \
              --filter "$SHARD_FILTER" \
              --collect:"XPlat Code Coverage" \
              --settings config/coverlet.runsettings \
              --results-directory coverage-results/ \
              || echo "Tests had failures (coverage observation continues)"
          fi
          # A shard that produced no coverage file at all is a broken measurement.
          if ! find coverage-results -name 'coverage.cobertura.xml' | grep -q .; then
            echo "::error::Shard ${SHARD} produced no coverage.cobertura.xml (host crash or filter matched nothing)"
            exit 1
          fi

      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-shard-${{ matrix.shard }}
          path: coverage-results/
          retention-days: 14

  coverage-observation:
    name: Coverage observation (Tier 3, never a gate)
    needs: coverage-shard
    # Aggregate whatever shards finished; a missing shard is reported as incomplete.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coverage_pct: ${{ steps.measure.outputs.coverage_pct }}
      shards_found: ${{ steps.measure.outputs.shards_found }}
    steps:
      - name: Download shard coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-coverage-shard-*
          merge-multiple: true  # per-run GUID directories never collide
          path: coverage-results

      - name: Aggregate coverage
        id: measure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage-results
          # Merge all Cobertura files by source line: a line counts as covered when any
          # shard / test project hit it, and each line is counted once.
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import os
          from pathlib import Path

          best = {}  # (file, line) -> max hits
          files = 0
          for cob in Path("coverage-results").rglob("coverage.cobertura.xml"):
              try:
                  tree = ET.parse(cob)
              except ET.ParseError:
                  continue
              files += 1
              for cls in tree.getroot().iter("class"):
                  fname = cls.get("filename") or ""
                  for ln in cls.iter("line"):
                      key = (fname, ln.get("number"))
                      hits = int(ln.get("hits") or 0)
                      if hits > best.get(key, -1):
                          best[key] = hits

          total_lines = len(best)
          covered_lines = sum(1 for h in best.values() if h > 0)
          if files == 0:
              # No shard artifact at all is a broken measurement, not 0.0% coverage.
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("coverage_pct=?\n")
                  f.write("shards_found=0\n")
              print("::error::No coverage.cobertura.xml found in any shard artifact")
              raise SystemExit(1)
          if total_lines == 0:
              pct = "0.0"
          else:
              pct = f"{(covered_lines / total_lines) * 100:.1f}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"coverage_pct={pct}\n")
              f.write(f"shards_found={files}\n")
          print(f"Aggregated coverage: {pct}% from {files} cobertura file(s) (observation only, no gate)")
          PY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage
          path: coverage-results/
          retention-days: 30

  # -------------------------------------------------------------------------
  # trivy-fs: Tier 3 — full filesystem vulnerability scan.
  # Complements the lighter PR-level vuln-scan job above.
  # -------------------------------------------------------------------------
  trivy-fs:
    name: Trivy filesystem scan (Tier 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      high_or_critical_count: ${{ steps.parse.outputs.high_or_critical_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        # Pinned to a tag that EXISTS. This previously read `@0.28.0`, which is not a
        # tag in aquasecurity/trivy-action — the release is `v0.28.0`, with the `v`.
        # GitHub reports the miss as "Unable to resolve action ... unable to find version",
        # so the step never ran and the nightly job was red every night.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs.json'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'  # NEVER fail the job — we report counts, not gate
        env:
          TRIVY_DISABLE_VEX_NOTICE: true

      - name: Parse counts
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f trivy-fs.json ]; then
            echo "::warning::trivy-fs.json missing"
            echo "high_or_critical_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sum all HIGH + CRITICAL findings across all results
          count=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' trivy-fs.json 2>/dev/null || echo 0)
          echo "high_or_critical_count=$count" >> "$GITHUB_OUTPUT"
          echo "Trivy HIGH/CRITICAL findings: $count"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-trivy-fs
          path: trivy-fs.json
          retention-days: 14

  # -------------------------------------------------------------------------
  # dep-audit: Tier 3 — full transitive dependency audit.
  # Broader than the PR-level vuln-scan (which is HIGH/CRITICAL only on key pkgs);
  # this counts all severities across all package.json roots.
  # -------------------------------------------------------------------------
  dep-audit:
    name: Dependency audit (Tier 3, full transitive)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      vuln_count: ${{ steps.audit.outputs.vuln_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: dotnet transitive vuln scan
        id: dotnet
        shell: bash
        run: |
          set +e
          dotnet restore > /dev/null
          out=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$out" > dotnet-audit.txt
          # Count any non-empty severity line (Low/Moderate/High/Critical)
          count=$(echo "$out" | grep -cE '>(Low|Moderate|High|Critical)<|\b(Low|Moderate|High|Critical)\b' || true)
          echo "dotnet_count=$count" >> "$GITHUB_OUTPUT"

      - name: npm audit (all package.json roots)
        id: npm
        shell: bash
        run: |
          set +e
          total=0
          # Find every package.json that has a lockfile (npm audit requires a lock)
          while IFS= read -r lock; do
            pkg_dir=$(dirname "$lock")
            # Skip node_modules
            case "$pkg_dir" in
              */node_modules/*) continue ;;
            esac
            (cd "$pkg_dir" && \
              json=$(npm audit --json 2>/dev/null || true) && \
              vulns=$(echo "$json" | jq -r '
                (.metadata.vulnerabilities.low // 0) +
                (.metadata.vulnerabilities.moderate // 0) +
                (.metadata.vulnerabilities.high // 0) +
                (.metadata.vulnerabilities.critical // 0)
              ' 2>/dev/null || echo 0) && \
              echo "$pkg_dir: $vulns" && \
              total=$((total + vulns)) && \
              echo "total=$total" > /tmp/npm-audit-total
            )
            # Re-read total (subshell side-effect workaround)
            if [ -f /tmp/npm-audit-total ]; then
              total=$(cat /tmp/npm-audit-total | sed 's/total=//')
            fi
          done < <(find . -name package-lock.json -not -path '*/node_modules/*' 2>/dev/null)
          echo "npm_count=$total" >> "$GITHUB_OUTPUT"

      - name: Aggregate
        id: audit
        shell: bash
        run: |
          dc=${{ steps.dotnet.outputs.dotnet_count }}
          nc=${{ steps.npm.outputs.npm_count }}
          total=$((dc + nc))
          echo "vuln_count=$total" >> "$GITHUB_OUTPUT"
          echo "dotnet vulnerabilities: $dc"
          echo "npm vulnerabilities: $nc"
          echo "Total: $total"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-dep-audit
          path: dotnet-audit.txt
          retention-days: 14

  # -----------------------------------------------------------------------
  # customer-provisioning-orchestration-r1 task 067 — Nightly Graph app-role
  # parity for UAMI SP ↔ GraphAppRoles.cs (the stamp set, task 261). T3 silent-fail-trap
  # safety net. Coord-PR spec: projects/customer-provisioning-orchestration-r1
  # /notes/graph-app-role-parity-coord-pr.md (detail) + notes/phase-h-ci-wiring-coord-pr.md §3 (umbrella).
  # -----------------------------------------------------------------------
  graph-app-role-parity:
    name: Graph App-Role Parity (UAMI SP vs GraphAppRoles.cs)
    runs-on: ubuntu-latest
    # Advisory during rollout window (per r3 deferral doc — do NOT flip
    # blocking until zero-findings baseline holds ≥ 7 nightly runs). The advisory
    # behaviour is `continue-on-error` on the STEPS below, not on this job: a job-level
    # continue-on-error makes `needs.<job>.result` report `success` even when the job
    # failed, so the alerts leg could never see the failure. The `verdict` step turns
    # the step outcomes into the explicit job output `failed`, which the alerts leg reads.
    outputs:
      failed: ${{ steps.verdict.outputs.failed }}
    permissions:
      id-token: write         # OIDC federated credential for Azure login
      contents: read
    env:
      # UAMI_SP_OBJECT_ID: SERVICE PRINCIPAL OBJECT ID (not appId) of the
      # target customer's UAMI. Stored per-environment in GH Actions secrets.
      UAMI_SP_OBJECT_ID: ${{ secrets.NIGHTLY_UAMI_SP_OBJECT_ID }}
      # AZURE_TENANT_ID: the Entra tenant hosting the UAMI (§4D I5 —
      # explicit tenantId; no ambient default).
      AZURE_TENANT_ID: ${{ secrets.NIGHTLY_AZURE_TENANT_ID }}
    steps:
      # This job was wired ahead of the environment it watches. None of the four
      # NIGHTLY_* secrets it needs have ever existed in this repo, so `azure/login`
      # failed every night with "Not all values are present" and the nightly report
      # carried a permanent red that had nothing to do with code health.
      #
      # Skipping instead of deleting: the parity check guards a real T3 silent-fail
      # trap (a customer UAMI whose Graph app-roles have drifted from
      # GraphAppRoles.cs grants nothing and reports nothing), and the provisioning
      # pipeline it covers has not been stood up yet. Deleting would mean
      # re-authoring it later; this way it arms itself the moment the secrets exist.
      #
      # To enable: create NIGHTLY_GRAPH_READER_CLIENT_ID, NIGHTLY_AZURE_TENANT_ID,
      # NIGHTLY_SUBSCRIPTION_ID and NIGHTLY_UAMI_SP_OBJECT_ID as repository secrets.
      # No workflow change is needed — the guard below flips on its own.
      - name: Check whether this job is configured
        id: guard
        run: |
          missing=""
          [ -n "${{ secrets.NIGHTLY_GRAPH_READER_CLIENT_ID }}" ] || missing="$missing NIGHTLY_GRAPH_READER_CLIENT_ID"
          [ -n "${{ secrets.NIGHTLY_AZURE_TENANT_ID }}" ]        || missing="$missing NIGHTLY_AZURE_TENANT_ID"
          [ -n "${{ secrets.NIGHTLY_SUBSCRIPTION_ID }}" ]        || missing="$missing NIGHTLY_SUBSCRIPTION_ID"
          [ -n "${{ secrets.NIGHTLY_UAMI_SP_OBJECT_ID }}" ]      || missing="$missing NIGHTLY_UAMI_SP_OBJECT_ID"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Graph app-role parity SKIPPED — not configured. Missing secret(s):$missing"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.guard.outputs.configured == 'true'

      - name: Setup .NET SDK (pin to global.json)
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Azure login (OIDC federated MI)
        id: login
        if: steps.guard.outputs.configured == 'true'
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NIGHTLY_GRAPH_READER_CLIENT_ID }}
          tenant-id: ${{ secrets.NIGHTLY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NIGHTLY_SUBSCRIPTION_ID }}

      - name: Restore + build nightly test project
        id: build
        if: steps.guard.outputs.configured == 'true' && steps.login.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet restore tests/integration/Sprk.Provisioning.ControlPlane.NightlyTests/
          dotnet build tests/integration/Sprk.Provisioning.ControlPlane.NightlyTests/ \
            -c Release --no-restore

      - name: Run Graph app-role parity test
        id: parity
        if: steps.guard.outputs.configured == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        # xunit forwards the diff-formatted Assert.Fail message into the
        # workflow log — no --logger-html needed for triage.
        run: |
          dotnet test tests/integration/Sprk.Provisioning.ControlPlane.NightlyTests/ \
            -c Release --no-build --logger "console;verbosity=normal"

      # Explicit verdict for the alerts leg (see the job comment above). Not configured
      # (secrets absent) is a skip, not a failure; any configured step that did not
      # succeed (login, build, or the parity test itself) is a failure.
      - name: Record verdict
        id: verdict
        if: always()
        shell: bash
        env:
          CONFIGURED: ${{ steps.guard.outputs.configured }}
          LOGIN: ${{ steps.login.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PARITY: ${{ steps.parity.outcome }}
        run: |
          failed=0
          if [ "$CONFIGURED" = "true" ]; then
            if [ "$LOGIN" != "success" ] || [ "$BUILD" != "success" ] || [ "$PARITY" != "success" ]; then failed=1; fi
          fi
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # report: create/update single tracking issue
  # -------------------------------------------------------------------------
  report:
    name: Update tracking issue
    needs: [flake-hunt, bundle-size, vuln-scan, full-integration, coverage-observation, trivy-fs, dep-audit, graph-app-role-parity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Off by default since the quality alerts + the Issues & Quality dashboard replaced
      # this log (the rolling issue had collected ~100 unread comments). The code is kept
      # so the log can be restored: dispatch with post_tracking_comment=true.
      - name: Compose + post report
        if: ${{ inputs.post_tracking_comment == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLAKE_SUMMARY: ${{ needs.flake-hunt.outputs.flake_summary }}
          FLAKES_FOUND: ${{ needs.flake-hunt.outputs.flakes_found }}
          DRIFT_SUMMARY: ${{ needs.bundle-size.outputs.drift_summary }}
          REGRESSIONS_FOUND: ${{ needs.bundle-size.outputs.regressions_found }}
          VULN_SUMMARY: ${{ needs.vuln-scan.outputs.vuln_summary }}
          HIGH_OR_CRITICAL: ${{ needs.vuln-scan.outputs.high_or_critical }}
          INTEGRATION_PASSED: ${{ needs.full-integration.outputs.passed_count }}
          INTEGRATION_FAILED: ${{ needs.full-integration.outputs.failed_count }}
          COVERAGE_PCT: ${{ needs.coverage-observation.outputs.coverage_pct }}
          TRIVY_HIGH_OR_CRITICAL: ${{ needs.trivy-fs.outputs.high_or_critical_count }}
          DEP_VULN_COUNT: ${{ needs.dep-audit.outputs.vuln_count }}
          GRAPH_PARITY_RESULT: ${{ needs.graph-app-role-parity.result }}
        shell: bash
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          title="Nightly Health — $today"

          # Status emoji. NOTE: coverage_pct is OBSERVATION-ONLY per ADR-038 + spec FR-A04
          # MUST NOT — it is NEVER a gate and does not influence the status emoji.
          status="✅"
          if [ "${FLAKES_FOUND:-0}" -gt 0 ] \
             || [ "${REGRESSIONS_FOUND:-0}" -gt 0 ] \
             || [ "${HIGH_OR_CRITICAL:-0}" -gt 0 ] \
             || [ "${INTEGRATION_FAILED:-0}" -gt 0 ] \
             || [ "${TRIVY_HIGH_OR_CRITICAL:-0}" -gt 0 ] \
             || [ "${DEP_VULN_COUNT:-0}" -gt 0 ]; then
            status="⚠️"
          fi

          body=$(cat <<EOF
          # ${status} Nightly Health Report — ${today}

          Workflow run: [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ## Flake hunt (unit tests 3x)
          - Flakes found: **${FLAKES_FOUND:-?}**

          ${FLAKE_SUMMARY:-(no summary)}

          ## Bundle size drift
          - Regressions: **${REGRESSIONS_FOUND:-?}** (threshold: ±10% vs baseline)

          ${DRIFT_SUMMARY:-(no summary)}

          ## Vulnerability scan (PR-level)
          - HIGH/CRITICAL: **${HIGH_OR_CRITICAL:-?}**

          ${VULN_SUMMARY:-(no summary)}

          ## Full integration tests (Tier 3)
          - Passed: **${INTEGRATION_PASSED:-?}**
          - Failed: **${INTEGRATION_FAILED:-?}**

          Suite: \`tests/integration/Spe.Integration.Tests/\` (full run, no filters).

          ## Coverage observation (Tier 3 — OBSERVATION ONLY, never a gate)
          - Coverage: **${COVERAGE_PCT:-?}%**

          Per ADR-038 + spec FR-A04 MUST NOT: this number is tracked over time, never gated.
          Artifact published as \`nightly-coverage\` in the workflow run.

          ## Trivy filesystem scan (Tier 3)
          - HIGH/CRITICAL findings: **${TRIVY_HIGH_OR_CRITICAL:-?}**

          See workflow run for the full Trivy report.

          ## Dependency audit (Tier 3 — full transitive)
          - Vulnerabilities: **${DEP_VULN_COUNT:-?}**

          Combined: \`dotnet list package --vulnerable --include-transitive\` + \`npm audit\`
          across key client packages.

          ## Graph app-role parity (UAMI SP vs GraphAppRoles.cs — advisory)
          - Result: **${GRAPH_PARITY_RESULT:-?}**

          Job steps carry \`continue-on-error: true\` during rollout (per
          customer-provisioning-orchestration-r1 task 067/088 coord-notes) —
          SKIPPED is expected until \`NIGHTLY_UAMI_SP_OBJECT_ID\` /
          \`NIGHTLY_AZURE_TENANT_ID\` / \`NIGHTLY_GRAPH_READER_CLIENT_ID\` /
          \`NIGHTLY_SUBSCRIPTION_ID\` secrets are populated. Flip to blocking
          after ≥7 consecutive GREEN/SKIPPED nightly runs.

          ---
          _Generated by \`.github/workflows/nightly-health.yml\`. Each night a new comment is appended; the issue stays open until a clean night._
          EOF
          )

          # Find or create the tracking issue for today
          existing=$(gh issue list --search "$title in:title" --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1 || echo "")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Appended to issue #$existing"
          else
            # Look for any open Nightly Health issue (last few days) to consolidate
            old=$(gh issue list --search "Nightly Health in:title" --state open --json number,title --jq '.[0].number' || echo "")
            if [ -n "$old" ] && [ "$old" != "null" ]; then
              gh issue edit "$old" --title "$title"
              gh issue comment "$old" --body "$body"
              echo "Updated rolling issue #$old"
            else
              # Ensure label exists (idempotent — succeeds whether it exists or not).
              gh label create "nightly-health" --color "fbca04" --description "Auto-generated by nightly-health.yml" 2>/dev/null || true
              gh issue create --title "$title" --body "$body" --label "nightly-health"
              echo "Created new tracking issue"
            fi
          fi

          # Close the issue automatically if everything was clean
          if [ "$status" = "✅" ]; then
            issue=$(gh issue list --search "Nightly Health in:title" --state open --json number --jq '.[0].number' || echo "")
            if [ -n "$issue" ] && [ "$issue" != "null" ]; then
              gh issue close "$issue" --comment "All checks clean ✅ — closing."
            fi
          fi

  # -------------------------------------------------------------------------
  # alerts: one quality alert per check (see .github/actions/quality-alert).
  #
  # What this adds to the `report` job above (which is kept as the nightly log): the
  # report appends a comment per night to one rolling issue, and that issue has
  # collected ~100 comments nobody reads. An alert is ONE issue per check, assigned
  # to the owner (so GitHub emails them), edited in place while the check keeps
  # failing and closed by the first green night. `label:quality-alert is:open` is the
  # dashboard.
  #
  # A job that is not `success` is a failing check, whatever the reason: failure,
  # CANCELLED or timed out (a job that hits its timeout-minutes reports `cancelled`)
  # or skipped. On top of that two checks can fail while their job succeeds, because
  # their test commands run under `set +e` to keep the report rendering:
  #   - flake-hunt: any flake found, or any run/shard result missing;
  #   - full-integration: any failed test.
  # Vulnerability and Trivy counts are NOT alerted here: they are a standing backlog
  # (non-zero every night), not a regression, and an alert that can never close teaches
  # the owner to ignore the label.
  # -------------------------------------------------------------------------
  alerts:
    name: Alert ${{ matrix.check }}
    needs: [flake-hunt-run, flake-hunt, bundle-size, vuln-scan, full-integration, coverage-shard, coverage-observation, trivy-fs, dep-audit, graph-app-role-parity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: nightly-health/flake-hunt
            jobs: flake-hunt-run flake-hunt
          - check: nightly-health/bundle-size
            jobs: bundle-size
          - check: nightly-health/vuln-scan
            jobs: vuln-scan
          - check: nightly-health/full-integration
            jobs: full-integration
          - check: nightly-health/coverage-observation
            jobs: coverage-shard coverage-observation
          - check: nightly-health/trivy-fs
            jobs: trivy-fs
          - check: nightly-health/dep-audit
            jobs: dep-audit
          - check: nightly-health/graph-app-role-parity
            jobs: graph-app-role-parity
    steps:
      - name: Checkout (local action only)
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - name: Decide status
        id: decide
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CHECK: ${{ matrix.check }}
          CHECK_JOBS: ${{ matrix.jobs }}
        run: |
          set -euo pipefail
          status=ok
          summary=""

          for j in $CHECK_JOBS; do
            result="$(jq -r --arg j "$j" '.[$j].result' <<<"$NEEDS_JSON")"
            if [ "$result" != "success" ]; then
              status=failing
              case "$result" in
                cancelled) why="was **cancelled**, which is what a job that hits its \`timeout-minutes\` reports" ;;
                *)         why="finished **${result}**" ;;
              esac
              summary+="- Job \`${j}\` ${why}. A check that did not complete is a failing check, not a pass."$'\n'
            fi
          done

          if [ "$CHECK" = "nightly-health/flake-hunt" ]; then
            flakes="$(jq -r '.["flake-hunt"].outputs.flakes_found // "0"' <<<"$NEEDS_JSON")"
            incomplete="$(jq -r '.["flake-hunt"].outputs.incomplete // "0"' <<<"$NEEDS_JSON")"
            if [ -z "$flakes" ]; then
              status=failing
              summary+="- The flake analysis produced no result (the flake-hunt job did not reach its analysis step)."$'\n'
            elif [ "$flakes" != "0" ] || [ "$incomplete" = "1" ]; then
              status=failing
              body="$(jq -r '.["flake-hunt"].outputs.flake_summary // ""' <<<"$NEEDS_JSON")"
              summary+=$'\n'"${body}"$'\n'
            fi
          fi

          if [ "$CHECK" = "nightly-health/full-integration" ]; then
            failed="$(jq -r '.["full-integration"].outputs.failed_count // "0"' <<<"$NEEDS_JSON")"
            passed="$(jq -r '.["full-integration"].outputs.passed_count // "0"' <<<"$NEEDS_JSON")"
            if [ "$failed" != "0" ]; then
              status=failing
              summary+="- ${failed} integration test(s) failed (${passed} passed). The job itself stays green by design (\`set +e\`), so this is the only place the failure surfaces."$'\n'
            elif [ "$passed" = "0" ]; then
              status=failing
              summary+="- The integration suite reported 0 passed and 0 failed tests: it did not run (no project found, a build break or a host crash before any result). That is a failing check, not a pass."$'\n'
            fi
          fi

          if [ "$CHECK" = "nightly-health/graph-app-role-parity" ]; then
            pfailed="$(jq -r '.["graph-app-role-parity"].outputs.failed // "0"' <<<"$NEEDS_JSON")"
            if [ "$pfailed" != "0" ]; then
              status=failing
              summary+="- The Graph app-role parity test (or its Azure login / build) failed. The job's steps are \`continue-on-error\` during the rollout window, so this output is the only place the failure surfaces."$'\n'
            fi
          fi

          if [ "$status" = "failing" ]; then
            summary+=$'\n'"Re-run the failing job from the workflow run linked above; artifacts (TRX, coverage) are attached to it."$'\n'
          else
            summary="All jobs for this check succeeded."
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          delimiter="ALERT_SUMMARY_EOF_$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "summary<<${delimiter}"
            printf '%s\n' "$summary"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Raise or clear the alert
        uses: ./.github/actions/quality-alert
        with:
          check: ${{ matrix.check }}
          status: ${{ steps.decide.outputs.status }}
          summary: ${{ steps.decide.outputs.summary }}
          dry-run: ${{ inputs.dry_run_alerts == true || github.ref_name != github.event.repository.default_branch }}
