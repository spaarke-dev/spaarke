# ============================================================================
# publish-dataverse-solutions-manifest.yml — pack SpaarkeMaster from git and publish it to provisioning-artifacts
# ============================================================================
#
# customer-provisioning-orchestration-r1 T218d (ADR-027 §3-§4 amended 2026-10-07). H6 imports ONE package,
# SpaarkeMaster, managed by default and unmanaged on explicit instruction, from the provisioning-artifacts store. It
# reads `dataverse-solutions-latest.json` (SolutionImportOptions.SolutionArtifactManifestBlobName) in the shape
#   {"solutions":{"SpaarkeMaster":{"version","managedBlobName","unmanagedBlobName"}}}
# (DataverseWebApiSolutionImporter.ParsePackageEntry). This workflow is that artifact's ONLY producer: it packs the
# committed source `src/dataverse/solutions/SpaarkeMaster` (written by scripts/solution-authoring/
# Export-SpaarkeMasterSource.ps1) — never a zip from a laptop.
#
# Steps: pack managed + unmanaged with the pac CLI → check both zips (name, version = Other/Solution.xml, managed
# flag, no environment-variable values) and the source (no missing dependency on solution="Active" — F12) → write
# the manifest with New-SpaarkeMasterManifest (the one producer of its shape; the C# parser and Pester tests share
# Fixtures/spaarkemaster-manifest.sample.json) → keep everything as a run artifact.
# Only a manual run on master with `publish: true` then uploads: both zips under versioned names, a versioned
# manifest, a copy of the current latest manifest as `dataverse-solutions-latest.previous.json` (the rollback
# pointer), then the new `dataverse-solutions-latest.json`, read back. A version publishes ONCE: a zip of that version
# from a DIFFERENT commit refuses the run (bump with Assemble-SpaarkeMasterSolution.ps1 -Version and re-export); a zip
# from the SAME commit (blob metadata `sourcesha`) is a re-run after a partial failure and is replaced. Nothing is
# ever deleted.
#
# Runbook: docs/procedures/SPAARKE-SOLUTION-RELEASE-PROCESS.md. Storage access: the existing OIDC identity
# (azure/login, no key or SAS) — the same one publish-provisioning-arm-artifacts.yml uses on the same container.
# ============================================================================

name: Publish Dataverse Solutions Manifest

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to provisioning-artifacts and move dataverse-solutions-latest.json. false = dry run (pack + checks + manifest as a run artifact; nothing uploaded).'
        required: false
        type: boolean
        default: false
  # Dry run only: proves every change to the committed package source still packs and passes the checks.
  pull_request:
    paths:
      - 'src/dataverse/solutions/SpaarkeMaster/**'
      - 'scripts/solution-authoring/SpaarkePackageScope.psm1'
      - '.github/workflows/publish-dataverse-solutions-manifest.yml'

permissions:
  contents: read
  id-token: write  # OIDC login for the publish steps (no stored storage key)

concurrency:
  group: publish-dataverse-solutions-manifest-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight publish

env:
  SOURCE_FOLDER: src/dataverse/solutions/SpaarkeMaster
  # Same pac version that unpacked the committed source (Export-SpaarkeMasterSource.ps1, 2026-10-08). Bump both together.
  PAC_VERSION: '1.46.1'
  CONTAINER: provisioning-artifacts

jobs:
  pack-and-publish:
    name: Pack SpaarkeMaster, check, (publish)
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
      # The OIDC subject trusts refs/heads/master only; a publish from another branch is refused up front.
      ON_MASTER: ${{ github.ref == 'refs/heads/master' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Refuse a publish from a branch other than master
        if: env.PUBLISH == 'true' && env.ON_MASTER != 'true'
        shell: bash
        run: |
          echo "::error::publish=true runs from master only (the OIDC federated subject trusts refs/heads/master). Merge first, or run with publish=false for a dry run."
          exit 1

      - name: Install pac CLI ${{ env.PAC_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version "${PAC_VERSION}"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Pack managed + unmanaged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          pac solution pack --zipfile out/SpaarkeMaster_managed.zip --folder "${SOURCE_FOLDER}" --packagetype Managed
          pac solution pack --zipfile out/SpaarkeMaster.zip --folder "${SOURCE_FOLDER}" --packagetype Unmanaged
          ls -l out
          test -s out/SpaarkeMaster_managed.zip
          test -s out/SpaarkeMaster.zip

      - name: Check the packages and write the manifest
        id: check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/solution-authoring/SpaarkePackageScope.psm1 -Force
          $sourceXml = Join-Path $env:SOURCE_FOLDER 'Other/Solution.xml'
          $version = ([xml](Get-Content $sourceXml -Raw)).ImportExportXml.SolutionManifest.Version
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { throw "Unreadable version '$version' in $sourceXml." }

          $leaks = @(Find-LeakyDependencies -SolutionXmlPath $sourceXml)
          if ($leaks.Count -gt 0) { $leaks | ForEach-Object { Write-Host "LEAK: $_" }; throw "$($leaks.Count) missing dependency(ies) on solution=Active (F12) — re-export from dev after Assemble." }

          foreach ($p in @(@{ Zip = 'out/SpaarkeMaster_managed.zip'; Managed = $true }, @{ Zip = 'out/SpaarkeMaster.zip'; Managed = $false })) {
              $info = Get-PackedSolutionInfo -ZipPath $p.Zip
              if ($info.UniqueName -ne 'SpaarkeMaster') { throw "$($p.Zip) is '$($info.UniqueName)', not SpaarkeMaster." }
              if ($info.Version -ne $version) { throw "$($p.Zip) is version $($info.Version); the source says $version." }
              if ($info.Managed -ne $p.Managed) { throw "$($p.Zip) has managed=$($info.Managed); expected $($p.Managed)." }
              $values = @(Find-EnvironmentVariableValues -Path $p.Zip)
              if ($values.Count -gt 0) { throw "$($p.Zip) carries environment-variable values: $($values -join ', ')" }
          }

          $managedBlob = "dataverse-solution-SpaarkeMaster-$version-managed.zip"
          $unmanagedBlob = "dataverse-solution-SpaarkeMaster-$version-unmanaged.zip"
          $buildId = "$((Get-Date).ToUniversalTime().ToString('yyyy.MM.dd'))-${{ github.run_number }}"
          New-SpaarkeMasterManifest -Version $version -ManagedBlobName $managedBlob -UnmanagedBlobName $unmanagedBlob `
              -ManagedSha256 (Get-FileHash out/SpaarkeMaster_managed.zip -Algorithm SHA256).Hash.ToLowerInvariant() `
              -UnmanagedSha256 (Get-FileHash out/SpaarkeMaster.zip -Algorithm SHA256).Hash.ToLowerInvariant() `
              -BuildId $buildId -SourceSha '${{ github.sha }}' | Set-Content out/manifest.json -Encoding utf8NoBOM
          Get-Content out/manifest.json

          # Producer <-> parser contract: the same sample the C# ParsePackageEntry test reads.
          $made = Get-Content out/manifest.json -Raw | ConvertFrom-Json
          $sample = Get-Content src/server/services/Sprk.Provisioning.ControlPlane.Tests/Fixtures/spaarkemaster-manifest.sample.json -Raw | ConvertFrom-Json
          foreach ($pair in @(@($made, $sample), @($made.solutions.SpaarkeMaster, $sample.solutions.SpaarkeMaster))) {
              $a = @($pair[0].PSObject.Properties.Name) -join ','; $b = @($pair[1].PSObject.Properties.Name) -join ','
              if ($a -ne $b) { throw "Manifest keys '$a' differ from the parser sample's '$b' (Fixtures/spaarkemaster-manifest.sample.json)." }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "managed_blob=$managedBlob" >> $env:GITHUB_OUTPUT
          "unmanaged_blob=$unmanagedBlob" >> $env:GITHUB_OUTPUT
          "build_id=$buildId" >> $env:GITHUB_OUTPUT

      - name: Keep the packages and manifest as a run artifact
        uses: actions/upload-artifact@v6
        with:
          name: spaarkemaster-${{ steps.check.outputs.version }}-run${{ github.run_number }}
          path: out/
          retention-days: 14

      - name: Azure Login (OIDC)
        if: env.PUBLISH == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish (versioned zips, versioned manifest, previous pointer, latest)
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          ACCOUNT: ${{ vars.PROVISIONING_ARTIFACTS_STORAGE_ACCOUNT }}
          VERSION: ${{ steps.check.outputs.version }}
          MANAGED_BLOB: ${{ steps.check.outputs.managed_blob }}
          UNMANAGED_BLOB: ${{ steps.check.outputs.unmanaged_blob }}
          BUILD_ID: ${{ steps.check.outputs.build_id }}
        run: |
          set -euo pipefail
          if [ -z "${ACCOUNT}" ]; then echo "::error::Repo variable PROVISIONING_ARTIFACTS_STORAGE_ACCOUNT is not set."; exit 1; fi
          blob() { az storage blob "$@" --account-name "${ACCOUNT}" --container-name "${CONTAINER}" --auth-mode login; }

          # A version publishes once. A zip of this version from ANOTHER commit refuses the run; one from THIS commit
          # (metadata sourcesha) is a re-run after a partial failure and is replaced.
          upload_zip() {  # name file
            local exists src
            exists=$(blob exists --name "$1" --query exists -o tsv)
            if [ "${exists}" = "true" ]; then
              src=$(blob metadata show --name "$1" --query sourcesha -o tsv)
              if [ "${src}" != "${GITHUB_SHA}" ]; then
                echo "::error::$1 already exists from commit ${src:-unknown} — SpaarkeMaster ${VERSION} is published. Bump the version (Assemble-SpaarkeMasterSolution.ps1 -Version), re-export, and run again."
                exit 1
              fi
              echo "$1 exists from this commit (re-run) — replacing it."
            fi
            blob upload --name "$1" --file "$2" --overwrite true --metadata "sourcesha=${GITHUB_SHA}"
          }
          upload_zip "${MANAGED_BLOB}" out/SpaarkeMaster_managed.zip
          upload_zip "${UNMANAGED_BLOB}" out/SpaarkeMaster.zip
          blob upload --name "dataverse-solutions-${BUILD_ID}-${GITHUB_RUN_ATTEMPT}.json" --file out/manifest.json --overwrite false

          # Rollback pointer: keep the manifest being replaced (the first run keeps the hand-made pre-T218 one).
          latest_exists=$(blob exists --name dataverse-solutions-latest.json --query exists -o tsv)
          if [ "${latest_exists}" = "true" ]; then
            blob download --name dataverse-solutions-latest.json --file out/previous-latest.json --overwrite true
            blob upload --name dataverse-solutions-latest.previous.json --file out/previous-latest.json --overwrite true
          fi
          blob upload --name dataverse-solutions-latest.json --file out/manifest.json --overwrite true

          # Read back what H6 will read.
          blob download --name dataverse-solutions-latest.json --file out/readback.json --overwrite true
          python3 - <<'PY'
          import json, os
          m = json.load(open('out/readback.json'))['solutions']['SpaarkeMaster']
          assert m['version'] == os.environ['VERSION'], m
          assert m['managedBlobName'] == os.environ['MANAGED_BLOB'] and m['unmanagedBlobName'] == os.environ['UNMANAGED_BLOB'], m
          print('latest manifest read back:', m)
          PY

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### SpaarkeMaster package"
            echo "- Version: \`${{ steps.check.outputs.version }}\` — mode: $([ "${PUBLISH}" = "true" ] && echo '**published**' || echo 'dry run (nothing uploaded)')"
            echo "- Blobs: \`${{ steps.check.outputs.managed_blob }}\`, \`${{ steps.check.outputs.unmanaged_blob }}\`"
            echo "- Manifest: \`dataverse-solutions-${{ steps.check.outputs.build_id }}-${GITHUB_RUN_ATTEMPT}.json\` → \`dataverse-solutions-latest.json\` (container \`${CONTAINER}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
