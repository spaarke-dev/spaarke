# ============================================================================
# deploy-bff-api.yml — Build, Test & Deploy BFF API via Staging Slot Swap
# ============================================================================
#
# Triggers on push to master when API code changes (FR-09).
# Also supports manual dispatch for on-demand deployments.
#
# Pipeline: build → test → deploy staging → verify staging → swap →
#           verify production → (rollback on failure)
#
# Zero-downtime: Uses staging slot + swap pattern (NFR-02).
# Rollback:      Auto swap-back if production health check fails (NFR-06).
# Health check:  /healthz endpoint (ADR-001).
#
# Audit trail: All runs logged in GitHub Actions history (NFR-05).
#
# H9 artifact-based re-scope (customer-provisioning-orchestration-r1 task 116,
# Phase C'' Wave G-1, design.md DS-4 §5): the "Build API" job below also pushes
# bff-api-{buildId}.zip + a latest.json manifest to a `provisioning-artifacts`
# blob container on the platform storage account. This is H9's (task 132,
# Wave G-3) future artifact source -- H9 resolves a build, verifies the r3-gate
# + size metadata carried in the manifest as a pure-C# check (no re-run at
# provision time), downloads the blob (Azure.Storage.Blobs, UAMI RBAC), and
# deploys to the customer's own BFF staging slot. See
# projects/customer-provisioning-orchestration-r1/notes/
# h9-artifact-publish-ci-coord-pr.md for the full design rationale + the
# open live-ceremony items (platform storage account does not exist yet).
#
# Governance: r1 holds DIRECT-COMMIT ownership of .github/workflows/** for
# Phase C'' scope as of commit 8281045052 (see projects/customer-provisioning-
# orchestration-r1/CLAUDE.md "Coordination with other worktrees" section) --
# this extension is a direct commit, not a further coord-note.
# ============================================================================

name: Deploy BFF API

on:
  # NOTE (dotnet-10-upgrade-r1, 2026-08-11): the `push: master` auto-deploy trigger
  # was REMOVED. BFF deploys are operator-driven from the worktree (/bff-deploy + az);
  # CI must never auto-deploy on merge. Deploy on demand via workflow_dispatch only.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - production
        default: 'production'

permissions:
  contents: read
  id-token: write  # Required for OIDC-based Azure login

concurrency:
  group: deploy-bff-api-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false  # Never cancel in-progress deployments

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: '10.x'
  API_PROJECT: src/server/api/Sprk.Bff.Api/Sprk.Bff.Api.csproj

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Build & Publish
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} -c Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o ./publish --no-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: bff-api-build
          path: ./publish
          retention-days: 7

      # ------------------------------------------------------------------------
      # H9 artifact-based re-scope (task 116, DS-4 §5) starts here.
      #
      # Gate naming matches Sprk.Provisioning.ControlPlane.Handlers.BffDeploy.
      # R3GateKind + R3GateStatus EXACTLY (Analyzers/GodClassRatchet/ArchTests/
      # NamingConformance/GraphAppRoleParity; Passed/Skipped/Failed) so task
      # 132's H9 handler can deserialize latest.json straight into the existing
      # enums -- no new vocabulary, no re-run of DotnetR3GateVerifier's shell-
      # outs at provision time.
      #
      # r3AnalyzersAsErrors is NOT re-run as a separate step: the "Build" step
      # above already runs with Directory.Build.props' TreatWarningsAsErrors=
      # true, and GitHub Actions stops the job on a failed step (no continue-
      # on-error there) -- reaching this point already proves that gate passed.
      #
      # graphAppRoleParity is a DEPLOYMENT-TARGET property (a specific
      # customer's UAMI service principal vs GraphAppRoles.cs), not a property
      # of this platform-BFF build artifact, so it cannot be computed here. It
      # is always recorded "Skipped" with a diagnostic pointing at the
      # nightly-health.yml graph-app-role-parity job (the platform-baseline
      # signal); H9/task 132 must do its own live per-environment check rather
      # than trust this manifest key as a real per-deploy signal. Documented
      # as a deliberate design decision in notes/h9-artifact-publish-ci-coord-
      # pr.md -- not a silent gap.
      # ------------------------------------------------------------------------

      - name: Compute build identifiers (buildId + sha)
        id: build-id
        shell: bash
        run: |
          set -euo pipefail
          # buildId: date + monotonic run-number (matches build-provisioning-
          # sidecar.yml's semver_tag convention) -- deterministic + stable +
          # human-sortable. NOT a raw timestamp: the run-number is monotonic
          # per-workflow, so buildId collisions are impossible even for two
          # dispatches on the same UTC day. sha is carried separately for the
          # git-anchored identity H9 (task 132) resolves against.
          build_id="$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: 'Gate: god-class ratchet (tests/Spaarke.ArchTests/GodClassGuardTests.cs)'
        id: gate-godclass
        continue-on-error: true # capture red without aborting the job -- the final "Fail job if any r3 gate is red" step below enforces the operator-visible signal AFTER the manifest is published.
        shell: bash
        run: |
          dotnet test tests/Spaarke.ArchTests/Spaarke.ArchTests.csproj \
            -c Release \
            --filter "FullyQualifiedName~GodClassGuardTests" \
            --logger "trx;LogFileName=godclass.trx" \
            --results-directory ./gate-results

      - name: 'Gate: tenant-isolation ArchTests I1-I5 (FR-28..FR-32)'
        id: gate-archtests
        continue-on-error: true
        shell: bash
        run: |
          dotnet test tests/Spaarke.ArchTests/Spaarke.ArchTests.csproj \
            -c Release \
            --filter "FullyQualifiedName~TenantIsolation" \
            --logger "trx;LogFileName=tenantisolation.trx" \
            --results-directory ./gate-results

      - name: 'Gate: naming-conformance (FR-35 / NFR-08)'
        id: gate-naming
        continue-on-error: true
        shell: pwsh
        run: ./scripts/naming-conformance-check.ps1

      - name: Translate gate outcomes to R3GateStatus values
        id: gate-status
        shell: bash
        run: |
          set -euo pipefail
          to_status () { [ "$1" = "success" ] && echo "Passed" || echo "Failed"; }
          echo "analyzers=Passed" >> "$GITHUB_OUTPUT"
          echo "godclass=$(to_status '${{ steps.gate-godclass.outcome }}')" >> "$GITHUB_OUTPUT"
          echo "archtests=$(to_status '${{ steps.gate-archtests.outcome }}')" >> "$GITHUB_OUTPUT"
          echo "naming=$(to_status '${{ steps.gate-naming.outcome }}')" >> "$GITHUB_OUTPUT"

      - name: Create artifact zip (bff-api-{buildId}.zip)
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          zip_name="bff-api-${{ steps.build-id.outputs.build_id }}.zip"
          (cd ./publish && zip -r "../${zip_name}" . -x '*.pdb')
          size_bytes=$(stat -c%s "./${zip_name}")
          echo "zip_name=${zip_name}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${size_bytes}" >> "$GITHUB_OUTPUT"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push artifact zip to provisioning-artifacts blob (OIDC, no stored key)
        # PROVISIONING_ARTIFACTS_STORAGE_ACCOUNT: NOT YET PROVISIONED as of this
        # workflow's authoring (2026-08-19) -- no platform storage account
        # exists in infrastructure/bicep/platform-controlplane.bicep. This is a
        # repo VARIABLE (a storage-account name is not confidential), matching
        # the ACR_LOGIN_SERVER placeholder pattern in build-provisioning-
        # sidecar.yml. Live-ceremony items (documented, NOT created by task
        # 116 -- see notes/h9-artifact-publish-ci-coord-pr.md § Open Items):
        #   1. Create the storage account + `provisioning-artifacts` blob
        #      container (canonical naming, e.g. `stsprkplatform{env}`).
        #   2. Grant the OIDC service principal (secrets.AZURE_CLIENT_ID)
        #      "Storage Blob Data Contributor" RBAC on that account so
        #      `--auth-mode login` succeeds.
        #   3. Populate the PROVISIONING_ARTIFACTS_STORAGE_ACCOUNT repo variable.
        # Until all three land, this step fails cleanly (missing/empty account
        # name) -- the rest of the existing deploy pipeline (staging/swap/
        # rollback jobs below) is UNCHANGED and unaffected by this step's
        # failure (this is an additive step in the Build job only).
        run: |
          az storage blob upload \
            --account-name "${{ vars.PROVISIONING_ARTIFACTS_STORAGE_ACCOUNT }}" \
            --container-name provisioning-artifacts \
            --name "${{ steps.zip.outputs.zip_name }}" \
            --file "./${{ steps.zip.outputs.zip_name }}" \
            --auth-mode login \
            --overwrite true

      - name: Generate + push latest.json manifest (AFTER the zip -- never point at a missing blob)
        run: |
          set -euo pipefail
          cat > ./latest.json <<EOF
          {
            "buildId": "${{ steps.build-id.outputs.build_id }}",
            "sha": "${{ steps.build-id.outputs.sha }}",
            "sizeBytes": ${{ steps.zip.outputs.size_bytes }},
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifactBlobName": "${{ steps.zip.outputs.zip_name }}",
            "gates": {
              "r3AnalyzersAsErrors": "${{ steps.gate-status.outputs.analyzers }}",
              "godClassRatchet": "${{ steps.gate-status.outputs.godclass }}",
              "archTests": "${{ steps.gate-status.outputs.archtests }}",
              "namingConformance": "${{ steps.gate-status.outputs.naming }}",
              "graphAppRoleParity": "Skipped"
            }
          }
          EOF
          cat ./latest.json

          az storage blob upload \
            --account-name "${{ vars.PROVISIONING_ARTIFACTS_STORAGE_ACCOUNT }}" \
            --container-name provisioning-artifacts \
            --name "latest.json" \
            --file "./latest.json" \
            --auth-mode login \
            --overwrite true
        shell: bash

      - name: Fail job if any r3 gate is red (manifest still published -- operators must see it)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.gate-godclass.outcome }}" = "failure" ] || \
             [ "${{ steps.gate-archtests.outcome }}" = "failure" ] || \
             [ "${{ steps.gate-naming.outcome }}" = "failure" ]; then
            echo "::error::One or more r3 gates failed -- see the gate-godclass / gate-archtests / gate-naming step results above. The artifact + manifest were still published (the manifest records the failure) so H9 can see it and refuse to deploy, but this workflow run is marked failed so operators notice immediately."
            exit 1
          fi
          echo "All artifact-scoped r3 gates green. (graphAppRoleParity is intentionally recorded Skipped here -- see step comments above.)"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Test
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Run unit tests
        run: |
          dotnet test tests/unit/Sprk.Bff.Api.Tests/ \
            -c Release \
            --no-restore \
            --logger trx \
            --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: ./TestResults/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy to Staging Slot
  # ──────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging Slot
    runs-on: ubuntu-latest
    needs: [build, test]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    environment: staging  # Auto-approve for staging

    env:
      RESOURCE_GROUP: rg-spaarke-platform-prod
      APP_SERVICE: spaarke-bff-prod
      SLOT_NAME: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: bff-api-build
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create deployment package
        run: |
          cd ./publish
          zip -r ../bff-api.zip .

      - name: Deploy to staging slot
        run: |
          az webapp deploy \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_SERVICE }} \
            --slot ${{ env.SLOT_NAME }} \
            --src-path ./bff-api.zip \
            --type zip \
            --async false

      - name: Wait for staging slot startup
        run: sleep 15

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Verify Staging Health
  # ──────────────────────────────────────────────────────────────────────────
  verify-staging:
    name: Verify Staging Health
    runs-on: ubuntu-latest
    needs: deploy-staging

    env:
      STAGING_URL: https://spaarke-bff-prod-staging.azurewebsites.net

    steps:
      - name: Health check — staging /healthz
        run: |
          echo "Verifying staging health at ${{ env.STAGING_URL }}/healthz"

          MAX_RETRIES=12
          INTERVAL=5
          HEALTHY=false

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "${{ env.STAGING_URL }}/healthz" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Staging health check passed on attempt $i"
              HEALTHY=true
              break
            fi

            echo "Attempt $i/$MAX_RETRIES: HTTP $HTTP_CODE — retrying in ${INTERVAL}s..."
            sleep $INTERVAL
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "::error::Staging health check failed after $MAX_RETRIES attempts"
            echo "Staging slot is unhealthy. Aborting deployment — production is UNCHANGED."
            exit 1
          fi

      - name: Smoke test — staging /ping
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "${{ env.STAGING_URL }}/ping" || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Staging /ping check passed"
          else
            echo "::warning::Staging /ping returned HTTP $HTTP_CODE (non-blocking)"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Swap Staging → Production (requires approval)
  # ──────────────────────────────────────────────────────────────────────────
  swap-production:
    name: Swap to Production
    runs-on: ubuntu-latest
    needs: verify-staging
    environment: production  # FR-09: requires reviewer approval

    env:
      RESOURCE_GROUP: rg-spaarke-platform-prod
      APP_SERVICE: spaarke-bff-prod
      SLOT_NAME: staging

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Swap staging → production
        run: |
          echo "Swapping staging slot to production (zero-downtime)..."
          az webapp deployment slot swap \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_SERVICE }} \
            --slot ${{ env.SLOT_NAME }} \
            --target-slot production

          echo "Slot swap completed successfully"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 6: Verify Production Health
  # ──────────────────────────────────────────────────────────────────────────
  verify-production:
    name: Verify Production Health
    runs-on: ubuntu-latest
    needs: swap-production

    env:
      PRODUCTION_URL: https://api.spaarke.com

    steps:
      - name: Wait for DNS/routing stabilization
        run: sleep 10

      - name: Health check — production /healthz
        id: health-check
        run: |
          echo "Verifying production health at ${{ env.PRODUCTION_URL }}/healthz"

          MAX_RETRIES=12
          INTERVAL=5
          HEALTHY=false

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "${{ env.PRODUCTION_URL }}/healthz" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Production health check passed on attempt $i"
              HEALTHY=true
              break
            fi

            echo "Attempt $i/$MAX_RETRIES: HTTP $HTTP_CODE — retrying in ${INTERVAL}s..."
            sleep $INTERVAL
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "::error::Production health check failed after $MAX_RETRIES attempts"
            echo "healthy=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "healthy=true" >> $GITHUB_OUTPUT

      - name: Smoke test — production /ping
        if: success()
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "${{ env.PRODUCTION_URL }}/ping" || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Production /ping check passed"
          else
            echo "::warning::Production /ping returned HTTP $HTTP_CODE (non-blocking)"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Job 7: Rollback (on production health check failure)
  # ──────────────────────────────────────────────────────────────────────────
  rollback:
    name: Rollback (Swap Back)
    runs-on: ubuntu-latest
    needs: verify-production
    if: failure()

    env:
      RESOURCE_GROUP: rg-spaarke-platform-prod
      APP_SERVICE: spaarke-bff-prod
      SLOT_NAME: staging
      PRODUCTION_URL: https://api.spaarke.com

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Swap back — rollback to previous version
        run: |
          echo "::warning::ROLLING BACK: Swapping production back to previous version"

          az webapp deployment slot swap \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_SERVICE }} \
            --slot ${{ env.SLOT_NAME }} \
            --target-slot production

          echo "Rollback swap completed"

      - name: Verify rollback health
        run: |
          echo "Verifying production health after rollback..."
          sleep 10

          MAX_RETRIES=12
          INTERVAL=5
          HEALTHY=false

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "${{ env.PRODUCTION_URL }}/healthz" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Rollback health check passed on attempt $i"
              HEALTHY=true
              break
            fi

            echo "Attempt $i/$MAX_RETRIES: HTTP $HTTP_CODE — retrying in ${INTERVAL}s..."
            sleep $INTERVAL
          done

          if [ "$HEALTHY" = "true" ]; then
            echo "::warning::Rollback successful — previous version restored"
          else
            echo "::error::CRITICAL: Rollback health check also failed! Manual intervention required."
            echo "Manual rollback command:"
            echo "  az webapp deployment slot swap --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.APP_SERVICE }} --slot ${{ env.SLOT_NAME }} --target-slot production"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Summary (always runs)
  # ──────────────────────────────────────────────────────────────────────────
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build, test, deploy-staging, verify-staging, swap-production, verify-production, rollback]
    if: always()

    steps:
      - name: Write Summary
        run: |
          echo "## BFF API Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Staging | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Verify Staging | ${{ needs.verify-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Swap Production | ${{ needs.swap-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Verify Production | ${{ needs.verify-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollback | ${{ needs.rollback.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.rollback.result }}" = "success" ]; then
            echo "### :warning: Deployment was ROLLED BACK" >> $GITHUB_STEP_SUMMARY
            echo "Production health check failed after swap. Previous version has been restored." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.verify-production.result }}" = "success" ]; then
            echo "### :white_check_mark: Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "Production API: https://api.spaarke.com" >> $GITHUB_STEP_SUMMARY
            echo "Health check: https://api.spaarke.com/healthz" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.verify-staging.result }}" = "failure" ]; then
            echo "### :x: Staging Verification Failed" >> $GITHUB_STEP_SUMMARY
            echo "Staging health check failed. Production was NOT modified." >> $GITHUB_STEP_SUMMARY
          fi
