name: Validate Bicep Infrastructure

# Validates the Bicep IaC on every change. It deploys nothing.
#
# Task 249 (customer-provisioning-orchestration-r1, owner decision D19, 2026-10-02): `customer.bicep` is the ONLY
# customer-stamp template, and customer stamps are deployed ONLY by the L2 control plane (handler H2a), each into the
# customer's own subscription (amended ADR-027). The former what-if and deploy stages targeted
# `stacks/model2-full.bicep` in the single `secrets.AZURE_SUBSCRIPTION_ID`; that template deployed no live environment
# and could not deploy as written, so it is deleted and this workflow validates only. (The Model 1 shared stack was
# retired earlier by task 225a.)
#
# Usage:
#   - Pull request / push to master touching infrastructure/bicep/**: lint every Bicep file, compile customer.bicep,
#     the remaining standalone stacks and the parameter files under parameters/.
#   - Manual dispatch: the same validation, on demand.

on:
  pull_request:
    paths:
      - 'infrastructure/bicep/**'
  push:
    branches:
      - master
    paths:
      - 'infrastructure/bicep/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-bicep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Azure CLI config
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/.azure
        run: |
          mkdir -p $AZURE_CONFIG_DIR
          echo '{}' > $AZURE_CONFIG_DIR/azureProfile.json
          chmod 600 $AZURE_CONFIG_DIR/azureProfile.json

      - name: Setup Azure CLI
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: echo "Azure CLI ready"

      # AZURE_CONFIG_DIR must be set per-step (runner context not available
      # at job-level per GitHub Actions context rules — actionlint enforces).
      # Without this, az bicep lint falls back to ~/.azure/azureProfile.json
      # which doesn't exist + isn't writable on the runner, causing
      # PermissionError / FileNotFoundError on ALL Bicep files.
      # Fixed 2026-06-23 in R3 PR #415; pre-existing bug on master triggered
      # only by PRs touching infrastructure/bicep/ post-runner-image-change.
      - name: Lint Bicep templates
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/.azure
        run: |
          echo "## Bicep Lint Results" >> $GITHUB_STEP_SUMMARY
          LINT_ERRORS=0

          for file in $(find infrastructure/bicep -name '*.bicep' -not -path '*/node_modules/*'); do
            echo "Linting: $file"
            if ! az bicep lint --file "$file" 2>&1; then
              echo "| $file | FAILED |" >> $GITHUB_STEP_SUMMARY
              LINT_ERRORS=$((LINT_ERRORS + 1))
            else
              echo "| $file | OK |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          if [ $LINT_ERRORS -gt 0 ]; then
            echo "::error::$LINT_ERRORS Bicep file(s) failed linting"
            exit 1
          fi

          echo "All Bicep files passed linting" >> $GITHUB_STEP_SUMMARY

      # AZURE_CONFIG_DIR per-step (same reason as Lint step above —
      # runner context not available at job-level; without this az bicep build
      # fails on missing ~/.azure/azureProfile.json). `--outfile`, never `--stdout`
      # (on Windows `--stdout` crashes on non-ASCII template text — keep one
      # invocation style everywhere; see scripts/tests/bicep-e2e-dry-run.ps1).
      - name: Build Bicep templates
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/.azure
        run: |
          OUT="${{ runner.temp }}/bicep-build"
          mkdir -p "$OUT"
          # The customer stamp template (deployed by L2 handler H2a) + any remaining standalone stacks.
          for template in infrastructure/bicep/customer.bicep infrastructure/bicep/stacks/*.bicep; do
            [ -f "$template" ] || continue
            echo "Building: $template"
            az bicep build --file "$template" --outfile "$OUT/$(basename "$template" .bicep).json"
          done
          # Parameter files: catches a parameter set that still names a parameter its template no longer
          # declares (task 249 removed one). Token-substituted files outside parameters/ (ai-foundry.bicepparam,
          # '#{...}#' placeholders) are not compilable as checked in and are skipped by the path.
          for params in infrastructure/bicep/parameters/*.bicepparam; do
            [ -f "$params" ] || continue
            echo "Building: $params"
            az bicep build-params --file "$params" --outfile "$OUT/$(basename "$params" .bicepparam).parameters.json"
          done
          echo "All templates and parameter files compiled successfully" >> $GITHUB_STEP_SUMMARY
