name: CI Tier 2 (Advisory)

# Tier 2 advisory CI per spec FR-A03 / NFR-02 (ci-cd-unit-test-remediation-r1).
#
# CONTRACT (binding):
#   - ADVISORY ONLY. NEVER blocking. NEVER referenced by branch protection.
#   - Aggregates 7 advisory jobs + a single deduplicated PR comment.
#   - Total p95 budget: <= 8 min (spec NFR-02).
#   - Invoked by ci-router.yml (FR-A01) via workflow_call OR runs standalone
#     on pull_request (during shadow period alongside legacy sdap-ci.yml).
#
# DEDUP PATTERN: copied verbatim from sdap-ci.yml lines 591-619 (adr-pr-comment
# job) with marker text changed to "Tier 2 Advisory Report" so this workflow's
# comment does NOT collide with the existing sdap-ci "ADR Architecture
# Validation Report" comment during the 14-day shadow window (spec MUST §123).
#
# NOTE: Job 5 (markdown-link-validator) depends on scripts/validate-markdown-links.ps1
# which ships in parallel task CICD-044. If 044 has not yet merged when this
# workflow first runs, the job step short-circuits with an explanatory notice
# rather than failing — the workflow remains advisory regardless.

on:
  workflow_call:
    # All run-* inputs are `type: string` with default 'true' per CICD-086 (2026-06-26).
    # Rationale: when `ci-router.yml` passes a `${{ expression }}` value, GitHub Actions
    # string-coerces the result across the workflow_call boundary. Strict `type: boolean`
    # validation then rejects the string value pre-job-creation -> conclusion=startup_failure
    # with no visible logs. Using `type: string` accepts the coerced value; guards compare
    # against 'false' (string) instead of `false` (boolean). Callers may pass literal `true`
    # (YAML boolean) and it will coerce to "true" string at call site -- both work.
    inputs:
      run-format:
        description: 'Run dotnet format check'
        required: false
        type: string
        default: 'true'
      run-lint:
        description: 'Run ESLint + Prettier on src/client/**'
        required: false
        type: string
        default: 'true'
      run-unit-tests:
        description: 'Run full unit-test suite (Debug only — Release blocked until 7-day soak per CICD-075)'
        required: false
        type: string
        default: 'true'
      run-adr-compliance:
        description: 'Run full NetArchTest ADR suite'
        required: false
        type: string
        default: 'true'
      run-markdown:
        description: 'Run markdown link validator'
        required: false
        type: string
        default: 'true'
      run-last-reviewed:
        description: 'Run Last Reviewed stamp check on .claude/ + docs/standards/'
        required: false
        type: string
        default: 'true'
      run-plugin-size:
        description: 'Run plugin size validation'
        required: false
        type: string
        default: 'true'
  # NOTE (2026-08-24, unified-access-control-r2): the standalone `pull_request:` trigger was REMOVED.
  # `workflow_call` is now the ONLY entry point. Rationale: under `workflow_call` a reusable workflow
  # evaluates `github.ref` / `github.sha` from the CALLER, so the standalone PR run and ci-router.yml's
  # tier2 call computed the IDENTICAL concurrency group below and cancelled each other. Empirically the
  # standalone died 1s after the Router's `classify` dispatched tier2 (15:25:00 → 15:25:01 on run
  # 32744675143), giving a `CI Tier 2 (Advisory)` check that was `cancelled` at 100% of SHAs on every PR
  # in the repo. The jobs still run — as `CI / Tier 2 (Advisory) / *` under the Router. Verified safe at
  # removal time: all open PRs target master (so the Router always fires), branch protection is disabled
  # (no required-check name depended on the standalone), and tier2-pr-comment already runs in the call.

permissions:
  contents: read
  pull-requests: write   # tier2-pr-comment writes ONE deduplicated comment

concurrency:
  # Include the commit SHA so runs on DIFFERENT commits never cancel each other. Previously the group was
  # keyed on github.ref alone, so on master (frequent merges from many projects) a newer run cancelled the
  # in-flight tier2 run of the prior commit; the Router aggregator (alls-green) treats a *cancelled* tier2 as
  # a hard fail (allowed-failures covers failure, not cancellation) → spurious red `CI / Router`. Per-SHA
  # groups keep cancel-in-progress a literal boolean (avoids the ci-router.yml startup_failure class) while
  # letting each commit's advisory tier run to completion.
  #
  # ⚠️ 2026-08-24 (unified-access-control-r2): per-SHA grouping fixed only the CROSS-COMMIT cause. It could
  # not fix same-SHA self-collision between the standalone `pull_request` trigger and the Router's
  # `workflow_call` — both computed this identical group. That trigger is now removed (see `on:` above), and
  # ci-router.yml no longer lets a cancelled tier2 redden the gate at all. Two independent fixes, because a
  # cancelled advisory tier must be survivable even if a future cancellation source appears.
  group: ci-tier2-advisory-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ============================================================================
  # Job 1 — format (dotnet format --verify-no-changes). Budget: <30s.
  # ============================================================================
  format:
    name: Format (dotnet format)
    runs-on: ubuntu-latest
    if: ${{ inputs.run-format != 'false' }}
    continue-on-error: true   # Advisory — never blocking
    timeout-minutes: 3
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore --verbosity minimal

      - name: Format verification (whitespace-only — mirrors sdap-ci policy)
        id: fmt
        continue-on-error: true
        # whitespace-only mirrors sdap-ci.yml code-quality job rationale:
        # IDE1006 naming-rule warnings fire on intentionally-lowercase Dataverse
        # field names (sprk_*, accountid) in anonymous payloads. See
        # docs/assessments/bff-warning-suppression-analysis-2026-06-01.md.
        run: dotnet format whitespace --verify-no-changes --verbosity minimal

      - name: Report result
        id: report
        if: always()
        run: |
          if [ "${{ steps.fmt.outcome }}" = "success" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # Job 2 — lint (ESLint + Prettier on src/client/**). Budget: <60s.
  # ============================================================================
  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    if: ${{ inputs.run-lint != 'false' }}
    continue-on-error: true
    timeout-minutes: 3
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache root npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-root-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-root-

      - name: Install root deps (Prettier)
        # `npm install --legacy-peer-deps` per root CLAUDE.md §11 Node Installs:
        # repo lockfiles drift; `npm ci` blocks CI on harmless transitive churn.
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Prettier format check
        id: prettier
        continue-on-error: true
        run: npx prettier --check "src/client/**/*.{ts,tsx}" --no-error-on-unmatched-pattern

      - name: Install PCF deps (ESLint)
        working-directory: src/client/pcf
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: ESLint check
        id: eslint
        continue-on-error: true
        working-directory: src/client/pcf
        # node_modules/.bin/eslint (not npx) per PR #393 root-cause fix
        # (2026-06-18): npx silently auto-fetches eslint from registry when
        # local copy is missing, masking install bugs.
        run: node_modules/.bin/eslint .

      - name: Report result
        id: report
        if: always()
        run: |
          if [ "${{ steps.prettier.outcome }}" = "success" ] && [ "${{ steps.eslint.outcome }}" = "success" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # Job 3 — full-unit-tests (Debug only — spec MUST §125 forbids Release until
  # after 7-day soak per CICD-075).
  #
  # TIMEOUT: 30 min (was 6, raised 2026-08-24 by unified-access-control-r2).
  # The old 6 was authored against a "<3 min" budget the suite has long outgrown
  # and was structurally unreachable: on windows-latest the overhead BEFORE a
  # single test runs is ~4m23s (measured, run 32744675143 → Checkout w/
  # fetch-depth:0 + LFS 28s, Cache NuGet 1m27s, Restore 29s, Build 1m56s), so
  # `dotnet test` got ~1m35s of budget. It ran 2m49s and was killed at the wall.
  #
  # A `timeout-minutes` kill reports conclusion=CANCELLED, NOT failure — which
  # silently defeats the `continue-on-error: true` below and (until the paired
  # ci-router.yml fix) hard-failed `CI / Router` via alls-green. Net effect: the
  # Router was red on EVERY branch — and this job had NEVER COMPLETED ONCE: 20 of
  # the last 20 runs across all branches were cancelled, so there was no observed
  # duration to size against.
  #
  # How 30 was chosen: the plain suite (`dotnet test -c Debug --no-build`) takes
  # ~4m03s on a fast local dev box (10,762 tests, measured 2026-08-24). A 2-core
  # windows-latest runner is typically 2-4x slower → ~8-16 min, plus the 4m23s
  # overhead above = ~13-21 min. 20 would have sat right at the edge of that
  # range, which is precisely how the original 6 became unreachable. Corroborating
  # ceiling: the sibling `sdap-ci.yml` build-test job runs substantially the same
  # build+test on the same runner class with NO timeout-minutes at all, and its
  # coverage-instrumented test step was still running past 28 min on this SHA.
  #
  # This value is a RUNAWAY GUARD, not a performance budget — tier2 can no longer
  # redden `CI / Router` (see ci-router.yml router-result), so headroom is free
  # while a too-tight value costs the signal entirely. Re-tune from observed p95
  # once green runs accumulate.
  # ============================================================================
  full-unit-tests:
    name: Full Unit Tests (Debug)
    runs-on: windows-latest
    if: ${{ inputs.run-unit-tests != 'false' }}
    continue-on-error: true
    timeout-minutes: 30
    outputs:
      result: ${{ steps.report.outputs.result }}
    strategy:
      fail-fast: false
      matrix:
        # Debug-only is BINDING through Phase 2 per spec MUST §125 / FR-B07.
        # Restore Release here ONLY after surviving suite green >= 7 days (CICD-075).
        configuration: [Debug]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # LFS smudge required: tests/fixtures/compose-corpus/*.docx are git-LFS pointers
          # (.gitattributes: *.docx filter=lfs). Without this the ComposeNumbering/Projection
          # seam tests parse pointer files → ~30 Compose tests fail. Mirrors the sdap-ci.yml
          # build-test fix (email-communication-intelligence-r2, 2026-08-13).
          lfs: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore --verbosity minimal

      - name: Build
        # WarningsAsErrors centralized in Directory.Build.props per
        # docs/assessments/bff-warning-suppression-analysis-2026-06-01.md.
        run: dotnet build -c ${{ matrix.configuration }} --no-restore

      # ------------------------------------------------------------------
      # Two-pass runner (2026-08-27). This job is the repo's ONE full-suite
      # run — sdap-ci.yml's `build-test` is retiring into it rather than being
      # duplicated into tier1, where a ~28-minute job would have blown tier1's
      # p95 ≤ 3 min blocking budget by an order of magnitude.
      #
      # Pass 1 runs everything; the classifier emits a filter covering every
      # failure; pass 2 re-runs those; only a test failing BOTH is real. That
      # matters more here than it did in a blocking job: an advisory report
      # that cries wolf is one nobody reads, and this is now the only place the
      # full suite runs on a PR.
      #
      # NOTE: deliberately no `--collect:"XPlat Code Coverage"`. sdap-ci's
      # build-test collected coverage; coverage is observation-never-a-gate per
      # ADR-038 and nightly-health.yml already has a coverage-observation job.
      # The collector also hooks process shutdown, which is the leading
      # suspect for the 6-hour hang seen when this job was trialled in tier1.
      # ------------------------------------------------------------------
      - name: Run unit tests (pass 1)
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test -c ${{ matrix.configuration }} --no-build `
            --logger "trx;LogFilePrefix=tier2-pass1" `
            --results-directory ./TestResults/tier2/pass1

      - name: Classify pass-1 failures (decide on retry)
        id: classify
        shell: pwsh
        run: ./scripts/ci/classify-and-retry.ps1 -TrxDirectory ./TestResults/tier2/pass1

      - name: Retry pass-1 failures (pass 2)
        id: tests-pass-2
        if: steps.classify.outputs.retry_needed == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test -c ${{ matrix.configuration }} --no-build `
            --filter "${{ steps.classify.outputs.retry_filter }}" `
            --logger "trx;LogFilePrefix=tier2-pass2" `
            --results-directory ./TestResults/tier2/pass2

      - name: Test verdict (advisory — reported, never blocking)
        id: verdict
        shell: pwsh
        run: |
          if ("${{ steps.classify.outputs.retry_needed }}" -ne "true") {
            Write-Host "Pass 1 clean — full suite green"
            exit 0
          }
          $trx = @(Get-ChildItem -Path ./TestResults/tier2/pass2 -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue)
          if ($trx.Count -eq 0) {
            Write-Host "::warning::Pass 2 produced no TRX — dotnet test likely crashed"
            exit 0
          }
          $nsUri = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"
          $stillFailing = @()
          $executed = New-Object System.Collections.Generic.List[string]
          foreach ($t in $trx) {
            $xml = [xml](Get-Content $t.FullName -Raw)
            $nsm = New-Object System.Xml.XmlNamespaceManager $xml.NameTable
            $nsm.AddNamespace("x", $nsUri)
            $stillFailing += @($xml.SelectNodes("//x:UnitTestResult[@outcome='Failed']", $nsm))
            foreach ($r in $xml.SelectNodes("//x:UnitTestResult", $nsm)) { $executed.Add($r.GetAttribute("testName")) | Out-Null }
          }
          # Same coverage guard as the blocking path: a filter term that matched
          # nothing must not read as success, even in an advisory report.
          $expected = "${{ steps.classify.outputs.retry_methods }}" -split ';' | Where-Object { $_ }
          $notReRun = @($expected | Where-Object { $m = $_; -not ($executed | Where-Object { $_ -eq $m -or $_.StartsWith("$m(") }) })
          if ($notReRun.Count -gt 0) {
            Write-Host "::warning::INCONCLUSIVE — $($notReRun.Count) method(s) failed pass 1 but did not execute in pass 2:"
            $notReRun | ForEach-Object { Write-Host "  - $_" }
          }
          if ($stillFailing.Count -gt 0) {
            Write-Host "::warning::$($stillFailing.Count) test(s) failed BOTH passes — real failures:"
            $stillFailing | ForEach-Object { Write-Host "  - $($_.GetAttribute('testName'))" }
          } else {
            Write-Host "All pass-1 failures passed on retry — no real failures"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tier2-unit-test-results-${{ matrix.configuration }}
          path: ./TestResults/tier2/
          if-no-files-found: warn

      - name: Report result
        id: report
        if: always()
        run: |
          if ("${{ steps.tests.outcome }}" -eq "success") {
            "result=pass" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "result=fail" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
        shell: pwsh

  # ============================================================================
  # Job 4 — adr-compliance (NetArchTest full suite). Budget: <60s.
  # ============================================================================
  adr-compliance:
    name: ADR Compliance (NetArchTest)
    runs-on: ubuntu-latest
    if: ${{ inputs.run-adr-compliance != 'false' }}
    continue-on-error: true
    timeout-minutes: 3
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore --verbosity minimal

      - name: NetArchTest full suite
        id: arch
        continue-on-error: true
        run: |
          dotnet test tests/Spaarke.ArchTests/Spaarke.ArchTests.csproj \
            --logger "trx;LogFileName=tier2-adr.trx" \
            --results-directory ./TestResults

      - name: Upload ADR test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tier2-adr-results
          path: ./TestResults/tier2-adr.trx
          if-no-files-found: warn

      - name: Report result
        id: report
        if: always()
        run: |
          if [ "${{ steps.arch.outcome }}" = "success" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # Job 5 — markdown-link-validator (invokes scripts/validate-markdown-links.ps1
  # from parallel task CICD-044). Budget: <30s.
  #
  # TODO (CICD-044 follow-up): when scripts/validate-markdown-links.ps1 lands,
  # this job runs as designed. Until then the step short-circuits with a notice
  # and reports `skip` so the aggregated PR comment shows a clear "pending"
  # marker rather than a false pass/fail.
  # ============================================================================
  markdown-link-validator:
    name: Markdown Link Validator
    runs-on: ubuntu-latest
    if: ${{ inputs.run-markdown != 'false' }}
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run markdown link validator
        id: mdcheck
        continue-on-error: true
        shell: pwsh
        run: |
          $script = './scripts/validate-markdown-links.ps1'
          if (-not (Test-Path $script)) {
            Write-Host "::notice::scripts/validate-markdown-links.ps1 not yet present (ships in CICD-044). Skipping."
            "skipped=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          & pwsh -File $script

      - name: Report result
        id: report
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.mdcheck.outputs.skipped }}" -eq "true") {
            "result=skip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif ("${{ steps.mdcheck.outcome }}" -eq "success") {
            "result=pass" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "result=fail" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

  # ============================================================================
  # Job 6 — last-reviewed-stamp. Budget: <30s.
  #
  # No prior implementation existed in sdap-ci.yml; this is a NEW pattern for
  # the Tier 2 advisory tier. Verifies every modified `.claude/skills/*/SKILL.md`,
  # `.claude/constraints/*.md`, `docs/standards/*.md`, `docs/architecture/*.md`,
  # and `docs/procedures/*.md` file carries a `> **Last Reviewed**: YYYY-MM-DD`
  # stamp dated within the last 365 days. Advisory only.
  # ============================================================================
  last-reviewed-stamp:
    name: Last Reviewed Stamp
    runs-on: ubuntu-latest
    if: ${{ inputs.run-last-reviewed != 'false' }}
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need history for git diff

      - name: Check Last Reviewed stamp on touched docs
        id: stamp
        continue-on-error: true
        shell: pwsh
        run: |
          # Determine merge base for diff
          $baseRef = $env:GITHUB_BASE_REF
          if (-not $baseRef) { $baseRef = 'master' }
          git fetch origin $baseRef --depth=1 2>$null
          $base = "origin/$baseRef"
          $changed = git diff --name-only --diff-filter=AM $base...HEAD 2>$null
          if (-not $changed) { Write-Host 'No changed files vs base'; exit 0 }

          $targets = @(
            '^\.claude/skills/[^/]+/SKILL\.md$',
            '^\.claude/constraints/.+\.md$',
            '^docs/standards/.+\.md$',
            '^docs/architecture/.+\.md$',
            '^docs/procedures/.+\.md$'
          )
          $tracked = $changed | Where-Object {
            $f = $_
            $targets | Where-Object { $f -match $_ }
          }
          if (-not $tracked) { Write-Host 'No tracked-surface docs changed'; exit 0 }

          $cutoff = (Get-Date).AddDays(-365)
          $violations = @()
          foreach ($f in $tracked) {
            if (-not (Test-Path $f)) { continue }
            $content = Get-Content $f -Raw
            $m = [regex]::Match($content, '(?m)^>\s*\*\*Last Reviewed\*\*:\s*(\d{4}-\d{2}-\d{2})')
            if (-not $m.Success) {
              $violations += "${f}: missing 'Last Reviewed' stamp"
              continue
            }
            try {
              $stamped = [datetime]::ParseExact($m.Groups[1].Value, 'yyyy-MM-dd', $null)
              if ($stamped -lt $cutoff) {
                $violations += "${f}: stamp ${($m.Groups[1].Value)} older than 365 days"
              }
            } catch {
              $violations += "${f}: unparseable stamp '${($m.Groups[1].Value)}'"
            }
          }
          if ($violations.Count -gt 0) {
            Write-Host "::warning::Last Reviewed stamp issues:"
            $violations | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          Write-Host "All touched docs have valid Last Reviewed stamps."

      - name: Report result
        id: report
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.stamp.outcome }}" -eq "success") {
            "result=pass" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "result=fail" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

  # ============================================================================
  # Job 7 — plugin-size (mirrors sdap-ci.yml code-quality "Plugin size
  # validation" step verbatim — ADR-002 1MB cap). Budget: <30s.
  # ============================================================================
  plugin-size:
    name: Plugin Size (ADR-002)
    runs-on: windows-latest
    if: ${{ inputs.run-plugin-size != 'false' }}
    continue-on-error: true
    timeout-minutes: 5
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Setup .NET Framework targeting pack
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8")) {
            Write-Warning ".NET Framework 4.8 targeting pack not found. Plugin build may fail."
          }

      - name: Restore
        run: dotnet restore --verbosity minimal

      - name: Build plugin (Release)
        # Plugin must be Release-built for size validation. The repo-wide
        # Debug-only rule (CICD spec MUST §125) applies to test matrices,
        # not to single-target Release publish for size measurement.
        continue-on-error: true
        run: dotnet build power-platform/plugins/Spaarke.Plugins/Spaarke.Plugins.csproj -c Release --no-restore

      - name: Plugin size validation
        id: size
        continue-on-error: true
        shell: pwsh
        run: |
          # Mirrors sdap-ci.yml code-quality "Plugin size validation" step.
          $pluginPath = "power-platform/plugins/Spaarke.Plugins/bin/Release/net48/Spaarke.Plugins.dll"
          if (Test-Path $pluginPath) {
            $size = (Get-Item $pluginPath).Length
            Write-Host "Plugin assembly size: $size bytes"
            if ($size -gt 1MB) {
              Write-Error "Plugin assembly exceeds 1MB size limit (ADR-002)"
              exit 1
            }
          } else {
            Write-Host "::notice::Plugin DLL not present at $pluginPath — skipping size check (build may have been skipped)."
          }

      - name: Report result
        id: report
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.size.outcome }}" -eq "success") {
            "result=pass" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "result=fail" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

  # ============================================================================
  # Job 8 — tier2-pr-comment. Aggregates jobs 1-7 results into ONE deduplicated
  # PR comment.
  #
  # DEDUP PATTERN: copied verbatim from sdap-ci.yml lines 591-619 (adr-pr-comment
  # job). The only intentional difference is the OWNERSHIP MARKER string:
  #   - sdap-ci uses:    body.includes('ADR Architecture Validation Report')
  #   - tier2 uses:      body.includes('Tier 2 Advisory Report')
  # Distinct markers are REQUIRED for sdap-ci.yml + ci-tier2-advisory.yml to
  # co-exist during the 14-day shadow window (spec MUST §123).
  # ============================================================================
  tier2-pr-comment:
    name: Tier 2 Advisory PR Comment
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - full-unit-tests
      - adr-compliance
      - markdown-link-validator
      - last-reviewed-stamp
      - plugin-size
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Aggregate & post deduplicated PR comment
        uses: actions/github-script@v9
        env:
          # Each job reports TWICE, and the two disagree by design:
          #
          #   needs.<job>.result          the JOB conclusion. Every Tier 2 job carries
          #                               `continue-on-error: true`, which forces this to
          #                               `success` even when the job's work failed.
          #   needs.<job>.outputs.result  the job's OWN verdict, computed in its `Report result`
          #                               step from `steps.<id>.outcome` — which is evaluated
          #                               BEFORE continue-on-error is applied, so it is truthful.
          #
          # This block read only the first for six of the seven jobs, so the report said
          # "pass" unconditionally — Tier 2 could not express a failure at all. Observed on
          # PR #832 (2026-08-27): the comment read "✅ ADR Compliance (NetArchTest): pass"
          # while six ArchTests were red on that exact tree, including the credential guard
          # whose stated purpose is to fail the build on a new secret-bearing client.
          # A green light that cannot turn red is worse than no light.
          FORMAT_RESULT: ${{ needs.format.result }}
          FORMAT_OUTPUT: ${{ needs.format.outputs.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          LINT_OUTPUT: ${{ needs.lint.outputs.result }}
          UNIT_RESULT: ${{ needs.full-unit-tests.result }}
          UNIT_OUTPUT: ${{ needs.full-unit-tests.outputs.result }}
          ADR_RESULT: ${{ needs.adr-compliance.result }}
          ADR_OUTPUT: ${{ needs.adr-compliance.outputs.result }}
          MARKDOWN_RESULT: ${{ needs.markdown-link-validator.result }}
          MARKDOWN_OUTPUT: ${{ needs.markdown-link-validator.outputs.result }}
          LASTREVIEW_RESULT: ${{ needs.last-reviewed-stamp.result }}
          LASTREVIEW_OUTPUT: ${{ needs.last-reviewed-stamp.outputs.result }}
          PLUGIN_RESULT: ${{ needs.plugin-size.result }}
          PLUGIN_OUTPUT: ${{ needs.plugin-size.outputs.result }}
        with:
          script: |
            // The job's OWN verdict wins when it reported one, because `continue-on-error`
            // masks the job conclusion to `success`. Fall back to the job result only for
            // states the job cannot self-report: skipped, cancelled, or a crash before the
            // `Report result` step ran (in which case the output is empty — treated as a
            // failure, not a pass, so an infrastructure fault is never read as green).
            function fmt(name, result, outputResult) {
              if (outputResult === 'skip') return `- ⏭️ **${name}**: pending (CICD-044 follow-up)`;
              if (result === 'skipped') return `- ⏭️ **${name}**: skipped`;
              if (result === 'cancelled') return `- ⚪ **${name}**: cancelled`;
              if (outputResult === 'pass') return `- ✅ **${name}**: pass`;
              if (outputResult === 'fail') return `- ⚠️ **${name}**: fail (advisory — not blocking)`;
              if (!outputResult) {
                return result === 'success'
                  ? `- ✅ **${name}**: pass`
                  : `- ⚠️ **${name}**: fail (advisory — not blocking)`;
              }
              return `- ⚠️ **${name}**: fail (advisory — not blocking)`;
            }

            let comment = '## 🛈 Tier 2 Advisory Report\n\n';
            comment += '_Advisory checks only — none of these block merge. See ';
            comment += '[spec FR-A03](../blob/master/projects/ci-cd-unit-test-remediation-r1/spec.md) ';
            comment += 'for the binding contract._\n\n';

            comment += '### Results\n\n';
            comment += fmt('Format (dotnet format)',       process.env.FORMAT_RESULT,     process.env.FORMAT_OUTPUT)     + '\n';
            comment += fmt('Lint (ESLint + Prettier)',     process.env.LINT_RESULT,       process.env.LINT_OUTPUT)       + '\n';
            comment += fmt('Full Unit Tests (Debug)',      process.env.UNIT_RESULT,       process.env.UNIT_OUTPUT)       + '\n';
            comment += fmt('ADR Compliance (NetArchTest)', process.env.ADR_RESULT,        process.env.ADR_OUTPUT)        + '\n';
            comment += fmt('Markdown Link Validator',      process.env.MARKDOWN_RESULT,   process.env.MARKDOWN_OUTPUT)   + '\n';
            comment += fmt('Last Reviewed Stamp',          process.env.LASTREVIEW_RESULT, process.env.LASTREVIEW_OUTPUT) + '\n';
            comment += fmt('Plugin Size (ADR-002)',        process.env.PLUGIN_RESULT,     process.env.PLUGIN_OUTPUT)     + '\n';

            comment += '\n---\n\n';
            comment += '### How to investigate\n\n';
            comment += '- View per-job logs in the [Actions tab](../actions).\n';
            comment += '- Run locally: `dotnet test`, `dotnet format whitespace --verify-no-changes`, `npx prettier --check`, `npx eslint .`.\n';
            comment += '- Tier 2 budget: **p95 ≤ 8 min** (spec NFR-02). If consistently over budget, file an issue tagged `ci-tier2-budget`.\n\n';
            comment += '_Generated by `.github/workflows/ci-tier2-advisory.yml`._\n';

            // ----------------------------------------------------------------
            // Dedup pattern — COPIED VERBATIM from sdap-ci.yml lines 591-619
            // (adr-pr-comment job). Only the ownership-marker text below
            // differs: 'Tier 2 Advisory Report' vs 'ADR Architecture
            // Validation Report'. Distinct markers are REQUIRED so the two
            // workflows can co-exist during the 14-day shadow window
            // (spec MUST §123).
            // ----------------------------------------------------------------

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Tier 2 Advisory Report')
            );

            // Create or update comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
