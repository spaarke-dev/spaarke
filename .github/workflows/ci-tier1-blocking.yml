# ============================================================================
# ci-tier1-blocking.yml — Tier 1 Blocking CI
# ============================================================================
#
# PURPOSE
#   Reusable workflow invoked by ci-router.yml. Implements spec FR-A02:
#   the narrow blocking-tier surface that must hold the p95 ≤ 3 min budget
#   (NFR-01) at <1% flake (NFR-03).
#
# CONTENTS (strict scope list — do not extend without spec amendment)
#   1. compile                — Debug-only, no -warnaserror (<60s warm cache)
#   2. arch-tests             — critical NetArchTest MUST-NOT subset (<30s)
#   3. changed-surface-smoke  — Spe.Integration.Tests filtered by changed src/ paths (60-90s)
#   4. auth-smoke             — auth integration tests (conditional, <60s)
#
# NOT IN TIER 1 (live in ci-tier2-advisory.yml or nightly-health.yml):
#   format, lint, markdown link validator, dependency audit, Trivy,
#   full unit/integration test suite.
#
# INPUTS (from ci-router.yml `classify` job)
#   bff_changed       — true if src/server/api/Sprk.Bff.Api/** or shared server changed
#   spaarke_ai_changed — true if src/solutions/SpaarkeAi/** or AI client libs changed
#
# AUTH + NAMESPACE DETECTION
#   Done in-workflow via a dedicated classify-tier1 job using dorny/paths-filter.
#   Keeps this workflow's contract with the router small (bff_changed,
#   spaarke_ai_changed) while preserving fine-grained auth + changed-surface
#   routing locally. ADR-028 (Spaarke Auth v2) requires the auth-smoke job to
#   exercise OBO + app-only Graph paths whenever Infrastructure/Auth/** or
#   claims handling is touched.
#
# STATUS
#   SHADOW MODE. Per spec MUST §122, sdap-ci.yml remains the required check
#   for ≥14 days post-cutover; this workflow runs in parallel and reports
#   results via the ci-router.yml composite gate. Branch protection flip
#   happens in task 071.
#
# REFERENCES
#   - projects/ci-cd-unit-test-remediation-r1/spec.md FR-A02, NFR-01, NFR-03
#   - .claude/adr/ADR-028-spaarke-auth-architecture.md (auth-smoke alignment)
#   - tests/Spaarke.ArchTests/ — ArchTests source (MUST-NOT subset selected by
#     name; rationale documented inline at the arch-tests job)
# ============================================================================

name: CI Tier 1 (Blocking)

on:
  workflow_call:
    inputs:
      bff_changed:
        description: 'True if PR diff touches BFF server code (per router classification)'
        required: false
        type: string
        default: 'true'
      spaarke_ai_changed:
        description: 'True if PR diff touches SpaarkeAi (per router classification)'
        required: false
        type: string
        default: 'false'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # required by dorny/paths-filter inside classify-tier1

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Required by Sprk.Bff.Api startup validation in non-Development envs
  # (added by spaarke-redis-cache-remediation-r2 FR-06). Integration tests run
  # in ASPNETCORE_ENVIRONMENT=Testing → validation fires unconditionally.
  # Fake instrumentation key satisfies the check; no telemetry is actually
  # exported in CI runs. See ISS-NNN (to be filed): consider whether redis-r2
  # validation should be relaxed for Testing env so this CI workaround can be
  # removed.
  APPLICATIONINSIGHTS_CONNECTION_STRING: InstrumentationKey=00000000-0000-0000-0000-000000000000
  # Second redis-r2 startup validation: rejects Redis disabled unless explicit
  # in-memory fallback opt-in. Tests run in Testing env without a real Redis;
  # `AllowInMemoryFallback=true` is the documented Testing-env path per the
  # validation's own error message ("Development or Testing only"). Same ISS as
  # APPLICATIONINSIGHTS_CONNECTION_STRING above — both should be relaxed at
  # the validation layer for Testing env so these CI workarounds can be removed.
  Redis__AllowInMemoryFallback: "true"

jobs:
  # --------------------------------------------------------------------------
  # Job 0 — classify-tier1
  # Local-to-tier1 path classification for auth-smoke + changed-surface-smoke.
  # The router classifies coarse surfaces (BFF / SpaarkeAi / docs); this job
  # adds fine-grained Tier-1-only signals (auth paths, AI namespace, semantic
  # search namespace, workspace namespace).
  # Budget: ~10s. Always runs.
  # --------------------------------------------------------------------------
  classify-tier1:
    name: Classify Tier 1 Surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      ai_surface: ${{ steps.filter.outputs.ai_surface }}
      semantic_search_surface: ${{ steps.filter.outputs.semantic_search_surface }}
      workspace_surface: ${{ steps.filter.outputs.workspace_surface }}
      reporting_surface: ${{ steps.filter.outputs.reporting_surface }}
      changed_namespaces: ${{ steps.derive-namespaces.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Classify Tier 1 surfaces
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'src/server/api/Sprk.Bff.Api/Infrastructure/Auth/**'
              - 'src/server/api/Sprk.Bff.Api/Infrastructure/Graph/**'
              - 'src/server/api/Sprk.Bff.Api/**/Claims*.cs'
              - 'src/server/api/Sprk.Bff.Api/**/Authorization*.cs'
              - 'src/server/api/Sprk.Bff.Api/**/Authentication*.cs'
            ai_surface:
              - 'src/server/api/Sprk.Bff.Api/Services/Ai/**'
              - 'src/server/api/Sprk.Bff.Api/Endpoints/Ai*.cs'
            semantic_search_surface:
              - 'src/server/api/Sprk.Bff.Api/Services/Ai/SemanticSearch/**'
              - 'src/server/api/Sprk.Bff.Api/Services/Ai/RecordSearch/**'
            workspace_surface:
              - 'src/server/api/Sprk.Bff.Api/Services/Workspace/**'
              - 'src/server/api/Sprk.Bff.Api/Endpoints/Workspace*.cs'
            reporting_surface:
              - 'src/server/api/Sprk.Bff.Api/Services/Reporting/**'
              - 'src/server/api/Sprk.Bff.Api/Endpoints/Reporting*.cs'

      - name: Derive Spe.Integration.Tests namespaces from changed surface
        id: derive-namespaces
        # Maps fine-grained surface flags to Spe.Integration.Tests namespaces.
        # Output is a space-separated list of FullyQualifiedName~<ns> targets
        # consumed by the changed-surface-smoke job's xUnit filter.
        # Empty output = no-op for the smoke job (it has an `if:` guard).
        shell: bash
        run: |
          set -euo pipefail
          ns=()
          if [[ "${{ steps.filter.outputs.ai_surface }}" == "true" ]]; then
            ns+=("Spe.Integration.Tests.Api.Ai")
          fi
          if [[ "${{ steps.filter.outputs.semantic_search_surface }}" == "true" ]]; then
            ns+=("Spe.Integration.Tests.SemanticSearch")
          fi
          if [[ "${{ steps.filter.outputs.workspace_surface }}" == "true" ]]; then
            ns+=("Spe.Integration.Tests.Workspace")
          fi
          if [[ "${{ steps.filter.outputs.reporting_surface }}" == "true" ]]; then
            ns+=("Spe.Integration.Tests.Reporting")
          fi
          value="${ns[*]:-}"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          if [[ -n "$value" ]]; then
            echo "::notice::Changed-surface smoke namespaces: $value"
          else
            echo "::notice::No changed-surface namespaces — smoke job will no-op"
          fi

      - name: Classification summary
        shell: bash
        run: |
          {
            echo "### Tier 1 — Surface Classification"
            echo ""
            echo "| Surface | Changed |"
            echo "|---|---|"
            echo "| auth (Infrastructure/Auth, claims, authentication) | ${{ steps.filter.outputs.auth }} |"
            echo "| ai_surface (Services/Ai, Ai endpoints) | ${{ steps.filter.outputs.ai_surface }} |"
            echo "| semantic_search_surface | ${{ steps.filter.outputs.semantic_search_surface }} |"
            echo "| workspace_surface | ${{ steps.filter.outputs.workspace_surface }} |"
            echo "| reporting_surface | ${{ steps.filter.outputs.reporting_surface }} |"
            echo ""
            echo "**BFF changed (from router)**: ${{ inputs.bff_changed }}"
            echo "**Smoke namespaces**: ${{ steps.derive-namespaces.outputs.value }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Job 1 — compile (Debug only, no -warnaserror)
  # Budget: <60s warm cache. Scoped to BFF csproj for speed. WarningsAsErrors
  # policy lives in Directory.Build.props (TreatWarningsAsErrors=true +
  # WarningsNotAsErrors=CS0109;CS0618;CS1998;CS8601;CS8604), so the CLI does
  # NOT pass -warnaserror — see
  # docs/assessments/bff-warning-suppression-analysis-2026-06-01.md.
  # --------------------------------------------------------------------------
  compile:
    name: Compile (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-tier1-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-tier1-
            ${{ runner.os }}-nuget-

      - name: Restore (BFF project only)
        run: dotnet restore src/server/api/Sprk.Bff.Api/Sprk.Bff.Api.csproj --verbosity minimal

      - name: Build (Debug, BFF project only)
        # No -warnaserror — Directory.Build.props centralizes that policy.
        run: dotnet build src/server/api/Sprk.Bff.Api/Sprk.Bff.Api.csproj -c Debug --no-restore

  # --------------------------------------------------------------------------
  # Job 2 — arch-tests (MUST-NOT subset only)
  # Budget: <30s. Runs the 7 load-bearing NetArchTest MUST-NOT facts via xUnit
  # FullyQualifiedName filter. The remaining ~15 ArchTests (existence checks,
  # ceiling heuristics, source-scan exemptions like
  # KnownPluginViolationCountShouldNotIncrease, OptionsPatternShouldBeUsedForConfiguration,
  # ServicesShouldBeConcreteUnlessSeamRequired) live in Tier 2.
  #
  # MUST-NOT subset (selected because each test (a) detects a real production
  # regression that the architecture cannot tolerate, AND (b) is deterministic
  # — pure assembly inspection, no source scans, no ceiling counters that can
  # drift, no `NotEmpty` heuristics):
  #   - ADR-001 NoAzureFunctionsPackages      — bans Functions packages
  #   - ADR-002 EndpointsShouldNotReferencePluginInterfaces — plugin isolation
  #   - ADR-007 ControllersShouldNotReferenceGraphSdk      — Graph seam (controllers)
  #   - ADR-007 EndpointsShouldNotReferenceGraphSdk        — Graph seam (endpoints)
  #   - ADR-009 MemoryCacheShouldNotBeSingleton            — Redis-first caching
  #   - ADR-009 NoHybridCachingLibraries                   — bans hybrid cache libs
  #   - ADR-013 CrudCodeMustNotDependOnAiInternalTypes     — AI facade boundary (FR-C6;
  #     documented AI-API-surface exceptions grandfathered in the test itself per
  #     projects/sdap-bff-api-remediation-fix/EXECUTION-LOG.md tasks 050/053)
  # --------------------------------------------------------------------------
  arch-tests:
    name: Arch Tests (MUST-NOT subset)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-tier1-arch-${{ hashFiles('**/Directory.Packages.props', 'tests/Spaarke.ArchTests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-tier1-arch-
            ${{ runner.os }}-nuget-tier1-
            ${{ runner.os }}-nuget-

      - name: Restore ArchTests project
        run: dotnet restore tests/Spaarke.ArchTests/Spaarke.ArchTests.csproj --verbosity minimal

      - name: Build ArchTests project (Debug)
        run: dotnet build tests/Spaarke.ArchTests/Spaarke.ArchTests.csproj -c Debug --no-restore

      - name: Run MUST-NOT arch tests
        # xUnit --filter accepts pipe-separated ORs. Each fact name is the
        # method-level test; FullyQualifiedName=<full>.<method> targets it
        # exactly. (Display names are descriptive but FullyQualifiedName is
        # the canonical xUnit filter target — display names contain spaces.)
        run: |
          dotnet test tests/Spaarke.ArchTests/Spaarke.ArchTests.csproj \
            -c Debug \
            --no-build \
            --filter "FullyQualifiedName=Spaarke.ArchTests.ADR001_MinimalApiTests.NoAzureFunctionsPackages|FullyQualifiedName=Spaarke.ArchTests.ADR002_PluginTests.EndpointsShouldNotReferencePluginInterfaces|FullyQualifiedName=Spaarke.ArchTests.ADR007_GraphIsolationTests.ControllersShouldNotReferenceGraphSdk|FullyQualifiedName=Spaarke.ArchTests.ADR007_GraphIsolationTests.EndpointsShouldNotReferenceGraphSdk|FullyQualifiedName=Spaarke.ArchTests.ADR009_CachingTests.MemoryCacheShouldNotBeSingleton|FullyQualifiedName=Spaarke.ArchTests.ADR009_CachingTests.NoHybridCachingLibraries|FullyQualifiedName=Spaarke.ArchTests.ADR013_AiBoundaryTests.CrudCodeMustNotDependOnAiInternalTypes" \
            --logger "trx;LogFileName=arch-must-not.trx" \
            --results-directory ./TestResults
        shell: bash

      - name: Upload arch test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tier1-arch-must-not-results
          path: ./TestResults/arch-must-not.trx
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Job 3 — changed-surface-smoke
  # Budget: 60-90s. Runs Spe.Integration.Tests filtered to namespaces matching
  # the changed src/ paths (per classify-tier1 derivation). No-op when BFF
  # was untouched OR no matching namespace was derived (per task 010 catalog,
  # Spe.Integration.Tests is the "stable signal" project — top-5 flaky tests
  # all live in Sprk.Bff.Api.Tests / Spaarke.Scheduling.Tests, which are NOT
  # in Tier 1).
  # --------------------------------------------------------------------------
  changed-surface-smoke:
    name: Changed-Surface Integration Smoke
    needs: classify-tier1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.bff_changed == 'true' && needs.classify-tier1.outputs.changed_namespaces != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-tier1-spe-${{ hashFiles('**/Directory.Packages.props', 'tests/integration/Spe.Integration.Tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-tier1-spe-
            ${{ runner.os }}-nuget-tier1-
            ${{ runner.os }}-nuget-

      - name: Restore Spe.Integration.Tests
        run: dotnet restore tests/integration/Spe.Integration.Tests/Spe.Integration.Tests.csproj --verbosity minimal

      - name: Build Spe.Integration.Tests (Debug)
        run: dotnet build tests/integration/Spe.Integration.Tests/Spe.Integration.Tests.csproj -c Debug --no-restore

      - name: Run changed-surface integration smoke
        # classify-tier1 emits a space-separated namespace list. Compose into
        # pipe-OR xUnit filter. Example:
        #   in : "Spe.Integration.Tests.Api.Ai Spe.Integration.Tests.SemanticSearch"
        #   out: "FullyQualifiedName~Spe.Integration.Tests.Api.Ai|FullyQualifiedName~Spe.Integration.Tests.SemanticSearch"
        env:
          NAMESPACES: ${{ needs.classify-tier1.outputs.changed_namespaces }}
        run: |
          set -euo pipefail
          FILTER=""
          for ns in $NAMESPACES; do
            if [ -z "$FILTER" ]; then
              FILTER="FullyQualifiedName~${ns}"
            else
              FILTER="${FILTER}|FullyQualifiedName~${ns}"
            fi
          done
          if [ -z "$FILTER" ]; then
            echo "::notice::No namespaces derived — smoke job no-op"
            exit 0
          fi
          echo "Using xUnit filter: $FILTER"
          dotnet test tests/integration/Spe.Integration.Tests/Spe.Integration.Tests.csproj \
            -c Debug \
            --no-build \
            --filter "$FILTER" \
            --logger "trx;LogFileName=changed-surface-smoke.trx" \
            --results-directory ./TestResults
        shell: bash

      - name: Upload changed-surface results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tier1-changed-surface-results
          path: ./TestResults/changed-surface-smoke.trx
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Job 4 — auth-smoke (conditional on auth-related diff)
  # Budget: <60s. Runs only when classify-tier1 detected a diff touching
  # Infrastructure/Auth/**, Infrastructure/Graph/**, or claims/authorization
  # handling. Exercises OBO + app-only Graph token paths via the existing
  # AuthorizationIntegrationTests fixture (ADR-028 Spaarke Auth v2 alignment)
  # plus the semantic-search authorization smoke.
  # --------------------------------------------------------------------------
  auth-smoke:
    name: Auth Smoke
    needs: classify-tier1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ needs.classify-tier1.outputs.auth == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-tier1-auth-${{ hashFiles('**/Directory.Packages.props', 'tests/integration/Spe.Integration.Tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-tier1-auth-
            ${{ runner.os }}-nuget-tier1-spe-
            ${{ runner.os }}-nuget-tier1-
            ${{ runner.os }}-nuget-

      - name: Restore Spe.Integration.Tests
        run: dotnet restore tests/integration/Spe.Integration.Tests/Spe.Integration.Tests.csproj --verbosity minimal

      - name: Build Spe.Integration.Tests (Debug)
        run: dotnet build tests/integration/Spe.Integration.Tests/Spe.Integration.Tests.csproj -c Debug --no-restore

      - name: Run auth smoke tests
        # AuthorizationIntegrationTests exercises 401/403 paths through the test
        # WebApplicationFactory; ADR-028 alignment covers OBO + app-only token
        # validation via Microsoft.IdentityModel JWT. SemanticSearchAuthorizationTests
        # adds the second auth-relevant integration class (privacy filter +
        # caller-claims propagation through SemanticSearch).
        # Add additional auth-relevant FQN fragments here if/when new auth
        # integration test classes land.
        run: |
          dotnet test tests/integration/Spe.Integration.Tests/Spe.Integration.Tests.csproj \
            -c Debug \
            --no-build \
            --filter "FullyQualifiedName~Spe.Integration.Tests.AuthorizationIntegrationTests|FullyQualifiedName~Spe.Integration.Tests.SemanticSearch.SemanticSearchAuthorizationTests" \
            --logger "trx;LogFileName=auth-smoke.trx" \
            --results-directory ./TestResults
        shell: bash

      - name: Upload auth smoke results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tier1-auth-smoke-results
          path: ./TestResults/auth-smoke.trx
          if-no-files-found: warn

  # ==========================================================================
  # PORTED GATES — moved here from sdap-ci.yml (ci/tier1-gate-port, 2026-08-27)
  # ==========================================================================
  # These four jobs are the blocking gates that existed ONLY in sdap-ci.yml.
  # They are the reason sdap-ci could not simply be deleted: the tiered
  # replacement had no equivalent, so retiring the monolith would have silently
  # dropped tenant-isolation, the eval gate, the Compose fidelity gate, and the
  # full two-pass test run.
  #
  # They are copied VERBATIM, deliberately. No path-gating, no runner change, no
  # consolidation of the duplicated setup steps. The point of this step is that
  # tier1 and sdap-ci reach the SAME verdict on the same commit; any edit made
  # while porting would make a disagreement ambiguous — porting bug, or real
  # difference? Optimisation (path-gating these, sharing the NuGet cache setup,
  # collapsing the four windows-latest runners) comes AFTER sdap-ci.yml is
  # deleted, not before.
  #
  # SHADOW PERIOD — while both workflows exist, every PR runs these gates TWICE
  # and PR CI time rises accordingly. That is the cost of a safe comparison and
  # it is temporary: deleting sdap-ci.yml (ci-cd-unit-test-remediation-r1 tasks
  # 071/075/077) removes the duplicate AND the ~30 min sdap-ci leg, landing well
  # below where this started.
  #
  # DO NOT delete sdap-ci.yml until these have agreed with their counterparts
  # across a few days of real PRs.
  # ==========================================================================

  build-test:
    name: Build & Test
    runs-on: windows-latest
    # 2026-07-10 (redesign-r2 audit F-5 completion): job-level continue-on-error
    # REMOVED. The 2026-06-24 "informational-only" posture predated the two-pass
    # classifier + reliability registry and silently swallowed the classifier's
    # verdict (a failed job still produced a green run — observed live on master
    # run 29126132011). The full solution is 0-failures as of ef5d098b4; genuine
    # timing flakes belong in tests/.reliability-registry.json, not in a
    # job-level swallow.
    strategy:
      # When one matrix configuration fails (e.g., a flaky timing test in
      # Release), the default fail-fast=true cancels the sibling Debug job
      # mid-flight. The cancelled Debug then shows COMPLETED/CANCELLED — and
      # because Debug is the only REQUIRED status check, the PR becomes
      # un-mergeable even though Debug would have passed on its own. We want
      # each matrix configuration to run to its own conclusion.
      fail-fast: false
      matrix:
        # 2026-06-24 — Release matrix entry temporarily removed due to high
        # CI-flake rate on shared runners (timing/scheduling tests). Debug-only
        # build still validates compilation + unit tests. Tracked under
        # projects/test-architecture-reset-r1/ for permanent resolution.
        # Restore Release here AFTER that audit lands a stable test suite.
        configuration: [Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for GitVersion and better diff analysis
          lfs: true  # smudge tests/fixtures/compose-corpus/*.docx — real bytes, not LFS pointers (else ~200 Compose corpus seam tests fail on pointer files; mirrors compose-fidelity-gate job)

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Setup .NET Framework targeting pack
        shell: pwsh
        run: |
          # Ensure .NET Framework 4.8 targeting pack is available for plugin projects
          if (!(Test-Path "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8")) {
            Write-Warning ".NET Framework 4.8 targeting pack not found. Plugin build may fail."
          }

      - name: Cache NuGet packages
        uses: actions/cache@v5
        continue-on-error: true  # Prevents Debug/Release matrix race on shared cache key from failing the job (PR #337 hit this 2026-06-03 — Release lost the cache-save race to concurrent Debug at 00:18:47)
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore --verbosity minimal

      - name: Build
        # WarningsAsErrors policy is centralized in Directory.Build.props
        # (TreatWarningsAsErrors=true + WarningsNotAsErrors=CS0109;CS0618;CS1998;CS8601;CS8604).
        # The previous CLI -warnaserror overrode WarningsNotAsErrors. See
        # docs/assessments/bff-warning-suppression-analysis-2026-06-01.md.
        run: dotnet build -c ${{ matrix.configuration }} --no-restore

      # ------------------------------------------------------------------
      # Two-pass test runner — see scripts/ci/classify-and-retry.ps1 + docs/
      # procedures/testing-and-code-quality.md.
      #
      # Pass 1 runs the full suite. The classifier reads the TRX and emits a
      # filter covering EVERY failure. Pass 2 re-runs those on a fresh
      # execution, and only a test that fails BOTH passes fails the build —
      # two consecutive failures on different runs is no longer noise.
      #
      # Changed 2026-08-26: the classifier used to fail the build immediately
      # for any failure absent from tests/.reliability-registry.json, calling it
      # "deterministic". Absence from an allowlist is not evidence of
      # determinism, and the inference was usually wrong — tests failed that way
      # on three separate runs and every one of them passes locally. It also
      # meant a single unregistered failure denied the registered ones their
      # retry. The registry is now reporting only; it does not gate the retry.
      # ------------------------------------------------------------------
      - name: Test with coverage (pass 1)
        id: test-pass-1
        continue-on-error: true   # let classifier decide; don't abort here on test failures
        shell: pwsh
        run: |
          # LogFilePrefix (NOT LogFileName): each test project writes its own
          # uniquely-named TRX. A fixed LogFileName made every project in the
          # solution OVERWRITE the same file, so the classifier only ever saw
          # the last project's results — failures in the other test projects
          # were invisible to CI (redesign-r2 e2e audit finding F-5, 2026-07-10).
          dotnet test -c ${{ matrix.configuration }} --no-build `
            --logger "trx;LogFilePrefix=pass1" `
            --results-directory ./TestResults/pass1 `
            --collect:"XPlat Code Coverage" --settings config/coverlet.runsettings

      - name: Classify pass-1 failures (decide on retry)
        id: classify
        shell: pwsh
        run: ./scripts/ci/classify-and-retry.ps1 -TrxDirectory ./TestResults/pass1

      - name: Retry pass-1 failures (pass 2)
        id: test-pass-2
        if: steps.classify.outputs.retry_needed == 'true'
        continue-on-error: true   # final verdict step decides; capture TRX either way
        shell: pwsh
        run: |
          # LogFilePrefix for the same reason as pass 1 (audit finding F-5).
          dotnet test -c ${{ matrix.configuration }} --no-build `
            --filter "${{ steps.classify.outputs.retry_filter }}" `
            --logger "trx;LogFilePrefix=pass2" `
            --results-directory ./TestResults/pass2

      - name: Final test verdict
        shell: pwsh
        run: |
          $retryRan = "${{ steps.classify.outputs.retry_needed }}" -eq "true"
          if (-not $retryRan) {
            # The classifier requests a retry for ANY pass-1 failure, so
            # retry_needed=false means pass 1 was clean (or produced no TRX,
            # which the classifier reports separately).
            Write-Host "Pass 1 clean — no retry was needed"
            exit 0
          }
          # Aggregate ALL pass-2 TRX files (one per test project under
          # LogFilePrefix naming — audit finding F-5).
          $trxFiles = @(Get-ChildItem -Path ./TestResults/pass2 -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue)
          if ($trxFiles.Count -eq 0) {
            Write-Host "::error::Retry pass 2 ran but no TRX files were produced — dotnet test likely crashed"
            exit 1
          }
          $nsUri = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"
          $stillFailing = @()
          $executedNames = New-Object System.Collections.Generic.List[string]
          $passed = 0
          foreach ($trx in $trxFiles) {
            $xml = [xml](Get-Content $trx.FullName -Raw)
            $nsm = New-Object System.Xml.XmlNamespaceManager $xml.NameTable
            $nsm.AddNamespace("x", $nsUri)
            $stillFailing += @($xml.SelectNodes("//x:UnitTestResult[@outcome='Failed']", $nsm))
            $passed += $xml.SelectNodes("//x:UnitTestResult[@outcome='Passed']", $nsm).Count
            foreach ($r in $xml.SelectNodes("//x:UnitTestResult", $nsm)) {
              $executedNames.Add($r.GetAttribute("testName")) | Out-Null
            }
          }
          if ($stillFailing.Count -gt 0) {
            Write-Host "::error::Retry pass failed: $($stillFailing.Count) test(s) still failing after a second attempt — treating as real regression"
            $stillFailing | ForEach-Object {
              Write-Host "  - $($_.GetAttribute('testName'))"
            }
            exit 1
          }

          # COVERAGE GUARD — "did not re-run" is not "passed".
          # A --filter term can silently match zero tests (renamed, deleted, or a
          # [Theory] whose DisplayName differs from its FullyQualifiedName). Without
          # this check a vanished test would turn a red build green, which is worse
          # than the false-accusation bug this two-pass design was rewritten to fix.
          $expected = "${{ steps.classify.outputs.retry_methods }}" -split ';' | Where-Object { $_ }
          $notReRun = @()
          foreach ($method in $expected) {
            $covered = $executedNames | Where-Object { $_ -eq $method -or $_.StartsWith("$method(") }
            if (-not $covered) { $notReRun += $method }
          }
          if ($notReRun.Count -gt 0) {
            Write-Host "::error::Retry pass is INCONCLUSIVE: $($notReRun.Count) test method(s) failed pass 1 but did not execute in pass 2. Not treating absence as success."
            $notReRun | ForEach-Object { Write-Host "  - $_" }
            Write-Host "Most likely the pass-2 --filter did not match: the test was renamed or deleted between runs, or its TRX testName differs from its FullyQualifiedName."
            exit 1
          }

          Write-Host "Retry pass clean: $passed test(s) retried, all $($expected.Count) failing method(s) re-executed and passed"

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.configuration }}
          path: ./TestResults/

      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-${{ matrix.configuration }}
          path: ./TestResults/**/coverage.cobertura.xml

  # ──────────────────────────────────────────────────────────────────────────
  # Golden-utterance eval gate (NFR-02, spaarke-ai-architecture-redesign-r1
  # task 026 / FR-P1-07) — MERGE-BLOCKING from P1 onward.
  #
  # Deliberately a SEPARATE job with NO continue-on-error: build-test carries
  # job-level `continue-on-error: true` (2026-06-24 informational posture),
  # which would swallow a failing eval step placed inside it — with branch
  # protection currently disabled on this repo, the workflow-run conclusion is
  # the only mechanical merge signal, and this job is what turns it red when
  # any Category=GoldenUtteranceEval test fails. When branch protection /
  # rulesets are re-enabled, mark "Eval Gate (Golden Utterances)" as a
  # REQUIRED status check. Activation plan + rationale:
  # tests/integration/contract/Eval/README.md.
  #
  # Families joined to this gate via the Category=GoldenUtteranceEval trait (no
  # YAML change needed to register a family — the trait IS the registration):
  #   • Golden-utterance suite + P2 loop/injection (r1 tasks 011/026/037)
  #   • D-F0(e) Resourcefulness family (r2 task 031 / FR-A1-02) —
  #     ResourcefulnessEvalSuiteTests: no_fabrication is asserted MECHANICALLY
  #     against the ADR-040 ledger ToolChain (ResourcefulnessFabricationOracle);
  #     the four family dimensions are LLM-judge-scored on the live eval-gate run.
  #   • Origin-classification family (r2 task 033 / FR-A1-04, Policy v2 E-1..E-6)
  #     — OriginClassificationEvalSuiteTests: hard-equality assertions against the
  #     real RequestOriginClassifier + ConfirmationPolicyEngine (deterministic
  #     production code, never an LLM judge).
  #   • ContextEnvelope budget-breach-fails-eval (r2 task 054 / FR-B-05) —
  #     ContextBudgetBreachEvalTests: a per-slice or envelope-ceiling breach is
  #     mechanically DETECTED (never silently truncated) against the real
  #     EnvelopeBudget checker.
  #   • Memory-write capture→recall family (r2 task 057 / FR-B-08 / FR-30) —
  #     MemoryWriteCaptureRecallEvalTests.
  #
  # spec FR-D-02 / NFR-02 (r2 spaarke-ai-architecture-redesign-r2 task 071):
  # ALL of the above families gate the merge — any single family red fails this
  # job. Memory-poisoning eval families are explicitly OUT OF SCOPE here —
  # DEFERRED to the separate memory-governance project per spec FR-B-10
  # (spaarke-ai-architecture-redesign-r2/spec.md item 38). Do NOT add a
  # memory-poisoning family to this trait/gate until that governance project
  # ships it.
  # ──────────────────────────────────────────────────────────────────────────
  eval-gate:
    name: Eval Gate (Golden Utterances)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        continue-on-error: true  # cache is an optimization, never a gate
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Golden-utterance eval gate (NFR-02 — merge-blocking)
        shell: pwsh
        run: dotnet test tests/unit/Sprk.Bff.Api.Tests/Sprk.Bff.Api.Tests.csproj -c Debug --filter "Category=GoldenUtteranceEval"


  # ──────────────────────────────────────────────────────────────────────────
  # customer-provisioning-orchestration-r1 task 088 (r1 task 064 gate wiring)
  # — Tenant-isolation invariants I1..I5 (FR-28..FR-32 + design.md §4D).
  # BLOCKING from day 1 (r1 task 065 audit sweep = 0 findings baseline).
  #
  # Deliberately a SEPARATE self-contained job (same rationale as eval-gate
  # + compose-fidelity-gate in this file): existing jobs carry
  # continue-on-error: true (2026-06-24 informational posture) which would
  # swallow a tenant-isolation red. This gate must NEVER be advisory —
  # cross-tenant leak is a security incident, not a warning.
  # ──────────────────────────────────────────────────────────────────────────
  tenant-isolation:
    name: Tenant Isolation (I1–I5 invariants)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        continue-on-error: true  # cache is an optimization, never a gate
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Tenant-isolation invariants (I1..I5 — merge-blocking)
        # Filter by namespace: all 5 files live in
        # Spaarke.ArchTests.TenantIsolation.* — this catches I1..I5 as a
        # cohesive set + auto-picks-up any new I{N}_* tests r1 adds in the
        # future without a workflow edit.
        shell: pwsh
        run: |
          dotnet test tests/Spaarke.ArchTests/Spaarke.ArchTests.csproj `
            -c Release `
            --filter "FullyQualifiedName~Spaarke.ArchTests.TenantIsolation" `
            --logger "trx;LogFileName=tenant-isolation-results.trx" `
            --results-directory ./TestResults

      - name: Upload tenant-isolation TRX
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tenant-isolation-results
          path: ./TestResults/tenant-isolation-results.trx
          if-no-files-found: warn


  # ──────────────────────────────────────────────────────────────────────────
  # Compose fidelity gate (FR-08, spaarkeai-compose-r6 tasks 060/061 +
  # ADR-049 R6 amendment point 3) — RELEASE-GATING.
  #
  # Runs the corpus round-trip fidelity harness
  # (tests/integration/seam/Compose/ComposeFidelityGateHarnessTests.cs):
  # every `.docx` under tests/fixtures/compose-corpus/ is driven through one
  # full render-on-save wire round trip (load → edit → save → reopen) and
  # classified pass/warn/fail. FAIL-class results fail their xUnit Theory —
  # that non-zero `dotnet test` exit IS the gate; no continue-on-error here
  # by design (an advisory gate would defeat spec FR-08).
  #
  # Deliberately a SEPARATE self-contained job (same rationale as eval-gate):
  # existing jobs are owned by ci-cd-unit-test-remediation-r1 and are not
  # modified. `lfs: true` on checkout pulls the Git-LFS `.docx` corpus bytes
  # (same mechanism as PR #690's build-test fix); a missing-LFS checkout
  # fails LOUDLY via ComposeCorpusFixtureLocator's PK-signature guard — it
  # can never silently skip the gate. The per-document breakdown
  # (fidelity-gate-result.json, written next to the test assembly by the
  # harness's result sink) is uploaded as an artifact even on red.
  # ──────────────────────────────────────────────────────────────────────────
  compose-fidelity-gate:
    name: Compose Fidelity Gate (Corpus Round-Trip)
    runs-on: windows-latest
    steps:
      - name: Checkout (with Git-LFS corpus fixtures)
        uses: actions/checkout@v6
        with:
          lfs: true  # smudge tests/fixtures/compose-corpus/*.docx — real bytes, not LFS pointers

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        continue-on-error: true  # cache is an optimization, never a gate
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Fidelity gate (corpus round-trip — merge-blocking)
        shell: pwsh
        run: dotnet test tests/unit/Sprk.Bff.Api.Tests/Sprk.Bff.Api.Tests.csproj -c Debug --filter "FullyQualifiedName~FidelityGate"

      - name: Upload fidelity-gate-result.json (per-document breakdown)
        uses: actions/upload-artifact@v6
        if: always()   # the breakdown matters MOST when the gate is red
        with:
          name: fidelity-gate-result
          path: tests/unit/Sprk.Bff.Api.Tests/bin/**/fidelity-gate-result.json
          if-no-files-found: warn  # absent only if the run crashed pre-sink; the test step is already red then
