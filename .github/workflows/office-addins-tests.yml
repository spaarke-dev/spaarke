# ============================================================================
# Office Add-ins Tests (Gate)
# ============================================================================
# spaarkeai-word-add-in-r1 · task 043
#
# WHY THIS EXISTS
# ---------------
# The `src/client/office-addins` jest suite already ran in CI before this file
# — `.github/workflows/client-tests.yml` auto-discovers every package with a
# real jest `test` script, and this package has one. But that workflow triggers
# on `schedule` + `workflow_dispatch` ONLY, and every matrix leg is
# `continue-on-error: true`. So the suite ran NIGHTLY and could never fail a
# pull request. A break was recorded the next morning, on master, by which time
# it had already merged.
#
# What that left unprotected, concretely: the guards on the `.docx` binary save
# path (the 2026-09-03 UAT defect was `body.getOoxml()` returning flat OOXML
# text where a zip container was required — SPE could not preview it and Word
# could not open it), and the `useAnnounce` accessibility regression tests.
# A PR reverting either would have merged green.
#
# 🔴 WHAT THIS FILE DOES AND DOES NOT DO (corrected 2026-09-10 by adr-check)
# --------------------------------------------------------------------------
# It REPORTS a real pass/fail on every PR touching this package. It does NOT
# block a merge, and earlier revisions of this header wrongly said it did.
#
# Master's ruleset (21824191) requires exactly ONE status check, by name:
#
#     gh api repos/spaarke-dev/spaarke/rules/branches/master
#     -> required_status_checks: [ "Router" ]
#
# GitHub rulesets have no "require all checks" concept — only that named list.
# This workflow is not in it, so a red here renders a red X and the PR can
# still merge. `on: pull_request` plus no `continue-on-error` makes a check
# that CAN REPORT FAILURE; it does not make a check that BLOCKS. Those are not
# the same claim, and conflating them is FAILURE-MODES AP-12 (prose outliving
# the mechanism it describes).
#
# PROMOTION IS NOT A SETTINGS FLIP. Adding a PATH-FILTERED workflow to the
# required list deadlocks: on any PR outside its paths the check is "expected
# but never reported" and blocks forever — observed on PR #322, and the reason
# `workflows-validate.yml` and the router both classify paths INSIDE the job
# rather than in `on:`. Promotion therefore needs BOTH:
#   1. path classification hoisted into the job so the check always reports, and
#   2. N consecutive green runs ON `ubuntu-latest`.
#
# (2) is a settled repo standard, stated independently in three places: this
# package's originating filing (`record-header-and-notepad-r2/notes/
# ci-gap-client-jest-never-runs.md` §4), `client-tests.yml`'s promotion header,
# and `sdap-ci.yml`'s `compose-client-gate`, which landed advisory for exactly
# this reason — "a blocking gate whose first red is an environment artifact
# gets ignored, then disabled, and the surface silently reverts to having no
# gate." This gate's evidence at landing was five green runs, ALL on a local
# Windows box and NONE on `ubuntu-latest`.
#
# What the shadow window does and does not gate, since these were conflated:
# it gates DELETING `sdap-ci.yml` (task 077). It does not gate HAVING a gate.
# Adding this file now is correct; calling it blocking was not.
#
# THIS FILE IS THE GATE. `client-tests.yml` REMAINS THE BASELINE.
# ---------------------------------------------------------------
# The two are complements and neither replaces the other:
#
#   client-tests.yml   40 packages · nightly · advisory · reports everything
#   this file           1 package  · per-PR  · REPORTS  · reports one subset
#
# `client-tests.yml` was NOT extended to do this job, deliberately. Its own
# header states the reason it has no `pull_request` trigger — 40 packages with
# no npm workspace root means 40 independent `npm install`s, and hanging that
# off every PR contends for runners with the CI shadow window — and it states
# its promotion path: into Tier 2 as a real gate, only AFTER the shadow window
# closes AND the baseline is green. Neither precondition holds today. Adding a
# `pull_request` trigger there would have fired all 40 packages on every PR;
# making its legs conditionally blocking would have falsified the "advisory by
# construction" invariant its header rests on. Either change turns a 40-package
# observation report into something else. One package's gate does not get to do
# that to the other 39.
#
# NOR IS THIS IN THE TIER WORKFLOWS. `ci-router.yml`, `ci-tier1-blocking.yml`
# and `ci-tier2-advisory.yml` are FROZEN under the shadow-comparison window
# (opened 2026-08-27), which additionally holds an unresolved measurement latch
# awaiting an operator decision. Editing any of them restarts the cutover clock.
# `client-tests.yml`'s header separately says "do not add it to
# ci-tier1-blocking.yml or ci-tier2-advisory.yml". `sdap-ci.yml` is the legacy
# system pending retirement and is not somewhere to add new work.
#
# That leaves a standalone path-filtered gate — which is an established repo
# pattern, not an invention: `css-reset-gate.yml` is the same shape (one
# regression class, `pull_request` + `push: master`, path-filtered, standalone,
# outside the tiers). This file follows it deliberately.
#
# IT GATED A SUBSET — AND THE SUBSET IS NOW THE WHOLE PACKAGE
# -----------------------------------------------------------
# ⚠️ Corrected by task 069 (2026-09-28). This section read "12 of 22 suites green
# (164 of 380 tests) as of 2026-09-10", which has been stale since task 071
# repaired the ten red suites. The gate now covers **56 of the package's 56
# suites** — verified at commit 949bfa123 (run 36162453924: "jest ran 56 suite(s),
# manifest declares 56"). The ratchet in `ci-gated-suites.txt` reached the top.
#
# The original reasoning is kept because it is why the ratchet existed and why it
# must not be replaced with a blanket `npm test`: gating the full suite on day one
# would have been red from the moment it landed, and "a check that is always red is
# a check everyone learns to ignore, which is worse than no check". The list is now
# complete, but it stays an explicit list — that is what makes a deletion or rename
# fail loudly (the manifest step) instead of silently shrinking coverage.
#
# No test was deleted, skipped, or modified to reach 56. All of them also run
# nightly in `client-tests.yml`, which remains the promotion signal for this list.
#
# The manifest step fails if a gated path no longer exists, so a gated test
# cannot be renamed away or deleted to turn the gate green.
# ============================================================================

name: Office Add-ins Tests (Gate)

on:
  pull_request:
    paths:
      # Path pair copied from deploy-office-addins.yml: the add-ins consume
      # @spaarke/auth as a `file:` dependency and build it from source, so a
      # change there changes what ships.
      - 'src/client/office-addins/**'
      - 'src/client/shared/Spaarke.Auth/**'
      # Third path, which the deploy workflow does NOT carry (reported as a
      # separate finding in notes/043): jest.config.js AND webpack.config.js
      # both map `@spaarke/communication-components/logic/connections/provenance`
      # straight at this one file, and `communicationSuggestionsService.ts`
      # imports it. It is a leaf module with no imports of its own, so the exact
      # file is the precise filter — nothing else in that package reaches here.
      - 'src/client/shared/Spaarke.Communication.Components/src/logic/connections/provenance.ts'
      # (ci-gated-suites.txt needs no entry — 'src/client/office-addins/**' covers it.)
      - '.github/workflows/office-addins-tests.yml'
      # ── SERVER PATHS, added by task 070 ────────────────────────────────────
      # The `server-tests` job below runs C# suites that cover this surface. Without
      # these entries a BFF-only PR would change the code under test and this
      # workflow would not fire — the tests would exist, be selected, and never run.
      # Scoped to the Office/Documents surface this project owns rather than all of
      # `src/server/**`: this workflow must not quietly become a repo-wide BFF gate.
      - 'src/server/api/Sprk.Bff.Api/Api/Office/**'
      - 'src/server/api/Sprk.Bff.Api/Services/Office/**'
      - 'src/server/api/Sprk.Bff.Api/Workers/Office/**'
      - 'src/server/api/Sprk.Bff.Api/Services/Documents/**'
      # The suites themselves, and the project that compiles them.
      - 'tests/unit/Sprk.Bff.Api.Tests/**'
      - 'tests/unit/domain/**'
      - 'tests/integration/contract/Api/**'
      - 'tests/integration/data-mutation/**'
      - 'tests/integration/regression/**'
      - 'tests/integration/seam/Office/**'
      - 'tests/integration/auth/UnifiedAccessControl/**'
      # ⚠️ KNOWN COST, accepted deliberately: `on:`-level paths fire the WHOLE
      # workflow, so a server-only PR also runs the jest and typecheck jobs (~3-5 min
      # each of npm work that cannot fail for a server change). Under-triggering
      # loses regressions; over-triggering loses a few runner-minutes, so this is the
      # right side to err on. The fix is job-level path classification, which is
      # ALREADY a prerequisite for promoting this workflow to a required check
      # (see the header, and PR #322's deadlock) — do it there, once, rather than
      # building a second mechanism here now.
  push:
    branches:
      - master
    paths:
      - 'src/client/office-addins/**'
      - 'src/client/shared/Spaarke.Auth/**'
      - 'src/client/shared/Spaarke.Communication.Components/src/logic/connections/provenance.ts'
      - '.github/workflows/office-addins-tests.yml'
      # Mirrors the pull_request server paths above (task 070) so a direct push to
      # master over the same surface is covered identically. Keep the two lists in
      # step — a path present in one and not the other is a silent coverage hole.
      - 'src/server/api/Sprk.Bff.Api/Api/Office/**'
      - 'src/server/api/Sprk.Bff.Api/Services/Office/**'
      - 'src/server/api/Sprk.Bff.Api/Workers/Office/**'
      - 'src/server/api/Sprk.Bff.Api/Services/Documents/**'
      - 'tests/unit/Sprk.Bff.Api.Tests/**'
      - 'tests/unit/domain/**'
      - 'tests/integration/contract/Api/**'
      - 'tests/integration/data-mutation/**'
      - 'tests/integration/regression/**'
      - 'tests/integration/seam/Office/**'
      - 'tests/integration/auth/UnifiedAccessControl/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-addins-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gated-jest:
    name: Gated jest suites (office-addins)
    runs-on: ubuntu-latest
    # The gated set runs in ~16s on a cold from-scratch tree. 15 minutes is a
    # hang guard, not a budget.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node 20 matches client-tests.yml, the nightly baseline this gate is
          # a scoped promotion of. Same Node in both places means the gate and
          # the baseline can never disagree about a suite for toolchain reasons.
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/client/office-addins/package-lock.json

      - name: Install dependencies
        working-directory: src/client/office-addins
        # NOT `npm ci` (root CLAUDE.md §12). A bare `npm install` also fails
        # here with ERESOLVE: @testing-library/react@14 peer-requires React 18
        # while this package is on React 19.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # No build step, and that is not an oversight. jest.config.js maps
      # `@spaarke/auth` to the sibling package's TypeScript SOURCE (ts-jest
      # transforms it) precisely to sidestep the ESM/CJS mismatch in its
      # compiled `dist/`, so the tests do not need @spaarke/auth built — unlike
      # deploy-office-addins.yml, whose webpack build does. Verified on a
      # from-scratch install with no `dist/` anywhere: 164/164.

      - name: Resolve gated suite manifest
        id: manifest
        working-directory: src/client/office-addins
        shell: bash
        run: |
          set -euo pipefail
          manifest='ci-gated-suites.txt'

          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest is missing. The gate cannot decide what to run, and a gate that silently runs nothing is the false green this workflow exists to prevent."
            exit 1
          fi

          # ── TRAILING-NEWLINE CHECK (task 069) ─────────────────────────────────
          # `while read` DROPS a final line that has no terminating newline, without
          # a word of complaint, silently shrinking the gate. The suite-count
          # assertion downstream (:~270) does NOT catch this and never could: both
          # sides of that comparison derive from this same array, so a dropped line
          # shrinks GATED_COUNT and the number of suites jest runs *equally* and the
          # equality still holds. This is the only place the hole can be closed.
          #
          # Not hypothetical housekeeping: the manifest's last line is a REAL ENTRY
          # (`shared/taskpane/hooks/__tests__/useSaveFlow.test.ts`), not a trailing
          # comment, so a stripped newline silently ungates a live suite.
          if [ -n "$(tail -c 1 "$manifest")" ]; then
            echo "::error file=src/client/office-addins/ci-gated-suites.txt::$manifest does not end with a newline. \`while read\` would silently drop its final entry and shrink the gate. Add a trailing newline."
            exit 1
          fi

          suites=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(printf '%s' "$line" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -n "$line" ] || continue
            suites+=("$line")
          done < "$manifest"

          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error file=src/client/office-addins/ci-gated-suites.txt::No gated suites listed. Failing loudly rather than reporting a vacuous green."
            exit 1
          fi

          # A gated suite that no longer exists is either a rename that forgot
          # to update this list, or a deletion that would have quietly shrunk
          # the gate. Both are failures, not warnings.
          missing=0
          for s in "${suites[@]}"; do
            if [ ! -f "$s" ]; then
              echo "::error file=src/client/office-addins/ci-gated-suites.txt::Gated suite '$s' does not exist. If it was renamed, update ci-gated-suites.txt in this PR. If it was deleted, this gate requires a same-PR replacement."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          printf '%s\n' "${suites[@]}" > "$RUNNER_TEMP/gated-suites.txt"
          echo "count=${#suites[@]}" >> "$GITHUB_OUTPUT"
          echo "Gated suites (${#suites[@]}):"
          printf '  %s\n' "${suites[@]}"

      - name: Run gated jest suites
        working-directory: src/client/office-addins
        shell: bash
        # `npm test --` rather than `npx jest`, so the gate goes through the
        # package's own declared entry point — the same one client-tests.yml
        # invokes. If that script changes, both move together.
        env:
          GATED_COUNT: ${{ steps.manifest.outputs.count }}
        run: |
          set -euo pipefail
          mapfile -t suites < "$RUNNER_TEMP/gated-suites.txt"
          npm test -- --ci --reporters=default --passWithNoTests=false \
            --json --outputFile "$RUNNER_TEMP/jest-result.json" \
            --runTestsByPath "${suites[@]}"

          # ── THE NO-VACUOUS-GREEN ASSERTION (added 2026-09-10 by code-review W-2/W-3)
          # The manifest step proves every gated path EXISTS. It does not prove jest
          # RAN it, and jest does not complain when it doesn't: passing a real file
          # that jest does not treat as a test is silently ignored and the run still
          # exits 0. Reproduced —
          #     npx jest --runTestsByPath <a real test> jest.setup.js
          #     -> "Test Suites: 1 passed, 1 total"   EXIT 0
          #
          # That WAS live here: jest.config.js used to set `roots: ['<rootDir>/shared']`
          # alone, so promoting a suite under word/ or outlook/ — exactly the coverage
          # gap notes/043 F-5 flags — gave a file that exists, a manifest check that
          # passes, and a gate reporting green over a suite jest never ran.
          # ⚠️ Updated by task 069 (2026-09-28): `roots` is now
          # `['<rootDir>/shared', '<rootDir>/word', '<rootDir>/outlook']`
          # (jest.config.js:12), so `word/commands/__tests__/commands.test.ts` IS
          # reachable and the gate genuinely covers all 56 of its 56 entries. The
          # assertion stays regardless — `roots` can narrow again, and it is the only
          # thing that would notice.
          #
          # ⚠️ IT DOES **NOT** CLOSE THE TRAILING-NEWLINE HOLE. This comment used to
          # claim it did (corrected by task 069, 2026-09-28). It cannot: both sides of
          # the comparison below derive from the SAME `while read` array, so a dropped
          # final line shrinks GATED_COUNT and the suites jest runs equally, and the
          # equality still passes. That hole is now closed for real, at its only
          # possible site — the explicit `tail -c 1` check in the manifest step above.
          #
          # Asserting that jest ran exactly as many suites as the manifest declared
          # makes "no vacuous green" true BY CONSTRUCTION rather than by argument.
          ACTUAL="$(node -e 'process.stdout.write(String(require(process.argv[1]).numTotalTestSuites))' "$RUNNER_TEMP/jest-result.json")"
          if [ "$ACTUAL" != "$GATED_COUNT" ]; then
            echo "::error file=src/client/office-addins/ci-gated-suites.txt::Vacuous green: the manifest declares $GATED_COUNT gated suite(s) but jest ran $ACTUAL. A gated path exists but jest did not treat it as a test — most likely it is outside jest.config.js \`roots\` (currently '<rootDir>/shared'), or excluded by testMatch/testPathIgnorePatterns. The gate is NOT covering what it claims."
            exit 1
          fi
          echo "Suite-count assertion OK: jest ran $ACTUAL suite(s), manifest declares $GATED_COUNT."

      - name: Summary
        if: always()
        shell: bash
        env:
          GATED_COUNT: ${{ steps.manifest.outputs.count }}
        run: |
          set -euo pipefail
          {
            echo "# Office Add-ins gated jest suites"
            echo
            echo "**This job DOES fail the workflow run** when a gated suite fails. It does"
            echo "NOT block a merge — master's ruleset requires exactly one named check,"
            echo "\`Router\`, and this workflow is not in it. Two different claims; see the"
            echo "file header. Merge-blocking is an owner ruleset action."
            echo
            echo "${GATED_COUNT:-0} suite(s) gated."
            echo
            echo "The ungated suites are not skipped — they run nightly, unchanged, in"
            echo "client-tests.yml. When the nightly baseline shows one of them green, add"
            echo "it to src/client/office-addins/ci-gated-suites.txt in the PR that fixed"
            echo "it. The list only grows."
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # Production typecheck (task 056 · GitHub #996 / ISS-004)
  # ============================================================================
  # WHY THIS EXISTS
  # ---------------
  # FR-18's acceptance was "`npm run typecheck` is clean; CI gates it going
  # forward." The first half was narrowed to a deliberate accept; the second half
  # was never built. Verified 2026-09-19: NO workflow typechecked this package —
  # every `typecheck` hit in .github/workflows/ belonged to another package in
  # sdap-ci.yml.
  #
  # That left the accept's own safety property unenforced. The 2026-09-09 decision
  # to live with ~111 test-file errors rests on "production is at 0, so new
  # production errors stand out". Nothing looked: `npm run build` is webpack and
  # test files are not in its graph, and ts-jest runs `isolatedModules`, which is
  # transpile-only and type-checks nothing.
  #
  # 🔴 WHY THIS STEP MUST NOT TRUST THE EXIT CODE
  # ---------------------------------------------
  # `npm run typecheck` exits **2** on this tree today, on accepted debt. A step
  # that simply let a non-zero exit fail the job would be red on EVERY PR from the
  # moment it landed — and this file already records what happens then (:92-100):
  # "a check that is always red is a check everyone learns to ignore, which is
  # worse than no check." So the decision is made from the PRODUCTION error count,
  # never from the exit status. The step therefore runs under an EXPLICIT `set +e`
  # — not merely "without `set -e`", which is what this comment used to say and is
  # what broke it: `shell: bash` injects `-e` into the interpreter, so errexit is
  # ON unless actively turned off. See the step body for the full account.
  #
  # Measured at 23fd17991 — total 111 error lines, production 0, across 9 files.
  # Both directions were verified by seeding, not by argument:
  #   seed a production error -> production_count 1  (detected)
  #   seed a test-file error  -> production_count 0  (correctly ignored)
  #
  # REPORTS, DOES NOT BLOCK — same as `gated-jest` above, and for the same reason:
  # master's ruleset requires exactly one named check, `Router`, and this workflow
  # is not in it. Promotion needs BOTH path classification hoisted into the job
  # AND N consecutive green runs on ubuntu-latest (see :39-54).
  # ============================================================================
  typecheck:
    name: Production typecheck (office-addins)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node 20, matching gated-jest above and client-tests.yml, so the gate
          # and the nightly baseline can never disagree for toolchain reasons.
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/client/office-addins/package-lock.json

      # `@spaarke/auth` MUST be built before tsc runs. It is a
      # `file:../shared/Spaarke.Auth` dependency whose package.json points `types`
      # at `dist/`, and `dist/` is gitignored (Spaarke.Auth/.gitignore:5). On a
      # developer machine it exists from an earlier build, so this is invisible
      # locally; on a fresh CI checkout `npm install` links a package with no
      # built output and tsc reports
      #   shared/services/AuthService.ts(2,71): error TS2307:
      #     Cannot find module '@spaarke/auth' or its corresponding type declarations.
      #
      # This step's previous comment claimed no build was needed because "tsconfig
      # paths resolve it from source, same as jest.config.js does". That was FALSE
      # and is the second defect this gate hid: jest.config.js:48 DOES map
      # `^@spaarke/auth$` to `../shared/Spaarke.Auth/src/index.ts`, but tsconfig.json
      # maps only @shared/*, @outlook/*, @word/* and one deep
      # @spaarke/communication-components path — never @spaarke/auth. The two
      # configs were assumed to agree and do not, which is why `gated-jest` passes
      # while this job failed. It surfaced only once the errexit defect below was
      # fixed and the classifier could finally run.
      #
      # Mirrors deploy-office-addins.yml:47-51, the established pattern. Must stay
      # AHEAD of the add-in install: npm resolves the file: link at install time.
      - name: "Build @spaarke/auth (file: dependency — dist/ is gitignored)"
        working-directory: src/client/shared/Spaarke.Auth
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Install dependencies
        working-directory: src/client/office-addins
        # NOT `npm ci` (root CLAUDE.md §12); a bare `npm install` also fails here
        # with ERESOLVE (@testing-library/react@14 peer-requires React 18, this
        # package is on React 19).
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck — fail on PRODUCTION errors only
        working-directory: src/client/office-addins
        shell: bash
        env:
          # ── PINNED ACCEPTED TEST-FILE DEBT (task 069, 2026-09-28) ──────────────
          # The owner-approved 2026-09-09 accept is "production stays at 0, test-file
          # debt is tolerated". Until this pin existed, the total was PRINTED and
          # never CHECKED, so 74 -> 75 passed silently and new debt accrued invisibly
          # behind a green check — FAILURE-MODES AP-12 in its live form.
          #
          # MEASURED, NOT COPIED. 74 is the figure CI itself reported at commit
          # 949bfa123 (run 36162453924: "0 production error(s); 74 total line(s)").
          # A number lifted from a document instead of measured at the moment of
          # pinning is the stale-baseline error root CLAUDE.md §10 records for publish
          # size, where a three-week-old figure led a project to overstate its own
          # contribution 46×. This task's own POML carried 111 — already stale by 37
          # lines after task 071 repaired the red suites. Pin the CI number, never the
          # local one (they disagreed: 80 local vs 74 CI at the same commit), because
          # CI is what enforces it.
          #
          # ── HOW TO RE-BASELINE (a deliberate edit, never a silent drift) ───────
          # An INCREASE needs a reason. Order matters:
          #   1. Confirm `prod` is still 0 — this pin never licenses production debt.
          #   2. Read the new total from THIS job's own output on the PR that moved it.
          #   3. Edit the number here, in the same PR, with the reason in the PR body.
          # A DECREASE is the good direction and still requires the edit — the check
          # is an equality, so paying debt down turns the job red until you lower the
          # pin. That is deliberate: it stops a hard-won reduction from being silently
          # spent again later.
          # 74 -> 68 by task 072 (2026-09-28). RE-BASELINED DOWNWARD, per the procedure above.
          # Task 072 pointed `npm run lint` at the real source directories for the first time
          # and cleared the 32-violation backlog; six of those were unused imports/locals that
          # `tsc --noEmit` ALSO counts under `noUnusedLocals`, so the accepted debt fell by six.
          # Production errors remain 0.
          #
          # This is the pin behaving exactly as designed rather than an inconvenience: because
          # it is an equality and not a ceiling, CI refused the reduction until it was written
          # down here, which is what stops a hard-won decrease from being silently spent again
          # later. Measured at this commit, not copied.
          ACCEPTED_TEST_DEBT_LINES: '68'
        run: |
          # 🔴 `set +e` IS LOAD-BEARING — DO NOT REMOVE IT.
          #
          # `shell: bash` does NOT give a bare bash. GitHub Actions expands it to
          #   /usr/bin/bash --noprofile --norc -e -o pipefail {0}
          # so errexit is injected into the interpreter itself. Omitting `set -e`
          # here is not the same as not having it — this step ran for one real CI
          # cycle believing otherwise (run 35468805634, and again 35550824422):
          # `npm run typecheck` exits 2 on the accepted debt, `-e` killed the step
          # on that line ~7s in, and the classifier, the no-vacuous-green guard and
          # the summary below never executed. The gate built specifically so it
          # would never trust the exit code was killed by the exit code.
          #
          # `set +e` turns errexit back off, exactly where the note below claims it
          # is off. `-u` and `-o pipefail` are kept deliberately.
          #
          # NOTE: no errexit. tsc exits 2 on the accepted test-file debt; that is
          # expected and must not fail the job. See the header block above.
          set +e
          set -uo pipefail

          npm run typecheck > "$RUNNER_TEMP/tsc.txt" 2>&1
          tsc_exit=$?

          total=$(grep -c 'error TS' "$RUNNER_TEMP/tsc.txt" || true)
          grep 'error TS' "$RUNNER_TEMP/tsc.txt" \
            | grep -vE '__tests__|\.test\.|\.spec\.|__mocks__' \
            > "$RUNNER_TEMP/tsc-prod.txt" || true
          prod=$(grep -c '' "$RUNNER_TEMP/tsc-prod.txt" || true)

          # ── NO-VACUOUS-GREEN GUARD ────────────────────────────────────────────
          # A production count of 0 is only meaningful if tsc actually RAN. If the
          # script is missing, the install is broken, or tsc dies before emitting
          # diagnostics, we get exit != 0 with ZERO "error TS" lines — which would
          # otherwise read as a clean pass. Fail loudly instead.
          if [ "$tsc_exit" -ne 0 ] && [ "$total" -eq 0 ]; then
            echo "::error file=src/client/office-addins/package.json::typecheck exited $tsc_exit but emitted no 'error TS' diagnostics. tsc did not run to completion — this is a broken gate, not a clean tree."
            sed -n '1,40p' "$RUNNER_TEMP/tsc.txt"
            exit 1
          fi

          {
            echo "# office-addins typecheck"
            echo
            echo "| | Count |"
            echo "|---|---|"
            echo "| **Production errors** | **${prod}** |"
            echo "| Test-file errors (accepted debt) | $((total - prod)) / pinned ${ACCEPTED_TEST_DEBT_LINES} |"
            echo "| Total \`error TS\` lines | ${total} |"
            echo
            echo "Production errors fail this job. Test-file errors are the owner-approved"
            echo "2026-09-09 accept — tolerated, but PINNED, so drift in either direction"
            echo "fails too (task 069)."
            echo
            echo "**This job DOES fail the workflow run.** It does NOT block a merge:"
            echo "master's ruleset requires exactly one named check, \`Router\`, and this"
            echo "workflow is not in it. Those are two different claims — see the file"
            echo "header. Making a red here merge-blocking is an owner ruleset action."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$prod" -gt 0 ]; then
            echo "::error::${prod} PRODUCTION TypeScript error(s) in src/client/office-addins. The accepted debt is test-file only; production must stay at 0."
            cat "$RUNNER_TEMP/tsc-prod.txt"
            exit 1
          fi

          # ── THE DEBT PIN ASSERTION (task 069) ─────────────────────────────────
          # Runs AFTER the production check so a production error is always the first
          # thing reported. Equality, not a ceiling: drift in either direction is a
          # deliberate edit. See the step's `env:` block for the re-baseline procedure.
          debt=$((total - prod))
          if [ "$debt" -ne "$ACCEPTED_TEST_DEBT_LINES" ]; then
            if [ "$debt" -gt "$ACCEPTED_TEST_DEBT_LINES" ]; then
              echo "::error file=.github/workflows/office-addins-tests.yml::Accepted test-file debt ROSE: ${debt} line(s) vs the pinned ${ACCEPTED_TEST_DEBT_LINES}. New test-file type debt is accruing behind a green check. Fix the new errors, or re-baseline ACCEPTED_TEST_DEBT_LINES in this PR with the reason in the PR body."
            else
              echo "::error file=.github/workflows/office-addins-tests.yml::Accepted test-file debt FELL: ${debt} line(s) vs the pinned ${ACCEPTED_TEST_DEBT_LINES}. This is the good direction — lower ACCEPTED_TEST_DEBT_LINES to ${debt} in this PR so the reduction is locked in and cannot be silently spent again."
            fi
            echo "Test-file error lines currently counted:"
            grep 'error TS' "$RUNNER_TEMP/tsc.txt" | grep -E '__tests__|\.test\.|\.spec\.|__mocks__' || true
            exit 1
          fi

          echo "Production typecheck clean: 0 production error(s); ${total} total line(s), of which ${debt} are accepted test-file debt (pinned at ${ACCEPTED_TEST_DEBT_LINES})."

  # ============================================================================
  # Server-side C# suites (task 070 - Fable review 2026-09-21 section 1)
  # ============================================================================
  # WHY THIS EXISTS
  # ---------------
  # This project added 46 C# test files and NO COMPLETING PR-TIME JOB RAN THEM.
  #
  #   - `ci-tier1-blocking.yml` runs `Sprk.Bff.Api.Tests` only with
  #     `Category=GoldenUtteranceEval` / `FidelityGate`. None of these tests carry
  #     either category, so Tier 1 runs none of them.
  #   - `ci-tier2-advisory.yml` is `continue-on-error: true` with a 30-minute cap.
  #     Its test step was CANCELLED in 6 of 6 recent runs on this branch and its
  #     verdict step never executed. Measured cause: the equivalent `sdap-ci.yml`
  #     "Build & Test" job takes 23-34 minutes (runs 36434557427 = 32.6 min,
  #     36431157503 = 34.4 min, 36162831641 = 22.8 min), so a 30-minute cap sits
  #     below the real cost of the whole assembly. The cap is not the defect - the
  #     SCOPE is.
  #   - The only runner that completes is legacy `sdap-ci.yml`, and another
  #     project's task 077 deletes it. It still exists as of 2026-09-28, so the gap
  #     is PROSPECTIVE, not yet live. That is the honest framing.
  #
  # After that deletion the `POST /api/office/save` contract tests this project
  # un-skipped as a deliverable, and NFR-02's 11-test per-row authorization suite
  # (`VisualizationRowAuthorizationContractTests`), would run on NO PR check.
  #
  # WHY IT LIVES HERE AND NOT IN TIER 1
  # -----------------------------------
  # Tier 1 is the natural home and is FROZEN under the shadow-comparison window -
  # confirmed still open 2026-09-28 by `scripts/ci/shadow-window-status.ps1`:
  # "Do NOT edit ci-router.yml / ci-tier1-blocking.yml / ci-tier2-advisory.yml".
  # This workflow is the only writable surface that runs on a PR.
  #
  # WHEN THE WINDOW CLOSES, MIGRATE THIS JOB INTO TIER 1 AND DELETE IT HERE.
  # Leaving it in both places is duplication, not defence in depth.
  #
  # SELECTION MECHANISM: an explicit namespace-prefix filter (in the step below)
  # ---------------------------------------------------------------------------
  # Chosen over the two options the task anticipated, both worse:
  #   - run the whole assembly: 12,359 tests, 23-34 min - the very timeout
  #     behaviour being fixed;
  #   - add `[Trait("Category", ...)]` to 46 test files: scope creep, and it makes
  #     inclusion depend on an attribute a new file can silently omit.
  # The namespaces are ALREADY organised by feature area, so prefix selection needs
  # no change to any test file.
  #
  # HOW A NEW SUITE GETS PICKED UP: a new test class in any listed namespace is
  # included AUTOMATICALLY, no edit here. A test in a NEW namespace is not, and that
  # omission shows up as one missing line in the filter. Measured at 2026-09-28:
  # 1,708 tests selected; 1,752 passed / 0 failed / 24 skipped in 3 m 44 s locally.
  #
  # NOT COVERED, deliberately, because they are DIFFERENT ASSEMBLIES: this project
  # also touched `tests/Spaarke.ArchTests/**` (2 files) and
  # `tests/integration/Spe.Integration.Tests/**` (1 file). ArchTests already run in
  # Tier 1 AND in `sdap-ci.yml`, so they are covered elsewhere; Spe.Integration.Tests
  # is a separate project this job does not build. Both are named in
  # `notes/070-pr-time-runner.md` rather than silently omitted.
  # ============================================================================
  server-tests:
    name: Server tests (office scope)
    runs-on: ubuntu-latest
    # Local wall-clock for the filtered set is 3 m 44 s; CI adds restore + build.
    # 20 minutes is a hang guard with roughly 2x margin, NOT a budget to grow into.
    # If this job approaches the cap, NARROW THE FILTER - do not raise the cap.
    # Raising it is how Tier 2 ended up cancelled in 6 of 6 runs.
    timeout-minutes: 20
    env:
      # -- VACUOUS-GREEN FLOOR ------------------------------------------------
      # `sdap-ci.yml:246` already records the hazard this guards: "A --filter term
      # can silently match zero tests (renamed, deleted, ...)". A filter that
      # selects NOTHING exits 0 and reports a green check - the same false green as
      # a gate that runs no suites. Rename one namespace in the filter and, without
      # this floor, coverage silently collapses behind a passing check.
      #
      # A FLOOR, not an equality. Unlike the typecheck debt pin above, tests are
      # EXPECTED to grow, and an exact pin would fail every PR that adds one. Set
      # ~6% under the measured 1,708 so ordinary churn does not trip it while a
      # collapse does. Re-baseline UPWARD only, deliberately, in the PR that grows
      # the suites.
      MIN_SELECTED_TESTS: '1600'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 🔴 `lfs: true` IS REQUIRED — DO NOT DROP IT.
          # `.gitattributes` has `*.docx filter=lfs`, and `actions/checkout` does NOT
          # smudge LFS by default, so without this the fixtures arrive as ~130-byte
          # POINTER FILES and any test that opens one fails on malformed bytes.
          #
          # Found the hard way on run 36451879399, the first green-direction attempt
          # for this job: exactly 2 failures, both
          # `NdaSaveNo422RegressionTests` (which reads `AppligentNDA_Signed.docx`),
          # while the same tests passed locally AND in `sdap-ci.yml`. The divergence
          # was never local-vs-CI — it was this checkout versus sdap-ci's, which sets
          # `lfs: true` at `:122` and `:878` with exactly this comment: "else ~200
          # Compose corpus seam tests fail on pointer files".
          #
          # The failing tests were RIGHT and this job was misconfigured. Narrowing the
          # filter to dodge them would have hidden a real defect in the runner.
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # '10.x' matches every other .NET job in the repo; global.json pins
          # 10.0.100 with rollForward latestFeature.
          dotnet-version: '10.x'

      - name: Run office-scope server suites
        shell: bash
        env:
          DOTNET_NOLOGO: 'true'
          DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
          TEST_FILTER: 'FullyQualifiedName~Sprk.Bff.Api.Tests.Api.Office|FullyQualifiedName~Sprk.Bff.Api.Tests.Api.Ai|FullyQualifiedName~Sprk.Bff.Api.Tests.Api.Documents|FullyQualifiedName~Sprk.Bff.Api.Tests.Integration.DataMutation|FullyQualifiedName~Sprk.Bff.Api.Tests.Integration.Regression|FullyQualifiedName~Sprk.Bff.Api.Tests.Services.Office|FullyQualifiedName~Sprk.Bff.Api.Tests.Services.Documents|FullyQualifiedName~Sprk.Bff.Api.Tests.Domain.Office|FullyQualifiedName~Sprk.Bff.Api.Tests.Domain.Ai|FullyQualifiedName~Sprk.Bff.Api.Tests.Domain.Dataverse|FullyQualifiedName~Sprk.Bff.Api.Tests.Seam.Office|FullyQualifiedName~Sprk.Bff.Api.Tests.Filters|FullyQualifiedName~Sprk.Bff.Api.Tests.Infrastructure.Graph|FullyQualifiedName~Sprk.Bff.Api.Tests.Infrastructure.Authentication|FullyQualifiedName~Sprk.Bff.Api.Tests.AccessControl'
        run: |
          # `set +e` IS LOAD-BEARING HERE TOO - the lesson from tasks 056 and 069.
          # `shell: bash` expands to `bash --noprofile --norc -e -o pipefail {0}`, so
          # errexit is injected into the interpreter. `dotnet test` exits non-zero on
          # ANY test failure, which under injected `-e` would kill this step before
          # the count assertion and the summary could run - making a real test
          # failure and a collapsed filter indistinguishable in the log. This step
          # decides from the counts AND the exit code, explicitly, below.
          set +e
          set -uo pipefail

          mkdir -p "$RUNNER_TEMP/trx"
          dotnet test tests/unit/Sprk.Bff.Api.Tests/Sprk.Bff.Api.Tests.csproj \
            -c Debug --filter "$TEST_FILTER" \
            --logger "trx;LogFileName=office-server.trx" \
            --results-directory "$RUNNER_TEMP/trx" \
            2>&1 | tee "$RUNNER_TEMP/dotnet-test.log"
          test_exit=${PIPESTATUS[0]}

          TRX="$RUNNER_TEMP/trx/office-server.trx"
          if [ ! -f "$TRX" ]; then
            echo "::error::No TRX was produced. dotnet test did not run to completion (exit $test_exit) - this is a broken gate, not a clean pass."
            tail -40 "$RUNNER_TEMP/dotnet-test.log" || true
            exit 1
          fi

          counters=$(grep -o '<Counters[^/]*/>' "$TRX" | head -1)
          field() { printf '%s' "$counters" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9][0-9]*' | head -1; }
          total=$(field total); passed=$(field passed); failed=$(field failed)
          total=${total:-0}; passed=${passed:-0}; failed=${failed:-0}

          {
            echo "# Office-scope server suites"
            echo
            echo "| | Count |"
            echo "|---|---|"
            echo "| **Failed** | **${failed}** |"
            echo "| Passed | ${passed} |"
            echo "| Total selected | ${total} (floor ${MIN_SELECTED_TESTS}) |"
            echo
            echo "Namespace-prefix selection over \`Sprk.Bff.Api.Tests\`. A new class in a"
            echo "listed namespace is picked up automatically; a new NAMESPACE needs a line"
            echo "added to the filter in this workflow."
            echo
            echo "**This job DOES fail the workflow run.** It does NOT block a merge -"
            echo "master's ruleset requires only \`Router\`. Promotion is an owner action."
          } >> "$GITHUB_STEP_SUMMARY"

          # The vacuous-green floor is checked FIRST: a collapsed filter is a worse
          # failure than a red test, because it is silent.
          if [ "$total" -lt "$MIN_SELECTED_TESTS" ]; then
            echo "::error file=.github/workflows/office-addins-tests.yml::Filter selected only ${total} test(s), below the floor of ${MIN_SELECTED_TESTS}. A namespace was probably renamed or removed, so coverage collapsed while the run stayed green. Fix the filter, or lower MIN_SELECTED_TESTS deliberately in this PR with the reason in the PR body."
            exit 1
          fi

          if [ "$test_exit" -ne 0 ] || [ "$failed" -gt 0 ]; then
            echo "::error::${failed} server test(s) failed in the office-scope selection (dotnet test exit ${test_exit})."
            grep -E "Failed |Error Message|Assert" "$RUNNER_TEMP/dotnet-test.log" | head -40 || true
            exit 1
          fi

          echo "Office-scope server suites green: ${passed} passed, ${failed} failed, ${total} selected (floor ${MIN_SELECTED_TESTS})."

  # ============================================================================
  # ESLint (task 072 - Fable review 2026-09-21 section 8)
  # ============================================================================
  # WHY THIS EXISTS
  # ---------------
  # `package.json` declared `"lint": "eslint src --ext .ts,.tsx"` in a package that has
  # NO `src/` directory - the sources are `shared/`, `word/` and `outlook/`. Running it
  # printed "No files matching the pattern src" and exited non-zero for that reason
  # alone. No workflow called it either: the repo's ESLint jobs run in `src/client/pcf`,
  # not here.
  #
  # So CI passed because lint never ran, not because lint passed, and nobody knew how
  # many violations the package held. The first successful run answered that: **32**
  # (4 errors, 28 warnings) across 17 of 125 files. All 32 are now fixed - see
  # `projects/spaarkeai-word-add-in-r1/notes/072-lint.md` for the by-rule table.
  #
  # `--max-warnings 0` is load-bearing. 28 of the 32 were WARNINGS, so without it this
  # job would have gone green over almost the entire backlog and the gate would have
  # been decorative in exactly the way this wave exists to fix.
  #
  # NOT type-aware, deliberately: `.eslintrc.js` sets no `parserOptions.project`, so the
  # parser needs no type information and this job does NOT have to build the
  # `@spaarke/auth` `file:` dependency the way the typecheck job does. That keeps it
  # short. If type-aware rules are ever added, this job must gain that build step.
  # ============================================================================
  lint:
    name: ESLint (office-addins)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node 20, matching every other job in this workflow.
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/client/office-addins/package-lock.json

      - name: Install dependencies
        working-directory: src/client/office-addins
        # NOT `npm ci` (root CLAUDE.md section 12); a bare `npm install` also fails here
        # with ERESOLVE (@testing-library/react@14 peer-requires React 18, this package
        # is on React 19).
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: ESLint
        working-directory: src/client/office-addins
        shell: bash
        run: |
          set -uo pipefail
          # No `set +e` needed or wanted here, unlike the typecheck job: eslint's exit
          # code IS the verdict (non-zero on any error, and on any warning because of
          # --max-warnings 0), so letting the injected errexit fail the step is correct.
          npm run lint 2>&1 | tee "$RUNNER_TEMP/eslint.log"
          lint_exit=${PIPESTATUS[0]}

          {
            echo "# office-addins ESLint"
            echo
            if [ "$lint_exit" -eq 0 ]; then
              echo "Clean - 0 errors, 0 warnings over \`shared/\`, \`word/\` and \`outlook/\`."
            else
              echo "**Violations found** (exit ${lint_exit}). \`--max-warnings 0\`, so warnings fail too."
              echo
              echo '```'
              tail -40 "$RUNNER_TEMP/eslint.log"
              echo '```'
            fi
            echo
            echo "**This job DOES fail the workflow run.** It does NOT block a merge -"
            echo "master's ruleset requires only \`Router\`. Promotion is an owner action."
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$lint_exit"
