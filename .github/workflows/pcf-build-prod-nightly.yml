# ============================================================================
# PCF Production Build (Nightly, Advisory)
# ============================================================================
# spaarke-ontology-platform-r1 · task 093 · owner decision 2026-10-04
#
# WHY THIS EXISTS
# ----------------
# Task 092 (PR #1123) found that no GitHub Actions workflow ran
# `npm run build:prod` for any PCF control. Six Communication PCFs could not
# be built from master from 2026-08-14 until #1123 fixed the pdfjs/babel
# break that caused it, and nothing ever turned red — the gap was invisible
# for seven weeks. This workflow closes that gap the same way
# `client-tests.yml` closed the "no jest ever runs" gap: a nightly, advisory
# baseline that discovers the surface, runs it, and records the result,
# without gating anything.
#
# SCOPE — ADVISORY ONLY, mirroring client-tests.yml
# ---------------------------------------------------
# This workflow makes "can every PCF still build from master" VISIBLE and
# nothing more. Every step that can fail is continue-on-error, the workflow
# appears in no blocking filter (ci-tier1-blocking.yml / ci-tier2-advisory.yml
# do not reference it), and it has NO pull_request or push trigger — only
# `schedule` and `workflow_dispatch`. Do not add it to either tier file and
# do not make it a required check.
#
# WHY A SEPARATE FILE, NOT A NEW JOB IN client-tests.yml
# -------------------------------------------------------
# client-tests.yml's own header scopes it explicitly to "Client Tests
# (Jest)" — "runs jest at all" is the gap it closes, and a production
# webpack build is a different question (can it build) than a different tool
# (jest, not webpack) answers (do the tests pass). The two also discover
# different package sets: client-tests.yml matches EVERY client package with
# a real `test` script (40, repo-wide); this workflow matches only
# `src/client/pcf/*` packages with a `build:prod` script (18 at the time of
# writing). Folding this in would require either a second discover job
# inside client-tests.yml (no sharing benefit — the matrix, install step, and
# summary table all still need to be separate) or diluting that file's
# stated single-tool scope. A separate file keeps each workflow's header
# honest about what it covers.
#
# WHY 08:00 UTC (not 06:00 or 07:00)
# -------------------------------------
# nightly-health.yml runs at 06:00 UTC and client-tests.yml at 07:00 UTC
# (one hour after nightly-health, by client-tests.yml's own design, so the
# two do not contend for runners). This workflow runs at 08:00 UTC — one
# hour after client-tests.yml — for the same reason: 18 PCF legs each doing
# their own `npm install` is exactly the kind of runner contention
# client-tests.yml's header already flags, and stacking it on top of either
# existing nightly job would reintroduce that contention instead of avoiding
# it.
#
# THE SHARED-LIBRARY PREBUILD CHAIN (why "Prepare shared libraries" exists)
# ---------------------------------------------------------------------------
# Measured empirically while building this workflow (fresh worktree, nothing
# pre-installed — i.e. exactly what a GitHub Actions runner starts from):
# most PCFs depend on `@spaarke/ui-components` via a `file:../../shared/...`
# reference, and their `prebuild` / `prebuild:prod` script runs
# `Spaarke.UI.Components/scripts/ensure-dist-fresh.js`, which rebuilds
# `@spaarke/sdap-client` -> `@spaarke/auth` -> `@spaarke/ui-components` (in
# that order) via `npm run build` (tsc) in each — but ONLY if that package
# already has its OWN `node_modules`. `dist/` is gitignored for all three, so
# on a clean checkout every one of them is missing, and the script's
# documented fallback when `node_modules` is also absent is to warn and
# SKIP the rebuild, not fail — which would silently turn a perfectly
# buildable PCF into a false "fail" for an environment reason, not a code
# reason. (`@spaarke/communication-components` and `@spaarke/visuals` do NOT
# need this: both ship `src/index.ts` directly as `main`, no `dist/` build
# step, confirmed by a successful `CommunicationActions` build that bundled
# `@spaarke/communication-components` straight from source.) So: for any
# discovered PCF whose `prebuild`/`prebuild:prod` script references
# `ensure-dist-fresh.js`, this workflow installs the three shared packages'
# own dependencies FIRST, in dependency order, before installing or building
# the PCF itself. Getting this wrong would not produce a clean error — it
# would make the six known-broken Communication PCFs indistinguishable from
# every other PCF, all failing together for the wrong reason.
#
# WHY DISCOVERY, NOT A HAND-WRITTEN LIST
# -----------------------------------------
# A fixed list of 18 PCF names would drift the moment someone adds or
# removes a control — silently narrowing coverage exactly the way "no
# workflow builds any PCF" narrowed it to zero. Job 1 scans
# `src/client/pcf/*/package.json` (git-tracked files only) for a real
# `build:prod` script instead.
# ============================================================================

name: PCF Production Build (Nightly)

on:
  # Nightly baseline. 08:00 UTC — deliberately one hour after
  # client-tests.yml (07:00 UTC), which itself sits one hour after
  # nightly-health.yml (06:00 UTC), so none of the three contend for
  # runners.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      pcf_filter:
        description: 'Optional substring filter — build only PCFs whose path contains this'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Keyed per ref, same as client-tests.yml. Never cancel a nightly baseline
  # mid-flight on account of a manual dispatch: a partial baseline is worse
  # than a late one.
  group: pcf-build-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # Job 1 — discover
  # Build the matrix by SCANNING for PCFs that declare a real build:prod
  # script, and tag each one with whether its prebuild hook needs the shared
  # sdap-client/auth/ui-components chain primed first (see header).
  # --------------------------------------------------------------------------
  discover:
    name: Discover PCF controls
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find PCFs with a build:prod script
        id: find
        shell: bash
        run: |
          set -euo pipefail
          filter='${{ inputs.pcf_filter }}'
          rows=()

          while IFS= read -r pkgjson; do
            dir="$(dirname "$pkgjson")"

            row="$(node -e "
              try {
                const j = require('./$pkgjson');
                const s = j.scripts || {};
                const buildProd = s['build:prod'] || '';
                if (!buildProd) { process.exit(0); }
                const pre = s['prebuild:prod'] || s['prebuild'] || '';
                const needsShared = pre.includes('ensure-dist-fresh.js');
                process.stdout.write(JSON.stringify({ pcf: '$dir', shared: needsShared }));
              } catch (e) { }
            " 2>/dev/null || true)"

            if [ -z "$row" ]; then continue; fi
            if [ -n "$filter" ] && [[ "$dir" != *"$filter"* ]]; then continue; fi
            rows+=("$row")
          done < <(git ls-files 'src/client/pcf/*/package.json')

          if [ ${#rows[@]} -eq 0 ]; then
            echo "::error::No PCF with a build:prod script was found under src/client/pcf. That is almost certainly a discovery bug, not an empty repo — failing loudly rather than reporting a vacuous green."
            exit 1
          fi

          matrix=$(printf '%s\n' "${rows[@]}" | jq -cs '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=${#rows[@]}" >> "$GITHUB_OUTPUT"

          echo "Discovered ${#rows[@]} PCF(s):"
          printf '  %s\n' "${rows[@]}"

  # --------------------------------------------------------------------------
  # Job 2 — build
  # One PCF per matrix leg. continue-on-error so a red PCF never fails the
  # run; the result is RECORDED, not enforced. Bound to max-parallel: 8, the
  # same ceiling client-tests.yml uses, so this never monopolizes the runner
  # queue even though it runs at a different hour than that workflow.
  # --------------------------------------------------------------------------
  build:
    name: ${{ matrix.pcf }}
    needs: discover
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Only runs for PCFs whose prebuild hook calls ensure-dist-fresh.js.
      # See the header comment for why this step exists and why skipping it
      # for a PCF that needs it would produce a false "fail", not a clean
      # error.
      - name: Prepare shared libraries (sdap-client, auth, ui-components)
        id: shared
        if: ${{ matrix.shared == true }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for d in src/client/shared/Spaarke.SdapClient src/client/shared/Spaarke.Auth src/client/shared/Spaarke.UI.Components; do
            echo "::group::npm install ($d)"
            (cd "$d" && npm install --legacy-peer-deps --no-audit --no-fund)
            echo "::endgroup::"
          done

      - name: Install PCF dependencies
        id: install
        continue-on-error: true
        working-directory: ${{ matrix.pcf }}
        # NOT `npm ci`. Per root CLAUDE.md §12, stale package-lock.json files
        # make `npm ci` fail outright on most of these packages.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # TEMPORARY diagnostic (task 092, 2026-10-04) — investigating a CI-only
      # TS2307 "Cannot find module" failure for @fluentui/react-components /
      # @fluentui/react-icons / @spaarke/auth that does not reproduce locally
      # even with an exact-sequence fresh install. To be reverted before this
      # PR merges once the root cause is understood.
      - name: DIAGNOSTIC — module resolution
        if: always()
        continue-on-error: true
        working-directory: ${{ matrix.pcf }}
        shell: bash
        run: |
          echo "::group::npm ls (top-level + all)"
          npm ls @fluentui/react-components @fluentui/react-icons @spaarke/auth @spaarke/ui-components 2>&1 || true
          echo "---all---"
          npm ls @fluentui/react-components @fluentui/react-icons @spaarke/auth @spaarke/ui-components --all 2>&1 || true
          echo "::endgroup::"
          echo "::group::require.resolve"
          node -e "for (const m of ['@fluentui/react-components','@fluentui/react-icons','@spaarke/auth']) { try { console.log(m, '->', require.resolve(m)); } catch (e) { console.log(m, '-> FAILED:', e.message); } }" || true
          echo "::endgroup::"
          echo "::group::node_modules presence (own vs shared libs)"
          for p in '@fluentui/react-components' '@fluentui/react-icons' '@spaarke/auth'; do
            if [ -d "node_modules/$p" ]; then echo "OWN node_modules/$p: present"; else echo "OWN node_modules/$p: MISSING"; fi
          done
          for shared in SdapClient Auth UI.Components; do
            d="../../shared/Spaarke.$shared/node_modules"
            for p in '@fluentui/react-components' '@fluentui/react-icons' '@spaarke/auth'; do
              if [ -d "$d/$p" ]; then echo "Spaarke.$shared/node_modules/$p: present"; else echo "Spaarke.$shared/node_modules/$p: MISSING"; fi
            done
          done
          echo "::endgroup::"
          node --version
          npm --version

      - name: Build (production)
        id: build
        continue-on-error: true
        working-directory: ${{ matrix.pcf }}
        run: npm run build:prod

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          # Distinguish shared-prep failure from install failure from build
          # failure. Collapsing them would send the next person debugging a
          # pdfjs/webpack error to check npm install logs instead, or vice
          # versa.
          if [ "${{ steps.shared.outcome }}" = "failure" ]; then
            status="shared-libs-failed"
          elif [ "${{ steps.install.outcome }}" != "success" ]; then
            status="install-failed"
          elif [ "${{ steps.build.outcome }}" = "success" ]; then
            status="pass"
          else
            status="fail"
          fi
          slug="$(printf '%s' '${{ matrix.pcf }}' | tr '/' '_')"
          printf '%s\t%s\n' '${{ matrix.pcf }}' "$status" > "$RUNNER_TEMP/results/$slug.tsv"
          echo "$status  ${{ matrix.pcf }}"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcf-build-prod-result-${{ strategy.job-index }}
          path: ${{ runner.temp }}/results/
          retention-days: 30

  # --------------------------------------------------------------------------
  # Job 3 — summarize
  # The per-PCF table is the artifact of this workflow. It must be readable
  # without downloading anything, so it goes in the job summary.
  # --------------------------------------------------------------------------
  summarize:
    name: Baseline summary
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: pcf-build-prod-result-*
          merge-multiple: true
          path: results

      - name: Build baseline table
        shell: bash
        run: |
          set -euo pipefail
          discovered='${{ needs.discover.outputs.count }}'
          cat results/*.tsv 2>/dev/null | sort -u > all.tsv || true
          reported=$(wc -l < all.tsv | tr -d ' ')

          pass=$(awk -F'\t' '$2=="pass"'               all.tsv | wc -l | tr -d ' ')
          fail=$(awk -F'\t' '$2=="fail"'                all.tsv | wc -l | tr -d ' ')
          inst=$(awk -F'\t' '$2=="install-failed"'      all.tsv | wc -l | tr -d ' ')
          shrd=$(awk -F'\t' '$2=="shared-libs-failed"'  all.tsv | wc -l | tr -d ' ')

          {
            echo "# PCF Production Build Baseline (Nightly)"
            echo
            echo "Advisory only — this workflow gates nothing. See the header of"
            echo '`.github/workflows/pcf-build-prod-nightly.yml` for the scope split.'
            echo
            echo "| Result | PCFs |"
            echo "|---|---:|"
            echo "| ✅ pass | $pass |"
            echo "| ❌ fail | $fail |"
            echo "| ⚠️ install-failed | $inst |"
            echo "| ⚠️ shared-libs-failed | $shrd |"
            echo "| **discovered** | **$discovered** |"
            echo

            # Never let a partial baseline read as a complete one.
            if [ "$reported" != "$discovered" ]; then
              echo "> ⚠️ **Incomplete baseline** — $discovered PCF(s) discovered but only"
              echo "> $reported reported a result. The difference is legs that did not finish"
              echo "> (cancelled or infrastructure failure). Treat the table below as partial."
              echo
            fi

            echo "## Per PCF"
            echo
            echo "| PCF | Result |"
            echo "|---|---|"
            awk -F'\t' '{
              icon = ($2=="pass") ? "✅" : ($2=="fail") ? "❌" : "⚠️";
              printf "| `%s` | %s %s |\n", $1, icon, $2
            }' all.tsv
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Baseline: $pass pass / $fail fail / $inst install-failed / $shrd shared-libs-failed of $discovered discovered"

      - name: Upload combined baseline
        uses: actions/upload-artifact@v4
        with:
          name: pcf-build-prod-baseline
          path: all.tsv
          retention-days: 90
