name: Deploy Office Add-ins to Azure Static Web App

on:
  push:
    branches:
      - master
      - work/SDAP-outlook-office-add-in
    paths:
      - 'src/client/office-addins/**'
      # The add-ins consume @spaarke/auth as a `file:` dependency and build it from
      # source (dist/ is gitignored), so a change there changes what ships here.
      # Without this path the add-ins would keep deploying against a stale auth lib.
      - 'src/client/shared/Spaarke.Auth/**'
      - '.github/workflows/deploy-office-addins.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Office Add-ins
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: src/client/office-addins/package-lock.json

      # @spaarke/auth is a `file:../shared/Spaarke.Auth` dependency whose package.json
      # points main at `dist/index.js` — and `dist/` is gitignored
      # (src/client/shared/Spaarke.Auth/.gitignore:5). On a developer machine it exists
      # from a previous build, so this is invisible locally. On a fresh CI checkout it
      # does not, `npm install` links a package with no built output, and webpack fails
      # with "Can't resolve '@spaarke/auth'".
      #
      # Build the dependency first. This must stay AHEAD of the add-ins install: npm
      # resolves the file: link at install time.
      - name: "Build @spaarke/auth (file: dependency — dist/ is gitignored)"
        working-directory: src/client/shared/Spaarke.Auth
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Install dependencies
        working-directory: src/client/office-addins
        # --legacy-peer-deps per root CLAUDE.md §12: a bare `npm install` fails here with
        # ERESOLVE, because @testing-library/react@14 peer-requires React 18 while the
        # project is on React 19. The repo's build scripts already use these flags; this
        # workflow was the one place that did not.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Office Add-ins
        working-directory: src/client/office-addins
        run: npm run build
        env:
          NODE_ENV: production
          ADDIN_CLIENT_ID: c1258e2d-1688-49d2-ac99-a7485ebd9995
          TENANT_ID: a221a95e-6abc-4434-aecc-e48338a1b2f2
          BFF_API_CLIENT_ID: 1e40baad-e065-4aea-a8d4-4b7ab273458c
          BFF_API_BASE_URL: https://spaarke-bff-dev.azurewebsites.net

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/client/office-addins/dist"
          skip_app_build: true
