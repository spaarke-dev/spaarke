# ============================================================================
# Issues & Quality Dashboard
# ============================================================================
# Maintains ONE pinned issue, "📊 Issues & Quality Dashboard" (label `dashboard`), whose
# BODY is regenerated by scripts/ci/render-issues-dashboard.py: open quality alerts,
# the last result of each nightly workflow, issues opened in the last 7 days, stale
# open issues, and totals. The body is edited in place and the issue never gets
# comments, so refreshing it sends nobody a notification. Alerts themselves are raised
# by .github/actions/quality-alert (docs/procedures/ci-cd-workflow.md, "Quality alerts").
#
# Refreshed every 6 hours, on demand, and on issue events. Events caused by the default
# GITHUB_TOKEN (for example an alert opened by a nightly) do not start workflows, so the
# schedule is what picks those up.
# ============================================================================

name: issues-dashboard

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the dashboard body instead of writing the issue'
        required: false
        type: boolean
        default: false
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]

permissions:
  issues: write
  contents: read
  actions: read         # last run of each nightly workflow
  pull-requests: read   # open PR count

concurrency:
  # A burst of issue events collapses into the running refresh plus one pending run.
  group: issues-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    name: Refresh dashboard issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci

      - name: Render and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/ci/render-issues-dashboard.py --dry-run
          else
            python3 scripts/ci/render-issues-dashboard.py
          fi
