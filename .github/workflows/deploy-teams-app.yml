name: Deploy Teams App Package

# Task 071 (teams-app-r1, Phase 7 "Teams Package & Deploy" / Stream M).
#
# Builds the external-spa Teams-tab surface as a fail-fast sanity gate, then
# packages the Teams app manifest produced by task 070
# (src/client/external-spa/appPackage/: manifest.json + color.png +
# outline.png) into a distributable zip and publishes it as a durable
# GitHub Actions artifact.
#
# Modeled directly on deploy-external-spa.yml's job/step shape (checkout →
# setup-node → npm install --legacy-peer-deps → build → stage/package →
# deploy), split into two jobs joined by `needs:` so the job graph itself
# (not step ordering) enforces that a build or package failure hard-blocks
# the deploy job — see the `deploy` job's `needs: build_and_package` below.
#
# Toolkit-CLI vs pre-zip-upload (task 071 decision point): this workflow
# zips appPackage/ directly with the `zip` CLI rather than invoking the
# M365 Agents Toolkit CLI (`atk`/`teamsapp`). No `m365agents.yml` or Toolkit
# project scaffolding exists anywhere in the repo — task 070 authored
# appPackage/ by hand (not via `atk new`) and produced its local
# `appPackage.dev.zip` the same way. Introducing the Toolkit CLI here would
# add a net-new CI build dependency with no existing project config to
# drive it, for no behavioral gain over a plain zip of the
# already-validated manifest + icons. If a later task adds Toolkit project
# scaffolding for `atk package`/`atk publish` end-to-end (including
# Toolkit-driven manifest schema validation), this workflow can be
# repointed then — see the handoff note in task 070.
#
# Deploy target: org-catalog submission under App Centric Management is a
# manual tenant-admin action (task 072) — there is no programmatic "deploy"
# endpoint this workflow can call. "Deploy" here means: publish the
# packaged zip as a long-retention GitHub Actions artifact that task 072's
# admin downloads and submits to the org app catalog.
#
# MANUAL-ONLY for now (workflow_dispatch), matching deploy-external-spa.yml's
# phase-gated trigger discipline — no push/path trigger until a later task
# explicitly calls for it.
#
# Environment split (task 043, spaarke-SPA-external-access-platform-r3, FR-20, design actions A1/A2):
#   environment=dev  -> GitHub environment `external-spa-dev`,  packages appPackage/manifest.json      (unchanged output)
#   environment=prod -> GitHub environment `external-spa-prod`, packages appPackage/manifest.prod.json
# The prod manifest carries a ${{TEAMS_APP_ID}} placeholder; the job renders it from the environment variable
# TEAMS_APP_ID (the owner-supplied production Teams app id) into build/stage/manifest.json. Both manifests must declare
# NO webApplicationInfo (ADR-028 A8). The sanity build reads the same VITE_* environment variables as
# deploy-external-spa.yml; no environment-specific identifier, URL or scope is written in this file. The variables the
# owner must create are listed in projects/spaarke-SPA-external-access-platform-r3/notes/task-043-notes.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev -> external-spa-dev, prod -> external-spa-prod)"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

permissions:
  contents: read

# One run per target environment at a time; a queued run waits rather than cancelling a publish in flight. The prefix
# differs from deploy-external-spa.yml so the two workflows never block each other.
concurrency:
  group: deploy-teams-app-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Build the external-spa Teams surface (sanity/regression gate) and
  #        package task 070's appPackage/ into a distributable zip.
  #        A failure at ANY step below stops this job — no later step in
  #        this job runs, and (via `needs:`) the deploy job never starts.
  # ──────────────────────────────────────────────────────────────────────────
  build_and_package:
    runs-on: ubuntu-latest
    name: Build external-spa and package Teams app (${{ inputs.environment }})
    environment: ${{ inputs.environment == 'prod' && 'external-spa-prod' || 'external-spa-dev' }}
    steps:
      # A REST/gh dispatch can pass a value the UI choice list would refuse. Anything but dev|prod would otherwise
      # resolve to the dev GitHub environment and publish the dev manifest under another environment's label.
      - name: Validate environment input
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          case "$TARGET" in dev|prod) ;; *) echo "::error::environment must be dev or prod (got '$TARGET')"; exit 1;; esac

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      # Vite solution: use npm install --legacy-peer-deps (NOT npm ci) per root CLAUDE.md §12.
      - name: Install dependencies
        working-directory: src/client/external-spa
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # Sanity/regression gate: the Teams tab is the same external-spa bundle
      # (D10 — extended in place, not a separate build target) already
      # deployed to Azure Static Web Apps by deploy-external-spa.yml. This
      # step does not re-deploy that bundle; it exists so a broken build of
      # the surface the manifest's contentUrl points at fails HERE, before a
      # Teams app package advertising it is published.
      - name: Build (Vite production)
        working-directory: src/client/external-spa
        env:
          # GitHub environment variables (dev values in external-spa-dev, prod values in external-spa-prod) - same
          # names and meaning as in deploy-external-spa.yml; both planes request api://{app id}/user_impersonation
          # (ADR-028 A8). Unset optional values (VITE_BACKENDS) arrive as empty strings, which the SPA treats as unset.
          VITE_BFF_API_URL: ${{ vars.VITE_BFF_API_URL }}
          VITE_BACKENDS: ${{ vars.VITE_BACKENDS }}
          VITE_MSAL_AUTHORITY: ${{ vars.VITE_MSAL_AUTHORITY }}
          VITE_MSAL_CLIENT_ID: ${{ vars.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ vars.VITE_MSAL_TENANT_ID }}
          VITE_MSAL_BFF_SCOPE: ${{ vars.VITE_MSAL_BFF_SCOPE }}
          # Workforce plane (Teams host): single-tenant Spaarke public client, authority pinned to Spaarke's tenant.
          VITE_TEAMS_MSAL_CLIENT_ID: ${{ vars.VITE_TEAMS_MSAL_CLIENT_ID }}
          VITE_TEAMS_MSAL_TENANT_ID: ${{ vars.VITE_TEAMS_MSAL_TENANT_ID }}
          VITE_TEAMS_MSAL_BFF_SCOPE: ${{ vars.VITE_TEAMS_MSAL_BFF_SCOPE }}
        run: npm run build

      # Pick the manifest by environment and stage it as build/stage/manifest.json (the file name Teams requires at
      # the archive root). dev copies manifest.json byte for byte. prod renders manifest.prod.json: the id comes from
      # the TEAMS_APP_ID environment variable (the owner-supplied production Teams app id) - it must be a GUID and
      # not the all-zero placeholder - and nothing else in the manifest is touched.
      - name: Stage manifest for the target environment
        working-directory: src/client/external-spa/appPackage
        env:
          TARGET: ${{ inputs.environment }}
          TEAMS_APP_ID: ${{ vars.TEAMS_APP_ID }}
        run: |
          mkdir -p build/stage
          rm -f build/stage/manifest.json
          if [ "$TARGET" = "prod" ]; then
            [ -n "$TEAMS_APP_ID" ] || { echo "::error::GitHub environment variable TEAMS_APP_ID is not set for the 'external-spa-prod' environment (the owner-supplied production Teams app id)"; exit 1; }
            printf '%s' "$TEAMS_APP_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' || { echo "::error::TEAMS_APP_ID must be a GUID"; exit 1; }
            [ "$TEAMS_APP_ID" != "00000000-0000-0000-0000-000000000000" ] || { echo "::error::TEAMS_APP_ID is the all-zero placeholder"; exit 1; }
            jq --arg id "$TEAMS_APP_ID" '.id = $id' manifest.prod.json > build/stage/manifest.json
          else
            cp manifest.json build/stage/manifest.json
          fi

      - name: Validate Teams app manifest (required fields present)
        working-directory: src/client/external-spa/appPackage/build/stage
        run: |
          echo "Validating the staged manifest.json is well-formed JSON with required fields..."
          jq -e '.manifestVersion != null and .manifestVersion != ""' manifest.json > /dev/null || { echo "::error::manifest.json missing manifestVersion"; exit 1; }
          jq -e '.id != null and .id != ""' manifest.json > /dev/null || { echo "::error::manifest.json missing id"; exit 1; }
          jq -e '.staticTabs != null and (.staticTabs | length) > 0' manifest.json > /dev/null || { echo "::error::manifest.json missing staticTabs"; exit 1; }
          jq -e '.validDomains != null and (.validDomains | length) > 0' manifest.json > /dev/null || { echo "::error::manifest.json missing validDomains"; exit 1; }
          # ADR-028 Amendment A8 (MUST NOT): the manifest declares NO webApplicationInfo (no Teams-SSO fallback).
          jq -e 'has("webApplicationInfo") | not' manifest.json > /dev/null || { echo "::error::manifest.json must NOT declare webApplicationInfo (ADR-028 A8: NAA then MSAL popup, no Teams SSO)"; exit 1; }
          # No unrendered placeholder may reach a package.
          if grep -Eq '[$][{][{]' manifest.json; then echo "::error::manifest.json still contains an unrendered placeholder"; exit 1; fi
          echo "Manifest validation passed."

      - name: Verify icon assets exist
        working-directory: src/client/external-spa/appPackage
        run: |
          test -f color.png || { echo "::error::color.png missing (declared in manifest.icons.color)"; exit 1; }
          test -f outline.png || { echo "::error::outline.png missing (declared in manifest.icons.outline)"; exit 1; }

      # Package: zip the staged manifest.json + icons at the archive root (Teams
      # app package format — no appPackage/ prefix inside the zip). env.*.json is
      # a Toolkit environment-variable file, not part of the distributable
      # package, and is intentionally excluded.
      - name: Package Teams app
        working-directory: src/client/external-spa/appPackage
        run: |
          mkdir -p build
          rm -f build/appPackage.zip
          zip -j build/appPackage.zip build/stage/manifest.json color.png outline.png

      - name: Verify package contents
        working-directory: src/client/external-spa/appPackage
        run: |
          unzip -l build/appPackage.zip
          FILE_COUNT=$(unzip -Z1 build/appPackage.zip | wc -l)
          if [ "$FILE_COUNT" -ne 3 ]; then
            echo "::error::Expected 3 files in appPackage.zip (manifest.json + 2 icons), found $FILE_COUNT — check for stray dev artifacts"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: teams-app-package${{ inputs.environment == 'prod' && '-prod' || '' }}-build
          path: src/client/external-spa/appPackage/build/appPackage.zip
          retention-days: 7

      - name: Write build summary
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          echo "## Teams App — Build & Package" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`$TARGET\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | \`appPackage.zip\` (manifest.json + color.png + outline.png) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Publish the packaged Teams app as the release artifact.
  #        `needs: build_and_package` is the job-graph mechanism that hard-
  #        blocks this job when the build/package job fails — GitHub Actions
  #        skips a job whose `needs:` dependency did not succeed, regardless
  #        of step ordering within either job.
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Publish Teams app package
    runs-on: ubuntu-latest
    needs: build_and_package
    steps:
      # A REST/gh dispatch can pass a value the UI choice list would refuse. Anything but dev|prod would otherwise
      # resolve to the dev GitHub environment and publish the dev manifest under another environment's label.
      - name: Validate environment input
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          case "$TARGET" in dev|prod) ;; *) echo "::error::environment must be dev or prod (got '$TARGET')"; exit 1;; esac

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: teams-app-package${{ inputs.environment == 'prod' && '-prod' || '' }}-build
          path: dist

      # "Deploy" for a Teams org-catalog app is publishing the durable
      # artifact an admin will submit — App Centric Management org-catalog
      # upload/approval is a manual tenant-admin action (task 072), not a
      # programmatic endpoint this workflow can call.
      - name: Publish release artifact
        uses: actions/upload-artifact@v6
        with:
          name: teams-app-package${{ inputs.environment == 'prod' && '-prod' || '' }}
          path: dist/appPackage.zip
          retention-days: 90

      - name: Write deploy summary
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          SUFFIX=""
          if [ "$TARGET" = "prod" ]; then SUFFIX="-prod"; fi
          echo "## Teams App — Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published artifact **teams-app-package${SUFFIX}** (\`appPackage.zip\`, $TARGET environment, 90-day retention)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$TARGET" = "prod" ]; then
            echo "**Next step (task 073, go-live gated on T240c/T240d and DNS):** the production package is built only; do not submit it to a tenant catalog until go-live is approved." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Next step (task 072, manual/admin-gated):** download this artifact and submit it to the org app catalog under App Centric Management for admin approval." >> $GITHUB_STEP_SUMMARY
          fi
