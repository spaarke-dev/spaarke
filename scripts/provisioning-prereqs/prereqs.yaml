prereqs:
  # ============================================================================
  # ONCE-PER-TENANT (Spaarke Model 1 Prod tenant OR customer tenant Model 2)
  # ============================================================================

  - id: PRQ-T-01
    name: SPE container-type registered on Spaarke tenant
    scope: once_per_env
    frequency: once (do NOT recreate — 24h replication penalty)
    owner: Spaarke platform admin
    never_delete: true
    consequence_of_absence: H8 (SPE root container creation) fails with 404 on containerType lookup; downstream file-storage flows all fail.
    check_recipe:
      cli: |
        set -o pipefail
        export MSYS_NO_PATHCONV=1
        tok=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv | tr -d '\r') || exit 1
        [ -n "$tok" ] || { echo "no Graph access token - az login first"; exit 1; }
        body=$(mktemp) || exit 1
        trap 'rm -f "$body"' EXIT

        code=$(curl -sS -o "$body" -D - -H "Authorization: Bearer $tok" "https://graph.microsoft.com/v1.0/storage/fileStorage/containerTypes/{containerTypeId}" | sed -n 1p | tr -d '\r' | awk '{print $2}') || exit 1
        case "$code" in
          200) grep -qi '"id": *"{containerTypeId}"' "$body" || { echo "HTTP 200 but the body does not carry containerTypeId {containerTypeId}"; exit 1; }
               echo ok ;;
          403) echo "SKIP: HTTP 403 - the operator's Azure CLI token is not consented for container-type reads (T248); H0 SpeOwnerCredential verifies the container type with the L2 credential"; exit 0 ;;
          404) echo "container type {containerTypeId} not found in this tenant"; exit 1 ;;
          *)   echo "unexpected HTTP '$code'"; cat "$body"; exit 1 ;;
        esac
      expect: '`ok` - HTTP 200 and the body carries containerTypeId. HTTP 403 (the Azure CLI token is not consented for container-type reads) prints SKIP and exits 0 - H0 SpeOwnerCredential proves it with the L2 credential; 404 or any other status exits 1'
    remediation: See `docs/guides/SPAARKE-CUSTOMER-DEPLOYMENT-GUIDE.md` §2.4 lead-time. Container-type creation is out-of-scope for provisioning automation per owner directive 2026-08-24.
    related_findings: [F17-update, T051-h8-*, audit-gap-05-artifacts-storage-missing]

  - id: PRQ-T-02
    name: SPE container-type application permissions granted
    scope: once_per_env
    frequency: once per tenant (Model 2) or once per Spaarke tenant (Model 1)
    owner: customer tenant admin (Model 2) OR Spaarke admin (Model 1)
    consequence_of_absence: H8 succeeds but subsequent file-storage operations 403.
    check_recipe:
      cli: |
        set -o pipefail
        export MSYS_NO_PATHCONV=1
        tok=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv | tr -d '\r') || exit 1
        [ -n "$tok" ] || { echo "no Graph access token - az login first"; exit 1; }
        body=$(mktemp) || exit 1
        trap 'rm -f "$body"' EXIT

        code=$(curl -sS -o "$body" -D - -H "Authorization: Bearer $tok" "https://graph.microsoft.com/beta/storage/fileStorage/containerTypes/{containerTypeId}/applicationPermissionGrants" | sed -n 1p | tr -d '\r' | awk '{print $2}') || exit 1
        case "$code" in
          200) grep -q '"readContent"' "$body" && grep -q '"writeContent"' "$body" || { echo "no applicationPermissionGrant with readContent + writeContent on container type {containerTypeId}"; cat "$body"; exit 1; }
               echo ok ;;
          403) echo "SKIP: HTTP 403 - the operator's Azure CLI token is not consented for container-type reads (T248); H0 SpeOwnerCredential verifies the registration with the L2 credential"; exit 0 ;;
          404) echo "container type {containerTypeId} not found in this tenant"; exit 1 ;;
          *)   echo "unexpected HTTP '$code'"; cat "$body"; exit 1 ;;
        esac
      expect: '`ok` - at least one grant carries `readContent` and `writeContent`. HTTP 403 prints SKIP and exits 0 (see PRQ-T-01); 404 or any other status exits 1'
    remediation: See `docs/guides/SPAARKE-CUSTOMER-DEPLOYMENT-GUIDE.md` §2.4.

  - id: PRQ-T-03
    name: Office add-in Outlook Entra app-reg exists
    scope: once_per_env
    frequency: once
    owner: Spaarke platform admin
