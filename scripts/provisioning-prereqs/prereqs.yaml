  - id: PRQ-E-12
    name: Provisioning Service Bus queue `sprk-provisioning-jobs` exists with `requiresSession=true` + `requiresDuplicateDetection=true` (PT1H)
    scope: once_per_env
    frequency: once per env (recreate ceremony required on drift)
    owner: Spaarke platform admin (via runbook `notes/queue-recreate-runbook-2026-08.md`)
    consequence_of_absence: Session receiver against non-session queue throws at `StartProcessingAsync`; L1 dedup silently swallows §4C retries.
    check_recipe:
      cli: |
        set -o pipefail
        export MSYS_NO_PATHCONV=1
        sbid=$(az resource list --name {sbNamespace} --resource-type Microsoft.ServiceBus/namespaces --query "[0].id" -o tsv | tr -d '\r') || exit 1
        [ -n "$sbid" ] || { echo "Service Bus namespace {sbNamespace} not found"; exit 1; }

        rg=$(echo "$sbid" | sed -E 's#.*/[Rr]esource[Gg]roups/([^/]+)/.*#\1#')
        { [ -n "$rg" ] && [ "$rg" != "$sbid" ]; } || { echo "cannot derive the resource group from $sbid"; exit 1; }
        sess=$(az servicebus queue show -g "$rg" --namespace-name {sbNamespace} -n sprk-provisioning-jobs --query requiresSession -o tsv | tr -d '\r' | tr 'A-Z' 'a-z') || { echo "queue sprk-provisioning-jobs not found in {sbNamespace}"; exit 1; }
        dedup=$(az servicebus queue show -g "$rg" --namespace-name {sbNamespace} -n sprk-provisioning-jobs --query requiresDuplicateDetection -o tsv | tr -d '\r' | tr 'A-Z' 'a-z') || exit 1
        { [ "$sess" = true ] && [ "$dedup" = true ]; } || { echo "queue sprk-provisioning-jobs: requiresSession=$sess requiresDuplicateDetection=$dedup (both must be true; creation-time-only - recreate ceremony, task 108)"; exit 1; }
        echo ok
      expect: '`ok` - `requiresSession` AND `requiresDuplicateDetection` are both `true` on `sprk-provisioning-jobs`'
    remediation: '`az servicebus queue delete` + recreate via Bicep (task 108). WARNING — creation-time-only settings; existing messages lost.'
    related_findings: [T108-*, queue-recreate-runbook]

