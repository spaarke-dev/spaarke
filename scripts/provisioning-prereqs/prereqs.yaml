      expect: '`ok` - the app `Spaarke Exchange Admin` exists, a federated credential names the L2 Worker UAMI principal id, and the app holds NO secret or certificate. NOT asserted here (needs an interactive Exchange Online session, which Step 0.5b must not open): `Exchange.ManageAsApp` consent and, in Exchange, `Get-ManagementRoleAssignment -RoleAssignee <its service-principal object id>` listing `Spaarke App RBAC Admin`, `View-Only Recipients` and the four DelegatingOrgWide `Application Mail.*` / `MailboxSettings.Read` assignments - H14a / H13 T4 fail loudly on first use if they are missing'
