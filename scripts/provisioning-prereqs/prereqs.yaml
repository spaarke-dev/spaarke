  - id: PRQ-E-08
    name: L2 UAMI is Dataverse Application User on admin env (Path X, scoped role)
    scope: once_per_env
    frequency: once per env
    owner: Spaarke platform admin
    consequence_of_absence: L2 cannot read/write `sprk_dataverseenvironment` registry rows; registry-driven flows all fail.
    check_recipe:
      cli: |
        # PRQ-07 fix (2026-08-27): `pac org list-users` is not a valid pac subcommand
        # at CLI 1.46 (pac org group is [who, list, fetch, list-settings, update-settings,
        # select]). Swap to az rest against Dataverse Web API systemusers + role
        # association endpoints.
        # NOTE: `\$filter` and `\$select` are escaped so bash -c does not expand.
        token=$(az account get-access-token --resource "{adminDvUrl}" --query accessToken -o tsv 2>/dev/null)
        [ -z "$token" ] && exit 1
        # Locate the L2 UAMI application user by clientId.
        users=$(az rest --method get \
          --uri "{adminDvUrl}/api/data/v9.2/systemusers?\$filter=applicationid%20eq%20{l2UamiClientId}&\$select=fullname,systemuserid" \
          --headers "Authorization=Bearer $token" 2>/dev/null)
        [ -z "$users" ] && exit 1
        echo "$users" | jq -e '(.value | length) > 0' >/dev/null || { echo "APP_USER_NOT_FOUND"; exit 1; }
        userid=$(echo "$users" | jq -r '.value[0].systemuserid')
        [ -z "$userid" ] || [ "$userid" = "null" ] && exit 1
        # Verify the Spaarke Provisioning Registry role is assigned.
        roles=$(az rest --method get \
          --uri "{adminDvUrl}/api/data/v9.2/systemusers($userid)/systemuserroles_association?\$select=name" \
          --headers "Authorization=Bearer $token" 2>/dev/null)
        echo "$roles" | jq -e '.value[] | select(.name == "Spaarke Provisioning Registry")' >/dev/null || { echo "MISSING_ROLE: Spaarke Provisioning Registry"; exit 1; }
        echo "OK: userid=$userid role=Spaarke Provisioning Registry"
      expect: L2 UAMI application user present in admin env (by clientId) with `Spaarke Provisioning Registry` role assigned via systemuserroles_association
    remediation: Path X registration script (per design.md §9.6 FR-38 + DS-8). One-time per env.
    related_findings: [FR-38, DS-8-uami-dv-appuser-maturity, spec.md-MUST-path-x]

