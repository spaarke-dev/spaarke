# PROVISIONING-PREREQUISITES — canonical manifest
#
# Purpose: machine-parseable source of truth for every manual prerequisite
# that must be in place BEFORE a customer provisioning run can start end-to-end.
# Consumers: (a) `/provision-environment` skill Step 0.5 (task 203 wires the read);
# (b) `docs/guides/PROVISIONING-PREREQUISITES.md` renders the human-readable view.
#
# Owner directive 2026-08-24 SESSION 5 (BINDING):
#   "these need to be actually documented somewhere that can then feed into the
#    process; this needs to be formalized e.g., a file, an app, a table—something
#    that is codified"
# This file is the codification. Prose narrative lives in the sibling markdown.
#
# Owner directive 2026-08-24 SESSION 5 (BINDING):
#   "don't remove container types — creating new container types are one
#    prerequisite outside the provisioning automation"
# SPE container-type entries in `once_per_tenant` MUST be KEEP-only (never delete).
#
# Schema:
#   scope: once_per_tenant | once_per_subscription | once_per_env | once_per_customer
#   frequency: how often check + apply (informational)
#   owner: who performs the manual step
#   consequence_of_absence: what fails and how the failure surfaces
#   check_recipe.cli: <shell> command that returns present/absent/version deterministically
#   check_recipe.expect: what the recipe's output looks like when the prereq IS satisfied
#   remediation: how to satisfy (link to guide/script or inline steps)
#   related_findings: F-<n> / audit-gap-<nn> / c<n>.<n> lesson IDs for traceability
#   never_delete: if true, provisioning MUST NOT delete/replace even on drift
#
# Version discipline: change `schema_version` when the schema itself changes;
# increment `manifest_version` for content changes only.

