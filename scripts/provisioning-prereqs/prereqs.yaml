        result=$(az keyvault secret list --vault-name "sprk-{env}-kv" --query "[].name" -o tsv 2>/dev/null)
        [ -z "$result" ] && { echo "EMPTY_KV: sprk-{env}-kv has zero secrets — seeder never ran (audit-gap-09)"; exit 1; }
        echo "OK: platform KV populated with $(echo "$result" | wc -l) secret(s) — verify canonical parity via ArchTest"
      expect: contains every canonical secret name listed in `scripts/canonical-secret-catalog/manifest.yaml` § `secrets`
    remediation: Author + run `Seed-PlatformKeyVault.ps1` (audit-gap-09; task 084 canonical manifest already provides source-of-truth).
    related_findings: [audit-gap-09-platform-kv-secrets-unseeded]

