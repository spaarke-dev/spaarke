  - id: PRQ-E-03
    name: L2 UAMI has Storage Blob Data Reader on artifacts storage
    scope: once_per_env
    frequency: once per env
    owner: Spaarke platform admin
    consequence_of_absence: H2a / H9 artifact download 403.
    check_recipe:
      cli: |
        # Bucket B HIGH#9 SESSION 18 — exit-1 hardening (see PRQ-T-03).
        result=$(az role assignment list --assignee {l2UamiPrincipalId} --scope "{artifactsStorageId}" --query "[?roleDefinitionName=='Storage Blob Data Reader']" -o tsv 2>/dev/null)
