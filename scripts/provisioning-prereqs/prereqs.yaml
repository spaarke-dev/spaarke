# PROVISIONING-PREREQUISITES — canonical manifest
#
# Purpose: machine-parseable source of truth for every manual prerequisite
# that must be in place BEFORE a customer provisioning run can start end-to-end.
# Consumers: (a) `/provision-environment` skill Step 0.5 (task 203 wires the read);
# (b) `docs/guides/PROVISIONING-PREREQUISITES.md` renders the human-readable view.
#
# Owner directive 2026-08-24 SESSION 5 (BINDING):
#   "these need to be actually documented somewhere that can then feed into the
#    process; this needs to be formalized e.g., a file, an app, a table—something
#    that is codified"
# This file is the codification. Prose narrative lives in the sibling markdown.
#
# Owner directive 2026-08-24 SESSION 5 (BINDING):
#   "don't remove container types — creating new container types are one
#    prerequisite outside the provisioning automation"
# SPE container-type entries in `once_per_tenant` MUST be KEEP-only (never delete).
#
# Schema:
#   scope: once_per_tenant | once_per_subscription | once_per_env | once_per_customer
#   frequency: how often check + apply (informational)
#   owner: who performs the manual step
#   consequence_of_absence: what fails and how the failure surfaces
#   check_recipe.cli: <shell> command that returns present/absent/version deterministically
#   check_recipe.expect: what the recipe's output looks like when the prereq IS satisfied
#   remediation: how to satisfy (link to guide/script or inline steps)
#   related_findings: F-<n> / audit-gap-<nn> / c<n>.<n> lesson IDs for traceability
#   never_delete: if true, provisioning MUST NOT delete/replace even on drift
#
# Version discipline: change `schema_version` when the schema itself changes;
# increment `manifest_version` for content changes only.

schema_version: 1
manifest_version: 2
last_updated: 2026-08-27
author_task: customer-provisioning-orchestration-r1 / task 202
cross_ref_markdown: docs/guides/PROVISIONING-PREREQUISITES.md
cross_ref_deployment_guide: docs/guides/SPAARKE-CUSTOMER-DEPLOYMENT-GUIDE.md
cross_ref_skill: .claude/skills/provision-environment/SKILL.md

prereqs:

  # ============================================================================
  # ONCE-PER-TENANT (Spaarke Model 1 Prod tenant OR customer tenant Model 2)
  # ============================================================================

  - id: PRQ-T-01
    name: SPE container-type registered on Spaarke tenant
    scope: once_per_tenant
    frequency: once (do NOT recreate — 24h replication penalty)
    owner: Spaarke platform admin
    never_delete: true
    consequence_of_absence: H8 (SPE root container creation) fails with 404 on containerType lookup; downstream file-storage flows all fail.
    check_recipe:
      cli: |
        # PRQ-01 fix (2026-08-27): acquire Graph token in-line; do NOT reference an
        # undefined bash variable ($graphAppOnlyToken never existed in the invoking shell).
        # PRQ-08 fix (2026-08-27): jq -e assert response body `id` matches the requested
        # containerTypeId (silent-PASS on wrong tenant's container type otherwise).
        token=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv 2>/dev/null)
        [ -z "$token" ] && exit 1
        result=$(az rest --method get \
          --uri "https://graph.microsoft.com/v1.0/storage/fileStorage/containerTypes/{containerTypeId}" \
          --headers "Authorization=Bearer $token" 2>/dev/null)
        [ -z "$result" ] && exit 1
        echo "$result" | jq -e '.id == "{containerTypeId}"' >/dev/null || { echo "CONTAINER_TYPE_ID_MISMATCH"; exit 1; }
      expect: HTTP 200 with response body `.id == {containerTypeId}` (asserted via jq)
    remediation: See `docs/guides/SPAARKE-CUSTOMER-DEPLOYMENT-GUIDE.md` §2.4 lead-time. Container-type creation is out-of-scope for provisioning automation per owner directive 2026-08-24.
    related_findings: [F17-update, T051-h8-*, audit-gap-05-artifacts-storage-missing]

  - id: PRQ-T-02
    name: SPE container-type application permissions granted
    scope: once_per_tenant
    frequency: once per tenant (Model 2) or once per Spaarke tenant (Model 1)
    owner: customer tenant admin (Model 2) OR Spaarke admin (Model 1)
    consequence_of_absence: H8 succeeds but subsequent file-storage operations 403.
    check_recipe:
      cli: |
        # PRQ-01 fix (2026-08-27): acquire Graph token in-line (same trap as PRQ-T-01).
        # PRQ-08 fix (2026-08-27): jq -e assert response .value array is non-empty (at
        # least ONE grant exists). Strict per-app-reg-scope assertion deferred to Wave 4
        # SKILL.md (needs {bffAppId} substitution wired first).
        token=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv 2>/dev/null)
        [ -z "$token" ] && exit 1
        result=$(az rest --method get \
          --uri "https://graph.microsoft.com/beta/storage/fileStorage/containerTypes/{containerTypeId}/applicationPermissionGrants" \
          --headers "Authorization=Bearer $token" 2>/dev/null)
        [ -z "$result" ] && exit 1
        echo "$result" | jq -e '(.value | length) > 0' >/dev/null || { echo "NO_APPLICATION_PERMISSION_GRANTS"; exit 1; }
      expect: JSON with `.value` array non-empty (asserted via jq); strict per-app-reg scope-name assertion is deferred to Wave 4 (requires {bffAppId} substitution)
    remediation: See `docs/guides/SPAARKE-CUSTOMER-DEPLOYMENT-GUIDE.md` §2.4.

