      expect: non-empty
    remediation: Emit from Bicep (T1 handler enforces at run time). wave-4-drift-5 lesson — the retired shared Model 1 BFF UAMI (`sharedBffUami`, stack retired by T225a) lacked this grant.
    related_findings: [F16, wave-4-drift-5-shared-bff-uami-kv-secrets-user]

