  # ============================================================================
  # ONCE-PER-CUSTOMER (per customer stamp — validated at Step 2 preflight of each run)
  # ============================================================================

  - id: PRQ-C-01
    name: OpenAI regional TPM headroom for the pinned deployments
    scope: once_per_customer
    frequency: per run (Step 2 preflight)
    owner: Spaarke platform admin (or auto-support-ticket if plan present)
    consequence_of_absence: 'H2a fails with `InsufficientQuota - <model> - DataZoneStandard: limit is 0` (or too small) on a fresh subscription; H0 (task 247) refuses the run for the same reason, server-side.'
    check_recipe:
      cli: |
        set -o pipefail
        # Mirrors PinnedModelCatalog.RequestedTpmByQuotaName (quota name:requested TPM in thousands) - change both together.
        failed=0
        for pin in "OpenAI.DataZoneStandard.gpt-4o:150" "OpenAI.DataZoneStandard.gpt4.1-mini:200" "OpenAI.DataZoneStandard.text-embedding-3-large:350"; do
          q=$(echo "$pin" | cut -d: -f1); need=$(echo "$pin" | cut -d: -f2)
          row=$(az cognitiveservices usage list --location {openAiRegion} --query "[?name.value=='$q'].[limit,currentValue]" -o tsv | tr -d '\r' | sed -n 1p) || { echo "usage list failed in {openAiRegion}"; failed=1; continue; }
          [ -n "$row" ] || { echo "NO quota row '$q' in {openAiRegion}"; failed=1; continue; }
          limit=$(echo "$row" | cut -f1); cur=$(echo "$row" | cut -f2)
          awk -v l="$limit" -v c="$cur" -v n="$need" 'BEGIN { exit !(l - c >= n) }' || { echo "QUOTA $q: limit=$limit current=$cur needs $need more"; failed=1; }
        done
        [ "$failed" = 0 ] || exit 1
        echo ok
      expect: '`ok` - for each pinned deployment quota (gpt-4o 150, gpt4.1-mini 200, text-embedding-3-large 350 - DataZoneStandard, thousands of TPM) `limit - currentValue >= requested`; any shortfall or missing quota row exits 1'
    remediation: 'Support ticket via `az support tickets create` (requires PRQ-S-02 Support Plan). Fresh subs auto-grant the DataZoneStandard tiers of these three models (owner 2026-10-06, read in westus3); a different region or model may grant zero.'
    related_findings: [F5, NFR-12]

  - id: PRQ-C-02
    name: OpenAI model GA per region for each pinned version
    scope: once_per_customer
    frequency: per run (Step 2 preflight) — pins deprecate ~4-6 months after GA
    owner: Spaarke platform admin
    consequence_of_absence: '`ServiceModelDeprecated` at H2a deploy.'
    check_recipe:
      cli: |
        set -o pipefail
        # Mirrors PinnedModelCatalog.Models (model:version) - change both together.
        failed=0
        for pin in gpt-4o:2024-11-20 gpt-4.1-mini:2025-04-14 text-embedding-3-large:1; do
          m=$(echo "$pin" | cut -d: -f1); v=$(echo "$pin" | cut -d: -f2)
          st=$(az cognitiveservices model list --location {openAiRegion} --query "[?kind=='OpenAI' && model.name=='$m' && model.version=='$v'].model.lifecycleStatus" -o tsv | tr -d '\r' | sort -u) || { echo "model list failed in {openAiRegion}"; failed=1; continue; }
          [ -n "$st" ] || { echo "PIN NOT OFFERED: $m $v in {openAiRegion}"; failed=1; continue; }
          bad=$(echo "$st" | grep -vxE 'GenerallyAvailable|Legacy')
          [ -z "$bad" ] || { echo "PIN $m $v lifecycleStatus: $(echo $bad)"; failed=1; }
        done
        [ "$failed" = 0 ] || exit 1
        echo ok
      expect: '`ok` - each pinned model:version (gpt-4o 2024-11-20, gpt-4.1-mini 2025-04-14, text-embedding-3-large 1) is offered in the region and every listing is `GenerallyAvailable` or `Legacy`; `Deprecating`, `Deprecated`, `Preview` or absent exits 1'
    remediation: Bump the pinned version in `infrastructure/bicep/modules/openai.bicep` — its `deployments` default is the set `customer.bicep` deploys (customer.bicep passes no override).
    related_findings: [F1, F4, L-o1-model-status-lexicon]

  - id: PRQ-C-03
    name: Global resource-name availability (SB namespace, Cog Svc subdomain, Storage account)
    scope: once_per_customer
    frequency: per run (Step 2 preflight)
    owner: Spaarke platform admin
    consequence_of_absence: F10 — `NamespaceUnavailable` mid-deploy (~16m35s) with reserved suffix or global collision.
    check_recipe:
      cli: |
        set -o pipefail
        tok=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv | tr -d '\r') || exit 1
        [ -n "$tok" ] || { echo "no ARM access token - az login first"; exit 1; }
        # Names mirror infrastructure/bicep/customer.bicep (serviceBusName, storageAccountName, openAi/docIntelligence/contentSafety names).
        sb="spaarke-{customerId}-{stampEnvironment}-sbus"
        sa=$(printf 'sprk%s%ssa' '{customerId}' '{stampEnvironment}' | tr 'A-Z' 'a-z' | cut -c1-24)
        post() { # label url body key
          r=$(curl -sS -X POST -H "Authorization: Bearer $tok" -H "Content-Type: application/json" -d "$3" "$2") || { echo "$1: request failed"; return 1; }
          echo "$r" | grep -Eq "\"$4\": *true" && return 0
          echo "UNAVAILABLE $1: $r"; return 1
        }
        failed=0
        post "Service Bus namespace $sb" "https://management.azure.com/subscriptions/{stampSubscriptionId}/providers/Microsoft.ServiceBus/checkNameAvailability?api-version=2022-10-01-preview" "{\"name\":\"$sb\",\"type\":\"Microsoft.ServiceBus/namespaces\"}" nameAvailable || failed=1
        post "Storage account $sa" "https://management.azure.com/subscriptions/{stampSubscriptionId}/providers/Microsoft.Storage/checkNameAvailability?api-version=2023-01-01" "{\"name\":\"$sa\",\"type\":\"Microsoft.Storage/storageAccounts\"}" nameAvailable || failed=1
        for kind in openai docintel contentsafety; do
          n="sprk-{customerId}-{stampEnvironment}-$kind"
          post "Cognitive Services subdomain $n" "https://management.azure.com/subscriptions/{stampSubscriptionId}/providers/Microsoft.CognitiveServices/checkDomainAvailability?api-version=2023-05-01" "{\"subdomainName\":\"$n\",\"type\":\"Microsoft.CognitiveServices/accounts\"}" isSubdomainAvailable || failed=1
        done
        [ "$failed" = 0 ] || exit 1
        echo ok
      expect: "`ok` - the stamp's Service Bus namespace, storage account and the three Cognitive Services subdomains (openai, docintel, contentsafety) are all available; each unavailable name is printed with Azure's reason and the recipe exits 1. A run that already deployed some of them (resume) reports them unavailable - run this before the first attempt only"
    remediation: 'Adjust resource base name in bicepparam. Reserved suffixes to avoid: `-sb` (Service Bus namespace).'
    related_findings: [F10]

  - id: PRQ-C-04
