prereqs:
  # ============================================================================
  # ONCE-PER-TENANT (Spaarke Model 1 Prod tenant OR customer tenant Model 2)
  # ============================================================================

  - id: PRQ-T-01
    name: SPE container-type registered on Spaarke tenant
    scope: once_per_tenant
    frequency: once (do NOT recreate — 24h replication penalty)
    owner: Spaarke platform admin
    never_delete: true
    consequence_of_absence: H8 (SPE root container creation) fails with 404 on containerType lookup; downstream file-storage flows all fail.
    check_recipe:
      cli: |
        az rest --method get \
          --uri "https://graph.microsoft.com/v1.0/storage/fileStorage/containerTypes/{containerTypeId}" \
          --headers "Authorization=Bearer $graphAppOnlyToken"
      expect: HTTP 200 with matching containerTypeId in body
    remediation: See `docs/guides/SPAARKE-CUSTOMER-DEPLOYMENT-GUIDE.md` §2.4 lead-time. Container-type creation is out-of-scope for provisioning automation per owner directive 2026-08-24.
    related_findings: [F17-update, T051-h8-*, audit-gap-05-artifacts-storage-missing]

  - id: PRQ-T-02
    name: SPE container-type application permissions granted
    scope: once_per_tenant
    frequency: once per tenant (Model 2) or once per Spaarke tenant (Model 1)
    owner: customer tenant admin (Model 2) OR Spaarke admin (Model 1)
    consequence_of_absence: H8 succeeds but subsequent file-storage operations 403.
    check_recipe:
      cli: |
        az rest --method get \
          --uri "https://graph.microsoft.com/beta/storage/fileStorage/containerTypes/{containerTypeId}/applicationPermissionGrants" \
          --headers "Authorization=Bearer $graphAppOnlyToken"
      expect: JSON array of grants; presence of Spaarke BFF app-reg with `writeContent, readContent, delegated` scopes
    remediation: See `docs/guides/SPAARKE-CUSTOMER-DEPLOYMENT-GUIDE.md` §2.4.

  - id: PRQ-T-03
    name: Office add-in Outlook Entra app-reg exists
    scope: once_per_tenant
    frequency: once
    owner: Spaarke platform admin
    consequence_of_absence: Outlook add-in deploy step fails; email intake flows non-functional.
    check_recipe:
      cli: az ad app list --filter "displayName eq 'Spaarke Outlook Add-in {env}'" --query "[0].appId" -o tsv
      expect: non-empty GUID
    remediation: See `docs/guides/office-addins-deployment-checklist.md` (Appendix B).

  - id: PRQ-T-04
    name: Office add-in Word Entra app-reg exists
    scope: once_per_tenant
    frequency: once
    owner: Spaarke platform admin
    consequence_of_absence: Word add-in deploy step fails.
    check_recipe:
      cli: az ad app list --filter "displayName eq 'Spaarke Word Add-in {env}'" --query "[0].appId" -o tsv
      expect: non-empty GUID
    remediation: See `docs/guides/office-addins-deployment-checklist.md`.

  - id: PRQ-T-05
    name: Copilot bot Entra app-reg exists (if M365 Copilot integration in scope)
    scope: once_per_tenant
    frequency: once (optional per profile)
    owner: Spaarke platform admin
    consequence_of_absence: M365 Copilot / declarative-agent surface non-functional; other surfaces unaffected.
    check_recipe:
      cli: az ad app list --filter "displayName eq 'Spaarke Copilot Bot {env}'" --query "[0].appId" -o tsv
      expect: non-empty GUID
    remediation: See `docs/guides/M365-COPILOT-DEPLOYMENT-GUIDE.md`.

  - id: PRQ-T-06
    name: Power BI service principal (tenant Power BI service admin)
    scope: once_per_tenant
    frequency: once (only if tenant uses Power BI Embedded)
    owner: Power BI tenant admin
    consequence_of_absence: Power BI Embedded reports show unauthorized; H12b Power BI seed skipped.
    check_recipe:
      cli: az ad sp list --display-name "Power BI Service" --query "[0].id" -o tsv
      expect: non-empty GUID
    remediation: Power BI Admin Portal → Tenant settings → Service principals.

  # RETIRED 2026-09-28 by unified-access-control-r2 (D-12 + D-13).
  #
  # This entry described a SHARED MULTITENANT BFF app registration for a "Model 1 tier",
  # carried `never_delete: true`, and had an executable check_recipe that asserted such an
  # app EXISTS. All three are now wrong:
  #
  #   * D-13 (BINDING, do not re-open): the BFF Entra app registration is PER CUSTOMER, in
  #     BOTH models — Spaarke's tenant under Model 1, the customer's own tenant under
  #     Model 2. There is no shared/multitenant BFF app registration.
  #     `SharedBffAppRegistrationId` is a retired artifact.
  #   * D-12: the "Model 1 = shared trial/SMB tier" is retired. Model 1 is a dedicated
  #     stamp per customer in Spaarke's Azure tenant; Model 2 the same stamp in the
  #     customer's own tenant.
  #   * The per-customer app registration is created by provisioning automation (H3) on
  #     every run, so by this manifest's own definition it is a HANDLER concern, not a
  #     prerequisite. It is therefore not re-homed to another scope here.
  #
  # The id is retained (not deleted) so that references do not dangle.
  - id: PRQ-T-07
    name: 'RETIRED — multitenant BFF app-reg (superseded by D-13 per-customer BFF app registration)'
    scope: once_per_tenant
    status: retired
    retired_on: 2026-09-28
    retired_by: unified-access-control-r2 (D-12 + D-13)
    frequency: n/a — retired
    owner: n/a — retired
    consequence_of_absence: |
      None. Nothing depends on a shared multitenant BFF app registration. Each customer's
      BFF app registration is created per-customer by H3 during the provisioning run.
      🔴 Do NOT create a multitenant BFF app registration — D-13 forbids it (one credential
      would be accepted by the application user in every customer environment, and a shared
      app registration hits the unraisable 20-federated-identity-credential cap at customer 21).
    remediation: |
      Nothing to do. For the per-customer app registration, see
      `docs/guides/SPAARKE-CUSTOMER-DEPLOYMENT-GUIDE.md` and
      `projects/unified-access-control-r2/notes/D-13-per-customer-bff-app-registration.md`.
    related_findings: [D-12, D-13]

  # ============================================================================
  # THE CUSTOMER'S SUBSCRIPTION (T228: one subscription per customer, created by the operator — so these are
  # once_per_customer and read {stampSubscriptionId}, never the operator's current `az account`. Like every
  # once_per_customer entry they are not run by skill Step 0.5 (the subscription is known only after intake);
  # L2 enforces what matters server-side: H1 (tenant, one-customer, providers), H2a (Owner).)
  # ============================================================================

  - id: PRQ-S-00
    name: The customer's own Azure subscription exists and holds no other customer's stamp (the operator creates it)
    scope: once_per_customer
    frequency: once per customer, BEFORE the run (its id is the intake value subscriptionId)
    owner: Spaarke platform admin (Model 1 — in Spaarke's tenant); the customer's admin (Model 2)
    consequence_of_absence: "POST /api/runs refuses a run without subscriptionId (400 subscription-id-required) — for every model; nothing defaults or shares a subscription (ADR-027, T228). H1 refuses a subscription outside the run's tenant (subready-subscription-unreachable) or one already holding another customer's rg-spaarke-* resource group (subready-subscription-not-dedicated)."
    check_recipe:
      cli: |
        state=$(az account show --subscription {stampSubscriptionId} --query state -o tsv) || exit 1
        [ -z "$state" ] && exit 1
        [ "$state" = "Enabled" ] || exit 1
        others=$(az group list --subscription {stampSubscriptionId} --query "[?starts_with(name,'rg-spaarke-') && !starts_with(name,'rg-spaarke-{customerId}-')].name" -o tsv) || exit 1
        [ -n "$others" ] && { echo "$others"; exit 1; }
        echo ok
      expect: "`ok` — the subscription is Enabled and holds no rg-spaarke-* resource group other than this customer's"
    remediation: "Create a NEW subscription for the customer (Model 1: under Spaarke's billing account, in Spaarke's tenant), place it in the customer-subscriptions management group (ADR-027), grant PRQ-S-04, and enter its id as `subscriptionId` at intake. Never reuse another customer's subscription or the platform subscription."
    related_findings: [T228, ADR-027, G3]

  - id: PRQ-S-01
    name: Azure subscription billing-agreement type known
    scope: once_per_customer
    frequency: once per sub
    owner: Spaarke platform admin
    consequence_of_absence: Cost-envelope estimation unreliable; support-plan expectations wrong.
    check_recipe:
      cli: az account show --subscription {stampSubscriptionId} --query "subscriptionPolicies" -o json
      expect: JSON with `quotaId` populated (starts with `MSDN_`, `EnterpriseAgreement_`, `PayAsYouGo_`, `MicrosoftCustomerAgreement_`)
    remediation: Recorded in `provisioning-runs/{customerId}-{runId}/intake.md`. Informational.

  - id: PRQ-S-02
    name: Azure subscription has a Support Plan (Basic or better)
    scope: once_per_customer
    frequency: once per sub
    owner: Spaarke platform admin (or customer for CustomerOwned Model 2)
    consequence_of_absence: F9 — auto-support-ticket path unavailable when quota bump denied.
    check_recipe:
      cli: az rest --method get --url "https://management.azure.com/subscriptions/{stampSubscriptionId}/providers/Microsoft.Support/supportTickets?api-version=2020-04-01" -o none
      expect: HTTP 200; HTTP 403 = no plan
    remediation: Azure Portal → Help + Support → Support plans → Purchase Basic minimum.
    related_findings: [F9]

  - id: PRQ-S-03
    name: Resource-provider registration for required namespaces
    scope: once_per_customer
    frequency: once per sub (fresh subs)
    owner: Spaarke platform admin
    consequence_of_absence: F6 — `az deployment sub create` fails on unregistered provider even after `az provider register` reports success. Microsoft.Cache is for Azure Managed Redis (Microsoft.Cache/redisEnterprise), which every customer stamp deploys (task 242); L2 handler H1 registers it by default.
    check_recipe:
      cli: |
        for ns in Microsoft.Web Microsoft.Storage Microsoft.KeyVault Microsoft.CognitiveServices Microsoft.Search \
                  Microsoft.ServiceBus Microsoft.Cache Microsoft.DocumentDB Microsoft.OperationalInsights \
                  Microsoft.Insights Microsoft.ManagedIdentity Microsoft.ContainerRegistry; do
          echo "$ns=$(az provider show --namespace $ns --subscription {stampSubscriptionId} --query registrationState -o tsv)"
        done
      expect: every namespace prints `Registered`
    remediation: '`az provider register --namespace <ns>` then poll every 30s for 5 min. If still `NotRegistered`, try `az rest --method post ...?force=true`; if still failing, register via Azure Portal (some fresh subs require silent auth flow).'
    related_findings: [F6]

  - id: PRQ-S-04
    name: L2 control-plane UAMI has Owner on the customer's subscription
    scope: once_per_customer
    frequency: once per customer subscription (owner decision 2026-10-06, T228)
    owner: Spaarke platform admin (an Owner of the customer's subscription)
    consequence_of_absence: "H1 cannot list the subscription's resource groups or register resource providers; H2a cannot create rg-spaarke-{customerId}-{env} or deploy customer.bicep — which writes role assignments, so Contributor is not enough."
    check_recipe:
      cli: |
        r=$(az role assignment list --assignee {l2UamiPrincipalId} --scope "/subscriptions/{stampSubscriptionId}" --query "[?roleDefinitionName=='Owner'].id" -o tsv) || exit 1
        [ -z "$r" ] && exit 1
        echo ok
      expect: '`ok`'
    remediation: '`az deployment sub create --subscription {stampSubscriptionId} --location westus2 --template-file infrastructure/bicep/modules/controlplane-subscription-rbac.bicep --parameters principalId={l2UamiPrincipalId}` (idempotent). L2 never grants itself access to a subscription.'
    related_findings: [audit-gap-02-l2-uami-contributor, T228]

  - id: PRQ-S-05
    name: Operator has Owner or Contributor + User Access Administrator on target sub
    scope: once_per_customer
    frequency: per operator
    owner: sub owner
    consequence_of_absence: Operator's own KV data-plane bootstrap (F15/F18) via `az rest --method put` returns 403.
    check_recipe:
      cli: az role assignment list --assignee $(az ad signed-in-user show --query id -o tsv) --scope "/subscriptions/{stampSubscriptionId}" --query "[].roleDefinitionName" -o tsv
      expect: contains `Owner` OR (`Contributor` + `User Access Administrator`)
    remediation: Grant via Azure Portal → Subscription → Access control (IAM). Operator runs `/provision-environment` under their own AAD identity per NFR-11.
    related_findings: [F15, F18, NFR-11]

  # ============================================================================
  # ONCE-PER-ENV (Spaarke platform env: dev / prod — before ANY customer stamp)
  # ============================================================================

  - id: PRQ-E-01
    name: Platform artifacts storage account exists
    scope: once_per_env
    frequency: once per env
    owner: Spaarke platform admin (or L2 IaC deploy)
    consequence_of_absence: H2a ARM-JSON publish workflow + H9 BFF-zip publish workflow both fail cleanly (empty account name). Blocks EVERY new customer stamp.
    check_recipe:
      cli: az storage account show --name "sprk{env}artifacts" --query "properties.provisioningState" -o tsv
      expect: '`Succeeded`'
    remediation: Author `infrastructure/bicep/modules/controlplane-artifacts-storage.bicep` + wire into `platform-controlplane.bicep` (Wave G-8 Batch 2 / audit-gap-05).
    related_findings: [audit-gap-05-artifacts-storage-missing, h2a-bicep-precompile-ci-coord-pr]

  - id: PRQ-E-02
    name: Platform ACR exists (for L2 sidecar image)
    scope: once_per_env
    frequency: once per env
    owner: Spaarke platform admin
    consequence_of_absence: Sidecar image cannot be pushed; H14a (Exchange PS) permanently blocked; workflow references `vars.SIDECAR_ACR_LOGIN_SERVER` placeholder.
    check_recipe:
      cli: az acr show --name "sprk{env}acr" --query "provisioningState" -o tsv
      expect: '`Succeeded`'
    remediation: Author `infrastructure/bicep/modules/controlplane-acr.bicep` + wire into `platform-controlplane.bicep` (Wave G-8 Batch 2 / audit-gap-10).
    related_findings: [audit-gap-10-acr-sidecar-chain, sidecar-ci-workflow-coord-pr, T108-*]

  - id: PRQ-E-03
    name: L2 UAMI has Storage Blob Data Reader on artifacts storage
    scope: once_per_env
    frequency: once per env
    owner: Spaarke platform admin
    consequence_of_absence: H2a / H9 artifact download 403.
    check_recipe:
      cli: az role assignment list --assignee {l2UamiPrincipalId} --scope "{artifactsStorageId}" --query "[?roleDefinitionName=='Storage Blob Data Reader']" -o tsv
      expect: non-empty
    remediation: Emit from `platform-controlplane.bicep` role-assignment module (Wave G-8 Batch 2 / audit-gap-03).

  - id: PRQ-E-04
    name: L2 UAMI has AcrPull on platform ACR
    scope: once_per_env
    frequency: once per env
    owner: Spaarke platform admin
    consequence_of_absence: Sidecar image pull fails at H14a dispatch.
    check_recipe:
      cli: az role assignment list --assignee {l2UamiPrincipalId} --scope "{acrId}" --query "[?roleDefinitionName=='AcrPull']" -o tsv
      expect: non-empty
    remediation: Wave G-8 Batch 2 / audit-gap-04.

  # Scope corrected 2026-10-01 (T225a): the target is each customer stamp's own BFF App Service
  # (D-12 — there is no shared Model 1 BFF). It exists only after H2a, and customer.bicep emits the grant,
  # so this is an H2a POSTCONDITION, not a preflight: nothing runs this recipe automatically (Step 0.5b
  # skips once_per_customer; H0 runs before the BFF exists). It is here for an operator diagnosing a
  # H4b Kudu-log fetch failure after H2a. Id kept.
  - id: PRQ-E-05
    name: L2 UAMI has Website Contributor on a Model 1 customer stamp's BFF App Service (for Kudu docker log fetch)
    scope: once_per_customer
    frequency: once per Model 1 customer stamp (emitted by customer.bicep at H2a; Model 2 — not granted, task 249)
    owner: Spaarke platform admin (Bicep)
    consequence_of_absence: H4b `KuduContainerLogFetcher` cannot fetch fail-fast diagnostics on BFF boot failure — falls back to generic diagnostic + Kudu URL.
    check_recipe:
      cli: az role assignment list --assignee {l2UamiPrincipalId} --scope "/subscriptions/{stampSubscriptionId}/resourceGroups/rg-spaarke-{customerId}-{stampEnvironment}/providers/Microsoft.Web/sites/sprk-{customerId}-{stampEnvironment}-api" --query "[?roleDefinitionName=='Website Contributor']" -o tsv
      expect: non-empty
    remediation: "Emitted by `customer.bicep` (`modules/customer-l2-bff-rbac.bicep`) on **Model 1** stamps — H2a sends `controlPlaneUamiPrincipalId` from the Worker setting `ControlPlaneIdentity__PrincipalObjectId` (task 249; before it the parameter was never passed, so the grant was never created). Re-run H2a if missing. Not applicable to Model 2: the stamp is in the customer's tenant, where a role assignment cannot name a Spaarke-tenant principal; L2 reaches it through its Lighthouse delegation."
    related_findings: [T201-h4b-kudu-rbac-deferred, T225a, T249]

  # RETIRED 2026-09-30 by customer-provisioning-orchestration-r1 T226.
  #
  # This entry required the L2 UAMI to hold key-reading roles on the SHARED source
  # services (sprkshared{env}-openai/-docintel/-search/-servicebus/-storage/-redis) so the
  # H4-shared handler could copy their keys into a shared vault. T226 retired H4-shared and
  # the `from-shared-service` value source: every customer secret now comes from the
  # customer's own resources (customer.bicep kvSecretValues), and the dedicated-stamp model
  # has no shared source services. The role assignments it checked lived in
  # model1-shared-l2-rbac.bicep, retired with the other Model 1 templates by T225a (2026-10-01).
  #
  # The id is retained (not deleted) so that references do not dangle.
  - id: PRQ-E-06
    name: 'RETIRED — L2 UAMI key-reading RBAC on the shared source services (H4-shared retired by T226)'
    scope: once_per_env
    status: retired
    retired_on: 2026-09-30
    retired_by: customer-provisioning-orchestration-r1 T226
    frequency: n/a — retired
    owner: n/a — retired
    consequence_of_absence: |
      None. No handler reads a shared service's keys. H4b never depended on these roles — it
      writes KV references to the customer's own vault.
    remediation: |
      Nothing to do. See projects/customer-provisioning-orchestration-r1/notes/t226-shared-secret-read-path.md.
    related_findings: [T226, D-12, F19]

  - id: PRQ-E-07
    name: L2 UAMI has Graph app-role grants for provisioning-relevant roles
    scope: once_per_env
    frequency: once per env, refresh on `GraphAppRoles.cs` change
    owner: Spaarke platform admin (via `scripts/provisioning/Grant-ControlPlaneIdentity.ps1`)
    consequence_of_absence: L2 handlers H7/H10/H11/H12c cannot authenticate to Graph; every Graph call 403s silently.
    check_recipe:
      cli: az rest --method get --url "https://graph.microsoft.com/v1.0/servicePrincipals(appId='{graphAppId}')/appRoleAssignments?$filter=principalId eq {l2UamiSpId}" --query "value[].id" -o tsv
      expect: non-empty array; count matches expected role list in `GraphAppRoles.cs`
    remediation: 'Run `Grant-ControlPlaneIdentity.ps1` (audit-gap DS-5 c5.8). ⚠ Prerequisite: 11 of 14 null GUIDs in `GraphAppRoles.cs` completed via `spec.md` MUST rule.'
    related_findings: [c5.8-l2-uami-graph-and-dataverse-grants, T3-graph-app-role-parity]

  - id: PRQ-E-08
    name: L2 UAMI is Dataverse Application User on admin env (Path X, scoped role)
    scope: once_per_env
    frequency: once per env
    owner: Spaarke platform admin
    consequence_of_absence: L2 cannot read/write `sprk_dataverseenvironment` registry rows; registry-driven flows all fail.
    check_recipe:
      cli: |
        pac org list-users --environment "{adminDvUrl}" --query "[?applicationId=='{l2UamiClientId}'].{name:fullname, role:securityroles}" -o json
      expect: non-empty; `securityroles` includes `Spaarke Provisioning Registry`
    remediation: Path X registration script (per design.md §9.6 FR-38 + DS-8). One-time per env.
    related_findings: [FR-38, DS-8-uami-dv-appuser-maturity, spec.md-MUST-path-x]

  - id: PRQ-E-09
    name: Platform KV secrets pre-seeded (fresh envs)
    scope: once_per_env
    frequency: once per env, on drift
    owner: Spaarke platform admin (via `scripts/provisioning/Seed-PlatformKeyVault.ps1`)
    consequence_of_absence: L2 config `.ValidateOnStart()` returns non-empty garbage strings (literal `@Microsoft.KeyVault(...)` refs) → T1-family silent fail propagates garbage as secret values.
    check_recipe:
      cli: az keyvault secret list --vault-name "sprk-{env}-kv" --query "[].name" -o tsv
      expect: contains every canonical secret name listed in `scripts/canonical-secret-catalog/manifest.yaml` § `secrets`
    remediation: Author + run `Seed-PlatformKeyVault.ps1` (audit-gap-09; task 084 canonical manifest already provides source-of-truth).
    related_findings: [audit-gap-09-platform-kv-secrets-unseeded]

  - id: PRQ-E-10
    name: L2 UAMI has KV Secrets User (data-plane RBAC) on platform + per-tenant KVs
    scope: once_per_env
    frequency: once per KV
    owner: Spaarke platform admin
    consequence_of_absence: F16 — BFF's `@Microsoft.KeyVault(...)` refs silently unresolvable; `keyVaultReferenceIdentity` binding invalid.
    check_recipe:
