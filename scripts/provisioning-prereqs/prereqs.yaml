        az rest --method post \
          --url "https://management.azure.com/subscriptions/{sub}/providers/Microsoft.ServiceBus/checkNameAvailability?api-version=2022-10-01-preview" \
          --body '{"name":"{sbName}","type":"Microsoft.ServiceBus/namespaces"}'
      expect: '`{"nameAvailable": true}`'
