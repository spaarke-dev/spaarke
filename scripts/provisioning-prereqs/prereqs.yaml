    name: Platform KV secrets pre-seeded (fresh envs)
    scope: once_per_env
    frequency: once per env, on drift
    owner: Spaarke platform admin (via `scripts/provisioning/Seed-PlatformKeyVault.ps1`)
    consequence_of_absence: L2 config `.ValidateOnStart()` returns non-empty garbage strings (literal `@Microsoft.KeyVault(...)` refs) → T1-family silent fail propagates garbage as secret values.
    check_recipe:
      cli: |
        # Bucket B HIGH#9 SESSION 18 — exit-1 hardening (see PRQ-T-03).
        # Note: this is a presence-check only (any non-empty result = "vault has SOME secrets").
        # Full canonical-catalog parity is enforced by the L2 boot-time IdentityConfigurationValidator
        # + the ArchTest suite — replicating that here would duplicate scope. This gate catches the
        # obvious silent-fail: an empty vault (fresh env, seeder never ran) that would let L2 boot
