  - id: PRQ-E-06
    name: L2 UAMI has Cognitive Services User / Search Service Contributor / Service Bus Data Owner / Storage Account Contributor / Redis Cache Contributor on ALL shared source services
    scope: once_per_env
    frequency: once per env
    owner: Spaarke platform admin
    consequence_of_absence: H4-shared handler cannot extract credentials from source services (F19 automation blocked); H4b handler cannot bind KV refs (F20 automation blocked).
    check_recipe:
      cli: |
        # PRQ-03 fix (2026-08-27): assert the EXACT required role per service.
        # Prior loop dumped every roleDefinitionName without asserting the SPECIFIC
        # role required per svc — ANY role assignment (even irrelevant) would satisfy
        # a naive exit-1-on-empty guard. F19/F20 silent-pass class.
        # Per-service required role map from task 200 Deferred Item #1 (SESSION 4 handoff).
        declare -A svc_roles=(
          [openai]="Cognitive Services User"
          [docintel]="Cognitive Services User"
          [search]="Search Service Contributor"
          [servicebus]="Azure Service Bus Data Owner"
          [storage]="Storage Account Contributor"
          [redis]="Redis Cache Contributor"
        )
        failed=0
        for svc in "${!svc_roles[@]}"; do
          scope=$(az resource show --resource-group rg-spaarke-shared-{env} --name sprkshared{env}-$svc --query id -o tsv 2>/dev/null)
          if [ -z "$scope" ]; then echo "$svc=RESOURCE_NOT_FOUND"; failed=1; continue; fi
          expected_role="${svc_roles[$svc]}"
          found=$(az role assignment list --assignee {l2UamiPrincipalId} --scope "$scope" \
            --query "[?roleDefinitionName=='$expected_role'].roleDefinitionName" -o tsv 2>/dev/null)
          if [ -z "$found" ]; then echo "$svc=MISSING_ROLE:$expected_role"; failed=1; else echo "$svc=OK($found)"; fi
        done
        [ "$failed" -eq 0 ] || exit 1
      expect: each service reports OK with its required role (openai/docintel=Cognitive Services User, search=Search Service Contributor, servicebus=Azure Service Bus Data Owner, storage=Storage Account Contributor, redis=Redis Cache Contributor)
    remediation: Extend `stacks/model1-shared.bicep` role-assignment module (task 200 Deferred Item #1). List of role/service pairs in `current-task.md` SESSION 4 handoff §RECOMMENDED.
    related_findings: [T200-h4shared-*, F19, F20]

