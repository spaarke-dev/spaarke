        # PRQ-02 fix (2026-08-27): SERVER-SIDE-ONLY. This check requires a token issued
        # by the CUSTOMER tenant (not the Spaarke operator tenant) — the operator does
        # NOT hold such credentials at Step 0.5 time. The H0.5 handler in L2 control-plane
        # performs this verification via its own multitenant app-only token flow.
        # Operator-side check is intentionally skipped (explicit exit 0).
        echo "PRQ-C-05: server-side-only — verified by H0.5 handler in L2 control-plane"
        exit 0
      expect: (server-side only — H0.5 handler in L2 control-plane verifies via multitenant app-only token flow; operator-side check intentionally skipped because operator does not hold a customer-tenant token at Step 0.5 time)
    remediation: Skill Step 5a auto-emits consent URL + polls callback (H0.5). Model 1 uses shared multitenant BFF app — Spaarke tenant consents once.

  - id: PRQ-C-06
    name: Dataverse org-settings contract satisfied (maxuploadfilesize ≥ 25MB)
    scope: once_per_customer
    frequency: per run (Step 2 preflight OR H6 pre-import)
    owner: Spaarke platform admin (auto-applied by H6)
    consequence_of_absence: F14 — SpaarkeMaster solution import fails 5min in on Spaarke.Controls.UniversalDocumentUpload (`Webresource content size too big`).
    check_recipe:
      cli: |
        # PRQ-03 fix (2026-08-27): assert numeric threshold >= 25600000. Prior recipe
        # dumped `value` without comparison — default 5MB (5242880) silent-PASSed and
        # F14 (SpaarkeMaster import fail 5min in on UniversalDocumentUpload
        # "Webresource content size too big") reproduced on every fresh env.
        value=$(pac org list-settings --environment {dvUrl} --name maxuploadfilesize --query value -o tsv 2>/dev/null)
        if [ -z "$value" ]; then echo "SETTING_NOT_FOUND"; exit 1; fi
        # Must be an integer >= 25600000.
        case "$value" in
          ''|*[!0-9]*) echo "NON_NUMERIC_VALUE:$value"; exit 1;;
        esac
        if [ "$value" -lt 25600000 ]; then
          echo "TOO_SMALL: maxuploadfilesize=$value (required >= 25600000)"; exit 1
        fi
        echo "OK: maxuploadfilesize=$value"
      expect: numeric integer value `>= 25600000` (25 MB)
    remediation: "`pac org update-settings --name maxuploadfilesize --value 25600000`. Add Org Settings Contract to r1 handler catalog."
    related_findings: [F14]

  - id: PRQ-C-07
    name: Required Applications manifest satisfied (Power BI Anchor + others)
    scope: once_per_customer
    frequency: per run (Step 2 preflight OR H6 pre-import)
    owner: Spaarke platform admin (auto-applied by H6)
    consequence_of_absence: F13 — SpaarkeMaster import fails on Power BI dependency; `--skip-dependency-check` does NOT help (not a product-update dep).
    check_recipe:
      cli: |
        # Bucket B MED#9 SESSION 18 (customer-provisioning-orchestration-r1
        # adversarial e2e verify workflow wepdcb8we): PRIOR recipe used
        # `pac application list ... | Select-String "$app"` — Select-String is a
        # PowerShell CMDLET, NOT a bash command. Under the `bash -c` wrapper in
        # SKILL.md Step 0.5b it produces `/bin/bash: line N: Select-String:
        # command not found` (exit 127) on every operator machine. Operators
        # (correctly) recognize the author bug + skip via -SkipStep0_5, then hit
        # F13 downstream anyway.
        # Fix: POSIX-native `grep -q` with explicit exit-1-on-missing per the
        # Bucket B HIGH#9 recipe author contract (validate-recipe-authoring.ps1).
        output=$(pac application list --environment {dvUrl} 2>/dev/null)
        [ -z "$output" ] && { echo "PAC_LIST_EMPTY: pac application list returned empty for {dvUrl}"; exit 1; }
        failed=0
        for app in msft_PowerBI_Anchor; do
          if echo "$output" | grep -q "$app"; then
            echo "OK: $app present"
          else
            echo "MISSING_APP: $app"
            failed=1
          fi
        done
        [ "$failed" -eq 0 ] || exit 1
      expect: each app present
    remediation: "`pac application install --application-name msft_PowerBI_Anchor` (~6 min)."
    related_findings: [F13]
