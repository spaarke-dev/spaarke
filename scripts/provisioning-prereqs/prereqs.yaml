  # ============================================================================
  # ONCE-PER-SUBSCRIPTION (fresh Azure sub, before first customer stamp)
  # ============================================================================

  - id: PRQ-S-01
    name: Azure subscription billing-agreement type known
    scope: once_per_subscription
    frequency: once per sub
    owner: Spaarke platform admin
    consequence_of_absence: Cost-envelope estimation unreliable; support-plan expectations wrong.
    check_recipe:
      cli: |
        # NO-EXIT-1-GUARD-JUSTIFIED: this recipe is READ-ONLY INFORMATIONAL —
        # billing-agreement type is recorded to intake.md, not gated on. An empty
        # result here means the operator's az context does not have policy read
        # perms; that is diagnostic, not a HARD STOP. Bucket B HIGH#9 SESSION 18
        # validate-recipe-authoring.ps1 whitelists this class via the marker
        # comment above.
        az account show --query "subscriptionPolicies" -o json
      expect: JSON with `quotaId` populated (starts with `MSDN_`, `EnterpriseAgreement_`, `PayAsYouGo_`, `MicrosoftCustomerAgreement_`)
    remediation: Recorded in `provisioning-runs/{customerId}-{runId}/intake.md`. Informational.

  - id: PRQ-S-02
    name: Azure subscription has a Support Plan (Basic or better)
    scope: once_per_subscription
    frequency: once per sub
    owner: Spaarke platform admin (or customer for CustomerOwned Model 2)
    consequence_of_absence: F9 — auto-support-ticket path unavailable when quota bump denied.
    check_recipe:
      cli: |
        # PRQ-09 fix (2026-08-27): distinguish 200 (OK) vs 403 (no plan) vs other
        # (network / auth / transient 500). Prior recipe used `-o none` which discarded
        # the HTTP status — every non-200 became an opaque exit-1 that operator MIGHT
        # read as "no support plan" but was equally likely to be a transient auth issue.
        # Use --resource + curl-style status inspection via az's --debug output is heavy;
        # simpler: use `--only-show-errors` + exit-code inspection, and probe stderr for
        # ForbiddenError signature vs other errors.
        stderr=$(az rest --method get \
          --url "https://management.azure.com/providers/Microsoft.Support/supportTickets?api-version=2020-04-01" \
          --only-show-errors -o none 2>&1)
        rc=$?
        if [ "$rc" -eq 0 ]; then
          echo "OK: support plan present (HTTP 200)"
          exit 0
        fi
        # Non-zero exit: classify by stderr fingerprint.
        # az returns ForbiddenError / SubscriptionNotRegistered for missing support plan.
        if echo "$stderr" | grep -qiE "(ForbiddenError|AuthorizationFailed|no support plan|SubscriptionHasNoSupport)"; then
          echo "NO_SUPPORT_PLAN (HTTP 403): $stderr"
          exit 1
        fi
        # Anything else (network, transient 5xx, token expiry) — treat as transient
        # and surface distinct diagnostic so operator does not misread as no-plan.
        echo "TRANSIENT_OR_AUTH_ERROR: $stderr"
        exit 1
      expect: HTTP 200 (support plan present) → OK; ForbiddenError/AuthorizationFailed/SubscriptionHasNoSupport in stderr → NO_SUPPORT_PLAN; any other non-zero → TRANSIENT_OR_AUTH_ERROR (distinct diagnostic — remediation is retry/auth-refresh, NOT support-plan purchase)
    remediation: Azure Portal → Help + Support → Support plans → Purchase Basic minimum.
    related_findings: [F9]

  - id: PRQ-S-03
    name: Resource-provider registration for required namespaces
    scope: once_per_subscription
    frequency: once per sub (fresh subs)
    owner: Spaarke platform admin
    consequence_of_absence: F6 — `az deployment sub create` fails on unregistered provider even after `az provider register` reports success.
    check_recipe:
      cli: |
        # PRQ-04 fix (2026-08-27): rewrite loop with `failed=0` flag so a single
        # unregistered namespace makes the recipe exit 1. Prior version echoed each
        # state but always exited 0 — F6 (the failure this prereq exists to catch)
        # would silent-pass.
        failed=0
        for ns in Microsoft.Web Microsoft.Storage Microsoft.KeyVault Microsoft.CognitiveServices Microsoft.Search \
                  Microsoft.ServiceBus Microsoft.Cache Microsoft.DocumentDB Microsoft.OperationalInsights \
                  Microsoft.Insights Microsoft.ManagedIdentity Microsoft.ContainerRegistry; do
          state=$(az provider show --namespace $ns --query registrationState -o tsv 2>/dev/null)
          echo "$ns=$state"
          if [ "$state" != "Registered" ]; then failed=1; fi
        done
        [ "$failed" -eq 0 ] || exit 1
      expect: every namespace prints `Registered`
    remediation: "`az provider register --namespace <ns>` then poll every 30s for 5 min. If still `NotRegistered`, try `az rest --method post ...?force=true`; if still failing, register via Azure Portal (some fresh subs require silent auth flow)."
    related_findings: [F6]

  - id: PRQ-S-04
    name: L2 UAMI has Subscription Contributor on target sub
    scope: once_per_subscription
    frequency: once per sub, per L2 UAMI
    owner: Spaarke platform admin
    consequence_of_absence: H2a ArmDeploymentRunner 403s on sub-scope deployment.
    check_recipe:
      cli: |
        # Bucket B HIGH#9 SESSION 18 — exit-1 hardening (see PRQ-T-03).
        result=$(az role assignment list --assignee {l2UamiPrincipalId} --scope "/subscriptions/{subId}" --query "[?roleDefinitionName=='Contributor']" -o tsv 2>/dev/null)
        [ -z "$result" ] && { echo "MISSING_ROLE: L2 UAMI has no Contributor on /subscriptions/{subId}"; exit 1; }
        echo "OK: Contributor assignment present"
      expect: non-empty
    remediation: "`az role assignment create --assignee {l2UamiPrincipalId} --scope /subscriptions/{subId} --role Contributor`."
    related_findings: [audit-gap-02-l2-uami-contributor]

  - id: PRQ-S-05
    name: Operator has Owner or Contributor + User Access Administrator on target sub
    scope: once_per_subscription
    frequency: per operator
    owner: sub owner
    consequence_of_absence: Operator's own KV data-plane bootstrap (F15/F18) via `az rest --method put` returns 403.
    check_recipe:
      cli: |
        # Bucket B HIGH#9 SESSION 18 — exit-1 hardening + explicit role-set assertion.
        # The prior recipe dumped role names via -o tsv but had no downstream check that
        # the correct set was present. Now verify explicitly.
        roles=$(az role assignment list --assignee $(az ad signed-in-user show --query id -o tsv) --scope "/subscriptions/{subId}" --query "[].roleDefinitionName" -o tsv 2>/dev/null)
        [ -z "$roles" ] && { echo "NO_ROLE_ASSIGNMENTS: operator has no role on /subscriptions/{subId}"; exit 1; }
        # Owner is sufficient by itself.
        if echo "$roles" | grep -q "^Owner$"; then echo "OK: Owner"; exit 0; fi
        # Otherwise require BOTH Contributor + User Access Administrator.
        has_contrib=$(echo "$roles" | grep -c "^Contributor$" || true)
        has_uaa=$(echo "$roles" | grep -c "^User Access Administrator$" || true)
        if [ "$has_contrib" -ge 1 ] && [ "$has_uaa" -ge 1 ]; then echo "OK: Contributor + User Access Administrator"; exit 0; fi
        echo "INSUFFICIENT_ROLES: operator has [$(echo "$roles" | tr '\n' ',' | sed 's/,$//')] — requires Owner OR (Contributor + User Access Administrator)"
        exit 1
      expect: contains `Owner` OR (`Contributor` + `User Access Administrator`)
    remediation: Grant via Azure Portal → Subscription → Access control (IAM). Operator runs `/provision-environment` under their own AAD identity per NFR-11.
    related_findings: [F15, F18, NFR-11]

  - id: PRQ-S-15
    name: L2 App Service + Worker outbound egress reaches every downstream endpoint
    scope: once_per_subscription
    frequency: once per L2 deploy (re-run after VNet / NSG / firewall / Private-Endpoint changes)
    owner: Spaarke platform admin
    consequence_of_absence: |
      COMP-02 (customer-provisioning-orchestration-r1 Wave 7 completeness sweep, 2026-08-27).
      A customer stamp whose subscription has SafeList / NSG / Private-Endpoint
      restrictions applied to the L2 App Service will silently HANG on outbound
      TCP for 60+s per handler, then surface a generic HttpRequestException.
      FailureClassifier maps HttpRequestException to Resumable so the run does
      NOT quarantine — but every H1/H3/H5/H6/H7/H9/H10/H11 dispatch pays the
      60s stall, turning a 20-min provision into a >2h grind before the
      operator abandons. Fail-fast at prereqs instead.
    check_recipe:
      cli: |
        # PRQ-S-15 (COMP-02): probe every downstream endpoint the L2 App
        # Service must reach. MUST be executed FROM THE L2 App Service (via
        # `az webapp ssh` or SCM console-run) — a local operator probe from
        # a laptop proves nothing about the deployed egress path. Each probe
        # is a bare TCP-level reachability check; auth is deliberately NOT
        # attempted (a 401/403 response is proof of network reachability,
        # which is what this prereq validates).
        set -e
        endpoints=(
          "https://management.azure.com/"
          "https://graph.microsoft.com/v1.0/"
          "https://{customerDataverseHost}/api/data/v9.2/"
          "https://{platformKvName}.vault.azure.net/"
          "https://{customerKvName}.vault.azure.net/"
          "https://{cosmosAccountName}.documents.azure.com/"
          "https://{acrName}.azurecr.io/v2/"
          "https://{serviceBusFqn}/"
        )
        for e in "${endpoints[@]}"; do
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$e" || echo "TIMEOUT")
          echo "$e -> $code"
          [ "$code" = "TIMEOUT" ] && { echo "EGRESS_TIMEOUT: $e"; exit 1; }
          [ "$code" = "000" ]     && { echo "EGRESS_UNREACHABLE: $e"; exit 1; }
        done
      expect: every endpoint returns any HTTP status (401/403/404 acceptable — proves reachability); NO `TIMEOUT` or `000` (DNS / TCP-level unreachable).
    remediation: Add the L2 App Service's outbound IP (or the delegated subnet) to each downstream service's firewall allow-list; if VNet-integrated, ensure Private-Endpoint DNS zones resolve for management.azure.com / graph.microsoft.com / *.crm.dynamics.com / *.vault.azure.net / *.documents.azure.com / *.servicebus.windows.net / *.azurecr.io.
    related_findings: [COMP-02]

  - id: PRQ-S-16
    name: Service Bus namespace is Standard tier or higher AND DLQ drain recipe documented
    scope: once_per_subscription
    frequency: once per L2 deploy
    owner: Spaarke platform admin
    consequence_of_absence: |
      COMP-09 (customer-provisioning-orchestration-r1 Wave 7 completeness sweep, 2026-08-27).
      Basic tier does NOT support sessions (required for §4D I5 same-customer
      FIFO ordering) NOR level-1 duplicate detection (required by
      ServiceBusHandlerEnqueuer.ComputeMessageId per task 107). Basic-tier
      deploy = silent per-customer message-interleaving + retry-storm on the
      §4C RetryableWithCleanup path.

      The Standard 256 KB per-message cap is now enforced client-side by
      ServiceBusModuleOptions.MaxEnvelopeBodyBytes (default 224 KB — see
      COMP-09 code) so an oversize envelope fails fast at enqueue. Premium
      raises the cap to 1 MB.

      DLQ has no operator drain path today — a poison-message backlog
      accumulates silently. Runbook must document the `az servicebus queue
      subscription` peek + delete recipe.
    check_recipe:
      cli: |
        # PRQ-S-16 (COMP-09): assert SB namespace tier + session-enabled queue
        # + duplicate-detection window match the enforcement invariants.
        set -e
        tier=$(az servicebus namespace show --name "{serviceBusNamespaceName}" --resource-group "{platformRg}" --query "sku.tier" -o tsv 2>/dev/null)
        [ "$tier" = "Basic" ] && { echo "SB_TIER_BASIC: sessions + dedup unsupported"; exit 1; }
        [ -z "$tier" ]         && { echo "SB_NAMESPACE_NOT_FOUND"; exit 1; }
        session=$(az servicebus queue show --namespace-name "{serviceBusNamespaceName}" --resource-group "{platformRg}" --name "sprk-provisioning-jobs" --query "requiresSession" -o tsv 2>/dev/null)
        [ "$session" != "true" ] && { echo "SB_QUEUE_SESSIONLESS: §4D I5 violation"; exit 1; }
        dedup=$(az servicebus queue show --namespace-name "{serviceBusNamespaceName}" --resource-group "{platformRg}" --name "sprk-provisioning-jobs" --query "requiresDuplicateDetection" -o tsv 2>/dev/null)
        [ "$dedup" != "true" ] && { echo "SB_QUEUE_NO_DEDUP: level-1 idempotency broken"; exit 1; }
        echo "SB_OK tier=$tier sessions=$session dedup=$dedup"
      expect: |
        `SB_OK tier=Standard sessions=true dedup=true` (or `tier=Premium`).
    remediation: |
      1. `az servicebus namespace update --sku Standard` (or Premium for the 1 MB cap).
      2. Recreate the queue with `--enable-session true --enable-duplicate-detection true --duplicate-detection-history-time-window PT1H` if not currently set.
      3. DLQ drain recipe (operator runbook):
         `az servicebus queue subscription show --namespace-name ... --queue-name sprk-provisioning-jobs/$deadletterqueue` — peek dead-lettered messages;
         resubmit via a bespoke replay script once root cause is fixed. Silent-fail warning: a DLQ backlog without an alert is invisible.
    related_findings: [COMP-09]

