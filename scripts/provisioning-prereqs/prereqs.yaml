  - id: PRQ-C-06
    name: Dataverse org-settings contract satisfied (maxuploadfilesize ≥ 25MB)
    scope: once_per_customer
    frequency: per run (Step 2 preflight OR H6 pre-import)
    owner: Spaarke platform admin (auto-applied by H6)
    consequence_of_absence: F14 — SpaarkeMaster solution import fails 5min in on Spaarke.Controls.UniversalDocumentUpload (`Webresource content size too big`).
    check_recipe:
      cli: |
        set -o pipefail
        res=$(echo "{dvUrl}" | sed 's#/$##')
        v=$(az rest --method get --resource "$res" --url "$res/api/data/v9.2/organizations?\$select=maxuploadfilesize" --query "value[0].maxuploadfilesize" -o tsv | tr -d '\r') || { echo "cannot read organization.maxuploadfilesize on $res"; exit 1; }
        [ -n "$v" ] || { echo "organization.maxuploadfilesize is empty on $res"; exit 1; }
        [ "$v" -ge 25600000 ] 2>/dev/null || { echo "maxuploadfilesize=$v is below 25600000 on $res - pac org update-settings --name maxuploadfilesize --value 25600000"; exit 1; }
        echo ok
      expect: '`ok` - `organization.maxuploadfilesize` is a number >= 25600000 (the 5242880 default exits 1)'
    remediation: 'Nothing to do before the run: H6 applies it before the import (Dataverse Web API `organization` PATCH as its importer identity — T253; no pac on the Worker). By hand: `pac org update-settings --name maxuploadfilesize --value 25600000`.'
    related_findings: [F14, T253]

  - id: PRQ-C-07
    name: 'RETIRED — required Power Platform applications (Power BI Extensions, msft_PowerBI_Anchor)'
