  - id: PRQ-C-08
    name: Exchange mail-enabled security group scoping the stamp identity's Exchange mailbox roles (H14a)
    scope: once_per_customer
    frequency: once per customer, BEFORE the run (its id is an intake value — exchangePolicyScopeGroupId)
    owner: Exchange Online admin of the stamp's tenant (the customer's for Model 2; Spaarke's for Model 1)
    consequence_of_absence: "POST /api/runs refuses the run (400 h14a-missing-policy-scope-group-id). With a wrong id, H14a cannot scope the stamp identity's Exchange mailbox roles and fails; the stamp's Mail.* calls 403 (trap T4). Only DIRECT members count — nested groups are not honoured."
    check_recipe:
      cli: |
        pwsh -NoProfile -Command "Connect-ExchangeOnline -ShowBanner:\$false; (Get-DistributionGroup -Identity '{exchangePolicyScopeGroupId}').RecipientTypeDetails"
      expect: '`MailUniversalSecurityGroup`, and its members are exactly the mailboxes Spaarke may read and send from (including communicationDefaultMailbox)'
    remediation: '`New-DistributionGroup -Name "Spaarke-AppAccess-{customerId}" -Type Security -Members <mailboxes>` in Exchange Online PowerShell, then enter its email address or object id as `exchangePolicyScopeGroupId` at intake. Membership is the customer''s access decision — which mailboxes the app may use — so L2 never creates or edits it (owner decision 2026-10-01, T245c).'
    related_findings: [T245c, T4]

  - id: PRQ-C-09
    name: The customer's Dataverse environment exists (the operator creates it) and the L2 Worker identity is its System Administrator application user
    scope: once_per_customer
    frequency: once per customer, BEFORE the run (its URL is the intake value dataverseEnvUrl)
    owner: Spaarke platform admin (Power Platform admin of the stamp's tenant — Spaarke's for Model 1)
    consequence_of_absence: "POST /api/runs refuses a run without dataverseEnvUrl, or one whose domain is not spaarke-{customerId} / spaarke-{customerId}-{environmentName} (400 dataverse-env-url-invalid — the guard against adopting another customer's environment). H5 fails Resumable worker-not-app-user when the L2 Worker identity cannot call WhoAmI, env-health-check-failed when the environment does not answer. L2 never creates an environment (T228)."
    check_recipe:
      cli: |
        res=$(echo "{dvUrl}" | sed 's#/$##')
        n=$(az rest --method get --resource "$res" --url "$res/api/data/v9.2/systemusers?\$filter=applicationid eq {l2UamiClientId} and isdisabled eq false&\$select=systemuserid" --query "length(value)" -o tsv) || exit 1
        [ -z "$n" ] && exit 1
        [ "$n" = "1" ] || exit 1
        echo ok
      expect: '`ok` — one enabled application user for the L2 Worker identity; confirm in the Power Platform admin center that it holds System Administrator'
    remediation: |
      1. Power Platform admin center → Environments → New, in the stamp's tenant: name and URL `spaarke-{customerId}`
         (→ https://spaarke-{customerId}.crm[N].dynamics.com/ — the domain POST /api/runs and H5 require), type Production
         (Sandbox for a trial), the customer's region, Dataverse ON. `pac admin create --domain` silently appends a digit
         when the domain is taken (spaarke-{customerId}0) — check the URL and use spaarke-{customerId}-{environmentName}
         instead; any other domain is refused.
      2. Add the L2 Worker managed identity as an application user with the System Administrator role:
         `pac admin assign-user --environment {dvUrl} --user {l2UamiClientId} --role "System Administrator" --application-user`
         (or the environment → Settings → Users + permissions → Application users → New app user).
      3. Enter the environment URL as `dataverseEnvUrl` at intake. After the run, set up secure records per
         docs/guides/SECURE-PROJECT-ENVIRONMENT-SETUP.md (deployment guide §7.11).
    related_findings: [T228, D4, Q1]

  - id: PRQ-C-10
    name: The customer environment's security group sprk-{customerId}-users exists and is set on the Dataverse environment (Model 1 / every B2BGuest run)
    scope: once_per_customer
    frequency: once per customer, BEFORE the environment is created (PRQ-C-09 step 1 selects it) — its object id is the intake value environmentSecurityGroupId
    owner: Spaarke platform admin (Entra + Power Platform admin of Spaarke's tenant for Model 1)
    consequence_of_absence: "POST /api/runs refuses a B2BGuest run (every Model 1 run) without environmentSecurityGroupId (400 userprov-missing-security-group-id). H11 refuses a group not named sprk-{customerId}-users or not security-enabled (userprov-security-group-rejected) before inviting anyone. A group that is NOT set on the environment admits every user of Spaarke's tenant — including other customers' guests — on first sign-in: the group is the isolation boundary between Model 1 environments (T232)."
    check_recipe:
      cli: |
        az rest --method get --url "https://graph.microsoft.com/v1.0/groups/{environmentSecurityGroupId}?\$select=displayName,securityEnabled" --query "[displayName,securityEnabled]" -o tsv
      expect: "`sprk-{customerId}-users	true` — AND the Power Platform admin center shows this group as the environment's security group (Environments → the environment → Edit → Security group)"
    remediation: |
      1. Entra admin center → Groups → New group: type Security, name `sprk-{customerId}-users`, membership Assigned,
         no members (H11 adds each guest as a DIRECT member — Dataverse ignores nested groups).
      2. Select it as the security group when creating the environment (PRQ-C-09 step 1), or later: Power Platform admin
         center → Environments → the environment → Edit → Security group.
      3. Enter the group's object id as `environmentSecurityGroupId` at intake.
    related_findings: [T232, D2, G10]

  - id: PRQ-C-11
    name: The customer's Dataverse environment is linked to a pay-as-you-go billing policy on the customer's stamp subscription (Model 1 — Spaarke pays guest access)
    scope: once_per_customer
    frequency: once per customer, BEFORE the run
    owner: Spaarke platform admin (Power Platform admin of Spaarke's tenant)
    consequence_of_absence: "Model 1 guests hold no licence (owner 2026-10-07: Spaarke pays pay-as-you-go, not per user). Without the link the environment has no way to bill their access: H11 still makes each guest a Dataverse user, but the guest is refused at sign-in. L2 cannot see billing (no Dataverse-visible setting; the licensing API needs a Power Platform admin, which L2 is not) — this check is the operator's."
    check_recipe:
      cli: |
        pac licensing get-environment-billing-policy --environment {dvUrl}
      expect: 'a billing policy with status Enabled whose Azure subscription is {stampSubscriptionId} (the customer''s own stamp subscription — not Spaarke''s platform subscription); cross-check with `pac licensing list-billing-policies` (preview commands — Microsoft Learn "pac licensing")'
    remediation: |
      Power Platform admin center → Billing → Billing policies → New billing policy: name `sprk-{customerId}-payg`, the
      customer's stamp subscription {stampSubscriptionId} and its stamp resource group, region = the environment's
      region; then add the environment to the policy (Billing policies → the policy → Add environments). Linking makes
      it a Managed Environment. Meter: Power Apps per app — billed per ACTIVE user per app per month (Microsoft Learn
      "Pay-as-you-go meters").
    related_findings: [T232, D2, G10]

  - id: PRQ-C-12
    name: Guest access is allowed in the customer's Dataverse environment (organization.restrictguestuseraccess = false)
    scope: once_per_customer
    frequency: once per customer, BEFORE the run (new environments default to restricted)
    owner: Spaarke platform admin (System Administrator of the environment)
    consequence_of_absence: 'Guests cannot use Dataverse at all while the setting is on (Microsoft Learn "Guest access"). H11 reads it as the L2 Worker identity and refuses the run before inviting anyone (userprov-guest-access-restricted, Resumable).'
    check_recipe:
      cli: |
        res=$(echo "{dvUrl}" | sed 's#/$##')
        az rest --method get --resource "$res" --url "$res/api/data/v9.2/organizations?\$select=restrictguestuseraccess" --query "value[0].restrictguestuseraccess" -o tsv
      expect: '`false`'
    remediation: |
      As the operator (System Administrator of the environment), PATCH the organization row:
        res=$(echo "{dvUrl}" | sed 's#/$##')
        org=$(az rest --method get --resource "$res" --url "$res/api/data/v9.2/organizations?\$select=organizationid" --query "value[0].organizationid" -o tsv)
        az rest --method patch --resource "$res" --url "$res/api/data/v9.2/organizations($org)" --body '{"restrictguestuseraccess": false}' --headers "Content-Type=application/json"
      then re-run the check. L2 never changes it (an environment-wide access decision).
    related_findings: [T232, D2, G10]
