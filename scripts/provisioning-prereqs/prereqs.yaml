    related_findings: [F10]

  - id: PRQ-C-04
    name: Dataverse env-creation rate quota available (~4/hr per tenant)
    scope: once_per_customer
    frequency: per run (Step 2 preflight)
    owner: Spaarke platform admin
    consequence_of_absence: H5 fails with rate-limit error; run blocks until quota window resets.
    check_recipe:
      cli: |
        # PRQ-07 fix (2026-08-27): `pac admin quota` is not a valid pac subcommand at
        # CLI 1.46 (pac admin group has [list, list-groups, add-group, create, backup,
        # ..., set-runtime-state] — no `quota` subcommand). Swap to az rest against the
        # Power Platform BAP (Business Application Platform) API.
        #
        # NOTE: The 4/hr per-tenant Dataverse env-creation rate quota is a ROLLING RATE
        # LIMIT, not a directly-queryable used/cap counter. The BAP tenant-environments
        # list yields current environment COUNT (informational). True rate-limit
        # detection surfaces as HTTP 429 at H5 dispatch — this recipe verifies BAP
        # reachability + logs current env count as a signal, exit 1 on API failure.
        token=$(az account get-access-token --resource "https://api.bap.microsoft.com" --query accessToken -o tsv 2>/dev/null)
        [ -z "$token" ] && exit 1
        result=$(az rest --method get \
          --uri "https://api.bap.microsoft.com/providers/Microsoft.BusinessAppPlatform/scopes/admin/environments?api-version=2020-10-01" \
          --headers "Authorization=Bearer $token" 2>/dev/null)
        [ -z "$result" ] && exit 1
        count=$(echo "$result" | jq -r '(.value | length)')
        if [ -z "$count" ] || [ "$count" = "null" ]; then
          echo "MALFORMED_BAP_RESPONSE"; exit 1
        fi
        echo "OK: tenant_env_count=$count (rate quota 4/hr rolling; not directly queryable)"
      expect: BAP API reachable; tenant environment count logged (informational — rate limit is 4/hr rolling window, surfaces as HTTP 429 at H5 if exhausted)
    remediation: Wait for quota window (rolling 1-hour rate); no bump path. If H5 hits 429, exponential backoff at handler level.

  - id: PRQ-C-05
    name: Customer admin consent granted for BFF multitenant app (Model 2 only)
    scope: once_per_customer
    frequency: once per customer tenant
    owner: customer tenant admin (via H0.5 consent-capture URL)
    consequence_of_absence: H0.5 consent-callback times out; H10 admin-consent verification fails.
    check_recipe:
