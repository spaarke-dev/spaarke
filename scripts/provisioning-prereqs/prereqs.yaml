  - id: PRQ-E-15
    name: Exchange admin app — `Spaarke Exchange Admin` with a federated credential trusting the L2 Worker UAMI, `Exchange.ManageAsApp`, and the narrowed Exchange role `Spaarke App RBAC Admin` (T251)
    scope: once_per_env
    frequency: once per tenant L2 provisions into (Spaarke's, for Model 1); the platform parameter exchangeAdminAppId names it
    owner: Spaarke platform admin (Entra Global Admin + Exchange Organization Management) — SPAARKE-CUSTOMER-DEPLOYMENT-GUIDE.md §4.2.1
    consequence_of_absence: H14a and H13 T4 fail on first use ("ExchangeAdminAppId is not configured", or the sign-in / Exchange call is refused); the stamp identity never receives its group-scoped mailbox roles, so its Mail.* calls 403 (trap T4).
    check_recipe:
      cli: az ad app list --display-name "Spaarke Exchange Admin" --query "[0].appId" -o tsv
      expect: 'the client id set as exchangeAdminAppId in platform-controlplane-{env}.bicepparam; its federated credential names the L2 Worker UAMI principal id (`az ad app federated-credential list --id <appId>`), and in Exchange `Get-ManagementRoleAssignment -RoleAssignee <its service-principal object id>` lists `Spaarke App RBAC Admin`, `View-Only Recipients` and four DelegatingOrgWide `Application Mail.*` / `MailboxSettings.Read` assignments'
    remediation: 'Follow SPAARKE-CUSTOMER-DEPLOYMENT-GUIDE.md §4.2.1 (Enable-OrganizationCustomization once per tenant — irreversible, ~1 h to apply). Never give the app a secret, a certificate or an Entra directory role.'
