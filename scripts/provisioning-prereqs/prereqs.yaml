  - id: PRQ-C-05
    name: 'RETIRED — customer admin consent for the customer BFF app registration (Model 2 only)'
    scope: once_per_customer
    status: retired
    retired_on: 2026-10-06
    retired_by: customer-provisioning-orchestration-r1 T227a (D-12)
