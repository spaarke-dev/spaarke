  - id: PRQ-E-07
    name: L2 UAMI has Graph app-role grants for provisioning-relevant roles
    scope: once_per_env
    frequency: once per env, refresh on `ControlPlaneGraphAppRoles.cs` change
    owner: Spaarke platform admin (via `scripts/provisioning/Grant-ControlPlaneIdentity.ps1`)
    consequence_of_absence: L2 handlers H7/H10/H11/H12c cannot authenticate to Graph; every Graph call 403s silently.
    check_recipe:
      cli: |
        set -o pipefail
        export MSYS_NO_PATHCONV=1
        cd "$(git rev-parse --show-toplevel)" || exit 1
        src=src/server/services/Sprk.Provisioning.ControlPlane.Core/Handlers/ControlPlaneGraphAppRoles.cs
        [ -f "$src" ] || { echo "$src not found (run from the repo checkout)"; exit 1; }
        expected=$(grep -E '^[[:space:]]*private const string Id[A-Za-z]+ = ' "$src" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | tr -d '\r')
        [ -n "$expected" ] || { echo "no app-role ids parsed from $src"; exit 1; }
        graphsp=$(az ad sp show --id {graphAppId} --query id -o tsv | tr -d '\r') || exit 1
        [ -n "$graphsp" ] || { echo "Microsoft Graph service principal not found in this tenant"; exit 1; }
        granted=$(az rest --method get --url "https://graph.microsoft.com/v1.0/servicePrincipals/{l2UamiSpId}/appRoleAssignments" --query "value[?resourceId=='$graphsp'].appRoleId" -o tsv | tr -d '\r') || exit 1
        failed=0
        for rid in $expected; do
          echo "$granted" | grep -qi "^$rid$" || { echo "MISSING Graph app role $rid for the L2 UAMI"; failed=1; }
        done
        [ "$failed" = 0 ] || exit 1
        echo ok
      expect: '`ok` - every app-role id in `ControlPlaneGraphAppRoles.cs` (the `Id*` constants) is granted to the L2 UAMI on Microsoft Graph; each missing role is printed and the recipe exits 1'
    remediation: "Run `Grant-ControlPlaneIdentity.ps1` (audit-gap DS-5 c5.8; it grants `ControlPlaneGraphAppRoles.cs`, task 261). The set and the call behind each role: `projects/customer-provisioning-orchestration-r1/notes/t261-stamp-graph-least-privilege.md` §4. Residual risk: `AppRoleAssignment.ReadWrite.All` lets the L2 identity grant any app role to any principal (H10 needs it to grant and remove the stamp identity's Graph roles)."
    related_findings: [c5.8-l2-uami-graph-and-dataverse-grants, T3-graph-app-role-parity]

