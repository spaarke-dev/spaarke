  - id: PRQ-E-14
    name: OpenAI region availability + model deployability (pre-H2a Bicep deploy)
    scope: once_per_env
    frequency: per env, refresh on openai.bicep deployments-array pin change
    owner: Spaarke platform admin
    consequence_of_absence: H2a Bicep deploy fails with model-not-available in region OR silently ships Deprecated version that gets ServiceModelDeprecated rejection mid-run; customer stamp aborts; recovery requires rollback + template change + full re-provision. This is a SILENT-PASS-AT-PLAN + FAIL-AT-DEPLOY class caught by us SESSION 12 when westus2 returned 0 OpenAI models for the sub while the plan still validated cleanly.
    check_recipe:
      cli: |
        # Verify every openai.bicep-pinned model:version pair is AVAILABLE + NON-DEPRECATED in the target OpenAI region.
        # openAiRegion defaults to westus3 (canonical Spaarke strategy per operator memory).
        # Pin list MUST stay in sync with infrastructure/bicep/modules/openai.bicep 'deployments' array default.
        # Bump this list AT THE SAME TIME as any openai.bicep version bump (both artifacts land in the same commit).
        for pin in gpt-4o:2024-11-20 gpt-4o-mini:2024-07-18 text-embedding-3-large:1; do
          model=${pin%:*}; ver=${pin#*:}
          status=$(az cognitiveservices model list --location {openAiRegion} \
            --query "[?kind=='OpenAI' && model.name=='$model' && model.version=='$ver'].model.lifecycleStatus" -o tsv)
          if [ -z "$status" ]; then echo "$model:$ver=NOT_AVAILABLE_IN_REGION"; exit 1; fi
          if [ "$status" = "Deprecated" ]; then echo "$model:$ver=DEPRECATED"; exit 1; fi
          echo "$model:$ver=$status"
        done
      expect: every model reports GenerallyAvailable or Legacy; no NOT_AVAILABLE_IN_REGION or Deprecated entries
    remediation: (a) change openAiLocation intake parameter to a region where the pinned versions are available (see 'az cognitiveservices model list --location REGION' output); (b) bump version pins in infrastructure/bicep/modules/openai.bicep deployments array to current non-Deprecated versions.
    related_findings: [session-12-openai-region-gap-catch, gap-caught-by-manual-preflight-not-in-yaml]

  # ============================================================================
  # ONCE-PER-CUSTOMER (per customer stamp — validated at Step 2 preflight of each run)
  # ============================================================================

  - id: PRQ-C-01
    name: OpenAI regional TPM headroom for pinned frontier models
    scope: once_per_customer
    frequency: per run (Step 2 preflight)
    owner: Spaarke platform admin (or auto-support-ticket if plan present)
    consequence_of_absence: "H2a fails with `InsufficientQuota - gpt-5.x - GlobalStandard: limit is 0` on fresh subs."
    check_recipe:
      cli: |
        # PRQ-03 fix (2026-08-27): assert numeric limit > current (headroom) for every
        # returned frontier tier. Prior recipe dumped JSON but never asserted the numeric
        # comparison — fresh-sub gpt-5* limit=0 would silent-pass, and H2a fails with
        # `InsufficientQuota - gpt-5.x - GlobalStandard: limit is 0` mid-deploy.
        result=$(az cognitiveservices usage list --location {region} \
          --query "[?contains(name.value,'GlobalStandard') && contains(name.value,'gpt-5')].{model:name.value, limit:limit, current:currentValue}" -o json 2>/dev/null)
        [ -z "$result" ] && exit 1
        count=$(echo "$result" | jq 'length')
        if [ "$count" -eq 0 ]; then echo "NO_FRONTIER_TIER_ENTRIES"; exit 1; fi
        # Any entry with limit <= current is a headroom failure.
        no_headroom=$(echo "$result" | jq -r '.[] | select(.limit <= .current) | "\(.model)=\(.current)/\(.limit)"')
        if [ -n "$no_headroom" ]; then
          echo "$no_headroom" | while read line; do echo "NO_HEADROOM: $line"; done
          exit 1
        fi
        echo "$result" | jq -r '.[] | "\(.model)=\(.current)/\(.limit) OK"'
      expect: every returned frontier model (gpt-5*) has numeric limit strictly greater than currentValue (headroom for expected call load)
    remediation: Support ticket via `az support tickets create` (requires PRQ-S-02 Support Plan). Fresh subs auto-grant mini/embedding tiers generously (500+ TPM) but zero TPM for frontier tiers.
    related_findings: [F5, NFR-12]

  - id: PRQ-C-02
    name: OpenAI model GA per region for each pinned version
    scope: once_per_customer
    frequency: per run (Step 2 preflight) — pins deprecate ~4-6 months after GA
    owner: Spaarke platform admin
    consequence_of_absence: "`ServiceModelDeprecated` at H2a deploy."
    check_recipe:
      cli: |
        # PRQ-03 fix (2026-08-27): iterate the pinned model:version list explicitly.
        # Prior recipe used a single {pinnedVer} placeholder that was never substituted
        # AND could not represent the actual pin list (3 pinned models).
        # This mirrors PRQ-E-14 pattern; keep pin list in sync with openai.bicep 'deployments'.
        failed=0
        for pin in gpt-4o:2024-11-20 gpt-4o-mini:2024-07-18 text-embedding-3-large:1; do
          model=${pin%:*}; ver=${pin#*:}
          status=$(az cognitiveservices model list --location {region} \
            --query "[?kind=='OpenAI' && model.name=='$model' && model.version=='$ver'].model.lifecycleStatus" -o tsv 2>/dev/null)
          if [ -z "$status" ]; then echo "$pin=NOT_AVAILABLE_IN_REGION"; failed=1; continue; fi
          case "$status" in
            Deprecated|Deprecating) echo "$pin=$status"; failed=1;;
            GenerallyAvailable|Legacy|Preview) echo "$pin=$status OK";;
            *) echo "$pin=UNKNOWN_STATUS:$status"; failed=1;;
          esac
        done
        [ "$failed" -eq 0 ] || exit 1
      expect: every pinned model reports `GenerallyAvailable` or `Legacy` (reject `Deprecating`, `Deprecated`, `NOT_AVAILABLE_IN_REGION`)
    remediation: Bump pinned version in `stacks/model1-shared.bicep` / `customer.bicep` OpenAI deployment set.
    related_findings: [F1, F4, L-o1-model-status-lexicon]

  - id: PRQ-C-03
    name: Global resource-name availability (SB namespace, Cog Svc subdomain, Storage account)
    scope: once_per_customer
