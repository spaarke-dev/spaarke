    exception_note: ""
    aliases: []
    value_source: "from-run-parameter"
    app_settings:
      - "TENANT_ID"
      - "AzureAd__TenantId"
      - "Graph__TenantId"
      - "Dataverse__TenantId"
      - "AgentToken__TenantId"
      - "ScheduledRagIndexing__TenantId"
    tags: ["identity", "bff", "public"]

  - canonical_name: "BFF-API-ClientId"
    category: "identity"
    purpose: "BFF API Entra ID app-registration client ID. Non-secret but stored in KV for reference-parity with ClientSecret."
    consumers:
      - "BFF: API_APP_ID / AzureAd:ClientId / Graph:ClientId / Dataverse:ClientId / AgentToken:ClientId"
    rotation_cadence: "N/A"
    never_delete: false
    exception_note: >-
      Reclassified 2026-08-19 (customer-provisioning-orchestration-r1 task 129,
      owner E3 confirmation) from from-bicep-output to from-run-parameter. H3
      (task 130) is the value producer -- it creates the per-customer BFF Entra
      app-registration at RUNTIME (a C# handler, not a Bicep ARM resource) and
      writes ClientId to RunParameters.Secrets. The DAG runs H3 before H4, so H4
      resolves this value from RunParameters, not from a Bicep deployment output.
    aliases: []
    value_source: "from-run-parameter"
    app_settings:
      - "API_APP_ID"
      - "AzureAd__ClientId"
      - "Graph__ClientId"
      - "Dataverse__ClientId"
      - "AgentToken__ClientId"
    tags: ["identity", "bff", "public"]

  - canonical_name: "BFF-API-Audience"
    category: "identity"
    purpose: "BFF API audience URI (api://{clientId})."
    consumers:
      - "BFF: AzureAd:Audience"
    rotation_cadence: "N/A"
    never_delete: false
    exception_note: >-
      Reclassified 2026-08-19 (customer-provisioning-orchestration-r1 task 129,
      owner E3 confirmation) from from-bicep-output to from-run-parameter. H3
      (task 130) is the value producer -- it creates the per-customer BFF Entra
      app-registration at RUNTIME (a C# handler, not a Bicep ARM resource) and
      writes Audience to RunParameters.Secrets. The DAG runs H3 before H4, so H4
      resolves this value from RunParameters, not from a Bicep deployment output.
    aliases: []
    value_source: "from-run-parameter"
    app_settings:
      - "AzureAd__Audience"
    tags: ["identity", "bff", "public"]

