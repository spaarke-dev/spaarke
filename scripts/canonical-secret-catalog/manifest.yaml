# ---------------------------------------------------------------------------
# Per-environment LITERAL App Service settings (task 201 — H4b handler)
# ---------------------------------------------------------------------------
# App Service app-settings whose values are per-env LITERALS (URIs, public
# GUIDs, generated signing keys) — NOT appropriate as KV secrets OR needed to
# bootstrap KV access (SpeAdmin__KeyVaultUri creates a circular-boot if stored
# in that same KV; AzureAd__TenantId is a public GUID; etc.).
#
# The generator (Invoke-CatalogGenerator.ps1) emits per-env-literal lines into
# the SAME Configure-AppServiceSettings.generated.ps1 output alongside the
# KV-ref lines (both in the single $settings array so ONE batched
# `az webapp config appsettings set --settings @settings` call per slot is
# preserved). Runtime consumer: H4bBulkAppSettingsHandler resolves each
# non-literal entry through PerEnvSourceCatalog (task 245a) — a typed
# InterStepState output of a named handler, or an intake parameter — and
# writes the same settings the generated script writes (secrets' app_settings
# as KV references + these entries) through the ARM SDK on both slots (task
# 253: the L2 Worker host has no pwsh; a parity test pins H4b to the script).
#
# Per-entry schema:
#   - key                — App Service app-setting name (double underscore for
#                          nested config, e.g. SpeAdmin__KeyVaultUri).
#   - per_env_source     — one of:
#                            literal                          (value in literal_value)
#                            from-{handler}-output:{k}        (InterStepState output of {handler})
#                            from-intake-parameter:{k}        (intake value: an IntakeParameterCatalog key,
#                                                              or customer_id = the run's customerId)
#                          The non-literal forms are a CLOSED set — every one
#                          must be listed in
#                          src/server/services/Sprk.Provisioning.ControlPlane.Core/Handlers/BulkAppSettings/PerEnvSourceCatalog.cs,
#                          or H4b's manifest read fails. Adding a source = add
#                          it there (with where its value lives) first.
#   - literal_value?     — REQUIRED when per_env_source == "literal"; else null/absent.
#   - iOptionsModule     — Documentation: which BFF module consumes this
#                          (per-env-literal drives the F20/F20a fail-fast chain).
#   - required           — bool; defaults true if absent. Required-and-missing
#                          in envelope → Resumable Failure BEFORE any script call.
#   - indexed?           — bool (task 255); true = the key is a .NET
#                          configuration LIST fed by a list source
#                          (PerEnvSourceCatalog). H4b and the generated script
#                          write {key}__0 … {key}__{n-1} and REMOVE every other
#                          {key}__* setting on both slots, so a dropped value
#                          cannot linger. Must be required; only a list source
#                          may feed it, and a list source feeds only it.
#   - notes?             — free-form.
#
# BINDING guard: entries whose `key` matches a never_delete secret name from
# `secrets:` (Dataverse-ClientSecret / BFF-API-ClientSecret) are REFUSED by
# the generator's Test-PerEnvSettingsShape — prevents accidentally writing a
# cleartext BFF client secret as an app-setting literal (spec.md MUST rule).
#
# Ordering: sorted alphabetically by key at generator-emit time (determinism
# contract mirrors secrets: sort).
per_env_settings:
  - key: 'SpeAdmin__KeyVaultUri'
    per_env_source: 'from-h2a-output:kv_vault_uri'
    iOptionsModule: 'SpeAdminModule'
    required: true
    notes: >-
      F20 SIGABRT trigger (2026-08-24 SESSION 2). BFF's SpeAdminModule fails
      fast at boot when `SpeAdmin:KeyVaultUri` (or the fallback `KeyVaultUri`)
      is absent. Value is the shared KV URI (e.g. https://sprk-prod-kv.vault.azure.net/).
      MUST be a per-env literal — storing it in KV creates a circular boot
      (BFF cannot resolve any KV ref without knowing the vault URI first).

  - key: 'CosmosPersistence__Endpoint'
    per_env_source: 'from-h2a-output:cosmos_endpoint'
    iOptionsModule: 'AiPersistenceModule'
    required: true
    notes: >-
      F20a SIGABRT trigger (2026-08-24 SESSION 2). BFF's AiPersistenceModule
      fails fast at boot when Cosmos endpoint is unset. Value is the per-env
      Cosmos account URI (e.g. https://sprk-prod-cosmos.documents.azure.com/).

  - key: 'AzureAd__TenantId'
    per_env_source: 'from-intake-parameter:tenant_id'
    iOptionsModule: 'AzureAdOptions'
    required: true
    notes: >-
      Public identifier; §4D I1 no-hardcoded-tenant compliance. The intake
      tenantId (POST /api/runs nonSecretParameters, required). Was labelled
      from-h0-parameter, but H0 produces nothing — it is an intake value
      (task 245a).

  - key: 'Customer__Id'
    per_env_source: 'from-intake-parameter:customer_id'
    iOptionsModule: 'CustomerOptions'
    required: true
    notes: >-
      The BFF's "which customer am I" handle (D-14; INCOMING-CUSTOMER-RUNTIME-IDENTITY
      §1.1-§1.2, T238). Exactly the run's customerId (POST /api/runs body,
      enforced by CustomerIdStandard) — the same value customer.bicep receives
      and sprk_dataverseenvironment.sprk_customerid stores; never re-derived,
      no default. customer.bicep sets it on the production site only; H4b
      writes BOTH slots so a staging→production swap cannot drop it, and H13
      trap T7 fails the run unless both slots carry it. Defence in depth and an
      observability handle — not the customer boundary (that is the dedicated
      per-customer resource).

  - key: 'WorkforceIdentity__CustomerTenantIds'
    per_env_source: 'from-intake-parameter:customer_workforce_tenant_ids'
    indexed: true
    iOptionsModule: 'ExternalAccessModule (WorkforceIdentityOptions)'
    required: true
    notes: >-
      T255 (INCOMING-141 from unified-access-control-r2 task 141). The CUSTOMER's
      Entra tenant id(s) whose employees use this stamp, written as
      WorkforceIdentity__CustomerTenantIds__0, __1, … on BOTH slots. The BFF's
      member test admits a first-sign-in email bind or contact creation only for
      a member (acct = 0) of a listed tenant; empty or absent DENIES everyone
      (workforce_tenant_list_empty), so every stamp needs it. Model 1: the
      customer's home tenant — never Spaarke's tenant or the run's tenantId
      (AzureAd__TenantId), which would bind Spaarke's staff into the customer's
      environment. Never a CIAM tenant (the BFF's ValidateOnStart refuses it).
      Intake customerWorkforceTenantIds, checked by CustomerWorkforceTenantsRule
      at POST /api/runs and again by H4b; H13 T7 fails a stamp whose slots do
      not carry exactly this list. Indices the list no longer has are removed.

  - key: 'Dataverse__EnvironmentUrl'
    per_env_source: 'from-h5-output:dataverse_env_url'
    iOptionsModule: 'DataverseOptions'
    required: true
    notes: >-
      The customer's Dataverse environment URL — H5's InterStepState.DataverseEnvUrl
      (task 245b; H4b ← H5 in the DAG). A plain app setting: it was the KV secret
      Dataverse-ServiceUrl, which H4 could never write (H5 runs after H4) and which
      is not a secret (D13). The live dev vault's copy (and its drifted alias
      SPRK-DEV-DATAVERSE-URL, pending the task-085 alias collapse) is untouched.

  - key: 'Dataverse__ServiceUrl'
    per_env_source: 'from-h5-output:dataverse_env_url'
    iOptionsModule: 'DataverseOptions'
    required: true
    notes: >-
      Same value as Dataverse__EnvironmentUrl — the BFF reads both keys
      (DataverseOptions + direct Dataverse:ServiceUrl readers). Task 245b.

  - key: 'AzureAd__ClientId'
    per_env_source: 'from-h3-output:bff_app_client_id'
    iOptionsModule: 'AzureAdOptions'
    required: true
    notes: >-
      Public identifier; H3 Entra-app-reg populates when it creates the BFF
      client app-registration for this customer stamp.

  - key: 'SharePointEmbedded__ContainerTypeId'
    per_env_source: 'from-intake-parameter:container_type_id'
    iOptionsModule: 'SpeOptions'
    required: true
    notes: >-
      Public GUID of the environment's pre-existing SPE container type —
      the intake containerTypeId (spaarke-constants.yaml per_env_constants,
      sent by /provision-environment Step 4.0). Was labelled from-h8-output,
      but H8 creates the container, not the container type (task 245a).

  - key: 'Graph__ManagedIdentity__Enabled'
    per_env_source: 'literal'
    literal_value: 'true'
    iOptionsModule: 'GraphModule'
    required: true
    notes: >-
      ADR-028 canonical: server outbound uses DefaultAzureCredential (MI)
      when true. Global literal — every deployed env sets this to true (dev
      + local fall back via appsettings.Development.json).

  - key: 'Graph__ManagedIdentity__ClientId'
    per_env_source: 'from-h2a-output:uami_client_id'
    iOptionsModule: 'GraphModule'
    required: true
    notes: >-
      UAMI client-id H2a Bicep emits. Consumed by GraphClientFactory to pin
      DefaultAzureCredential to the L2/BFF UAMI (rather than any other MI
      the App Service may have).

  - key: 'ManagedIdentity__ClientId'
    per_env_source: 'from-h2a-output:uami_client_id'
    iOptionsModule: 'GraphModule'
    required: true
    notes: >-
      Parity fallback alias for Graph__ManagedIdentity__ClientId. Kept for
      compatibility with modules that read the flat key (documented in
      SPAARKE-CUSTOMER-DEPLOYMENT-GUIDE.md §7). Also entry 3 of the auth-v4
      §10.2 live-contract 8-entry set (task 205c / punch row A39) — this is
      the ONLY entry that already existed pre-A39 (landed task 201); A39
      added this note, not the entry. SF-2 identifier-swap trap: the source
      MUST be uami_client_id (InterStepState.MiClientId, H2a UAMI clientId at
      Models/InterStepState.cs:53) — NEVER uami_object_id
      (InterStepState.MiObjectId, principalId at :48, used only for RBAC
      assignments). Substituting the object id here creates successfully and
      fails only at token exchange with AADSTS700213 wrong-subject.

  # ==========================================================================
  # Auth-v4 §10.2 live-contract entries (task 205c / punch row A39, 2026-08-26)
  # ==========================================================================
  # Verified 2026-08-24 against `spaarke-bff-dev` LIVE post-E-3 closure. This
  # is the runtime application of the §6.5 conflict-resolution record's prong
  # 1 (notes/decisions/adr-028-a4-integration-conflict-resolution.md,
  # APPROVED 2026-08-25): Graph__Credentials__Order__0=ManagedIdentityFederated
  # is the SOLE entry + RequireSecretFreeIdentity=true. ORDERING GUARD
  # (BINDING): these entries are lawful ONLY because A38 (H4 KV manifest
  # secret-free omit — no sentinel secret slots) AND A42 (FIC creation with
  # tenancy guard) have BOTH landed (confirmed at A39 dispatch time via
  # `git log`: A36/A37 @ 1bc049e4c, A38 @ f280de764/cc6ecb6e4, A42 @
  # cc6ecb6e4). Applying entry 2 below before A38+A42 land would boot-loop a
  # fresh stamp (exit-134 class) per §9.1 sentinel pathology.
  #
  # FIC-PROPAGATION-FLAP TOLERANCE (§5 item 4 verifier addition; SF-17 x SF-6
  # interaction case). Auth-v4 §11 invariant 2 measured Entra federated-
  # credential propagation to flap for ~130s (~8 failures, AADSTS70025) after
  # a FIC is created/changed. CHOSEN mechanism: (b) H4b boot-retry allowance
  # via the EXISTING /healthz backoff-poll in H4bBulkAppSettingsHandler.cs /
  # HttpHealthzProbe.cs (5 probes, 30+60+90+120+180s = 480s ~= 8-min budget,
  # task 201 -- unchanged by A39, >3x margin over the measured ~130s window) --
  # NOT new BFF-side retry code. Two verified reasons (2026-08-26, against
  # src/server/api/Sprk.Bff.Api/Configuration/{IdentityConfigurationValidator,
  # CredentialSelectionOptions}.cs):
  #   1. RequireSecretFreeIdentity=true's startup guard (Rule 6) is a PURE
  #      config-SHAPE assertion (does Graph:Credentials:Order still contain
  #      ClientSecret?) with NO live token exchange -- deliberately, per that
  #      file's own Rule 6 comment ("avoids a startup token acquisition, which
  #      would... refuse to boot during Entra's measured ~2-minute...
  #      propagation flap"; "No SIGABRT-class risk is introduced"). Turning on
  #      entries 1+2 below therefore cannot itself fail-fast during the flap.
  #   2. If some OTHER startup path attempts a live MI-FIC exchange during
  #      boot and hits the flap, H4b's own /healthz backoff-poll (480s budget)
  #      already comfortably outlasts the measured ~130s window -- an
  #      EXISTING, already-shipped mechanism.
  # REJECTED: "wait for A42's post-App-Service verified-exchange marker
  # before settings-apply" -- infeasible as literally specified. Per
  # Handlers/HandlerIds.cs, H4b runs BEFORE H9/H10/H13 in the DAG, and H13
  # (E2E acceptance gate) -- the post-App-Service verification owner per
  # InterStepState.FicPendingPostAppServiceVerification's doc comment -- is
  # the FINAL handler. H4b cannot block on a signal produced only after H4b
  # itself (and H9) have already run. Revisit at Phase-F once Q11 (BFF
  # warmup credential self-proof) ships a real warmup endpoint.
  #
  # Sourcing notes:
  #   - Entries 1/2/7/8 are LITERAL -- no handler-output dependency.
  #   - Entries 4/5/6 (Service Bus FQNS) share ONE source key
  #     (service_bus_fqns) per the existing dedup convention (see
  #     ManagedIdentity__ClientId / Graph__ManagedIdentity__ClientId above,
  #     both sharing uami_client_id). service_bus_fqns is H2a's
  #     InterStepState.ServiceBusFullyQualifiedNamespace — the HOST of the
  #     customer.bicep `serviceBusEndpoint` output, i.e. the FULL FQNS
  #     (<namespace>.servicebus.windows.net) (task 245a; before that, the
  #     "handler-output promotion step" these notes assumed did not exist).
  #     H4b's per_env_settings DSL is verbatim substitution only. A36 (BFF
  #     runtime UAMI granted Service Bus Data Sender + Data Receiver,
  #     1bc049e4c) is the RBAC prerequisite this app-setting activates.

  - key: 'Graph__Credentials__Order__0'
    per_env_source: 'literal'
    literal_value: 'ManagedIdentityFederated'
    iOptionsModule: 'CredentialSelectionOptions'
    required: true
    notes: >-
      Auth-v4 §10.2 entry 1. MUST be the ONLY Credentials__Order__* entry --
      the ordered credential selector fails opaquely if a second provider
      (e.g. ClientSecret) is listed alongside RequireSecretFreeIdentity=true.
      Do NOT add Graph__Credentials__Order__1 or higher.

  - key: 'Graph__Credentials__RequireSecretFreeIdentity'
    per_env_source: 'literal'
    literal_value: 'true'
    iOptionsModule: 'CredentialSelectionOptions'
    required: true
    notes: >-
      Auth-v4 §10.2 entry 2. Fail-fast: BFF startup validator
      (IdentityConfigurationValidator Rule 6) refuses to boot outside
      Development if ClientSecret is still listed in Graph:Credentials:Order
      alongside this flag. Pure config-shape assertion -- no live token
      exchange, so it is immune to the FIC-propagation-flap window (see the
      section header above). LAWFUL ONLY once A38 (H4 secret-slot omit) AND
      A42 (FIC creation) have landed -- see ORDERING GUARD above.

  - key: 'ServiceBus__FullyQualifiedNamespace'
    per_env_source: 'from-h2a-output:service_bus_fqns'
    iOptionsModule: 'ServiceBusOptions'
    required: true
    notes: >-
      Auth-v4 §10.2 entry 4 (Delta 1). FQNS format only
      (<namespace>.servicebus.windows.net) -- NEVER a connection string, NEVER
      a Key Vault reference. Enables BFF to authenticate to Service Bus via
      its runtime UAMI (A36 RBAC: Data Sender + Data Receiver) instead of the
      SAS connection string H4 previously wrote to KV.

  - key: 'Membership__EventPublisher__ServiceBusNamespace'
    per_env_source: 'from-h2a-output:service_bus_fqns'
    iOptionsModule: 'ServiceBusOptions'
    required: true
    notes: >-
      Auth-v4 §10.2 entry 5. Shares the service_bus_fqns source with entry 4
      (same namespace, different consumer module) per the manifest's existing
      source-dedup convention.

  - key: 'Membership__JunctionUpdater__ServiceBusNamespace'
    per_env_source: 'from-h2a-output:service_bus_fqns'
    iOptionsModule: 'ServiceBusOptions'
    required: true
    notes: >-
      Auth-v4 §10.2 entry 6. Shares the service_bus_fqns source with entries
      4 and 5.

  - key: 'Redis__Endpoint'
    per_env_source: 'from-h2a-output:redis_endpoint'
    iOptionsModule: 'RedisOptions'
    required: true
    notes: >-
      Task 242 (owner D12/D13). host:10000 of the stamp's Azure Managed Redis
      (customer.bicep output `redisEndpoint`). Not a secret: the cache has
      access keys disabled and the BFF authenticates with its UAMI
      (ManagedIdentity__ClientId) over RESP3. NEVER a connection string, NEVER
      a Key Vault reference. With Redis enabled outside Development/Testing the
      BFF refuses to start without it. customer.bicep sets the same value on
      deploy; H4b keeps it on upgrades.

  - key: 'DocumentIntelligence__Enabled'
    per_env_source: 'literal'
    literal_value: 'true'
    iOptionsModule: 'AnalysisServicesModule'
    required: true
    notes: >-
      T243 (2026-10-02). The BFF's AI master switch: without it AnalysisServicesModule registers
      NullTextExtractor and skips analysis, playbooks and search (the 2026-08-22 Model 1 stand-up
      logged exactly that). No stamp source set it before. Global literal -- every customer stamp
      runs the AI platform.

  - key: 'AiSearch__ManagedIdentity__Enabled'
    per_env_source: 'literal'
    literal_value: 'true'
    iOptionsModule: 'AiSearchOptions'
    required: true
    notes: >-
      Auth-v4 §10.2 entry 7 (Delta 2). Enables MI-authenticated AI Search
      data-plane calls; pairs with A37 RBAC (Search Index Data Contributor +
      Search Service Contributor) already granted to the BFF runtime UAMI.
      Global literal -- every deployed env sets this to true.

  - key: 'AiSafety__ContentSafety__ManagedIdentity__Enabled'
    per_env_source: 'literal'
    literal_value: 'true'
    iOptionsModule: 'AiSafetyOptions'
    required: true
    notes: >-
      Auth-v4 §10.2 entry 8. Enables MI-authenticated Azure AI Content Safety
      calls (PromptShieldService / GroundednessCheckService). The stamp's
      Content Safety account has local auth disabled (task 246), so MI is the
      only path; no stamp is given an API key. Global literal.

  - key: 'AiSafety__ContentSafety__Endpoint'
    per_env_source: 'from-h2a-output:content_safety_endpoint'
    iOptionsModule: 'AiSafetyOptions'
    required: true
    notes: >-
      Task 246 (plan G26). The stamp's own Azure AI Content Safety endpoint
      (customer.bicep output `contentSafetyEndpoint`). Not a secret: local
      auth is disabled and the BFF calls with its UAMI. Outside Development
      and Testing the BFF refuses to start without it (it used to fall back to
      a hard-coded dev endpoint). customer.bicep sets the same value on
      deploy; H4b keeps it on upgrades.

  - key: 'AiSpendLimit__MonthlyLimitUsd'
    per_env_source: 'from-intake-parameter:openai_monthly_limit_usd'
    iOptionsModule: 'AnalysisServicesModule (AiSpendLimitOptions)'
    required: false
    notes: >-
      Task 254 (owner G37 — "no cap, but allow for a per customer spend limit
      if desired"). The stamp's OPTIONAL monthly Azure OpenAI spend limit in
      USD: written only when the run carries intake `openAiMonthlyLimitUsd`;
      absent = no limit. The BFF refuses model calls with 429 once its
      estimate reaches it (Services/Ai/Metering/AiSpendLimit). Change or
      remove it later with scripts/Set-AiSpendLimit.ps1 (both slots).

  - key: 'EmailProcessing__DefaultContainerId'
    per_env_source: 'from-h8-output:spe_container_id'
    iOptionsModule: 'EmailProcessingOptions'
    required: true
    notes: >-
      Task 227c (plan G18). The customer's SPE container (H8 creates one per
      customer — owner D28: one container type per model, one container per
      customer). A plain setting: a container id is not a secret. It used to be
      the KV secret SPE-DefaultContainerId (from-bicep-output), which nothing
      could write — H8 runs after H4 — so H4 quarantined every fresh stamp; and
      it was wired to Email__DefaultContainerId, a key no BFF code reads (the
      BFF reads EmailProcessing:DefaultContainerId). H4b runs after H8.

  - key: 'Communication__ArchiveContainerId'
    per_env_source: 'from-h8-output:spe_container_id'
    iOptionsModule: 'CommunicationOptions'
    required: true
    notes: >-
      Task 227c (plan G18). Archived communications go to the same per-customer
      container (one container per customer, owner D28). Was the KV secret
      SPE-CommunicationArchiveContainerId, which nothing wrote.

  - key: 'AzureOpenAI__ChatModelName'
    per_env_source: 'literal'
    literal_value: 'gpt-4o-mini'
    iOptionsModule: 'AiModule'
    required: true
    notes: >-
      Task 247 (plan G27). The deployment NAME the BFF's IChatClient calls.
      AiModule registers no IChatClient unless both AzureOpenAI:Endpoint and
      this are set, so a stamp without it has no chat. The `gpt-4o-mini`
      deployment runs gpt-4.1-mini (openai.bicep / PinnedModelCatalog) — the
      name is what the BFF addresses, so it stays. Global literal: every
      stamp deploys the same set.

  - key: 'Cors__AllowedOrigins__0'
    per_env_source: 'literal'
    literal_value: 'https://addins.spaarke.com'
    iOptionsModule: 'CorsModule'
    required: true
    notes: >-
      T240a (2026-10-07). The production Office add-in site (Static Web App
      swa-spaarke-office-addins-prod, owner-chosen custom domain). CorsModule
      throws at startup outside Development when Cors:AllowedOrigins is empty,
      so without these entries no stamp BFF starts. The customer's Dataverse
      origins need no entry: CorsModule already admits *.dynamics.com and
      *.powerapps.com by suffix. Global literal: every stamp is reached by the
      same shared client sites.

  - key: 'Cors__AllowedOrigins__1'
    per_env_source: 'literal'
    literal_value: 'https://external.spaarke.com'
    iOptionsModule: 'CorsModule'
    required: true
    notes: >-
      T240a (2026-10-07). The production External Access SPA, which is also the
      Teams tab (Static Web App swa-spaarke-external-spa-prod, owner-chosen
      custom domain). One origin covers the browser and Teams.
