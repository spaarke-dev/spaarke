  # ==========================================================================

  - canonical_name: "AppInsights-ConnectionString"
    category: "monitoring"
    purpose: "Application Insights connection string. Fallback surface — Bicep also emits APPLICATIONINSIGHTS_CONNECTION_STRING directly."
    consumers:
      - "BFF: ApplicationInsights:ConnectionString / APPLICATIONINSIGHTS_CONNECTION_STRING"
    rotation_cadence: "on-instrumentation-key-rotation"
    never_delete: false
    exception_note: "Grandfathered PascalCase per §7.9 R2."
    aliases: []
    value_source: "from-bicep-output"
    app_settings:
      - "ApplicationInsights__ConnectionString"
      - "APPLICATIONINSIGHTS_CONNECTION_STRING"
    tags: ["monitoring"]
