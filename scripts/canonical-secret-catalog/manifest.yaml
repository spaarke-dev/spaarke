# ============================================================================
# Canonical Secret-Catalog Manifest — SINGLE SOURCE OF TRUTH
# ============================================================================
#
# Authority:
#   - spec.md FR-36 (Phase H canonical secret-catalog manifest)
#   - spec.md §7.9 (canonical KV naming; R1 env-agnostic, R2 one canonical
#     casing, R3 sprk-{env}-kv vault, R4 no orphan/duplicate secrets)
#   - docs/architecture/AZURE-RESOURCE-NAMING-CONVENTION.md
#     § "KV-Secret & Resource Naming Standard (Conformance-Gated)"
#   - projects/customer-provisioning-orchestration-r1/notes/naming-exception-registry.md
#   - projects/code-quality-and-assurance-r3/notes/task-063-naming-standard-r1-handoff.md
#
# Purpose:
#   ONE declarative source from which the generator (Invoke-CatalogGenerator.ps1)
#   fans out FOUR output artifacts that today drift under hand-maintenance:
#     1. Seeder PS script         (Seed-CustomerKeyVault.generated.ps1)
#     2. Configure script         (Configure-AppServiceSettings.generated.ps1)
#     3. Tokens.md documentation  (appsettings.tokens.generated.md)
#     4. Bicep KV secret set      (kv-secrets.generated.bicep)
#
# Binding invariants:
#   - Every canonical secret enumerated below MUST include: canonical-name,
#     purpose, consumers, rotation-cadence, never-delete, value-source.
#   - Dataverse-ClientSecret + BFF-API-ClientSecret MUST carry never-delete: true
#     (r3 handoff §4a; OBO + shared-lib Dataverse depend on exact spelling).
#     Generator refuses to write outputs when this invariant is violated.
#   - spaarke-spekvcert dev exception MUST carry an exception-note documenting
#     the DO-NOT-RENAME rationale (naming-exception-registry.md).
#   - Aliases listed on a canonical entry are drift spellings that Phase H
#     task 085 (alias-collapse) MUST reconcile with LIVE App-Service + KV +
#     Dataverse pre-check before removing.
#
# Determinism contract:
#   The generator MUST sort secrets alphabetically by canonical-name when
#   emitting each output artifact. Two invocations against the same manifest
#   MUST produce byte-identical outputs. Manifest edit order is irrelevant.
#
# Adding a new secret:
#   1. Add a new entry to the secrets: list below (any position — sort is
#      generator-side).
#   2. Populate ALL required fields.
#   3. Run: pwsh scripts/canonical-secret-catalog/Invoke-CatalogGenerator.ps1 -DryRun
#      Inspect the planned outputs; commit generated files atomically with
#      the manifest change.
#   4. If the new secret has aliases already live in an environment,
#      list them in aliases: — a follow-up alias-collapse task (per
#      spec.md FR-36 + task 085 pattern) reconciles them post-pre-check.
# ============================================================================

schema_version: 1
manifest_version: 1.0.0

# ---------------------------------------------------------------------------
# Vault-name policy
# ---------------------------------------------------------------------------
# Canonical vault name is `sprk-{env}-kv` per §7.9 R3. The vault name is
# ALWAYS a Bicep param + generator param (never hardcoded in outputs).
# Codified live-env exceptions live in vault_name_exceptions below; the
# authoritative source is naming-exception-registry.md.
vault_name_pattern: "sprk-{env}-kv"

vault_name_exceptions:
  # Legacy dev-env vault. DO-NOT-RENAME per owner directive #3 (2026-08-15).
  # Rename would break dev-env cert-based flows + dev App Service KV
  # references + Dataverse-persisted config still pointing at this vault.
  # See naming-exception-registry.md row 1.
  dev: "spaarke-spekvcert"

# ---------------------------------------------------------------------------
# KV-reference syntax (§7.9 single-form rule)
# ---------------------------------------------------------------------------
# Canonical KV-reference syntax used across generated outputs.
# Two forms exist in the wild — the generator uses the VaultName form because
# it does NOT require the vault URI (which itself was a drift source).
kv_reference_syntax: "@Microsoft.KeyVault(VaultName={vault};SecretName={secret})"

# ---------------------------------------------------------------------------
# Secret catalog — canonical entries (alphabetically-sorted output is
# generator-enforced; source order below is developer-convenience only,
# grouped by category)
# ---------------------------------------------------------------------------
secrets:

  # ==========================================================================
  # BINDING never-delete pair (spec.md MUST rules line 242 · r3 handoff §4a)
  # These two secrets carry `never-delete: true`. The generator refuses to
  # emit outputs where either is missing or has never-delete=false.
  # ==========================================================================

  - canonical_name: "Dataverse-ClientSecret"
    category: "auth"
    purpose: >-
      OBO + shared-lib Dataverse client-credentials secret. Consumed by
      DataverseWebApiService (shared lib) and DataverseServiceClientImpl
      (via API_CLIENT_SECRET). BINDING never-delete per r3 handoff §4a and
      spec.md MUST rules — removing this secret CRASHES the BFF at startup.
      Retirement is gated on the #3b shared-lib ClientSecret->MI migration
      (code-quality-and-assurance-r3 task 011 / NG1 track).
    consumers:
      - "BFF: Dataverse:ClientSecret"
      - "BFF: AzureAd:ClientSecret"
      - "BFF: AgentToken:ClientSecret"
      - "L2 control-plane: dataverseClientSecretName (controlplane-app-service.bicep)"
    rotation_cadence: "manual-on-incident"
    never_delete: true
    exception_note: >-
      Rollback-window hold per §6.5 resolution 2026-08-25 (sunset 2026-11-23);
      retirement owned by auth-v4 runbook (obligation 051-E). E-3 closure
      removed the Dataverse__ClientSecret app setting 2026-08-24; the KV secret
      is retained solely as auth-v4's rollback copy through the soak window.
      Grandfathered PascalCase per §7.9 R2 (never gain a second casing).
      DO-NOT-DELETE before sunset; retirement follows auth-v4 runbook.
    aliases: []
    value_source: "from-existing-kv"
    app_settings:
      - "Dataverse__ClientSecret"
      - "AzureAd__ClientSecret"
      - "AgentToken__ClientSecret"
    tags: ["auth", "dataverse", "binding-never-delete"]

  - canonical_name: "BFF-API-ClientSecret"
    category: "auth"
    purpose: >-
      BFF API app-registration client secret. Consumed by the OBO
      confidential-client flow (per OAuth spec — required even under
      ADR-028 MI-first outbound) and by any shared-lib Dataverse boot path
      still on client-credentials. BINDING never-delete per r3 handoff §4a.
    consumers:
      - "BFF: OBO ConfidentialClientApplication"
      - "BFF: AzureAd:ClientSecret (backing)"
      - "BFF: Graph:ClientSecret (local-dev fallback per ADR-028)"
    rotation_cadence: "90-days"
    never_delete: true
    exception_note: >-
      DELETED from KV 2026-08-24 (auth-v4 task 033, ADR-028 E-3 CLOSED).
      Entry retained to BLOCK re-creation — H4 omits in secret-free envs;
      never seed a sentinel value (§9.1 opaque AADSTS7000215 — the ordered
      selector cannot distinguish a sentinel from a real secret). Soft-deleted
      copies (BFF-API-ClientSecret + bff-api-client-secret) recoverable to
      2026-11-22 — DO-NOT-PURGE before then. Grandfathered PascalCase per
      §7.9 R2 (never gain a second casing).
    aliases: []
    value_source: "from-existing-kv"
    app_settings:
      - "AzureAd__ClientSecret"
      - "Graph__ClientSecret"
    tags: ["auth", "bff", "binding-never-delete"]

