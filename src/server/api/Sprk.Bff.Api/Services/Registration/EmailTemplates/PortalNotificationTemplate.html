<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaarke Portal</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f4f6f8;">
        <tr>
            <td style="padding: 40px 20px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);">
                    <!-- Header: Logo only, left-aligned, forced white background for dark mode -->
                    <tr>
                        <td style="padding: 24px 40px 16px; border-bottom: 1px solid #e8e8e8; background-color: #ffffff !important;">
                            <img src="https://www.spaarke.com/images/email/logo-color.png" alt="Spaarke" width="140" style="display: block; height: auto;" />
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding: 32px 40px 40px;">
                            <p style="margin: 0 0 16px; color: #242424; font-size: 18px; line-height: 1.5; font-weight: 600;">
                                {{Headline}}
                            </p>
                            <p style="margin: 0 0 28px; color: #242424; font-size: 16px; line-height: 1.6;">
                                {{Message}}
                            </p>

                            <!-- CTA Button -->
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 0 0 28px;">
                                <tr>
                                    <td style="border-radius: 6px; background-color: #0f6cbd;">
                                        <a href="{{LinkUrl}}" style="display: inline-block; padding: 12px 28px; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none; border-radius: 6px;">{{LinkText}}</a>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin: 0 0 16px; color: #616161; font-size: 14px; line-height: 1.6;">
                                You will be asked to sign in to the portal first. For your security, this email does not include the content of the record or of any message.
                            </p>

                            <!-- Support -->
                            <p style="margin: 0; color: #616161; font-size: 14px; line-height: 1.6;">
                                Need help signing in? Reach out to us at
                                <a href="mailto:{{SupportEmail}}" style="color: #0f6cbd; text-decoration: none;">{{SupportEmail}}</a>.
                            </p>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #fafafa; padding: 20px 40px; border-top: 1px solid #e8e8e8; text-align: center;">
                            <p style="margin: 0; color: #a0a0a0; font-size: 12px;">
                                &copy; {{Year}} Spaarke. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
