<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaarke decisions</title>
    <style>
      /* Box-sizing reset: the same contract the code pages follow (docs/guides/DATAGRID-CODE-PAGE-HOST-CONTRACT.md section 2).
       * No colour here on purpose: the FluentProvider in main.tsx owns every colour and follows the host theme (ADR-021). */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
