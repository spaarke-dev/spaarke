<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaarke</title>
    <style>
      body {
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f3f2f1;
        color: #201f1e;
      }
      .message {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        font-size: 14px;
        text-align: center;
      }
      .message.error {
        color: #a4262c;
      }
      #spinner {
        display: none;
        width: 28px;
        height: 28px;
        box-sizing: border-box;
        border: 3px solid #c8c6c4;
        border-top-color: #0f6cbd;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      body.progress #spinner {
        display: block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #spinner {
          animation-duration: 3s;
        }
      }
      #link {
        display: none;
        font-size: 14px;
        color: #0f6cbd;
      }
      #link.visible {
        display: inline;
      }
      #dismiss {
        display: none;
        margin-top: 8px;
        padding: 4px 16px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      body.done #dismiss {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <!--
      spaarkeai-word-add-in-r1 task 037 (FR-17): the Word ribbon commands' notification surface.

      Word has no equivalent of Outlook's `Office.context.mailbox.item.notificationMessages` (Mailbox-
      only). `Office.context.ui.displayDialogAsync` (DialogApi, Excel/Outlook/PowerPoint/Word — see
      `@types/office-js`'s `Office.UI.displayDialogAsync` doc comment, which explicitly says this IS
      callable "from a UI-less command button") is the genuine host-native mechanism for a Word
      ExecuteFunction command to show the user something without opening the task pane.
      `word/commands/index.ts` (`notify()`), the Quick Save dialog (`shared/commands/quickSaveDialog.ts`, Word and Outlook)
      are the only callers. Task 118: this one page lives in `shared/commands/` and webpack emits it for both hosts
      (`word/commands-notify.html`, `outlook/commands-notify.html`).

      Task 089 (UAT-9): an ERROR says why — often the server's own reason — so it must stay readable. Every message
      and link is rendered with textContent / a validated href only (never parsed as HTML), so a server-supplied
      reason cannot inject markup.

      Task 110 (UAT round 11, item 2): this one window now carries a Quick Save from start to finish. It opens in the
      `progress` state (spinner), and is then either UPDATED in place by the command (`dialog.messageChild`, DialogApi
      1.2) or closed and reopened with the final state in the URL (older hosts). States, from `?status=`:
        progress - spinner + message; no buttons; never closes itself.
        success  - message, optional "Open in Spaarke" link (`?linkUrl=`), Close; stays until the user closes it.
        error    - red message + Close; closes itself after 8 s (task 089).
        info     - the original transient notice (Open Spaarke's failures etc.); closes itself after 2.2 s.
      Office.js is OPTIONAL and loaded after first paint: with it the page tells the command "ready", receives result
      updates, and asks the command to open the link / close the dialog (`messageParent`); without it the page still
      renders from the URL alone, the link is a plain new-tab anchor and Close uses window.close().

      Auto-close timing and exact popup behavior are only verifiable against a live Word host — see
      projects/spaarkeai-word-add-in-r1/notes/037-manifest-change.md and notes/110-quick-save-progress-dialog.md.
    -->
    <div id="spinner" role="progressbar" aria-label="Saving"></div>
    <div id="message" class="message"></div>
    <a id="link" href="#" target="_blank" rel="noopener noreferrer">Open in Spaarke</a>
    <button id="dismiss" type="button">Close</button>
    <script>
      (function () {
        var INFO_CLOSE_MS = 2200;
        var ERROR_CLOSE_MS = 8000;

        var bridge = false; // true once Office.js is ready and messageParent works
        var closeTimer = null;

        var el = document.getElementById('message');
        var link = document.getElementById('link');

        function post(payload) {
          try {
            Office.context.ui.messageParent(JSON.stringify(payload));
            return true;
          } catch (e) {
            return false;
          }
        }

        // Best-effort close. With the bridge the command closes this dialog (and finishes the ribbon command);
        // window.close() on a window this add-in itself opened via displayDialogAsync is the standard fallback.
        function closeSelf() {
          if (bridge) {
            post({ type: 'close' });
          }
          try {
            window.close();
          } catch (e) {
            // Some hosts refuse a script-initiated close — the message stays visible; harmless.
          }
        }

        function safeHttpUrl(value) {
          try {
            var u = new URL(value);
            return u.protocol === 'https:' || u.protocol === 'http:' ? u.href : '';
          } catch (e) {
            return '';
          }
        }

        function render(state) {
          var status = state.status || 'info';
          var isError = status === 'error';
          var isProgress = status === 'progress';

          if (closeTimer) {
            clearTimeout(closeTimer);
            closeTimer = null;
          }

          el.textContent = state.message || '';
          el.classList.toggle('error', isError);
          if (isError) {
            el.setAttribute('role', 'alert');
          } else {
            el.removeAttribute('role');
          }
          document.body.classList.toggle('error', isError);
          document.body.classList.toggle('progress', isProgress);
          document.body.classList.toggle('done', !isProgress);

          var href = isError || isProgress ? '' : safeHttpUrl(state.linkUrl || '');
          if (href) {
            link.setAttribute('href', href);
            link.classList.add('visible');
          } else {
            link.setAttribute('href', '#');
            link.classList.remove('visible');
          }

          if (isError) {
            closeTimer = setTimeout(closeSelf, ERROR_CLOSE_MS);
          } else if (status === 'info') {
            closeTimer = setTimeout(closeSelf, INFO_CLOSE_MS);
          }
        }

        var params = new URLSearchParams(window.location.search);
        render({
          message: params.get('message') || '',
          status: params.get('status') || 'info',
          linkUrl: params.get('linkUrl') || '',
        });

        document.getElementById('dismiss').addEventListener('click', closeSelf);

        // With the bridge the command opens the link (Office.context.ui.openBrowserWindow, after validating its
        // origin); without it the anchor's own target=_blank does the job.
        link.addEventListener('click', function (event) {
          var href = link.getAttribute('href');
          if (bridge && href && href !== '#') {
            event.preventDefault();
            post({ type: 'open-link', url: href });
          }
        });

        function initOffice() {
          if (!window.Office || typeof Office.onReady !== 'function') {
            return;
          }
          Office.onReady(function () {
            try {
              Office.context.ui.addHandlerAsync('dialogParentMessageReceived', function (arg) {
                var data;
                try {
                  data = JSON.parse(arg && arg.message);
                } catch (e) {
                  return;
                }
                if (data && data.type === 'result') {
                  render(data);
                }
              });
              bridge = true;
              post({ type: 'ready' });
            } catch (e) {
              bridge = false;
            }
          });
        }

        if (window.Office) {
          initOffice();
        } else {
          var script = document.createElement('script');
          script.src = 'https://appsforoffice.microsoft.com/lib/1/hosted/office.js';
          script.async = true;
          script.onload = initOffice;
          document.head.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
