<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Events</title>
    <style>
      /* Reset styles for Dataverse Custom Page context */
      /* `box-sizing: border-box` is REQUIRED — without it, the DataGrid root's
         inner padding adds to the 100%-of-viewport width/height and the grid
         overflows the Power Apps modal frame on the right and bottom.
         Parity with sprk_invoicespage + sprk_kpiassessmentspage Code Page
         shells. Added 035-fix-iteration-3 (2026-06-03) after UAT showed the
         Createdon column clipped right + chrome not responsive in modal. */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* `max-height: 100vh` constrains the EventsPage iframe content to the
           iframe's viewport even when the parent form section gives the iframe
           auto-height. Prevents the form section from scrolling because the
           EventsPage content grew taller than the visible area. Task 035 UAT
           iteration 5 (2026-06-04). */
        max-height: 100vh;
        overflow: hidden;
      }
      /* Ensure Fluent provider fills the container */
      #root > div {
        height: 100%;
      }
    </style>
