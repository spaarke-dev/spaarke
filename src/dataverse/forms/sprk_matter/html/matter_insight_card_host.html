<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Matter Health Insight</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    #spaarke-matter-insight-card-host {
      width: 100%;
      min-height: 0;
      padding: 0;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <!--
    Matter Health Insight host — iframe-scope mount target for InsightSummaryCard.

    Web resource name: sprk_/html/matter_insight_card_host.html
    Form section:      tab_report card_section_3 (cell holds this as WebResource control)

    Task 043 deploy strategy (Phase 4):
      The Power Apps "WebResource" form control renders this HTML inside an iframe.
      DOM nodes in this document live in the iframe scope; parent-form scripts can NOT
      reach #spaarke-matter-insight-card-host via window.parent.document.getElementById.

      To keep the mount + render contract simple, ALL mount logic runs INSIDE this
      iframe (Option a from FormXml patch §4 cross-frame note). The parent form's
      `insightCardMount.js` library remains registered as an OnLoad handler for
      telemetry + future fan-out but the actual React mount happens here once the
      `@spaarke/ai-widgets` IIFE bundle ships (tracked follow-up — see
      notes/defer-issues.md C-22, filed spaarke-ontology-platform-r1 task 080,
      2026-10-03; no browser-IIFE bundler config exists yet for @spaarke/ai-widgets,
      so this is a build-pipeline task, not a wiring fix).

    NOTE (spaarke-ontology-platform-r1 task 080 / C-22, 2026-10-03): this host used
    to render a permanently-visible "Matter Health insight (Phase 4 staging)"
    placeholder card with live Subject/Topic/Mode/Envelope facts — it read as a
    shipped, working feature to anyone viewing the Matter form, forever, because
    nothing would ever flip it to the real card without someone separately
    noticing and building the bundle. The placeholder is REMOVED. The host renders
    nothing (empty, zero height) until the real `@spaarke/ai-widgets` IIFE bundle
    is present, at which point step "When the @spaarke/ai-widgets IIFE bundle
    ships" below applies unchanged. Contract-verification facts (subject
    resolution, envelope read) still run and still log to the browser console —
    useful for an engineer with devtools open — but nothing renders into the page.

    When the @spaarke/ai-widgets IIFE bundle ships:
      1. Add <script src="../scripts/spaarke_ai_widgets_bundle.js"></script> below.
      2. Call window.SpaarkeAiWidgets.mountInsightSummaryCard(host, props) instead
         of the diagnostic-only console logging the bootstrap script does today.
      3. Source the subject/envelope from window.parent.Xrm via postMessage or
         direct frame.parent access (same-origin) — already done below.
  -->
  <div id="spaarke-matter-insight-card-host"></div>

  <script>
    /**
     * Iframe-scope bootstrap. Resolves the Matter Guid via the parent form's
     * Xrm context and parses the stored envelope — console-only diagnostics
     * (spaarke-ontology-platform-r1 task 080 / C-22: no visible placeholder).
     * No React, no bundle, no cross-frame mount.
     *
     * Production path (tracked in notes/defer-issues.md C-22): replace the
     * console.log calls below with a call to
     * `window.SpaarkeAiWidgets.mountInsightSummaryCard(host, props)` once the
     * bundle is loaded above.
     */
    (function () {
      "use strict";
      try {
        var parentWindow = window.parent;
        if (!parentWindow || parentWindow === window) {
          console.log("[Matter Insight Card host] not embedded — opening the HTML resource directly hides this surface.");
          return;
        }
        // Resolve Matter Guid via Xrm in parent scope (same-origin).
        var Xrm = parentWindow.Xrm;
        var formCtx = null;
        try {
          if (Xrm && Xrm.Page && typeof Xrm.Page.data === "object") {
            formCtx = Xrm.Page;
          }
        } catch (xrmErr) {
          // Xrm.Page deprecated; fall through to alternate resolution below.
        }
        var matterGuid = null;
        try {
          if (formCtx && formCtx.data && formCtx.data.entity && typeof formCtx.data.entity.getId === "function") {
            matterGuid = formCtx.data.entity.getId();
          }
        } catch (idErr) { /* swallow */ }
        if (!matterGuid) {
          console.log("[Matter Insight Card host] Matter Guid unavailable (form may not be saved) — skipping.");
          return;
        }
        // Strip braces if present.
        if (matterGuid.charAt(0) === "{" && matterGuid.charAt(matterGuid.length - 1) === "}") {
          matterGuid = matterGuid.substring(1, matterGuid.length - 1);
        }
        var subject = "matter:" + matterGuid;
        console.log("[Matter Insight Card host] contract wired — subject=" + subject + " (no @spaarke/ai-widgets bundle yet; nothing rendered).");

        // Read envelope from parent's Xrm.WebApi (read-only, diagnostic only).
        var WebApi = parentWindow.Xrm && parentWindow.Xrm.WebApi;
        if (WebApi && typeof WebApi.retrieveRecord === "function") {
          WebApi.retrieveRecord("sprk_matter", matterGuid, "?$select=sprk_performancesummary").then(
            function (rec) {
              var raw = rec && rec.sprk_performancesummary;
              if (!raw) {
                console.log("[Matter Insight Card host] envelope absent (no stored insight yet).");
                return;
              }
              var parsed = null;
              try { parsed = JSON.parse(raw); } catch (parseErr) { /* legacy R5 text */ }
              if (!parsed || typeof parsed !== "object") {
                console.log("[Matter Insight Card host] envelope unparseable (legacy text — will overwrite on first invocation).");
                return;
              }
              console.log("[Matter Insight Card host] envelope present, generatedAt=" + (parsed.generatedAt || "(none)"));
            },
            function (err) {
              console.warn("[Matter Insight Card host] envelope read failed: " + (err && err.message ? err.message : "unknown"));
            }
          );
        }
      } catch (bootErr) {
        // Defensive — form load MUST NOT break.
        console.warn("[Matter Insight Card host] bootstrap failed: " + (bootErr && bootErr.message ? bootErr.message : String(bootErr)));
      }
    })();
  </script>
</body>
</html>
